<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--meta-->
<title>Slide 14 · White · ★★★★★ × PARADOX</title>
<meta name="description" content="From the Logo Variations deck. Vector SVG and 3840 × 2160 PNG.">
<link rel="canonical" href="https://paradoxica.uk/brand/slide-14/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="★★★★★ × PARADOX">
<meta property="og:title" content="Slide 14 · White · ★★★★★ × PARADOX">
<meta property="og:description" content="From the Logo Variations deck. Vector SVG and 3840 × 2160 PNG.">
<meta property="og:url" content="https://paradoxica.uk/brand/slide-14/">
<meta property="og:image" content="https://paradoxica.uk/logos/png/logo-14.png">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14'/%3E%3Cpath fill='%23fff' d='M32 12l5.9 12.6 13.8 1.6-10.2 9.4 2.7 13.6L32 42.4l-12.2 6.8 2.7-13.6-10.2-9.4 13.8-1.6z'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Graphik";src:local("Graphik Regular"),local("Graphik-Regular");font-weight:400;font-display:swap}
@font-face{font-family:"Graphik";src:local("Graphik Medium"),local("Graphik-Medium");font-weight:500;font-display:swap}
@font-face{font-family:"Canela";src:local("Canela Regular"),local("Canela-Regular");font-weight:400;font-display:swap}
:root{
  --sans:"Graphik","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Canela",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
  --bg:#000;--fg:#fff;--dim:rgba(255,255,255,.52);--line:rgba(255,255,255,.14);--card:#0a0a0a;--hover:#141414;
}
:root[data-ground="white"]{--bg:#fff;--fg:#000;--dim:rgba(0,0,0,.5);--line:rgba(0,0,0,.12);--card:#f6f6f6;--hover:#eeeeee}
:root[data-ground="violet"]{--bg:#462d7d;--fg:#fff;--dim:rgba(255,255,255,.6);--line:rgba(255,255,255,.18);--card:#5a4a92;--hover:#6a59a6}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg);transition:background-color .6s var(--ease),color .6s var(--ease)}
body{font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}

/* top bar */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:background-color .6s var(--ease)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.home{display:flex;align-items:center;height:20px}
.home img{height:16px;width:auto;display:block}
.grounds{display:flex;align-items:center;gap:10px;font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.g{width:14px;height:14px;border-radius:50%;border:1px solid var(--fg);opacity:.55;transition:opacity .25s,transform .25s var(--ease),box-shadow .25s}
.g:hover{opacity:.9}
.g[aria-pressed="true"]{opacity:1;transform:scale(1.18);box-shadow:0 0 0 3px color-mix(in srgb,var(--fg) 18%,transparent)}
.g.black{background:#000}.g.white{background:#fff}.g.violet{background:#5a4a92}

/* hero */
.hero{padding:clamp(56px,10vw,140px) 0 clamp(36px,6vw,72px)}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
h1{font:400 clamp(44px,8.4vw,128px)/.95 var(--serif);letter-spacing:-.02em}
.heromark{display:block;width:min(100%,720px);height:auto;margin-left:calc(min(100%,720px) * -.0455);margin-top:clamp(28px,4vw,52px)}
.lede{max-width:560px;margin-top:26px;font-size:clamp(15px,1.3vw,18px);color:var(--dim)}
.count{display:flex;gap:28px;margin-top:34px;font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.count b{font-weight:500;color:var(--fg)}
.count span{color:var(--dim)}

/* sections */
section{padding:clamp(28px,4vw,48px) 0 clamp(40px,6vw,80px);border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:26px}
h2{font:400 clamp(26px,3vw,40px)/1 var(--serif)}
.sh small{font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:clamp(10px,1.2vw,16px)}
.grid.deck{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;transition:background-color .35s var(--ease),transform .35s var(--ease),border-color .35s}
.card:hover,.card:focus-visible{background:var(--hover);transform:translateY(-2px);outline:none;border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.art{position:relative;aspect-ratio:4/3}
.deck .art{aspect-ratio:16/9;padding:0}
.art img{position:absolute;left:12%;top:12%;width:76%;height:76%;object-fit:contain;display:block;transition:transform .5s var(--ease)}
.deck .art img{left:0;top:0;width:100%;height:100%;object-fit:cover}
.card:hover .art img{transform:scale(1.03)}
.cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font:500 10px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.cap .n{color:var(--dim)}
.cap .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none}
.art{display:block}
.quick{display:flex;gap:6px;opacity:0;transition:opacity .25s}
.card:hover .quick,.card:focus-within .quick{opacity:1}
.quick a{padding:5px 7px;border:1px solid var(--line);border-radius:6px;text-decoration:none;color:var(--dim)}
.quick a:hover{color:var(--fg);border-color:var(--fg)}
@media (hover:none){.quick{opacity:1}}

footer{border-top:1px solid var(--line);padding:30px 0 48px;font:500 10px/1.6 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none}footer a:hover{color:var(--fg)}

/* preview */
.lb{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr auto;background:var(--lbg,#000);color:var(--lfg,#fff);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s .35s,background-color .5s var(--ease),color .5s}
.lb.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease),background-color .5s var(--ease),color .5s}
.lb[data-ground="white"]{--lbg:#fff;--lfg:#000}
.lb[data-ground="violet"]{--lbg:#462d7d;--lfg:#fff}
.lb[data-ground="black"]{--lbg:#000;--lfg:#fff}
.lbtop,.lbbot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(16px,3vw,36px);font:500 10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.lbtop .t{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbtop .t b{font:400 clamp(18px,2vw,26px)/1.1 var(--serif);letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtop .t span{opacity:.5}
.x{width:40px;height:40px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;opacity:.6;flex:none;transition:opacity .2s,transform .3s var(--ease)}
.x:hover{opacity:1;transform:rotate(90deg)}
.stagebox{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:clamp(20px,5vw,72px)}
.stagebox img{max-width:min(100%,1100px);max-height:100%;display:block;opacity:0;transform:scale(.985);transition:opacity .45s var(--ease),transform .55s var(--ease)}
.stagebox img.in{opacity:1;transform:none}
.stagebox.slide img{max-width:100%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.nav{position:absolute;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;border:1px solid currentColor;opacity:.35;display:grid;place-items:center;transition:opacity .2s}
.nav:hover{opacity:1}.nav.p{left:clamp(10px,2vw,28px)}.nav.n{right:clamp(10px,2vw,28px)}
.dl{display:flex;flex-wrap:wrap;gap:8px}
.dl a{display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;text-decoration:none;transition:background-color .2s,color .2s,border-color .2s}
.dl a:hover{background:var(--lfg,#fff);color:var(--lbg,#000);border-color:var(--lfg,#fff)}
.dl a i{font-style:normal;opacity:.55}
.lbg{display:flex;align-items:center;gap:10px}
.lnk{display:flex;align-items:center;gap:14px;min-width:0}
.lnk a{text-decoration:none;opacity:.55;letter-spacing:.06em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk a:hover{opacity:1}
#copy{padding:9px 12px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:999px;font:inherit;letter-spacing:.2em;text-transform:uppercase;transition:background-color .2s,color .2s}
#copy:hover{background:var(--lfg,#fff);color:var(--lbg,#000)}
.lbg .g{border-color:currentColor}
@media (max-width:720px){
  .lbbot{flex-direction:column-reverse;align-items:stretch}
  .dl a{flex:1 1 45%;justify-content:center}
  .nav{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .grid.deck{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .quick{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="home" href="/" aria-label="★★★★★ × PARADOX — home"><img id="homeLogo" src="/brand/svg/paradox-horizontal-paradox-white.svg" alt="★★★★★ × PARADOX"></a>
  <div class="grounds" role="group" aria-label="Ground">
    <span>Ground</span>
    <button class="g black" data-g="black" aria-label="Black ground" aria-pressed="true"></button>
    <button class="g white" data-g="white" aria-label="White ground" aria-pressed="false"></button>
    <button class="g violet" data-g="violet" aria-label="Violet ground" aria-pressed="false"></button>
  </div>
</div></header>

<main class="wrap">
  <div class="hero">
    <div class="eyebrow">PARADOXICA Ltd. · Brand</div>
    <h1>Brand assets</h1>
    <img class="heromark" data-mark="horizontal-paradox" src="/brand/svg/paradox-horizontal-paradox-white.svg" alt="★★★★★ × PARADOX">
    <p class="lede">Every variation of the mark, from the original decks. Open any one to preview it; take it as a vector SVG or a 4096&nbsp;px PNG, in white or black.</p>
    <div class="count" id="count"></div>
  </div>
  <div id="sections"></div>
</main>

<footer><div class="wrap">
  <span>© <span id="yr">2026</span> PARADOXICA Ltd. · ★★★★★ × PARADOX™</span>
  <a href="/logos/">The presentation deck →</a>
</div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Preview" data-ground="black">
  <div class="lbtop">
    <div class="t"><span id="lbGroup"></span><b id="lbName"></b></div>
    <div class="lbg" role="group" aria-label="Preview ground">
      <button class="g black" data-lg="black" aria-label="Black ground"></button>
      <button class="g white" data-lg="white" aria-label="White ground"></button>
      <button class="g violet" data-lg="violet" aria-label="Violet ground"></button>
      <button class="x" id="close" aria-label="Close preview"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l12 12M13 1L1 13"/></svg></button>
    </div>
  </div>
  <div class="stagebox" id="stage">
    <button class="nav p" id="prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2L4 8l6 6"/></svg></button>
    <img id="lbImg" alt="">
    <button class="nav n" id="next" aria-label="Next"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2l6 6-6 6"/></svg></button>
  </div>
  <div class="lbbot">
    <div class="dl" id="dl"></div>
    <div class="lnk"><a id="lbLink" href="/brand/"></a><button id="copy" type="button">Copy link</button><span id="lbPos" style="opacity:.5"></span></div>
  </div>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const GROUND_KEY = 'paradox-brand-ground';
const DECK = Array.from({ length: 47 }, (_, i) => String(i + 1).padStart(2, '0'));
const deckGround = n => n <= 12 ? 'Black' : n <= 23 ? 'White' : n <= 25 ? 'Lavender' : n <= 36 ? 'Purple' : 'Deep purple';
let items = [], cur = -1, ground = 'black', lbGround = 'black';
try { ground = localStorage.getItem(GROUND_KEY) || 'black'; } catch (e) {}
$('#yr').textContent = new Date().getFullYear();

const ink = g => g === 'white' ? 'black' : 'white';
const BASE = '/brand/', ORIGIN = 'https://paradoxica.uk';
const svgOf = (id, i) => `${BASE}svg/paradox-${id}-${i}.svg`;
const pngOf = (id, i) => `${BASE}png/paradox-${id}-${i}.png`;
const slugOf = it => it.deck ? 'slide-' + it.file.slice(-2) : it.id;
const urlOf = it => `${BASE}${slugOf(it)}/`;

function setGround(g) {
  ground = g; document.documentElement.dataset.ground = g;
  document.querySelectorAll('[data-g]').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === g));
  document.querySelectorAll('img[data-mark]').forEach(im => im.src = svgOf(im.dataset.mark, ink(g)));
  $('#homeLogo').src = svgOf('horizontal-paradox', ink(g));
  try { localStorage.setItem(GROUND_KEY, g); } catch (e) {}
}

function card(it, idx) {
  const el = document.createElement('div');
  el.className = 'card'; el.tabIndex = 0; el.setAttribute('role', 'button');
  el.setAttribute('aria-label', `Preview ${it.name}`);
  const src = it.deck ? it.thumb : svgOf(it.id, ink(ground));
  const quick = it.deck
    ? `<a href="${it.svg}" download="${it.file}.svg">SVG</a><a href="${it.png}" download="${it.file}.png">PNG</a>`
    : `<a href="${svgOf(it.id, ink(ground))}" download data-q="svg">SVG</a><a href="${pngOf(it.id, ink(ground))}" download data-q="png">PNG</a>`;
  el.innerHTML = `<a class="art" href="${urlOf(it)}" tabindex="-1" aria-hidden="true"><img ${it.deck ? '' : `data-mark="${it.id}"`} src="${src}" alt="" loading="lazy" decoding="async"></a>
    <div class="cap"><span class="n">${String(idx + 1).padStart(2, '0')}</span><a class="nm" href="${urlOf(it)}">${it.name}</a><span class="quick">${quick}</span></div>`;
  el.addEventListener('click', e => {
    if (e.target.closest('.quick')) { if (!it.deck) { const a = e.target.closest('a'); a.href = (a.dataset.q === 'svg' ? svgOf : pngOf)(it.id, ink(ground)); } return; }
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;   // new tab etc: let the real link work
    e.preventDefault(); open(idx, true);
  });
  el.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('.quick')) { e.preventDefault(); open(idx, true); } });
  return el;
}

function render(marks) {
  const groups = [['Horizontal', 'One line'], ['Stacked', 'Stars over the name'], ['Vertical', 'Down the spine']];
  items = [];
  const host = $('#sections');
  for (const [g, sub] of groups) {
    const list = marks.filter(m => m.group === g); if (!list.length) continue;
    const s = document.createElement('section');
    s.innerHTML = `<div class="sh"><h2>${g}</h2><small>${sub} · ${list.length}</small></div><div class="grid"></div>`;
    const grid = $('.grid', s);
    for (const m of list) { items.push(m); grid.append(card(m, items.length - 1)); }
    host.append(s);
  }
  const s = document.createElement('section');
  s.innerHTML = `<div class="sh"><h2>The deck</h2><small>Logo Variations · 16:9 · ${DECK.length}</small></div><div class="grid deck"></div>`;
  const grid = $('.grid', s);
  for (const n of DECK) {
    const it = { deck: true, group: 'The deck · ' + deckGround(+n), name: `Slide ${n} · ${deckGround(+n)}`,
      thumb: `/logos/svg/logo-${n}.svg`, svg: `/logos/svg/logo-${n}.svg`, png: `/logos/png/logo-${n}.png`, file: `paradox-logo-${n}` };
    items.push(it); grid.append(card(it, items.length - 1));
  }
  host.append(s);
  $('#count').innerHTML = `<span><b>${marks.length}</b> marks</span><span><b>${DECK.length}</b> slides</span><span><b>SVG</b> + <b>PNG</b></span>`;
}

/* preview */
const lb = $('#lb'), img = $('#lbImg');
function paint() {
  const it = items[cur]; if (!it) return;
  lb.dataset.ground = lbGround;
  document.querySelectorAll('[data-lg]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lg === lbGround));
  $('#stage').classList.toggle('slide', !!it.deck);
  $('.lbg').style.visibility = '';
  document.querySelectorAll('[data-lg]').forEach(b => b.hidden = !!it.deck);
  $('#lbGroup').textContent = it.deck ? it.group : `${it.group} · ${String(cur + 1).padStart(2, '0')}`;
  $('#lbName').textContent = it.name;
  $('#lbPos').textContent = `${cur + 1} / ${items.length}`;
  const link = $('#lbLink'); link.href = urlOf(it); link.textContent = 'paradoxica.uk' + urlOf(it);
  const src = it.deck ? it.svg : svgOf(it.id, ink(lbGround));
  img.classList.remove('in'); img.alt = it.name;
  img.onload = () => requestAnimationFrame(() => img.classList.add('in'));
  img.src = src; if (img.complete) img.classList.add('in');
  $('#dl').innerHTML = it.deck
    ? `<a href="${it.svg}" download="${it.file}.svg">SVG <i>vector</i></a><a href="${it.png}" download="${it.file}.png">PNG <i>3840 × 2160</i></a>`
    : ['white', 'black'].map(i => `<a href="${svgOf(it.id, i)}" download>SVG <i>${i} ink</i></a><a href="${pngOf(it.id, i)}" download>PNG <i>${i} · 4096 px</i></a>`).join('');
}
const HOME_TITLE = 'Brand · ★★★★★ × PARADOX';
function setUrl(path, push) {
  if (location.pathname !== path) history[push ? 'pushState' : 'replaceState']({ path }, '', path);
  let c = document.querySelector('link[rel=canonical]');
  if (!c) { c = document.createElement('link'); c.rel = 'canonical'; document.head.append(c); }
  c.href = ORIGIN + path;
}
function open(i, push) {
  cur = i; lbGround = ground; paint();
  lb.classList.add('open'); document.body.style.overflow = 'hidden';
  setUrl(urlOf(items[i]), push); document.title = `${items[i].name} · ★★★★★ × PARADOX`;
  $('#close').focus({ preventScroll: true });
}
function hide() { lb.classList.remove('open'); document.body.style.overflow = ''; document.title = HOME_TITLE; }
function close() { hide(); setUrl(BASE, true); }
const step = d => { cur = (cur + d + items.length) % items.length; paint();
  setUrl(urlOf(items[cur]), false); document.title = `${items[cur].name} · ★★★★★ × PARADOX`; };
const route = () => {   // /brand/<slug>/  (old #slug links still work)
  const seg = location.pathname.slice(BASE.length).replace(/\/+$/, '') || decodeURIComponent(location.hash.slice(1));
  const i = seg ? items.findIndex(it => slugOf(it) === seg) : -1;
  if (i >= 0) { if (location.hash) history.replaceState(null, '', urlOf(items[i])); open(i, false); } else hide();
};
addEventListener('popstate', route);
$('#copy').onclick = async () => {
  const u = ORIGIN + urlOf(items[cur]);
  try { await navigator.clipboard.writeText(u); } catch (e) { const t = document.createElement('textarea'); t.value = u; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  $('#copy').textContent = 'Copied'; setTimeout(() => $('#copy').textContent = 'Copy link', 1400);
};
$('#close').onclick = close; $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
document.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { lbGround = b.dataset.lg; paint(); });
document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => setGround(b.dataset.g));
$('#stage').addEventListener('click', e => { if (e.target === e.currentTarget) close(); });
addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
});
let tx = null;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
lb.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });

fetch(BASE + 'marks.json').then(r => r.json()).then(marks => {
  render(marks); setGround(ground); route();
});
})();
</script>
</body>
</html>
