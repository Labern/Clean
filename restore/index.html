<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Restore old photographs in your browser. Nothing uploads.">
<title>Revive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1115'/%3E%3Ccircle cx='32' cy='26' r='9' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Cpath d='M12 52c4-11 11-16 20-16s16 5 20 16' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115; --card:#161a21; --line:#252a33; --line-2:#323844;
  --text:#f2f4f8; --dim:#98a1b0; --faint:#5f6875;
  --accent:#f2f4f8; --accent-ink:#0f1115;
  --ok:#4ade80; --bad:#f87171;
  --r:14px;
}
.theme-light{
  --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --line-2:#d2d7de;
  --text:#12151a; --dim:#5c6573; --faint:#8b93a1;
  --accent:#12151a; --accent-ink:#ffffff;
  --ok:#16a34a; --bad:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100svh; line-height:1.5;
  font-size:15px; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto;padding:22px 18px 64px}

header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mark{font-weight:650;font-size:17px;letter-spacing:-.01em}
.spacer{flex:1}
.icon{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;
}
.icon:hover{color:var(--text);border-color:var(--line-2)}

section{display:none}
body[data-state="idle"] #s-idle,
body[data-state="working"] #s-working,
body[data-state="done"] #s-done,
body[data-state="batch"] #s-batch,
body[data-state="error"] #s-error{display:block}

/* drop */
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  min-height:56vh;border:1px dashed var(--line-2);border-radius:20px;
  background:var(--card);cursor:pointer;text-align:center;padding:40px 24px;
  transition:border-color .12s,background .12s;
}
.drop:hover,.drop.drag{border-color:var(--text)}
.drop .big{font-size:20px;font-weight:600;letter-spacing:-.01em}
.drop .sm{color:var(--faint);font-size:13px}
.opts{display:flex;gap:18px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;cursor:pointer}
.opts input{accent-color:var(--text);width:15px;height:15px;cursor:pointer}

/* working */
.panelbox{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:22px}
.bar{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:16px 0 10px}
.bar i{display:block;height:100%;width:0;background:var(--text);transition:width .25s ease}
.stage{color:var(--dim);font-size:13px}
.stage.small{color:var(--faint);font-size:12px;margin-top:3px}
.thumb{max-width:120px;max-height:90px;border-radius:8px;display:block;margin:0 auto 14px;opacity:.5}

/* result */
.shot{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;position:relative}
.shot + .shot{margin-top:12px}
.view{display:flex;align-items:center;justify-content:center;background:#000;overflow:auto}
.theme-light .view{background:#eceef1}
.view canvas{display:block;max-width:100%;height:auto}
body.zoom1 .view{max-height:64vh}
body.zoom1 .view canvas{max-width:none}
.tag{
  position:absolute;top:10px;left:10px;z-index:2;
  background:rgba(15,17,21,.72);color:#fff;backdrop-filter:blur(8px);
  font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:7px;
}
.dims{
  position:absolute;top:10px;right:10px;z-index:2;
  background:rgba(15,17,21,.72);color:#c9d1dc;backdrop-filter:blur(8px);
  font-size:11px;padding:4px 9px;border-radius:7px;font-variant-numeric:tabular-nums;
}
.hoverdl{
  position:absolute;right:10px;bottom:10px;z-index:2;
  border:none;border-radius:8px;cursor:pointer;
  background:rgba(15,17,21,.78);color:#fff;backdrop-filter:blur(8px);
  font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;
  opacity:0;transition:opacity .12s;
}
.shot:hover .hoverdl,.hoverdl:focus-visible{opacity:1}
@media (hover:none){.hoverdl{opacity:1}}
.small-shot .view{max-height:30vh}
.small-shot .view canvas{max-height:30vh;width:auto}

.actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btn{
  flex:1;min-width:150px;min-height:46px;border:none;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;
  background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line-2);color:var(--dim);font-weight:500}
.btn.ghost:hover{color:var(--text);opacity:1}
.note{color:var(--faint);font-size:12px;margin-top:10px;text-align:center}

/* batch */
.queue{list-style:none;margin:14px 0 0;display:flex;flex-direction:column;gap:1px;
  max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.queue li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim);
  padding:9px 12px;background:var(--card)}
.queue li.now{color:var(--text)}
.queue .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.queue li.now .dot{background:var(--text);animation:pulse 1.1s ease-in-out infinite}
.queue li.ok .dot{background:var(--ok)}
.queue li.bad .dot{background:var(--bad)}
.queue .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.queue .st{flex:none;font-size:12px;color:var(--faint)}
.queue a{color:var(--text);text-decoration:none;font-weight:600}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

details{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--faint);font-size:12px;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--dim)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin:14px 0}
.ctl label{font-size:13px;color:var(--dim)}
.ctl .val{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--text);margin-top:5px}
.seg{grid-column:1/-1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:54px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);
  background:none;color:var(--faint);font-family:inherit;font-size:12px;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--text);color:var(--text)}
.err{border:1px solid var(--bad);border-radius:var(--r);background:var(--card);padding:22px;text-align:center}
.err p{color:var(--dim);font-size:13px;word-break:break-word}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-state="idle">
<div class="wrap">

<header>
  <div class="mark">Revive</div>
  <div class="spacer"></div>
  <button id="themeToggle" class="icon" title="Light / dark">◐</button>
</header>

<section id="s-idle">
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose photos">
    <div class="big">Drop photos here</div>
    <div class="sm">or click to choose — one or a hundred</div>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="opts">
    <label><input type="checkbox" id="optFaces" checked> Sharpen faces</label>
    <label><input type="checkbox" id="optColour" checked> Colourise</label>
  </div>
  <p class="note">Runs on your device. Nothing is uploaded.</p>
</section>

<section id="s-working">
  <div class="panelbox">
    <canvas id="workThumb" class="thumb"></canvas>
    <div class="bar"><i id="barFill"></i></div>
    <div class="stage" id="stageText">Starting</div>
    <div class="stage small"><span id="elapsed">0s</span></div>
  </div>
</section>

<section id="s-done">
  <div class="shot">
    <span class="tag">Restored</span>
    <span class="dims" id="dimsAfter"></span>
    <div class="view" id="viewAfter"><canvas id="canvasAfter"></canvas></div>
    <button class="hoverdl" id="dlAfter">Download</button>
  </div>

  <div class="actions">
    <button class="btn" id="download">Download</button>
    <button class="btn ghost" id="zoomBtn" aria-pressed="false">Zoom 1:1</button>
    <button class="btn ghost" id="again">New photo</button>
  </div>

  <div class="shot small-shot" style="margin-top:22px">
    <span class="tag">Original</span>
    <span class="dims" id="dimsBefore"></span>
    <div class="view" id="viewBefore"><canvas id="canvasBefore"></canvas></div>
    <button class="hoverdl" id="dlBefore">Download</button>
  </div>

  <div id="summary" hidden></div>
  <div id="faceNote" hidden></div>
  <div id="colourNote" hidden></div>

  <details>
    <summary>Adjust</summary>
    <div class="actions" style="margin-top:12px">
      <button class="btn ghost" id="faceBtn">Sharpen faces</button>
      <button class="btn ghost" id="colourBtn">Colourise</button>
    </div>
    <div class="ctl" id="satCtl" hidden>
      <label for="cSat">Colour strength</label><span class="val" id="vSat"></span>
      <input type="range" id="cSat" min="0" max="1.6" step="0.05" value="1">
    </div>
    <div class="ctl">
      <label for="cRepair">Blemish removal</label><span class="val" id="vRepair"></span>
      <input type="range" id="cRepair" min="0" max="1" step="0.05">
    </div>
    <div class="ctl">
      <label>Blemish size</label><span class="val" id="vScale"></span>
      <div class="seg" id="segScale">
        <button data-v="0">Fine</button><button data-v="1">Normal</button>
        <button data-v="2">Coarse</button><button data-v="3">Heavy</button>
      </div>
    </div>
    <div class="ctl">
      <label for="cFade">Fade recovery</label><span class="val" id="vFade"></span>
      <input type="range" id="cFade" min="0" max="1" step="0.05">
    </div>
    <div class="ctl">
      <label>Tone</label><span class="val" id="vTone"></span>
      <div class="seg" id="segTone">
        <button data-v="neutral">Neutral</button>
        <button data-v="keep">Keep</button>
        <button data-v="mono">Mono</button>
      </div>
    </div>
    <div class="ctl">
      <label for="cDenoise">Grain</label><span class="val" id="vDenoise"></span>
      <input type="range" id="cDenoise" min="0" max="1" step="0.05">
    </div>
    <div class="ctl">
      <label for="cSharpen">Crispness</label><span class="val" id="vSharpen"></span>
      <input type="range" id="cSharpen" min="0" max="1" step="0.05">
    </div>
    <div class="ctl">
      <label>Enlarge</label><span class="val" id="vSize"></span>
      <div class="seg" id="segSize">
        <button data-v="1">1×</button><button data-v="2">2×</button>
        <button data-v="3">3×</button><button data-v="4">4×</button>
      </div>
    </div>
    <div class="actions" style="margin-top:14px">
      <button class="btn ghost" id="showMask" aria-pressed="false">Show repairs</button>
      <button class="btn ghost" id="redo">Apply</button>
    </div>
  </details>
</section>

<section id="s-batch">
  <div class="panelbox">
    <div class="bar"><i id="batchFill"></i></div>
    <div class="stage" id="batchStage">Starting</div>
    <div class="stage small" id="batchTitle"></div>
  </div>
  <div class="actions">
    <button class="btn" id="batchZip" hidden>Download all</button>
    <button class="btn ghost" id="batchStop">Stop</button>
    <button class="btn ghost" id="batchAgain" hidden>New batch</button>
  </div>
  <ul class="queue" id="queue"></ul>
</section>

<section id="s-error">
  <div class="err">
    <p id="errText"></p>
    <div class="actions" style="margin-top:14px"><button class="btn ghost" id="errBack">Try again</button></div>
  </div>
</section>

</div>
<script src="engine.js"></script>
<script>
/* ============================================================================
   THE APP — drop photographs in, get them back better. One or a hundred.

   All heavy work is handed to worker.js. Nothing expensive runs here, because
   a main thread busy with a 12-megapixel convolution cannot repaint, and a
   page that cannot repaint is indistinguishable from a page that is broken.
   ========================================================================== */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const body = document.body;

/* ── theme ── */
const root = document.documentElement;
try { if (localStorage.getItem('revive-theme') === 'light') root.classList.add('theme-light'); } catch (e) {}
$('themeToggle').onclick = () => {
  root.classList.toggle('theme-light');
  try { localStorage.setItem('revive-theme', root.classList.contains('theme-light') ? 'light' : 'dark'); } catch (e) {}
};

/* ── model locations ── */
const ORT_BASE = new URL('ort/', location.href).href;
const COLOUR_MODEL = { path: 'colorize.onnx', size: 78014375,
  detPath: 'models/facedet.onnx', detSize: 232589 };   // for the orientation check
const FACE_MODEL = {
  parts: ['models/face.onnx.part0', 'models/face.onnx.part1', 'models/face.onnx.part2'],
  totalSize: 158232137, detPath: 'models/facedet.onnx', detSize: 232589,
};

/* ── state ── */
let srcImage = null, srcName = 'photo', stats = null, opts = null, result = null;
let busy = false, colourOn = false, abFull = null, batch = null, facesDone = false;
let autoFaces = false, autoColour = false;
const setState = s => { body.dataset.state = s; };
const fmt = n => n.toLocaleString('en-US');

/* ── the worker ───────────────────────────────────────────────────────────
   With a main-thread fallback, because a page opened straight off the disk
   (file://) is not allowed to start a worker at all, and this app is meant to
   work that way too. The fallback is slower to look at — it cannot repaint
   mid-stage — but it is never dead. */
let worker = null, workerBroken = false, reqId = 0, progressCb = null;
const pending = new Map();

function getWorker() {
  if (worker || workerBroken) return worker;
  try {
    worker = new Worker('worker.js');
    worker.onmessage = ev => {
      const m = ev.data;
      if (m.type === 'progress') { if (progressCb) progressCb(m); return; }
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.type === 'failed') p.reject(new Error(m.message)); else p.resolve(m);
    };
    worker.onerror = () => {
      workerBroken = true;
      for (const [, p] of pending) p.reject(new Error('the background worker stopped'));
      pending.clear();
    };
  } catch (e) { workerBroken = true; worker = null; }
  return worker;
}
function callWorker(msg, transfer, onProgress) {
  const w = getWorker();
  if (!w) return null;
  const id = ++reqId;
  progressCb = onProgress || null;
  return new Promise((resolve, reject) => {
    pending.set(id, { resolve, reject });
    try { w.postMessage(Object.assign({ id }, msg), transfer || []); }
    catch (e) { pending.delete(id); reject(e); }
  });
}
const raf = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

/* ── input ── */
const drop = $('drop'), fileInput = $('file');
drop.onclick = () => fileInput.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } };
fileInput.onchange = () => { if (fileInput.files.length) loadMany(fileInput.files); };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('drag'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files; if (f && f.length) loadMany(f); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
window.addEventListener('paste', e => {
  if (busy) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const it of items) if (it.type.startsWith('image/')) files.push(it.getAsFile());
  if (files.length) loadMany(files);
});

function fail(msg) { $('errText').textContent = msg; setState('error'); busy = false; }
$('errBack').onclick = () => setState('idle');
$('again').onclick = () => { srcImage = null; result = null; setState('idle'); };

const looksLikeImage = f =>
  (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|heic|heif|avif|bmp|gif|tiff?)$/i.test(f.name || '');

async function decodeFile(file) {
  /* imageOrientation honours the EXIF rotation a scanner or phone wrote, so a
     portrait scan does not come back on its side. */
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await createImageBitmap(file); }
  const c = document.createElement('canvas');
  c.width = bmp.width; c.height = bmp.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bmp, 0, 0);
  bmp.close && bmp.close();
  const data = ctx.getImageData(0, 0, c.width, c.height);
  if (!data.width || !data.height) throw new Error('that image is empty');
  return data;
}

async function loadMany(list) {
  if (busy) return;
  const files = [...list].filter(looksLikeImage);
  if (!files.length) return fail('Those files do not look like images.');
  autoFaces = $('optFaces').checked;
  autoColour = $('optColour').checked;
  if (files.length > 1) return runBatch(files);
  return load(files[0]);
}

async function load(file) {
  srcName = (file.name || 'photo').replace(/\.[^.]+$/, '');
  try { srcImage = await decodeFile(file); }
  catch (e) { return fail('Could not read that image. ' + (e && e.message ? e.message : '')); }
  run();
}

/* ── the working screen: always visibly alive ── */
let tick = null, started = 0;
function startTicker() {
  started = Date.now();
  stopTicker();
  tick = setInterval(() => {
    const s = Math.round((Date.now() - started) / 1000);
    $('elapsed').textContent = s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  }, 250);
}
function stopTicker() { if (tick) { clearInterval(tick); tick = null; } }
function showStage(t, p) {
  $('stageText').textContent = t + '…';
  if (p != null) $('barFill').style.width = Math.round(p * 100) + '%';
}

/* ── restore one photograph ── */
async function run() {
  busy = true;
  setState('working');
  startTicker();
  const t = $('workThumb'), tw = 150, th = Math.max(1, Math.round(srcImage.height * tw / srcImage.width));
  t.width = tw; t.height = th;
  const tmp = document.createElement('canvas');
  tmp.width = srcImage.width; tmp.height = srcImage.height;
  tmp.getContext('2d').putImageData(srcImage, 0, 0);
  t.getContext('2d').drawImage(tmp, 0, 0, tw, th);
  showStage('Looking at the photograph', 0.02);
  await raf();

  try {
    colourOn = false; abFull = null; facesDone = false;
    result = await restoreImage(srcImage, showStage);
  } catch (e) {
    stopTicker();
    return fail('Restoration failed: ' + (e && e.message ? e.message : e));
  }
  /* Keep the working screen up through the model stages too, so there is one
     continuous run rather than a result that then changes under the user. */
  if (autoFaces) { autoFaces = false; await enhanceFaces({ onStage: showStage }); }
  if (autoColour) { autoColour = false; await colourise({ onStage: showStage }); }
  stopTicker();
  present();
  busy = false;
}

/* Worker if we can, main thread if we must. */
async function restoreImage(img, onStage) {
  const copy = new Uint8ClampedArray(img.data);
  const res = callWorker({ type: 'restore', width: img.width, height: img.height, data: copy.buffer },
    [copy.buffer], m => onStage(m.stage, m.p));
  if (res) {
    const m = await res;
    stats = m.stats; opts = m.opts; syncControls();
    return {
      width: m.width, height: m.height, data: new Uint8ClampedArray(m.data),
      mask: m.mask ? new Float32Array(m.mask) : null,
      maskWidth: m.maskWidth, maskHeight: m.maskHeight,
      damageFraction: m.damageFraction, scale: m.scale,
    };
  }
  stats = ReviveEngine.analyze(img);
  opts = ReviveEngine.autoSettings(stats);
  syncControls();
  const it = ReviveEngine.restore(img, opts, stats);
  let step = it.next();
  while (!step.done) {
    onStage(step.value.stage, step.value.p);
    await raf();
    step = it.next();
  }
  return step.value;
}

/* ── show it ── */
function paint(canvas, img) {
  canvas.width = img.width; canvas.height = img.height;
  canvas.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
}
function present() {
  paint($('canvasBefore'), srcImage);
  paint($('canvasAfter'), colourOn && result.colour
    ? { width: result.width, height: result.height, data: result.colour } : result);
  $('dimsBefore').textContent = fmt(srcImage.width) + ' × ' + fmt(srcImage.height);
  $('dimsAfter').textContent = fmt(result.width) + ' × ' + fmt(result.height)
    + (result.scale > 1.01 ? '  ' + (Math.round(result.scale * 10) / 10) + '×' : '');
  $('faceBtn').disabled = false;
  $('faceBtn').textContent = facesDone ? 'Faces sharpened' : 'Sharpen faces';
  $('colourBtn').disabled = false;
  $('colourBtn').textContent = colourOn ? 'Back to black & white' : 'Colourise';
  $('colourBtn').onclick = colourOn ? toggleColour : () => colourise();
  $('satCtl').hidden = !abFull;
  if (abFull) $('vSat').textContent = Math.round(parseFloat($('cSat').value) * 100) + '%';
  maskOn = false;
  $('showMask').setAttribute('aria-pressed', 'false');
  $('showMask').textContent = 'Show repairs';
  setState('done');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── faces ── */
async function enhanceFaces(silent) {
  const btn = $('faceBtn'), note = t => { if (!silent) $('faceNote').textContent = t; };
  const say = t => { if (!silent) btn.textContent = t; };
  btn.disabled = true;
  try {
    const copy = new Uint8ClampedArray(result.data);
    const res = callWorker(Object.assign({
      type: 'faces', width: result.width, height: result.height, data: copy.buffer,
      ortBase: ORT_BASE, lumaOnly: !!(stats && stats.nearNeutral),
    }, FACE_MODEL), [copy.buffer], m => say(m.stage + '…'));
    if (!res) throw new Error('face restoration needs the page served over http, not opened from a file');
    const m = await res;
    if (!m.count) { note('No faces found in this photograph — nothing to sharpen.'); btn.disabled = false; say('☺  Sharpen faces'); return; }
    result.data = new Uint8ClampedArray(m.data);
    facesDone = true;
    if (!silent && !onStage) paint($('canvasAfter'), result);
    if (abFull) {
      abFull.L = ReviveColour.lightness(result.data, result.width * result.height, ReviveEngine._internal.S2L);
      if (colourOn) applyColour(silent || !!onStage);
    }
    note(m.count + (m.count === 1 ? ' face' : ' faces') + ' restored. Detail here is rebuilt from a learned prior — a likeness, not a record.');
    say('☺  Faces sharpened');
  } catch (e) {
    note('Face restoration failed: ' + (e && e.message ? e.message : e));
    btn.disabled = false; say('☺  Sharpen faces');
  }
}
$('faceBtn').onclick = () => enhanceFaces();

/* ── colour ── */
async function colourise(silent) {
  const btn = $('colourBtn'), note = t => { if (!silent) $('colourNote').textContent = t; };
  const say = t => { if (!silent) btn.textContent = t; };
  btn.disabled = true;
  try {
    const copy = new Uint8ClampedArray(result.data);
    const res = callWorker(Object.assign({
      type: 'colour', width: result.width, height: result.height, data: copy.buffer, ortBase: ORT_BASE,
    }, COLOUR_MODEL), [copy.buffer], m => say(m.stage + '…'));
    if (!res) throw new Error('colourising needs the page served over http, not opened from a file');
    const m = await res;
    abFull = { L: new Float32Array(m.L), a: new Float32Array(m.a), b: new Float32Array(m.b) };
    colourOn = true;
    applyColour(silent || !!onStage);
    if (!silent && !onStage) {
      $('satCtl').hidden = false;
      $('vSat').textContent = Math.round(parseFloat($('cSat').value) * 100) + '%';
      note('Colour is predicted, not recovered — a plausible reading, not a record.');
      btn.textContent = '◐  Back to black & white';
      btn.onclick = toggleColour;
    }
    btn.disabled = false;
  } catch (e) {
    note('Colourising failed: ' + (e && e.message ? e.message : e));
    btn.disabled = false; say('◐  Colourise');
  }
}
$('colourBtn').onclick = () => colourise();

function applyColour(silent) {
  const n = result.width * result.height;
  const k = parseFloat($('cSat').value);
  const a = Float32Array.from(abFull.a), b = Float32Array.from(abFull.b);
  ReviveColour.scaleChroma(a, b, k, n);
  result.colour = ReviveColour.toRgb(abFull.L, a, b, n, result.data, ReviveEngine._internal.linearToByte);
  if (silent) return;
  paint($('canvasAfter'), { width: result.width, height: result.height, data: result.colour });
  $('download').textContent = '↓  Download colourised photo';
}
function toggleColour() {
  colourOn = !colourOn;
  const btn = $('colourBtn');
  if (colourOn) { applyColour(); btn.textContent = '◐  Back to black & white'; }
  else {
    paint($('canvasAfter'), result);
    btn.textContent = '◐  Show colour';
    $('download').textContent = '↓  Download restored photo';
  }
}
$('cSat').addEventListener('input', () => {
  $('vSat').textContent = Math.round(parseFloat($('cSat').value) * 100) + '%';
  if (colourOn && abFull) applyColour();
});

/* ── zoom, scroll-synced ── */
let zoom = false;
const vB = $('viewBefore'), vA = $('viewAfter');
$('zoomBtn').onclick = () => {
  zoom = !zoom;
  body.classList.toggle('zoom1', zoom);
  $('zoomBtn').setAttribute('aria-pressed', String(zoom));
  $('zoomBtn').textContent = zoom ? 'Fit to width' : 'Zoom 1:1';
};
let syncing = false;
const link = (from, to) => from.addEventListener('scroll', () => {
  if (!zoom || syncing) return;
  syncing = true;
  const fx = from.scrollWidth - from.clientWidth, tx = to.scrollWidth - to.clientWidth;
  const fy = from.scrollHeight - from.clientHeight, ty = to.scrollHeight - to.clientHeight;
  if (fx > 0) to.scrollLeft = from.scrollLeft / fx * tx;
  if (fy > 0) to.scrollTop = from.scrollTop / fy * ty;
  requestAnimationFrame(() => { syncing = false; });
});
link(vB, vA); link(vA, vB);

/* ── what was repaired ── */
let maskOn = false;
$('showMask').onclick = () => {
  if (!result || !result.mask) return;
  maskOn = !maskOn;
  $('showMask').setAttribute('aria-pressed', String(maskOn));
  $('showMask').textContent = maskOn ? 'Hide repairs' : 'Show what it repaired';
  if (!maskOn) { paint($('canvasBefore'), srcImage); return; }
  const c = $('canvasBefore'), ctx = c.getContext('2d');
  const im = ctx.getImageData(0, 0, c.width, c.height), d = im.data;
  const mw = result.maskWidth, mh = result.maskHeight, m = result.mask;
  for (let y = 0; y < c.height; y++) {
    const my = Math.min(mh - 1, Math.floor(y * mh / c.height));
    for (let x = 0; x < c.width; x++) {
      const v = m[my * mw + Math.min(mw - 1, Math.floor(x * mw / c.width))];
      if (v <= 0.02) continue;
      const p = (y * c.width + x) * 4, a = Math.min(1, v) * 0.75;
      d[p] = d[p] * (1 - a) + 244 * a;
      d[p + 1] = d[p + 1] * (1 - a) + 114 * a;
      d[p + 2] = d[p + 2] * (1 - a) + 182 * a;
    }
  }
  ctx.putImageData(im, 0, 0);
};

/* ── downloads ── */
function saveImage(img, name) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').putImageData(new ImageData(img.data, img.width, img.height), 0, 0);
  c.toBlob(b => {
    if (!b) return fail('Could not encode the image for download.');
    const url = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }, 'image/png');
}
const saveRestored = () => {
  if (!result) return;
  saveImage({ width: result.width, height: result.height, data: colourOn && result.colour ? result.colour : result.data },
    srcName + (colourOn ? '-colourised' : '-restored') + '.png');
};
$('download').onclick = saveRestored;
$('dlAfter').onclick = e => { e.stopPropagation(); saveRestored(); };
$('dlBefore').onclick = e => { e.stopPropagation(); if (srcImage) saveImage(srcImage, srcName + '-original.png'); };

/* ── batch ────────────────────────────────────────────────────────────────
   One at a time. A hundred 12-megapixel photographs cannot be held decoded in
   memory at once, so each result is encoded to a PNG blob the moment it is
   done and its pixel buffers are dropped: blobs are backed by disk, typed
   arrays are not. */
function crc32(bytes) {
  let c, table = crc32.t;
  if (!table) {
    table = crc32.t = new Int32Array(256);
    for (let n = 0; n < 256; n++) {
      c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c;
    }
  }
  c = ~0;
  for (let i = 0; i < bytes.length; i++) c = table[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (~c) >>> 0;
}
/* Stored, not deflated: PNG is already compressed, so packing it again would
   burn minutes to save nothing. Built from Blob parts, one file read at a
   time, so the whole batch never sits in memory together. */
async function makeZip(entries, onProgress) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    const nameBytes = enc.encode(e.name);
    const data = new Uint8Array(await e.blob.arrayBuffer());
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
    lh.setUint16(26, nameBytes.length, true);
    parts.push(new Uint8Array(lh.buffer), nameBytes, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, data.length, true); cd.setUint32(24, data.length, true);
    cd.setUint16(28, nameBytes.length, true); cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameBytes);
    offset += 30 + nameBytes.length + data.length;
    if (onProgress) onProgress((i + 1) / entries.length);
    await new Promise(r => setTimeout(r, 0));
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
function setRow(i, cls, status, link) {
  const li = $('queue').children[i];
  if (!li) return;
  li.className = cls;
  const st = li.querySelector('.st');
  if (link) { st.innerHTML = ''; st.appendChild(link); } else st.textContent = status;
}
async function runBatch(files) {
  batch = { items: [], stop: false, done: 0 };
  const wantFaces = autoFaces, wantColour = autoColour;
  autoFaces = autoColour = false;
  const q = $('queue');
  q.innerHTML = '';
  for (const f of files) {
    batch.items.push({ file: f, name: (f.name || 'photo').replace(/\.[^.]+$/, ''), blob: null });
    const li = document.createElement('li');
    li.innerHTML = '<span class="dot"></span><span class="nm"></span><span class="st">queued</span>';
    li.querySelector('.nm').textContent = f.name || 'photo';
    q.appendChild(li);
  }
  setState('batch');
  $('batchZip').hidden = true; $('batchAgain').hidden = true; $('batchStop').hidden = false;
  const total = batch.items.length;
  $('batchTitle').textContent = 'Restoring ' + total + ' photographs';
  busy = true;

  for (let i = 0; i < total; i++) {
    if (batch.stop) break;
    const item = batch.items[i];
    setRow(i, 'now', 'reading…');
    const overall = (t, label) => {
      $('batchFill').style.width = Math.round(((i + Math.min(1, t)) / total) * 100) + '%';
      $('batchStage').textContent = (i + 1) + ' of ' + total + ' — ' + (item.file.name || 'photo')
        + (label ? ' — ' + label.toLowerCase() : '');
    };
    overall(0);
    try {
      srcImage = await decodeFile(item.file);
      srcName = item.name;
      const span = (wantFaces || wantColour) ? 0.45 : 0.95;
      result = await restoreImage(srcImage, (stage, p) => { setRow(i, 'now', stage.toLowerCase() + '…'); overall(p * span, stage); });
      colourOn = false; abFull = null;
      if (wantFaces) { setRow(i, 'now', 'faces…'); overall(0.6, 'faces'); await enhanceFaces({ silent: true }); }
      if (wantColour) { setRow(i, 'now', 'colour…'); overall(0.85, 'colour'); await colourise({ silent: true }); }
      const pixels = colourOn && result.colour ? result.colour : result.data;
      item.blob = await new Promise(res => {
        const c = document.createElement('canvas');
        c.width = result.width; c.height = result.height;
        c.getContext('2d').putImageData(new ImageData(pixels, result.width, result.height), 0, 0);
        c.toBlob(res, 'image/png');
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(item.blob);
      a.download = item.name + '-restored.png';
      a.textContent = 'download';
      setRow(i, 'ok', '', a);
      batch.done++;
      srcImage = null; result = null;
    } catch (e) {
      setRow(i, 'bad', (e && e.message ? e.message : 'failed').slice(0, 40));
    }
    await raf();
  }
  busy = false;
  $('batchFill').style.width = '100%';
  $('batchStop').hidden = true;
  $('batchAgain').hidden = false;
  const ok = batch.items.filter(x => x.blob);
  $('batchStage').textContent = batch.stop
    ? 'Stopped — ' + batch.done + ' of ' + total + ' finished.'
    : batch.done + ' of ' + total + ' restored.';
  if (ok.length) {
    $('batchZip').hidden = false;
    $('batchZip').textContent = '↓  Download all ' + ok.length + ' as a ZIP';
  }
}
$('batchStop').onclick = () => { if (batch) { batch.stop = true; $('batchStage').textContent = 'Finishing the current photograph…'; } };
$('batchAgain').onclick = () => { batch = null; setState('idle'); };
$('batchZip').onclick = async () => {
  const ok = batch.items.filter(x => x.blob);
  const btn = $('batchZip');
  btn.disabled = true;
  try {
    const zip = await makeZip(ok.map(x => ({ name: x.name + '-restored.png', blob: x.blob })),
      p => { btn.textContent = 'Packing… ' + Math.round(p * 100) + '%'; });
    const url = URL.createObjectURL(zip);
    const a = document.createElement('a');
    a.href = url; a.download = 'restored-photos.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { $('batchStage').textContent = 'Could not build the ZIP: ' + e.message; }
  btn.disabled = false;
  btn.textContent = '↓  Download all ' + ok.length + ' as a ZIP';
};

/* ── advanced controls ── */
const SLIDERS = [['cRepair', 'vRepair', 'repair'], ['cFade', 'vFade', 'fade'],
                 ['cDenoise', 'vDenoise', 'denoise'], ['cSharpen', 'vSharpen', 'sharpen']];
const SEGS = [['segScale', 'vScale', 'damageScale', ['Fine', 'Normal', 'Coarse', 'Heavy'], true],
              ['segTone', 'vTone', 'tone', { neutral: 'Neutralise', keep: 'Keep tone', mono: 'Black & white' }, false],
              ['segSize', 'vSize', 'scale', null, true]];
function syncControls() {
  if (!opts) return;
  for (const [c, v, key] of SLIDERS) { $(c).value = opts[key]; $(v).textContent = Math.round(opts[key] * 100) + '%'; }
  for (const [seg, v, key, labels] of SEGS) {
    const cur = String(opts[key]);
    for (const b of $(seg).children) b.setAttribute('aria-pressed', String(b.dataset.v === cur));
    $(v).textContent = labels ? labels[opts[key]] : opts[key] + '×';
  }
}
for (const [c, v, key] of SLIDERS) $(c).addEventListener('input', () => {
  opts[key] = parseFloat($(c).value);
  $(v).textContent = Math.round(opts[key] * 100) + '%';
});
for (const [seg, v, key, labels, num] of SEGS) $(seg).addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  opts[key] = num ? parseInt(b.dataset.v, 10) : b.dataset.v;
  syncControls();
});
$('redo').onclick = async () => {
  if (busy || !srcImage) return;
  busy = true; setState('working'); startTicker();
  showStage('Applying your settings', 0.02);
  await raf();
  try {
    const copy = new Uint8ClampedArray(srcImage.data);
    const res = callWorker({ type: 'restore', width: srcImage.width, height: srcImage.height, data: copy.buffer, opts },
      [copy.buffer], m => showStage(m.stage, m.p));
    if (res) {
      const m = await res;
      result = { width: m.width, height: m.height, data: new Uint8ClampedArray(m.data),
        mask: m.mask ? new Float32Array(m.mask) : null, maskWidth: m.maskWidth, maskHeight: m.maskHeight,
        damageFraction: m.damageFraction, scale: m.scale };
      stats = m.stats;
    } else {
      const it = ReviveEngine.restore(srcImage, opts, stats);
      let step = it.next();
      while (!step.done) { showStage(step.value.stage, step.value.p); await raf(); step = it.next(); }
      result = step.value;
    }
  } catch (e) { stopTicker(); return fail('Could not apply those settings: ' + e.message); }
  stopTicker();
  present();
  busy = false;
};

setState('idle');
})();

</script>
</body>
