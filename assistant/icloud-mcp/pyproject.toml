[project]
name = "icloud-mcp"
version = "0.1.0"
description = "iCloud Mail + Calendar connector for Claude (remote MCP)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "caldav>=1.3", "uvicorn>=0.30"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["icloud_mcp"]
