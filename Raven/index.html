<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<title>Raven</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
<script src="config.js" onerror="window.RAVEN_CONFIG=window.RAVEN_CONFIG||{}"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tesla-t" viewBox="12 0 255 253">
    <g transform="translate(-33.796,-64.797)">
      <path d="m173.146 317.299 35.476-199.519c33.815 0 44.481 3.708 46.021 18.843 0 0 22.684-8.458 34.125-25.636-44.646-20.688-89.505-21.621-89.505-21.621l-26.176 31.882 0.059-4e-3 -26.176-31.883s-44.86 0.934-89.5 21.622c11.431 17.178 34.124 25.636 34.124 25.636 1.549-15.136 12.202-18.844 45.79-18.868l35.762 199.548"/>
      <path d="m173.132 80.157c36.09-0.276 77.399 5.583 119.687 24.014 5.652-10.173 7.105-14.669 7.105-14.669-46.227-18.289-89.518-24.548-126.797-24.705-37.277 0.157-80.566 6.417-126.787 24.705 0 0 2.062 5.538 7.1 14.669 42.28-18.431 83.596-24.29 119.687-24.014h5e-3"/>
    </g>
  </symbol>
</svg>

<div id="app">
  <header id="header">
    <div id="brand">
      <svg viewBox="12 0 255 253"><use href="#tesla-t"/></svg>
      <span class="display name">Raven</span>
    </div>
    <div id="clock" class="display num">--:--</div>
    <div id="status">
      <span id="temp-pill" class="pill num">--°</span>
      <span id="car-pill" class="pill num"><span class="bar"><i style="width:0"></i></span>--%</span>
      <span id="unread-pill" class="pill unread"></span>
      <span id="links" title="Spotify · Server · Car">
        <span id="dot-spotify" class="dot"></span>
        <span id="dot-server" class="dot"></span>
        <span id="dot-car" class="dot"></span>
      </span>
      <button id="settings-btn" class="icon" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section id="stage">
    <div id="map-host"></div>
    <div id="map-chrome">
      <label id="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Search a place" autocomplete="off" enterkeyhint="search">
      </label>
      <div id="places"></div>
    </div>
    <div id="map-actions">
      <button id="recenter" class="btn round" aria-label="Recenter">
        <svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" style="fill:currentColor"/></svg>
      </button>
      <button id="send-nav" class="btn primary">Send to nav</button>
    </div>

    <div id="sheet" aria-hidden="true">
      <div id="sheet-head">
        <h2 id="sheet-title" class="display"></h2>
        <span class="spacer"></span>
        <button id="sheet-close" class="btn quiet">Close</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </section>

  <nav id="rail" aria-label="Widgets"></nav>
</div>

<div id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
