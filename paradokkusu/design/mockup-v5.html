<title>パラドックス</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap">
<style>
/* Shelf: home spine (the mark) then four coloured spines; one open, the rest fold to 44pt strips.
   Read-only things live in the top half, everything you touch in the bottom half. */
:root{
  --ground:#000; --surface:#1c1c1e; --surface-2:#2c2c2e;
  --label:#fff; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --on-c:#000;
  --tesla:rgb(255,66,69);   --tesla-t:rgb(255,66,69);
  --ring:rgb(60,211,254);   --ring-t:rgb(60,211,254);
  --spotify:rgb(48,209,88); --spotify-t:rgb(48,209,88);
  --diary:rgb(255,146,48);  --diary-t:rgb(255,146,48);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mark:"Hiragino Mincho ProN","Shippori Mincho","Yu Mincho","Noto Serif JP",serif;
  --strip:44px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --ground:#fff; --surface:#f2f2f7; --surface-2:#e5e5ea;
  --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --tesla:rgb(255,56,60);   --tesla-t:rgb(233,21,45);
  --ring:rgb(0,192,232);    --ring-t:rgb(0,126,174);
  --spotify:rgb(52,199,89); --spotify-t:rgb(0,137,50);
  --diary:rgb(255,141,40);  --diary-t:rgb(197,83,0);
  color-scheme:light}}
:root[data-theme="light"]{
  --ground:#fff; --surface:#f2f2f7; --surface-2:#e5e5ea;
  --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --tesla:rgb(255,56,60);   --tesla-t:rgb(233,21,45);
  --ring:rgb(0,192,232);    --ring-t:rgb(0,126,174);
  --spotify:rgb(52,199,89); --spotify-t:rgb(0,137,50);
  --diary:rgb(255,141,40);  --diary-t:rgb(197,83,0);
  color-scheme:light}

html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--label);font:17px/22px var(--ui);letter-spacing:-.43px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
.phone{height:100%;max-width:430px;margin:0 auto;display:flex}
.spine{position:relative;flex:0 0 var(--strip);min-width:0;overflow:hidden;display:flex;
  transition:flex-grow .45s cubic-bezier(.32,.72,0,1),flex-basis .45s cubic-bezier(.32,.72,0,1)}
.spine.open{flex:1 1 0}

/* strips */
.strip{flex:0 0 var(--strip);width:var(--strip);display:flex;flex-direction:column;align-items:center;border:0;padding:0;margin:0;
  background:var(--c);color:var(--on-c);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  justify-content:flex-end;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transition:background .3s,color .3s}
.strip:active{filter:brightness(.85)}
.strip:focus-visible{outline:2px solid var(--label);outline-offset:-4px}
.spine.open .strip{display:none}
.word{writing-mode:vertical-rl;font:600 15px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase}
.count{margin-top:12px;font:600 13px/1 var(--ui);font-variant-numeric:tabular-nums;opacity:.6}

.home .strip{background:var(--ground);color:var(--label);justify-content:flex-start;padding:22px 0 0;box-shadow:inset -1px 0 0 var(--sep)}
.home.open .strip{display:flex}
.stars{display:flex;flex-direction:column;align-items:center;font:500 19px/1.12 var(--mark)}
.x{font:400 13px/1 var(--mark);margin:11px 0 9px;color:var(--label-2)}
.jp{font:500 14px/1 var(--mark);writing-mode:vertical-rl;letter-spacing:.38em}

/* page */
.page{flex:1;min-width:0;display:none;flex-direction:column;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.spine.open .page{display:flex;animation:in .32s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.eyebrow{font:400 13px/18px var(--ui);letter-spacing:-.08px;color:var(--label-2)}
h1{margin:2px 0 0;font:700 34px/41px var(--ui);letter-spacing:.4px;color:var(--ct,var(--label));text-wrap:balance}
.sub{margin:2px 0 0;font:400 15px/20px var(--ui);letter-spacing:-.23px;color:var(--label-2)}
.reach{margin-top:auto;display:flex;flex-direction:column;gap:12px}

/* grouped rows */
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border:0;margin:0;background:none;color:var(--label);
  font:inherit;text-align:left;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.row:active{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--ct,var(--label));outline-offset:-2px}
.row .t{flex:1;min-width:0;padding:14px 0}
.t.two{display:flex;flex-direction:column;padding:9px 0}
.row .d{font:400 15px/20px var(--ui);letter-spacing:-.23px;color:var(--label-2);font-variant-numeric:tabular-nums}
.chev{width:8px;height:13px;flex:none;color:var(--label-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin:0 7px 0 3px}
.ico{width:22px;height:22px;flex:none;color:var(--ct)}

/* to-dos */
.check{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--label-3);display:grid;place-items:center;transition:background .15s,box-shadow .15s}
.done .check{background:var(--c);box-shadow:none}
.done .check::after{content:"";width:6px;height:11px;border:solid var(--on-c);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.done .t{color:var(--label-3);text-decoration:line-through}
.compose{display:flex;gap:8px;align-items:center}
.compose input{flex:1;min-width:0;height:44px;border-radius:22px;border:0;padding:0 16px;background:var(--surface);color:var(--label);font:inherit;outline:none}
.compose input::placeholder{color:var(--label-3)}
.compose input:focus-visible{box-shadow:0 0 0 2px var(--ct)}
.add{width:44px;height:44px;border-radius:22px;border:0;background:var(--c);color:var(--on-c);display:grid;place-items:center;cursor:pointer;flex:none}
.add:active{filter:brightness(.85)}
.add svg{width:18px;height:18px}

/* primary shortcut = the one prominent button on a page, lowest = most reached */
.primary{min-height:56px;border-radius:28px;border:0;background:var(--c);color:var(--on-c);font:600 17px/22px var(--ui);letter-spacing:-.43px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.primary:active{filter:brightness(.85)}
.primary svg{width:15px;height:15px}

.events{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:baseline}
.ev time{font:600 15px/20px var(--ui);color:var(--ct);font-variant-numeric:tabular-nums}
.ev .w{font:400 13px/18px var(--ui);color:var(--label-2)}
.ev.past{opacity:.45}

@media (prefers-reduced-motion:reduce){.spine,.strip{transition:none}.spine.open .page{animation:none}}
</style>

<div class="phone" id="shelf">

  <section class="spine home open" data-name="Home">
    <button class="strip" aria-label="Home"><span class="stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></span><span class="x" aria-hidden="true">×</span><span class="jp" aria-hidden="true">パラドックス</span></button>
    <div class="page">
      <div class="eyebrow" id="today-sub"></div>
      <h1 id="today"></h1>
      <p class="sub">Next: Read-through at 15:30</p>
      <div class="reach">
        <div class="group">
          <button class="row" data-go="1" style="--c:var(--tesla)"><span class="dot"></span><span class="t two"><span>Tesla</span><span class="d" id="home-tesla">3 to do</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="row" data-go="2" style="--c:var(--ring)"><span class="dot"></span><span class="t two"><span>Ring</span><span class="d">All quiet</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="row" data-go="3" style="--c:var(--spotify)"><span class="dot"></span><span class="t two"><span>Spotify</span><span class="d">Driving</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="row" data-go="4" style="--c:var(--diary)"><span class="dot"></span><span class="t two"><span>Diary</span><span class="d">2 today</span></span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <section class="spine" data-name="Tesla" style="--c:var(--tesla);--ct:var(--tesla-t)">
    <button class="strip" aria-label="Tesla"><span class="word">Tesla</span><span class="count" id="strip-tesla">3</span></button>
    <div class="page">
      <div class="eyebrow">Model 3</div>
      <h1>Tesla</h1>
      <p class="sub" id="tesla-sub">3 to do</p>
      <div class="reach">
        <div class="group" id="todos">
          <button class="row done"><span class="check"></span><span class="t">Book the MOT</span></button>
          <button class="row"><span class="check"></span><span class="t">Fix the rear wiper arm</span></button>
          <button class="row"><span class="check"></span><span class="t">Wash, vacuum the front mats</span></button>
          <button class="row"><span class="check"></span><span class="t">Get tyre pressure caps</span></button>
        </div>
        <form class="compose" id="compose">
          <input id="new-todo" placeholder="Add to Tesla" autocomplete="off" aria-label="New to-do">
          <button class="add" aria-label="Add"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2v14M2 9h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
        </form>
      </div>
    </div>
  </section>

  <section class="spine" data-name="Ring" style="--c:var(--ring);--ct:var(--ring-t)">
    <button class="strip" aria-label="Ring"><span class="word">Ring</span></button>
    <div class="page">
      <div class="eyebrow">4 cameras</div>
      <h1>Ring</h1>
      <p class="sub">Last motion: drive, 08:12</p>
      <div class="reach">
        <div class="group">
          <button class="row"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8.5h4l7-4.5v14l-7-4.5H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="t">Events</span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="row"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><rect x="2.5" y="6" width="12" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 10l5-3v8l-5-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="t">Live view: Drive</span><svg class="chev" viewBox="0 0 8 13" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5 1.5 11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <button class="primary">Live view: Front door</button>
      </div>
    </div>
  </section>

  <section class="spine" data-name="Spotify" style="--c:var(--spotify);--ct:var(--spotify-t)">
    <button class="strip" aria-label="Spotify"><span class="word">Spotify</span></button>
    <div class="page">
      <div class="eyebrow">Last played</div>
      <h1>Spotify</h1>
      <p class="sub">Kind of Blue, Miles Davis</p>
      <div class="reach">
        <div class="group">
          <button class="row"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="11" cy="11" r="2.2" fill="currentColor"/></svg><span class="t">Kind of Blue</span><span class="d">Album</span></button>
          <button class="row"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 6h14M4 11h14M4 16h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="t">Discover Weekly</span><span class="d">Playlist</span></button>
        </div>
        <button class="primary"><svg viewBox="0 0 15 15" aria-hidden="true"><path d="M3 1.5v12l10-6z" fill="currentColor"/></svg>Play Driving ★★★★★</button>
      </div>
    </div>
  </section>

  <section class="spine" data-name="Diary" style="--c:var(--diary);--ct:var(--diary-t)">
    <button class="strip" aria-label="Diary"><span class="word">Diary</span><span class="count">2</span></button>
    <div class="page">
      <div class="eyebrow" id="diary-sub"></div>
      <h1>Diary</h1>
      <div class="events">
        <div class="ev past"><time>09:30</time><div><div>Coffee, Bea</div><div class="w">Monmouth, Borough</div></div></div>
        <div class="ev"><time>15:30</time><div><div>Read-through</div><div class="w">Soho</div></div></div>
        <div class="ev"><time>19:00</time><div><div>Gym</div><div class="w">1 hr</div></div></div>
      </div>
      <div class="reach">
        <div class="group">
          <button class="row"><svg class="ico" viewBox="0 0 22 22" aria-hidden="true"><path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="t">New event</span></button>
        </div>
        <button class="primary">Open Calendar</button>
      </div>
    </div>
  </section>

</div>

<script>
(function(){
  var shelf=document.getElementById('shelf');
  var spines=[].slice.call(shelf.querySelectorAll('.spine'));
  var cur=0;
  function open(i){
    cur=(i+spines.length)%spines.length;
    spines.forEach(function(s,j){s.classList.toggle('open',j===cur);s.querySelector('.strip').setAttribute('aria-expanded',j===cur)});
  }
  spines.forEach(function(s,i){s.querySelector('.strip').addEventListener('click',function(){open(i)})});
  [].forEach.call(document.querySelectorAll('[data-go]'),function(r){r.addEventListener('click',function(){open(+r.dataset.go)})});

  // dates
  var now=new Date();
  var day=now.toLocaleDateString('en-GB',{weekday:'long'});
  var date=now.toLocaleDateString('en-GB',{day:'numeric',month:'long'});
  document.getElementById('today').textContent=day;
  document.getElementById('today-sub').textContent=date;
  document.getElementById('diary-sub').textContent=day+' '+date;

  // tesla to-dos
  var list=document.getElementById('todos');
  function recount(){
    var n=list.querySelectorAll('.row:not(.done)').length;
    var s=n===0?'All done':n+' to do';
    document.getElementById('tesla-sub').textContent=s;
    document.getElementById('home-tesla').textContent=s;
    document.getElementById('strip-tesla').textContent=n||'';
  }
  list.addEventListener('click',function(e){var r=e.target.closest('.row');if(r){r.classList.toggle('done');recount()}});
  document.getElementById('compose').addEventListener('submit',function(e){
    e.preventDefault();
    var inp=document.getElementById('new-todo'),v=inp.value.trim();
    if(!v)return;
    var b=document.createElement('button');b.className='row';
    b.innerHTML='<span class="check"></span><span class="t"></span>';
    b.querySelector('.t').textContent=v;
    list.appendChild(b);inp.value='';recount();
  });
  recount();

  // swipe on the open page moves along the shelf; rows stay tap-only
  var x0=null,y0=0;
  shelf.addEventListener('touchstart',function(e){if(e.target.closest('input'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  shelf.addEventListener('touchend',function(e){
    if(x0==null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)open(cur+(dx<0?1:-1));
  });
  document.addEventListener('keydown',function(e){if(e.target.closest('input'))return;if(e.key==='ArrowRight')open(cur+1);else if(e.key==='ArrowLeft')open(cur-1)});
  function fromHash(){try{var h=location.hash.slice(1);open(/^[1-5]$/.test(h)?+h-1:cur)}catch(_){open(cur)}}
  window.addEventListener('hashchange',fromHash);fromHash();
})();
</script>
