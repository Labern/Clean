<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICA — a screenwriting instrument</title>
<meta name="description" content="A screenplay editor that reads and writes the printed page. Import any Final Draft PDF and edit it — identically.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   PICA — MONOGRAPH chrome (grisaille, serif+mono) around a Courier page.
   One ink, no accent. The script page is always paper — it is the object.
   ================================================================ */
:root{
  --serif: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, "Times New Roman", serif;
  --mono:  ui-monospace, "SF Mono", "Menlo", "Cascadia Code", "Roboto Mono", monospace;
  --ui: var(--serif);   /* the interface voice — the PICA face, never the screenplay's Courier */
  /* "Courier Prime Local" resolves only inside PICA.app, which bundles the font so the
     native build needs no network. On the web it simply fails and the Google Fonts copy
     below it in the stack takes over. */
  --courier: "Courier Prime Local", "Courier Prime", "Courier New", Courier, monospace;

  --paper:#f6f5f2;  --paper-2:#efeee9;
  --ink:#141413;    --ink-2:#4c4b47;   --faint:#8f8e88;
  --line:#dad9d2;   --rule:#141413;
  --page:#fdfcf8;   --page-ink:#1b1a17;
  --shadow: 0 14px 44px rgba(20,20,19,.14), 0 2px 8px rgba(20,20,19,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#111110;  --paper-2:#181817;
    --ink:#ecebe6;    --ink-2:#b1b0a9;   --faint:#706f69;
    --line:#2a2a27;   --rule:#ecebe6;
    --shadow: 0 18px 54px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --paper:#f6f5f2;  --paper-2:#efeee9;
  --ink:#141413;    --ink-2:#4c4b47;   --faint:#8f8e88;
  --line:#dad9d2;   --rule:#141413;
  --shadow: 0 14px 44px rgba(20,20,19,.14), 0 2px 8px rgba(20,20,19,.08);
}
:root[data-theme="dark"]{
  --paper:#111110;  --paper-2:#181817;
  --ink:#ecebe6;    --ink-2:#b1b0a9;   --faint:#706f69;
  --line:#2a2a27;   --rule:#ecebe6;
  --shadow: 0 18px 54px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
}

@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:block; }
@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Bold.ttf") format("truetype"); font-weight:700; font-style:normal; font-display:block; }
@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Italic.ttf") format("truetype"); font-weight:400; font-style:italic; font-display:block; }

*{ box-sizing:border-box; margin:0; padding:0; }
/* The whole interface is sized in rem off this one value, so the UI-size slider in
   Settings moves everything at once — and the app and the browser agree regardless of
   whatever default font size the browser happens to be set to. */
html{ font-size:var(--ui-base, 20px); }
html,body{ height:100%; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif);
  display:flex; flex-direction:column; overflow:hidden;
}
button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; }
::selection{ background:var(--ink); color:var(--paper); }
.page ::selection{ background:var(--page-ink); color:var(--page); }

/* ---------- annotations: margin notes ---------- */
.noteLayer{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.noteHl{ position:absolute; background:rgba(27,26,23,.16); border-bottom:1px solid rgba(27,26,23,.42); pointer-events:none; }
.noteBox{
  position:absolute; width:210px; pointer-events:auto;
  background:var(--paper); border:1px solid var(--line);
  padding:.42rem .55rem;
}
.noteBox .x{
  position:absolute; top:1px; right:1px; width:1.05rem; height:1.05rem; line-height:1rem;
  text-align:center; font-family:var(--mono); font-size:.62rem; color:var(--faint);
  background:var(--paper); border:1px solid var(--line); opacity:0; cursor:pointer; padding:0;
}
.noteBox:hover .x{ opacity:1; }
.noteBox .x:hover{ color:var(--ink); }
.noteBox:focus-within{ border-color:var(--faint); }
.noteBox textarea{
  display:block; width:100%; resize:none; background:transparent; border:none; outline:none;
  font-family:var(--mono); font-size:.66rem; line-height:1.55; letter-spacing:.01em;
  color:var(--ink); overflow:hidden; padding:0;
}
.noteBox textarea::placeholder{ color:var(--faint); }
.noteLead{ position:absolute; background:var(--faint); opacity:.55; pointer-events:none; }
#btnAnnot.on{ color:var(--ink); }

/* ---------- storyboard: e-conte panels, left of the page ---------- */
.sbLayer{ position:absolute; inset:0; pointer-events:none; z-index:3; }
.sbPanel{
  position:absolute; width:240px; pointer-events:auto; cursor:grab;
  background:var(--paper); border:1px solid var(--line); padding:4px;
}
.sbPanel img{ display:block; width:100%; height:auto; user-select:none; -webkit-user-drag:none; background:var(--paper-2); }
.sbPanel .x{
  position:absolute; top:1px; right:1px; width:1.05rem; height:1.05rem; line-height:1rem;
  text-align:center; font-family:var(--mono); font-size:.62rem; color:var(--faint);
  background:var(--paper); border:1px solid var(--line); opacity:0; cursor:pointer; padding:0;
}
.sbPanel:hover .x{ opacity:1; }
.sbPanel .x:hover{ color:var(--ink); }
.sbPanel.dragging{ opacity:.45; cursor:grabbing; z-index:5; }
.sbLead{ position:absolute; background:var(--faint); opacity:.55; pointer-events:none; }
#btnSb.on{ color:var(--ink); }
#sbZoom{
  position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  background:rgba(8,8,8,.74); cursor:zoom-out;
}
#sbZoom.show{ display:flex; }
#sbZoom img{ max-width:92vw; max-height:92vh; background:#fff; padding:6px; box-shadow:var(--shadow); }

/* ---------- masthead ---------- */
header{
  position:relative;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.2rem;
  padding:.72rem 1.4rem;
  padding-left:var(--titlebar-inset, 1.4rem);   /* PICA.app clears the traffic lights */
  border-bottom:1px solid var(--line);
  flex:none; user-select:none; min-height:3.15rem;
}
.hzone{ display:flex; align-items:center; gap:1.35rem; min-width:0; }
.hzone.left{ grid-column:1; }
.hzone.right{ grid-column:3; justify-content:flex-end; }
.wordmark{ font-family:var(--serif); font-size:1.28rem; font-weight:560; letter-spacing:.045em; }
#docTitle{
  font-family:var(--mono); font-size:.76rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink); outline:none; padding:.22rem .7rem; border-bottom:1px dashed transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:36vw; text-align:center;
  /* centred over the page (the canvas), not the window — the same optical centre the
     character cues sit on; when the sidebar hides, the page centre IS the window centre */
  position:absolute; left:calc(50% + var(--railw, 16.5rem) / 2); transform:translateX(-50%);
}
body.railhidden #docTitle{ left:50%; }
@media (max-width: 880px){ #docTitle{ position:static; transform:none; } }
#docTitle:hover{ border-bottom-color:var(--line); }
#docTitle:focus{ border-bottom-color:var(--faint); }
header .grow{ flex:1; }
.hbtn{
  font-family:var(--ui); font-size:.95rem; letter-spacing:.015em;
  color:var(--ink-2); padding:.24rem .1rem; border-bottom:1px solid transparent;
  transition:color .12s, border-color .12s;
}
.hbtn:hover{ color:var(--ink); border-bottom-color:var(--rule); }
#railToggle{ font-size:.95rem; letter-spacing:0; }

/* ---------- body split ---------- */
#split{ flex:1; display:flex; min-height:0; }

/* ---------- rail ---------- */
#rail{
  width:var(--railw, 16.5rem); flex:none; border-right:1px solid var(--line);
  overflow-y:auto; padding:1.3rem 1.2rem 3rem;
  scrollbar-width:thin; user-select:none; position:relative;
}
body.railhidden #rail, body.railhidden #railGrip{ display:none; }
/* drag handle: a hairline that thickens under the cursor */
#railGrip{
  flex:none; width:7px; margin-left:-4px; cursor:col-resize; position:relative; z-index:5;
  background:transparent;
}
#railGrip::after{
  content:""; position:absolute; inset:0 3px; background:transparent; transition:background .12s;
}
#railGrip:hover::after, #railGrip.dragging::after{ background:var(--rule); }
body.resizing{ cursor:col-resize; user-select:none; }
body.resizing #canvas{ pointer-events:none; }
.eyebrow{
  width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:.7rem;
  font-family:var(--mono); font-size:.62rem; letter-spacing:.28em; text-transform:uppercase;
  color:var(--faint); margin:1.4rem 0 .65rem;
}
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
.eyebrow:first-child{ margin-top:0; }
.doc-item,.scene-item{
  display:flex; gap:.7rem; width:100%; text-align:left;
  font-family:var(--mono); font-size:.71rem; line-height:1.6;
  color:var(--ink-2); padding:.3rem .35rem .3rem .55rem;
  border-left:2px solid transparent;
}
.doc-item:hover,.scene-item:hover{ color:var(--ink); }
.doc-item.current,.scene-item.current{ border-left-color:var(--rule); color:var(--ink); }
.doc-item.dragging{ opacity:.45; }
/* The row a context menu belongs to — so a Delete can never land on the wrong script.
   A faint wash was not enough: with the menu open over the rail you could not tell at a
   glance WHICH script you were about to rename or delete. It is a selection, so it looks
   like one — the whole row inverted, edge to edge, the way a chosen thing looks. */
.doc-item.menuing,.scene-item.menuing{
  background:var(--ink); color:var(--paper);
  border-left-color:var(--ink);
  /* bleed past the rail's own padding so the block runs the full width of the column */
  margin-left:-.55rem; margin-right:-.55rem;
  padding-left:1.1rem; padding-right:.9rem;
  border-radius:2px;
}
.doc-item.menuing .pg,.scene-item.menuing .no{ color:var(--paper); opacity:.62; }
.doc-item.menuing .ttl{ opacity:1 !important; }
.doc-item.menuing:hover,.scene-item.menuing:hover{ color:var(--paper); }
.doc-item.drop-above{ box-shadow:0 -2px 0 var(--rule); }
.doc-item.drop-below{ box-shadow:0 2px 0 var(--rule); }
.scene-item .no{ color:var(--faint); flex:none; width:1.7em; text-align:right; font-variant-numeric:tabular-nums; }
.scene-item .sl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-item .pg{ margin-left:auto; color:var(--faint); font-variant-numeric:tabular-nums; flex:none;}
.sidegrid{ display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.4rem; }
/* UI font option: Screenplay puts the title, index names, slugs and character
   names in the script's own Courier; headers and everything else stay put */
body.uifont-screenplay #docTitle{ font-family:var(--courier); font-size:.8rem; }
body.uifont-screenplay .doc-item, body.uifont-screenplay .scene-item{ font-family:var(--courier); font-size:.74rem; }

/* the index holds ten rows; past that it scrolls within itself, so SCENES always
   starts just below the tenth entry */
#docList{ max-height:17.6rem; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; position:relative; z-index:1; }
.sbtn{
  font-family:var(--mono); font-size:.64rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink); background:transparent; border:1.5px solid var(--ink);
  padding:.5rem 0; text-align:center; transition:background .1s, color .1s;
}
.sbtn:hover{ background:var(--ink); color:var(--paper); }
#btnKeys{ font-size:1.1rem; }
[data-head][hidden]{ display:none !important; }

/* ---------- canvas ---------- */
#canvas{ flex:1; overflow:auto; background:var(--paper-2); min-width:0; position:relative; }
#pages{ outline:none; padding:2.6rem 1rem 6rem; caret-color:var(--page-ink); }
.pageWrap{ margin:0 auto var(--pagegap, 7rem); position:relative; }
.page{
  position:relative; background:var(--page); color:var(--page-ink);
  box-shadow:var(--shadow); margin:0 auto;
  font-family:var(--courier); font-variant-ligatures:none;
}
.line{
  position:absolute; white-space:pre; min-width:1px;
}
.line:empty::after{ content:"\200B"; }
.gen{ color:var(--page-ink); }
.pageghost{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:.65rem; letter-spacing:.3em; color:var(--faint); }

#docGenre{
  font-family:var(--mono); font-size:.66rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-2); outline:none; padding:.15rem .3rem; min-width:1.2rem; text-align:right;
  border-bottom:1px dashed transparent; white-space:nowrap;
}
#docGenre:empty::before{ content:"genre"; color:var(--faint); opacity:.45; }
#docGenre:hover, #docGenre:focus{ border-bottom-color:var(--faint); }

/* ---------- reader mode: the app melts down to the read ---------- */
body.reader{ --pagegap: .55rem; --footpad: var(--rfoot, .22rem); }   /* reading runs tight; exit restores */
body.reader #pages{ caret-color:transparent; }
body.reader #btnReader{ color:var(--ink); border-bottom-color:var(--rule); }
.fcenter{ display:flex; align-items:center; justify-content:center; }
#readerPage{
  position:absolute; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:.7rem; letter-spacing:.18em; color:var(--faint);
  font-variant-numeric:tabular-nums; opacity:0; visibility:hidden; transition:opacity .35s, visibility .35s;
}
footer{ position:relative; }
body.reader #readerPage{ opacity:1; visibility:visible; }
/* everything that isn't PICA · page count · title · reader (header) or ☰ · zoom (footer)
   melts away — layout kept, so the morph is a fade, not a jump */
#docGenre, #btnSplit, #btnTheme, [data-head], #btnKeys, #stPage, [data-foot], #stSave{
  transition:opacity .35s, visibility .35s;
}
body.reader #docGenre, body.reader #btnSplit, body.reader #btnTheme, body.reader [data-head],
body.reader #btnKeys, body.reader #stPage, body.reader [data-foot], body.reader #stSave, body.reader #btnBrowse, body.reader #btnAnnot, body.reader #btnSb{
  opacity:0 !important; visibility:hidden !important; pointer-events:none !important;
}

/* ---------- side by side ---------- */
#canvasB{ flex:1; min-width:0; overflow:auto; background:var(--paper-2); border-left:1px solid var(--line); position:relative; }
body.split #canvas{ flex:1; min-width:0; }
.bstrip{
  position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:.6rem;
  background:var(--paper); border-bottom:1px solid var(--line); padding:.35rem .8rem;
}
#bDocSel{
  font-family:var(--mono); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink); background:none; border:none; border-bottom:1px solid var(--line); outline:none;
  max-width:70%;
}
#bSync{
  margin-left:auto; font-family:var(--mono); font-size:.62rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--faint); padding:.1rem .3rem; border-bottom:1px solid transparent;
}
#bSync.on{ color:var(--ink); border-bottom-color:var(--rule); }
#bSync:hover{ color:var(--ink); }
#bClose{ color:var(--ink-2); font-size:.9rem; }
#bClose:hover{ color:var(--ink); }
#pagesB{ padding:1.6rem .8rem 5rem; }
#pagesB .pageWrap{ margin:0 auto var(--pagegap, 1.6rem); }
#pagesB .page{ user-select:text; }

/* ---------- statusbar ---------- */
footer{
  flex:none; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.3rem;
  border-top:1px solid var(--line); padding:var(--footpad, .46rem) 1.4rem;
  font-family:var(--mono); font-size:.69rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); user-select:none; white-space:nowrap; overflow:hidden;
}
.fzone{ display:flex; align-items:center; gap:1.3rem; min-width:0; }
.fzone.right{ justify-content:flex-end; }
[data-foot][hidden]{ display:none !important; }
#stType{ color:var(--ink); letter-spacing:.2em; border-bottom:1px solid var(--line); padding-bottom:1px; }
#stDrafts{ color:var(--ink-2); letter-spacing:.15em; }
#stDrafts:hover{ color:var(--ink); }
#stType:hover{ border-bottom-color:var(--rule); }
footer .grow{ flex:1; }
footer .z{ padding:0 .25rem; color:var(--ink-2); }
/* ---------- find-a-screenplay ---------- */
#getForm{ display:flex; align-items:center; }
#getIn{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.04em; color:var(--ink);
  background:transparent; border:none; border-bottom:1px solid var(--rule);
  padding:.12rem .3rem; width:9.5rem; outline:none; transition:width .18s, border-color .18s;
}
#getIn::placeholder{ color:var(--faint); }
#getIn:focus{ width:15rem; border-bottom-color:var(--ink-2); }
#getIn::-webkit-search-cancel-button{ -webkit-appearance:none; }
#getForm.busy #getIn{ border-bottom-color:var(--ink); }
/* the trial bar sits above the first page and owns the decision */
/* The decision box. It is opaque WHITE and self-coloured on purpose: it asks a question
   about the page underneath it, so it must never be read through — and it must look the
   same in either theme. (It used to say background:var(--bg), a token this app has never
   defined, so it resolved to nothing and the box was transparent.) It sits above every
   layer on the page and below only the modal overlay and the toast. */
#trialBar{
  /* Full width, so the script passing underneath is MASKED rather than showing either
     side of it: an 780px box over an 881px page left the text visible around the edges
     as you scrolled. The reading measure is kept on the row inside. */
  position:sticky; top:0; z-index:75; margin:0 0 .55rem; width:100%;
  background:#fff; color:#141413;
  border:none; border-bottom:1px solid #cfccc3; border-radius:0;
  padding:.6rem 1.1rem .55rem; box-shadow:0 12px 26px rgba(0,0,0,.22);
  font-family:var(--mono); font-size:.72rem;
}
#trialBar .tb-row{ max-width:860px; margin-left:auto; margin-right:auto; }
#trialBar[hidden]{ display:none; }
#trialBar .tb-row{ display:flex; align-items:center; gap:.6rem; }
#trialBar .grow{ flex:1; }
#trialBar .tb-q{ color:#141413; letter-spacing:.06em; text-transform:uppercase; font-size:.66rem; }
#trialBar .tb-what{ color:#141413; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#trialBar .tb-what span{ color:#77746c; margin-left:.5rem; }
#trialBar .tb-sub{ margin-top:.28rem; color:#77746c; font-size:.66rem; }
#trialBar .tb-btn{
  font-family:var(--mono); font-size:.68rem; letter-spacing:.05em; white-space:nowrap;
  padding:.2rem .55rem; border:1px solid #d9d7d0; border-radius:3px; color:#3f3d38;
  background:#fff;
}
#trialBar .tb-q{ white-space:nowrap; }
#trialBar .tb-btn:hover{ color:#141413; border-color:#8a877e; }
#trialBar .tb-yes{ color:#141413; border-color:#141413; }
#trialBar .tb-quiet{ border-color:transparent; color:#77746c; }
@media (max-width: 880px){ #getIn{ width:6.5rem; } #getIn:focus{ width:9rem; } }
footer .z:hover{ color:var(--ink); }
#stSave{ font-variant-numeric:tabular-nums; }
#stPage{ font-variant-numeric:tabular-nums; color:var(--ink-2); }

/* ---------- popups ---------- */
.pop{
  position:fixed; z-index:50; background:var(--paper); border:1px solid var(--line);
  box-shadow:var(--shadow); min-width:15rem; max-width:24rem; padding:.45rem 0;
  font-family:var(--mono); font-size:.73rem; letter-spacing:.06em;
}
.pop .it{
  display:flex; gap:.9rem; padding:.36rem .95rem; color:var(--ink-2); cursor:pointer; align-items:baseline;
}
.pop .it .k{ font-family:var(--mono); margin-left:auto; color:var(--faint); font-size:.62rem; letter-spacing:.1em; }
.pop .it.sel{ background:var(--ink); color:var(--paper); }
.pop .it.sel .k{ color:var(--paper); opacity:.6; }
.pop .cap{ padding:.25rem .8rem .35rem; font-size:.58rem; letter-spacing:.26em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); margin-bottom:.25rem;}

/* ---------- overlay (keys / import / confirm) ---------- */
#overlay{
  position:fixed; inset:0; z-index:80; background:color-mix(in srgb, var(--paper) 72%, transparent);
  display:none; align-items:center; justify-content:center; backdrop-filter:blur(2px);
}
#overlay.show{ display:flex; }
.card{
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow);
  max-width:42rem; width:min(42rem, 94vw); max-height:86vh; overflow:auto; padding:2rem 2.4rem 2rem;
}
.card h2{ font-family:var(--serif); font-weight:560; font-size:1.3rem; letter-spacing:-.01em; margin-bottom:.2rem; }
.card .sub{ font-family:var(--ui); font-size:.72rem; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--faint); margin-bottom:1.1rem; }
.card table{ width:100%; border-collapse:collapse; font-family:var(--ui); font-size:.88rem; }
.card td{ padding:.32rem .2rem; border-top:1px solid var(--line); color:var(--ink-2); vertical-align:top;}
.card td:first-child{ font-family:var(--mono); font-size:.72rem; white-space:nowrap; padding-right:1.2rem; color:var(--ink); letter-spacing:.06em; }
.card .foot{ margin-top:1.2rem; display:flex; gap:1.4rem; }
.card p{ font-size:.95rem; line-height:1.55; color:var(--ink-2); max-width:60ch; margin:.4rem 0; }
#importLog{ font-family:var(--mono); font-size:.72rem; line-height:1.9; color:var(--ink-2); white-space:pre-wrap; }

/* toast */
#toast{
  position:fixed; left:50%; bottom:3.2rem; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:.66rem;
  letter-spacing:.18em; text-transform:uppercase; padding:.5rem 1rem; opacity:0; transition:.25s; z-index:90;
  pointer-events:none; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- draft compare ---------- */
.cmp-row{ border-top:1px solid var(--line); padding:.55rem 0; cursor:pointer; }
.cmp-st{ font-family:var(--mono); font-size:.6rem; letter-spacing:.18em; text-transform:uppercase; padding:.1rem .4rem; border:1px solid var(--line); margin-right:.6rem; }
.cmp-changed{ color:var(--ink); border-color:var(--rule); }
.cmp-added{ color:var(--ink-2); }
.cmp-removed{ color:var(--faint); text-decoration:line-through; }
.cmp-slug{ font-family:var(--mono); font-size:.72rem; }
.cmp-body{ display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:.6rem; }
.cmp-col h4{ font-family:var(--ui); font-size:.7rem; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin-bottom:.3rem; }
.cmp-col pre{ font-family:var(--mono); font-size:.62rem; line-height:1.7; white-space:pre-wrap; color:var(--ink-2); max-height:16rem; overflow:auto; border:1px solid var(--line); padding:.6rem; }

/* ---------- find bar ---------- */
#findBar{
  position:fixed; top:3.6rem; right:1.2rem; z-index:60;
  display:flex; align-items:center; gap:.55rem;
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow);
  padding:.5rem .7rem; font-family:var(--mono); font-size:.7rem;
}
#findBar[hidden]{ display:none; }
#findBar input{
  font-family:var(--mono); font-size:.72rem; color:var(--ink);
  background:none; border:none; border-bottom:1px solid var(--line); outline:none;
  padding:.15rem .1rem; width:11rem;
}
#findBar input:focus{ border-bottom-color:var(--rule); }
#findBar #replIn{ width:8.5rem; }
#findCount{ color:var(--faint); font-variant-numeric:tabular-nums; min-width:3.4rem; text-align:center; }
.fb{ color:var(--ink-2); padding:.1rem .25rem; letter-spacing:.04em; }
.fb:hover{ color:var(--ink); }

/* ---------- settings ---------- */
.set-row{
  display:grid; grid-template-columns:13rem 1fr; gap:.4rem 2rem; align-items:center;
  padding:.95rem 0; border-top:1px solid var(--line);
}
.set-row .lab{ font-family:var(--ui); font-size:.95rem; font-weight:600; color:var(--ink); }
.set-row .hint{ grid-column:1; font-family:var(--ui); font-size:.78rem; color:var(--faint); line-height:1.4; margin-top:-.5rem; }
.set-row .ctl{ grid-column:2; grid-row:1 / span 2; display:flex; align-items:center; gap:.9rem; justify-content:flex-end; }
.set-row:has(.hint) .ctl{ align-self:center; }
.seg{ display:flex; gap:1.1rem; flex-wrap:wrap; }
.seg button{
  font-family:var(--ui); font-size:.88rem; padding:.1rem 0;
  color:var(--faint); border-bottom:2px solid transparent;
}
.seg button:hover{ color:var(--ink-2); }
.seg button.on{ color:var(--ink); border-bottom-color:var(--rule); }
.seg button[disabled]{ opacity:.4; }
input[type=range]{ -webkit-appearance:none; appearance:none; height:2px; background:var(--line); flex:1; max-width:15rem; }
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--ink); cursor:grab; border:none;
}
.set-val{ font-family:var(--mono); font-size:.72rem; color:var(--ink); width:3.4rem; text-align:right; font-variant-numeric:tabular-nums; }
.card a{ color:var(--ink); text-underline-offset:3px; }
.card h3{
  font-family:var(--ui); font-size:.72rem; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  color:var(--faint); margin:2rem 0 .4rem; display:flex; align-items:center; gap:.8rem;
}
.card h3::after{ content:""; flex:1; height:1px; background:var(--line); }
#footLink{ color:var(--faint); text-decoration:none; border-bottom:1px solid transparent; }
#footLink:hover{ color:var(--ink); border-bottom-color:var(--rule); }

/* ---------- responsive ---------- */
footer .z{ font-size:.8rem; letter-spacing:0; }
@media (max-width: 880px){
  #rail{ position:fixed; left:0; top:0; bottom:0; z-index:70; background:var(--paper);
    transform:translateX(-100%); transition:.2s; padding-top:3rem; width:16rem !important;}
  #rail.open{ transform:none; box-shadow:var(--shadow); }
  #railGrip{ display:none; }
  body.railhidden #rail{ display:block; }
  #docTitle{ max-width:44vw; letter-spacing:.12em; }
  .hzone{ gap:.7rem; }
  header{ gap:.5rem; padding:.55rem .7rem .5rem; }
  .wordmark{ font-size:1.05rem; }
}

/* ---------- print: the page is the artifact ---------- */
@media print{
  html,body{ overflow:visible; background:#fff; height:auto;}
  header,#rail,footer,.pop,#overlay,#toast{ display:none !important; }
  .noteLayer,.sbLayer{ display:none !important; }   /* notes and boards are his, not the script's — PDF stays pristine */
  #split,#canvas{ display:block; overflow:visible; }
  #canvas{ background:#fff; }
  #pages{ padding:0; }
  .pageWrap{ margin:0; break-after:page; }
  .page{ box-shadow:none; background:#fff; color:#000; }
}
</style>
</head>

<script>
/*PICA-ENGINE-START*/
const PicaEngine = (() => {
  'use strict';

  // ---------- element types ----------
  const TYPES = ['scene', 'action', 'character', 'paren', 'dialogue', 'transition', 'shot', 'general'];

  // Default layout: US Letter, Final Draft standard (new blank documents)
  const LETTER = {
    pageW: 612, pageH: 792,
    y0: 76.5, rowH: 12, rows: 55,
    pnY: 40.5, pnRight: 576,
    cols: { action: 108, dialogue: 180, paren: 216, character: 252 },   // FD12: character left 3.50"
    transRight: 511.2, charW: 7.2,                                       // FD12: transition right 7.10"
    widths: { scene: 60, action: 60, character: 37, paren: 25, dialogue: 35, transition: 16, shot: 60, general: 60 },   // FD12's own margins (Screenplay.fdxt): action 1.5"–7.5", cue 3.5"–7.25", paren 3.0"–5.5", transition 5.5"–7.1"
    moreDy: 10, contDy: -14,
  };

  const SCENE_RE = /^(INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|INT|EXT|I\/E|EST)[\s.]/i;
  // a numbered slug's opening token, and the words that mark a page as title matter
  const INLINE_NO_HEAD = /^\s*[A-Z]{0,2}\d{1,3}[A-Z]{0,2}[.)]\s/;
  const TITLE_HEAD_RE = /screenplay by|written by|story by|directed by|produced by|copyright|\bdraft\b|\d{1,2}\/\d{1,2}\/\d{2,4}|[A-Z][a-z]+ \d{1,2},\s*\d{4}/i;
  const uid = () => 'e' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  // ---------- line assembly from positioned text items ----------
  // items: [{x, y (top-origin), w, str}] for one page → lines [{x, xEnd, y, text, items}]
  // wordLevel: this page's OCR gives one item per WORD, and its boxes often touch or even
  // overlap. Measuring the gap then welds them — "A CLUBPHOTOGRAPHERpops snap-shots". Two
  // words are two words however tight the boxes are. Only set for pages that really are
  // word-per-item, so a PDF whose items are whole runs (and whose splits fall mid-word)
  // is joined exactly as before.
  function joinItems(items, charW, wordLevel) {
    let text = '', xEnd = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (i > 0) {
        const gap = it.x - xEnd;
        if (gap > charW * 0.45 && !/\s$/.test(text)) text += ' '.repeat(Math.max(1, Math.round(gap / charW)));
        else if (wordLevel && !/\s$/.test(text) && /[A-Za-z0-9.,;:!?'")\]]$/.test(text)
                 && /^[A-Za-z0-9("'\[]/.test(it.str)) text += ' ';
      }
      text += it.str;
      xEnd = it.x + it.w;
    }
    return { text: text.replace(/\s+$/, ''), xEnd };
  }

  function linesFromItems(items, charW, wordLevel) {
    const its = items.filter(i => i.str && i.str.trim() !== '');
    its.sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    for (const it of its) {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - it.y) < 2.5) last.items.push(it);
      else lines.push({ y: it.y, items: [it] });
    }
    return lines.map(L => {
      L.items.sort((a, b) => a.x - b.x);
      // some PDFs draw their text twice at the same origin (double-strike bold,
      // duplicated watermark layers) — "Gadget" extracts as "GadgetGadget".
      // An identical string within a point of the previous one is overprint.
      const its2 = [];
      for (const it of L.items) {
        const prev = its2[its2.length - 1];
        if (prev && prev.str === it.str && Math.abs(prev.x - it.x) < 1) continue;
        its2.push(it);
      }
      L.items = its2;
      const j = joinItems(L.items, charW, wordLevel);
      return { x: L.items[0].x, xEnd: j.xEnd, y: L.y, text: j.text, items: L.items };
    }).filter(L => L.text.length > 0);
  }

  // ---------- garbled-font recovery ----------
  // Some PDFs (There Will Be Blood among them) embed subset fonts with no ToUnicode
  // map: extraction yields cipher text — every glyph a wrong symbol, consistently.
  // A screenplay gives ~100KB of ciphertext in known English, which is more than
  // enough to crack a monoalphabetic substitution outright. Solved per font (each
  // subset carries its own mapping), validated, and reverted if unconvincing —
  // an import may end up warned-about, but never silently blank.
  const GOODCH = /[a-zA-Z0-9\s.,:;!?'"()\-–—*&%$#@/[\]]/;
  function garbledness(text) {
    let letters = 0, weird = 0;
    for (const ch of text) {
      if (/[a-zA-Z]/.test(ch)) letters++;
      else if (!/[\s0-9.,:;!?'"()\-–—_*/]/.test(ch)) weird++;
    }
    const n = letters + weird;
    return n < 40 ? 0 : weird / n;
  }

  // compact English trigram model (log-ish weights) + words that anchor a screenplay
  const TRIGRAMS = ('the:9 and:8 ing:8 ent:7 ion:7 her:7 for:6 tha:6 nth:6 int:6 ere:6 tio:6 ter:6 est:6 ers:6 ati:5 hat:5 ate:5 all:5 eth:5 hes:5 ver:5 his:5 oft:5 ith:5 fth:5 sth:5 oth:5 res:5 ont:5 dth:5 are:5 rea:5 ear:5 was:5 sin:5 sto:5 tto:5 tot:5 and:5 men:4 out:4 you:4 not:4 was:4 con:4 pro:4 sta:4 sho:4 cut:4 day:4 igh:4 ght:4 loo:4 ook:4 man:4 car:4 door:0 ndo:4 own:4 ove:4 ome:4 ake:4 ack:4 one:4 ust:4 ted:4 ess:4 der:4 ded:4 ope:4 pen:4 ens:4 nds:4 hand:0 str:4 tre:4 eet:4 ide:4 nde:4 rom:4 com:4 omi:4 min:4 ain:4 tur:4 urn:4 rns:4 wal:4 alk:4 lks:4 ks :0')
    .split(' ').map(t => t.split(':')).filter(t => t[0].length === 3);
  const TRIMAP = new Map(TRIGRAMS.map(([g, w]) => [g, +w]));
  const CRIBWORDS = /(^|[^a-z])(the|and|you|that|his|her|out|int|ext|day|night|looks|door|man|car|from|with|into|down|back|then|what|this|cut|to|on|at|he|she|it|of|in|is|a)(?=[^a-z]|$)/g;

  function scorePlain(text) {
    let s = 0;
    const t = text.toLowerCase();
    for (let i = 0; i < t.length - 2; i++) {
      const w = TRIMAP.get(t.slice(i, i + 3));
      if (w) s += w;
    }
    const m = t.match(CRIBWORDS);
    if (m) s += m.length * 14;
    return s;
  }

  function solveSubstitution(cipher) {
    // symbol inventory, most frequent first
    const freq = new Map();
    for (const ch of cipher) freq.set(ch, (freq.get(ch) || 0) + 1);
    const syms = [...freq.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]);
    if (syms.length < 12) return null;
    const targetsByFreq = ' etaonihsrdlumwcfgypbvk.j\',x-q"z!?:;()0123456789';
    const map = new Map();
    syms.forEach((sym, i) => map.set(sym, targetsByFreq[Math.min(i, targetsByFreq.length - 1)]));
    const sample = cipher.slice(0, 22000);
    const apply = (m) => { let o = ''; for (const ch of sample) o += m.get(ch) ?? ch; return o; };
    let best = scorePlain(apply(map));
    const letters = 'abcdefghijklmnopqrstuvwxyz';
    // deterministic PRNG (Date/Math.random are unreliable in some harnesses; and
    // reproducible solves make reproducible tests)
    let seed = 0x9e3779b9 ^ cipher.length;
    const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return ((seed >>> 0) / 4294967296); };
    // the most frequent symbol is space in any real text this size — locked from the
    // start (targetsByFreq[0] is ' ') by keeping it out of the search entirely
    const active = syms.slice(1, Math.min(syms.length, 40));
    let stale = 0;
    for (let it = 0; it < 26000 && stale < 3200; it++) {
      const a = active[(rnd() * active.length) | 0];
      let undo;
      if (rnd() < 0.5) {
        const b = active[(rnd() * active.length) | 0];
        if (a === b) continue;
        undo = [[a, map.get(a)], [b, map.get(b)]];
        map.set(a, undo[1][1]); map.set(b, undo[0][1]);
      } else {
        undo = [[a, map.get(a)]];
        map.set(a, letters[(rnd() * 26) | 0]);
      }
      const sc = scorePlain(apply(map));
      if (sc > best) { best = sc; stale = 0; }
      else if (sc === best) stale++;
      else { for (const [k, v] of undo) map.set(k, v); stale++; }
    }
    return map;
  }

  // decide case per symbol: a letter-symbol that usually follows another letter inside
  // a word is lowercase; word-starters and all-caps-line dwellers are uppercase
  function caseMaps(cipher, map) {
    const afterLetter = new Map(), total = new Map();
    let prevWasLetter = false;
    for (const ch of cipher) {
      const p = map.get(ch) ?? ch;
      const isL = /[a-z]/.test(p);
      if (isL) {
        total.set(ch, (total.get(ch) || 0) + 1);
        if (prevWasLetter) afterLetter.set(ch, (afterLetter.get(ch) || 0) + 1);
      }
      prevWasLetter = isL;
    }
    const upper = new Set();
    for (const [ch, n] of total) {
      const r = (afterLetter.get(ch) || 0) / n;
      if (r < 0.5) upper.add(ch);
    }
    return upper;
  }

  function decodeGarbledFonts(rawPages) {
    // group text per font
    const perFont = new Map();
    for (const p of rawPages) for (const it of (p.items || [])) {
      const f = it.font || '·';
      perFont.set(f, (perFont.get(f) || '') + it.str);
    }
    const maps = new Map();
    let warned = false;
    for (const [font, text] of perFont) {
      if (text.length < 400 || garbledness(text) < 0.35) continue;
      const map = solveSubstitution(text);
      if (!map) { warned = true; continue; }
      const upper = caseMaps(text, map);
      const decode = (s) => {
        let o = '';
        for (const ch of s) {
          let p = map.get(ch) ?? ch;
          if (upper.has(ch) && /[a-z]/.test(p)) p = p.toUpperCase();
          o += p;
        }
        return o;
      };
      // convince me: decoded text must read as English
      const sampleDec = decode(text.slice(0, 4000));
      const hits = (sampleDec.toLowerCase().match(CRIBWORDS) || []).length;
      if (garbledness(sampleDec) < 0.12 && hits > sampleDec.length / 260) maps.set(font, decode);
      else warned = true;
    }
    if (!maps.size) return { changed: false, warned };
    const out = rawPages.map(p => ({
      ...p,
      items: (p.items || []).map(it => {
        const d = maps.get(it.font || '·');
        return d ? { ...it, str: d(it.str) } : it;
      }),
    }));
    return { changed: true, warned, pages: out, fontsDecoded: maps.size };
  }

  // ---------- shooting-script scene numbers ----------
  // Production drafts print the scene number in the margins, on the same line as the slug:
  // "A1     INT. HOUSE - DAY     A1". Those numbers are printing apparatus, not writing —
  // and left in place they become the leftmost column, so every real column is read one
  // slot out and nothing classifies correctly. Detect the gutter by the fact that almost
  // everything starting there is a scene number, then strip and re-anchor the line.
  // plain (12), lettered (12A, A12), ranged (68-69), star-welded (123A*), OCR'd (126*')
  const SCENE_NO = /^[A-Z]{0,2}\d{1,3}[A-Z]{0,2}(?:[-–][A-Z]{0,2}\d{1,3}[A-Z]{0,2})?\*{0,2}'?$/;
  // "CONTINUED:", "(CONTINUED)", "CONTINUED: (2)" — all printing apparatus, never writing
  const CONTINUED_RE = /^\(?\s*CONTINUED\s*\)?\s*[.:]?\s*(\(\s*\d+\s*\))?\s*$/i;

  function stripSceneNumbers(body, charW) {
    const at = new Map();
    for (const p of body) for (const l of p.lines) {
      if (!l.items || !l.items.length) continue;
      const k = Math.round(l.x);
      let e = at.get(k);
      if (!e) at.set(k, e = { n: 0, num: 0 });
      e.n++;
      if (SCENE_NO.test(l.items[0].str.trim())) e.num++;
      // right-margin numbering has no left twin — count detached trailing numbers
      // at their own x, or a right-only-numbered draft never forms a gutter at all
      if (l.items.length > 1) {
        const lastIt = l.items[l.items.length - 1], prev = l.items[l.items.length - 2];
        if (SCENE_NO.test(lastIt.str.trim()) && lastIt.x - (prev.x + prev.w) >= charW * 3) {
          const kr = Math.round(lastIt.x);
          let er = at.get(kr);
          if (!er) at.set(kr, er = { n: 0, num: 0 });
          er.n++; er.num++;
        }
      }
    }
    const gutter = new Set();
    for (const [x, e] of at) if (e.n >= 8 && e.num / e.n >= 0.6) gutter.add(x);
    // right-aligned numbers start at different x per width — membership is a band
    const nearGutter = x => { for (const g of gutter) if (Math.abs(g - x) <= charW * 2.2) return true; return false; };

    for (const p of body) {
      for (const l of p.lines) {
        if (!gutter.size) break;
        if (!l.items || l.items.length < 2) continue;
        let items = l.items;
        if (gutter.has(Math.round(l.x)) && SCENE_NO.test(items[0].str.trim())) items = items.slice(1);
        // the matching number at the right margin: detached, OR sitting in an
        // established gutter column — a long slug can run to within a point of
        // its number ("...CONTINUOUS72A"), but the number's x doesn't lie
        while (items.length > 1) {
          const lastIt = items[items.length - 1], prev = items[items.length - 2];
          if (!SCENE_NO.test(lastIt.str.trim())) break;
          if (lastIt.x - (prev.x + prev.w) < charW * 3 && !nearGutter(lastIt.x)) break;
          items = items.slice(0, -1);
        }
        if (items.length === l.items.length) continue;
        if (!items.length) { l.text = ''; continue; }
        const j = joinItems(items, charW);
        l.items = items; l.x = items[0].x; l.xEnd = j.xEnd; l.text = j.text;
      }
      // CONTINUED markers are furniture wherever they sit on the page, gutter or not
      p.lines = p.lines.filter(l => l.text.trim() !== '' && !CONTINUED_RE.test(l.text.trim()));
    }
    return gutter.size > 0;
  }

  // Production drafts star every changed line with an asterisk in the outer margin
  // ("VINCENT                                      *"). The star shares its row with
  // the writing, so line assembly welds it into the text — where it poisons sentence
  // detection, (CONT'D) regeneration, cue matching and width calibration. Like all
  // apparatus it is detected by behaviour, not format: a bare run of *s at a line's
  // edge, detached by a wide gap, stacking in one narrow x band in the margin across
  // the document. The stars are stripped from the text but not lost — each line
  // remembers it was starred (l.rev) and the band's x survives as layout.revX, so the
  // render puts them back exactly where the source printed them.
  function stripRevisionMarks(body, charW) {
    const BARE = /^\s*[*•]+\s*$/;   // stars, or the OCR'd dot form of the same mark
    const pageW = body[0] ? body[0].width : 612;
    // pass 1 — find the band: bare stars clearly detached from the text they flank
    const cands = [];
    for (const p of body) for (const l of p.lines) {
      const its = l.items || [];
      for (const pos of its.length === 1 ? [0] : [0, its.length - 1]) {
        const it = its[pos];
        if (!BARE.test(it.str)) continue;
        if (its.length > 1) {
          const gap = pos === 0 ? its[1].x - (it.x + it.w) : it.x - (its[pos - 1].x + its[pos - 1].w);
          if (gap < charW * 2) continue;
        }
        cands.push(it);
      }
    }
    // the band is a ZONE, not a point: typewriter/OCR drafts (There Will Be Blood)
    // smear their star column across 90pt, so membership is "in the outer margin",
    // right or left — never the middle of the page, where a bare * could be content
    const inRight = x => x > pageW * 0.78, inLeft = x => x < pageW * 0.15;
    const nR = cands.filter(it => inRight(it.x)).length, nL = cands.filter(it => inLeft(it.x)).length;
    if (Math.max(nR, nL) < 4) return null;
    const inZone = nR >= nL ? inRight : inLeft;
    // pass 2 — strip every edge star sitting in the zone, detached or not: a long
    // line can run to within a space of its star, but the star's x doesn't lie
    const xs = [];
    for (const p of body) for (const l of p.lines) {
      const its = l.items || [];
      for (const pos of its.length === 1 ? [0] : [0, its.length - 1]) {
        const it = its[pos];
        if (!BARE.test(it.str) || !inZone(it.x)) continue;
        const rest = its.filter(i => i !== it);
        l.rev = true; xs.push(it.x);
        if (!rest.length) { l.items = rest; l.text = ''; break; }
        const j = joinItems(rest, charW);
        l.items = rest; l.x = rest[0].x; l.xEnd = j.xEnd; l.text = j.text;
        break;
      }
    }
    for (const p of body) p.lines = p.lines.filter(l => l.text.length > 0);
    xs.sort((a, b) => a - b);
    return { x: Math.round(xs[Math.floor(xs.length / 2)] * 100) / 100, count: xs.length };
  }

  function estimateCharW(pages) {
    const ws = [];
    for (const p of pages) for (const it of p.items || [])
      if (it.str && it.str.trim().length >= 4 && Number.isFinite(it.w) && it.w > 0) ws.push(it.w / it.str.length);
    ws.sort((a, b) => a - b);
    const v = ws.length ? ws[Math.floor(ws.length / 2)] : 7.2;
    return v > 0.5 ? v : 7.2;   // a zero/NaN charW turns joinItems into ' '.repeat(Infinity)
  }

  // ---------- text wrapping (greedy, spaces only — Final Draft style) ----------
  function wrapText(text, width) {
    const out = [];
    for (const seg of String(text).split('\n')) {
      if (seg === '') { out.push(''); continue; }
      let rest = seg;
      while (rest.length > width) {
        let cut = rest.lastIndexOf(' ', width);
        if (cut <= 0) cut = width; // unbreakable word
        out.push(rest.slice(0, cut).replace(/\s+$/, ''));
        rest = rest.slice(cut).replace(/^\s+/, '');
      }
      out.push(rest);
    }
    return out.length ? out : [''];
  }

  function wrapElement(el, layout) {
    if (el.text === '') return [''];
    return wrapText(el.text, layout.widths[el.type] || 57);
  }

  // ---------- PDF import: classify pages of lines → document ----------
  const mode = arr => {
    const h = new Map();
    for (const v of arr) h.set(v, (h.get(v) || 0) + 1);
    let best = null, n = 0;
    for (const [v, c] of h) if (c > n) { n = c; best = v; }
    return best;
  };

  // The distance between two baselines is the row pitch — but a plain mode gets it
  // wrong on scripts made mostly of one-line paragraphs, where the *paragraph* gap
  // (two pitches) is the commonest gap of all. There Will Be Blood elects 25 that
  // way and reads as double-spaced, 26 rows to the page. Rounding splits a 12.7pt
  // pitch across 12 and 13 too, so each candidate is counted with its neighbours,
  // and the answer is the smallest frequent gap that the dominant gap is a
  // multiple of — because paragraph gaps are always multiples of the pitch.
  function rowPitch(gaps) {
    if (!gaps.length) return 12;
    const h = new Map();
    for (const g of gaps) h.set(g, (h.get(g) || 0) + 1);
    const win = g => (h.get(g - 1) || 0) + (h.get(g) || 0) + (h.get(g + 1) || 0);
    let top = 0, topG = 12;
    for (const g of h.keys()) { const c = win(g); if (c > top) { top = c; topG = g; } }
    for (const g of [...h.keys()].sort((a, b) => a - b)) {
      if (g < 7 || g >= topG) break;                  // below screenplay leading, or not smaller
      if (win(g) < top * 0.35) continue;              // not frequent enough to be the grid
      const mult = topG / g;
      if (Math.abs(mult - Math.round(mult)) <= 0.12) return g;   // topG is a multiple of it
    }
    return topG;
  }

  function importPdf(rawPages, opts = {}) {
    if (!rawPages || !rawPages.length) return newDoc('IMPORTED');
    // was any of this read off the picture rather than out of the file? measurements
    // taken by eye are a few points looser than a typesetter's, and a couple of the
    // rules below have to know that
    const byEye = rawPages.some(p => p.ocr);
    // fonts with no usable Unicode map yield cipher text — crack them first,
    // since classification reads the words (INT., EXT., …), not just positions
    let decodeNote = null;
    const dec = decodeGarbledFonts(rawPages);
    if (dec.changed) { rawPages = dec.pages; decodeNote = 'decoded ' + dec.fontsDecoded + ' unmapped font(s)'; }
    else if (dec.warned) decodeNote = 'some text could not be decoded — this PDF hides its character map';

    const charW0 = estimateCharW(rawPages);
    // is this document's text delivered one word at a time? (an OCR layer usually is)
    let wordish = 0, itemsSeen = 0;
    for (const p of rawPages) for (const it of p.items || []) {
      if (!it.str || !it.str.trim()) continue;
      itemsSeen++;
      if (!/\s/.test(it.str.trim()) && it.str.trim().length <= 20) wordish++;
      if (itemsSeen > 4000) break;
    }
    // A page read by eye is never welded either, whatever the chunks are. The recogniser
    // hands back phrases, not words, so this test does not catch it — and its boxes hug
    // the ink, so a chunk's measured end regularly runs past where the next one starts:
    // "I'm suppose to apologise" came back as "I'msuppose to apologise".
    const wordLevel = byEye || (itemsSeen > 50 && wordish / itemsSeen > 0.92);
    const pages = rawPages.map(p => ({
      width: p.width, height: p.height,
      lines: p.lines ? p.lines : linesFromItems(p.items, charW0, wordLevel),
    }));

    // -- typography: underline segments (drawn as vector lines just below the
    // baseline) attach to the row they underline; bold/italic ride the items'
    // font-style flags. Both become el.marks later, at finalization.
    for (let pi = 0; pi < pages.length; pi++) {
      const segs = rawPages[pi] && rawPages[pi].ul;
      if (!segs || !segs.length) continue;
      for (const l of pages[pi].lines) {
        for (const u of segs) {
          const dy = u.y - l.y;
          if (dy < 0.2 || dy > 7) continue;
          if (u.x2 < l.x - 2 || u.x1 > l.xEnd + 2) continue;
          (l.us = l.us || []).push(u);
        }
      }
    }

    // Some drafts number scenes inline at the action margin — "8.  INT. OFFICE - DAY.  8."
    // Some Like It Hot does. No gutter forms there, because the number shares its x with
    // every action line in the script, so stripSceneNumbers cannot see it: the slug then
    // begins "8." rather than INT/EXT and never reads as a scene at all. That script
    // imported with ZERO scene headings. Lift the number off the text; the mirrored one at
    // the right goes with it, but only when it is the same number.
    const INLINE_NO = /^\s*([A-Z]{0,2}\d{1,3}[A-Z]{0,2})[.)]?\s+/;
    const TRAIL_NO = /\s+([A-Z]{0,2}\d{1,3}[A-Z]{0,2})[.)]?\s*$/;
    // A line that OPENS and CLOSES with the same number is a numbered slug whatever it
    // says between them — this script's first scene is "1.  CITY AT NIGHT.  1.", with no
    // INT/EXT at all, so requiring one left the number in the text and wrapped the
    // mirrored copy onto a line of its own. The mirrored pair is signature enough.
    for (const p of pages) for (const l of p.lines) {
      const m = INLINE_NO.exec(l.text);
      if (!m) continue;
      const rest = l.text.slice(m[0].length);
      const tm = TRAIL_NO.exec(rest);
      const mirrored = tm && tm[1] === m[1];
      // A production draft may number only the left margin. "60    INT. ELI'S CHURCH. DAY"
      // and "54    THE IMAGE." are both scene headings; the wide gap after the number and
      // the shout that follows say so even when there is no INT/EXT and no twin.
      const numberedShout = /^\s{2,}/.test(l.text.slice(m[0].length - 1))
        || (/^[A-Z0-9]/.test(rest) && rest === rest.toUpperCase() && rest.length <= 60);
      if (!mirrored && !SCENE_RE.test(rest) && !numberedShout) continue;
      if (numberedShout && !mirrored) l.slugNo = m[1];
      l.text = (mirrored ? rest.slice(0, tm.index) : rest).trim();
      if (mirrored) l.slugNo = m[1];                  // numbered: it is a scene heading
    }

    // -- title page detection: first page, few lines, no sluglines, mostly centered-ish
    let titlePage = null, bodyStart = 0;
    if (pages.length > 1) {
      const p0 = pages[0];
      // a numbered slug counts as a slugline even with no INT/EXT — otherwise a script
      // that opens on "1. CITY AT NIGHT." has its whole first page taken for a title page
      const slug = p0.lines.some(l => SCENE_RE.test(l.text) || l.slugNo != null);
      // a title page has no slugline and reads as title matter — byline, draft stamps,
      // dates, contact blocks, revision-colour tables — not as flowing script
      const TITLE_MATTER = /written by|screenplay|story by|revised|revs?[.\s]|revision|draft|\d{1,2}\/\d{1,2}\/\d{2,4}|copyright|all rights|educational|contact|final|shooting script|table of contents/i;
      const matter = p0.lines.filter(l => TITLE_MATTER.test(l.text)).length;
      if (p0.lines.length > 0 && !slug &&
          (p0.lines.length <= 12 || (p0.lines.length <= 44 && matter >= p0.lines.length * 0.3))) {
        titlePage = p0; bodyStart = 1;
      }
    }
    // A script may carry its title matter at the TOP of its first page rather than on a
    // page of its own. Some Like It Hot does: the title, the credits, the company's
    // address with the date beside it, then FADE IN: and scene 1. Left in the script those
    // lines are body text — and the address and the date, sharing a row, read as two
    // columns and print through each other. Converting to Final Draft means they belong on
    // the title page. Take the head of page one up to the first slug or FADE IN.
    let titleHead = null;
    if (!titlePage && pages.length) {
      const ls0 = pages[0].lines;
      let cut = -1;
      for (let i2 = 0; i2 < Math.min(ls0.length, 20); i2++) {
        const t = ls0[i2].text.trim();
        if (SCENE_RE.test(t) || /^(FADE|DISSOLVE)\b/i.test(t) || INLINE_NO_HEAD.test(t)
            || ls0[i2].slugNo != null) { cut = i2; break; }
      }
      const head = cut > 1 ? ls0.slice(0, cut) : [];
      // it has to READ as title matter, or an ordinary script loses its first paragraph
      if (head.length >= 2 && head.length <= 14 && head.some(l => TITLE_HEAD_RE.test(l.text))) {
        titleHead = head;
        const skip = new Set(head);
        pages[0].lines = ls0.filter(l => !skip.has(l));
      }
    }

    const body = pages.slice(bodyStart);
    // stars first: a trailing star otherwise shields a right-gutter scene number
    // from the gutter stripper (the number is no longer the last detached item)
    const revMarks = stripRevisionMarks(body, charW0);
    stripSceneNumbers(body, charW0);

    // -- page furniture ------------------------------------------------------------
    // Page numbers, CONTINUED markers and running heads are not part of the script, and
    // must be scrubbed: PICA regenerates its own as it repaginates, so anything left
    // behind shows up twice and drags the old page break's whitespace with it.
    // Do NOT detect them by guessing a margin or a format — scripts number at the top or
    // the bottom, right or left, "5" or "5." or "A5." Detect them by the one thing they
    // all share: the same line sits at the same height on page after page, and it is
    // numeric (or a known marker). Anything genuinely written never repeats like that.
    const FURNITURE_NUM = /^[A-Za-z]?\d+[A-Za-z]?[.:]?$/;
    // the handful of phrases that are a transition whether or not the colon survived
    const TRANSITION_PHRASE = /^(?:(?:SMASH|MATCH|HARD|QUICK|JUMP|TIME|BACK)\s+)?(?:CUT|DISSOLVE|FADE|WIPE)(?:\s+(?:TO|FROM|IN|OUT|BACK|UP))*(?:\s+BLACK)?\s*[.:;]?$/;
    // "CONTINUED:" arrives with the scene number in front of it and a count after it —
    // Memento prints "4    CONTINUED: (2)" — and none of that is writing.
    const FURNITURE_WORD = /^\(?\s*(?:[A-Z]{0,2}\d{1,3}[A-Z]{0,2}[.)]?\s+)?(CONTINUED|CONT'D|CONT’D|MORE)\s*\)?\s*[.:]?\s*(\(\s*\d+\s*\))?\s*$/i;
    // the same, without MORE: a CONTINUED is apparatus wherever it sits, a (MORE) is not
    const FURNITURE_CONT = /^\(?\s*(?:[A-Z]{0,2}\d{1,3}[A-Z]{0,2}[.)]?\s+)?(CONTINUED|CONT'D|CONT’D)\s*\)?\s*[.:]?\s*(\(\s*\d+\s*\))?\s*$/i;
    // revision headers: "10/11/03 MM revs. (goldenrod)  5." — a date or the word revs,
    // usually trailing the page number. Printing apparatus, never writing.
    const FURNITURE_HEADER = /\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{1,2}-\d{1,2}|\brevs?[.\s]|\brevisions?\b|\bshooting script\b|\bdraft\b.*\d{1,2}\/\d{1,2}/i;
    // provenance stamps ("Downloaded from …", site names, urls) are not writing either
    // Sites stamp the scripts they host. A bare domain on its own line is one of those
    // stamps wherever it sits — The Social Network's copy carries "DEADLINE.com" on every
    // page, which became 165 stray elements and, worse, the script's title.
    const PROVENANCE = /\b(downloaded|imported|provided|courtesy)\s+(from|of|by)\b|scriptslug|script\s*savant|simplyscripts|imsdb|dailyscript|awesomefilm|8flix|screenplays?\s*online|for educational purposes|for your consideration|www\.[a-z0-9-]+\.[a-z]{2,}|https?:\/\/|^[a-z0-9-]{2,}\.(com|net|org|co\.uk|io|ru)$/i;
    const furniture = new Set();
    {
      const byY = new Map();
      for (const p of body) for (const l of p.lines) {
        const k = Math.round(l.y);
        if (!byY.has(k)) byY.set(k, []);
        byY.get(k).push(l);
      }
      const minPages = Math.max(3, body.length * 0.25);
      for (const [, arr] of byY) {
        if (arr.length < minPages) continue;
        const marks = arr.filter(l => {
          const t = l.text.trim();
          return FURNITURE_NUM.test(t) || FURNITURE_WORD.test(t);
        }).length;
        const headerish = arr.filter(l => FURNITURE_HEADER.test(l.text) || PROVENANCE.test(l.text)).length;
        // the whole row has to be furniture — a body row that happens to hold a number
        // on a few pages must survive
        if (marks >= arr.length * 0.9 || headerish >= arr.length * 0.7)
          for (const l of arr) furniture.add(l);
        // and the pattern-free catch-all, CONFINED to the margins: the SAME line at
        // the SAME height on page after page, in the page's extreme top or bottom
        // band, is apparatus whatever it says — running heads, watermarks, stamps,
        // any date format. It must never reach the body: a continuation cue
        // ("OPPENHEIMER (CONT'D)") legitimately repeats at the FIRST BODY ROW on
        // dozens of pages, and eating it orphans every continued speech.
        const pH = body[0] ? body[0].height : 792;
        const yv = arr[0].y;
        if (yv < pH * 0.085 || yv > pH * 0.94) {
          const seen = new Map();
          for (const l of arr) {
            const t = l.text.replace(/\s+/g, ' ').trim();
            seen.set(t, (seen.get(t) || 0) + 1);
          }
          for (const l of arr)
            if ((seen.get(l.text.replace(/\s+/g, ' ').trim()) || 0) >= minPages) furniture.add(l);
        }
      }
    }
    const bodyLines = p => p.lines.filter(l => !furniture.has(l));

    // -- collect body lines / metrics
    const allLines = [];
    for (const p of body) for (const l of bodyLines(p)) allLines.push(l);
    const gaps = [];
    for (const p of body) {
      const ls = bodyLines(p);
      for (let i = 1; i < ls.length; i++) {
        const g = Math.round(ls[i].y - ls[i - 1].y);
        if (g > 4 && g < 30) gaps.push(g);
      }
    }
    const rowH = rowPitch(gaps);
    const firstYs = body.slice(1).map(p => {
      const ls = bodyLines(p);
      return ls.length ? Math.round(ls[0].y * 2) / 2 : null;
    }).filter(v => v != null);
    // y0 = the most common first-line y that is on the dominant grid
    const y0 = mode(firstYs) ?? 76.5;

    // -- column detection from x histogram
    const xh = new Map();
    // A page number or a revision mark in the margin is not a column, but it stands to the
    // LEFT of every real one — so counted, it takes the action column's slot and every
    // other column is read one across: action becomes dialogue, dialogue becomes a
    // parenthetical. Memento and Lost in Translation both arrived with their action typed
    // as speech for exactly this reason. Only lines with words in them vote.
    const votes = allLines.filter(l => {
      const t = l.text.trim();
      if (t.length <= 4 || !/[A-Za-z]{2}/.test(t)) return false;
      if (FURNITURE_NUM.test(t) || SCENE_NO.test(t)) return false;
      // A slugline that opens with its scene number is anchored in the GUTTER, not on a
      // column — Memento has 216 of them, enough to win a column slot and read every real
      // column one across: its action came back as dialogue and its dialogue as
      // parentheticals. It still belongs in the script; it just does not get a vote on
      // where the columns are. (A vote filter only: nothing about the line is changed,
      // so dual dialogue, which reads the items directly, is untouched.)
      if (INLINE_NO.test(t)) return false;
      // and page furniture — running heads, revision stamps — which this document already
      // knows how to spot. Memento prints "MEMENTO Pink Revisions - 9/7/99" at the gutter
      // on every page, and 179 of those were enough to make the gutter a column.
      if (furniture.has(l)) return false;
      // A revision stamp is a printing apparatus, not writing. Memento prints "MEMENTO
      // Pink Revisions - 9/7/99" at the gutter on every page — 546 lines, more than its
      // parenthetical column has — and the band-based furniture test misses it because
      // both the wording and the height wander.
      if (/\b(revisions?|draft|rev\.)\b/i.test(t) || /\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/.test(t)) return false;
      if (l.items && l.items.length > 1 && SCENE_NO.test((l.items[0].str || '').trim())) return false;
      return true;
    });
    for (const l of (votes.length > 40 ? votes : allLines)) {
      const k = Math.round(l.x);
      xh.set(k, (xh.get(k) || 0) + 1);
    }
    // Cluster the x positions into columns. Not every PDF sets its glyph origins on exact
    // points — plenty smear a single column across five or six — so chain each bin to the
    // PREVIOUS one and let the cluster run. (Anchoring on the cluster's first x splits a
    // smeared column every few points and invents columns that aren't there.) A cluster is
    // represented by its busiest x, which is the column's true left edge.
    const bins = [...xh.entries()].sort((a, b) => a[0] - b[0]);
    const clusters = [];
    // A typesetter puts every line of a column on the same x. A recogniser reading a
    // photograph puts them within a few points of it — The Hateful Eight's cues wander
    // from 264 to 277 — and at a three-point chain that column shatters into fragments,
    // none of them big enough to count as a column. The document was then read as though
    // cue, parenthetical and dialogue all shared one, which is how O.B. came to say his
    // own name out loud. Widening the chain is worse, not better: with a few lines at
    // every intermediate x the chain runs from the dialogue column clean through to the
    // cues and swallows both.
    //
    // So a reading by eye is clustered the other way about — from the peaks inward. The
    // busiest x is a column; everything within a few points of it belongs to that column
    // and to no other; then the busiest x still unclaimed, and again. Smear is absorbed,
    // and a column can never grow along a trail of noise into the next one.
    if (byEye) {
      const left = new Map(bins);
      while (left.size) {
        let bx = null, bn = -1;
        for (const [x, n] of left) if (n > bn) { bn = n; bx = x; }
        let total = 0;
        // Sixteen points. The smear is real and it is wide — The Hateful Eight's speech
        // column runs from 193 to 213, because the recogniser's box starts at the ink and
        // the first letter of a line is not always the same letter. Sixteen swallows that
        // and still stops short of half the gap between two columns that Final Draft sets
        // 36 points apart, so a column can never annex its neighbour.
        for (const [x, n] of [...left]) if (Math.abs(x - bx) <= 16) { total += n; left.delete(x); }
        clusters.push({ x: bx, last: bx, n: total, peakN: bn });
      }
      clusters.sort((a, b) => a.x - b.x);
    } else
    for (const [x, n] of bins) {
      const c = clusters[clusters.length - 1];
      if (c && x - c.last <= 3) {
        c.n += n; c.last = x;
        if (n > c.peakN) { c.peakN = n; c.x = x; }
      } else clusters.push({ x, last: x, n, peakN: n });
    }
    // A column is a SPIKE, not a mound. Reading by eye, the speech column's left edges
    // spread twenty points, and the far tail of that spread — 111 lines at x=227, no one
    // x of them carrying more than 22 — piled up into something the size of a small
    // column and took the parenthetical slot. Nothing was typed there. A column that
    // really exists has one x that many lines share exactly; smear never does.
    const ranked = clusters.filter(b => b.n >= allLines.length * 0.01
        && (!byEye || b.peakN >= allLines.length * 0.005)).sort((a, b) => b.n - a.n);
    let top = ranked.slice(0, 4).sort((a, b) => a.x - b.x);
    // A MARGIN IS NOT A COLUMN. Memento's scene numbers and CONTINUEDs sit at x=72 — 546
    // lines, more than its parenthetical column has — so they won a slot, and being
    // leftmost they took the ACTION column's place and every other column was read one
    // across: action came back as dialogue, dialogue as parentheticals. The tell is that
    // the leftmost of the four is far to the left of the next and carries a fraction of
    // its lines; real action is the busiest column on the page, not a thin margin.
    // …and the test is what the cluster CONTAINS. A margin holds scene numbers, CONTINUEDs
    // and page numbers; an action column holds prose. Judging by line count alone throws
    // away a real column on a script whose action happens to be sparse.
    if (top.length === 4 && top[0].n < top[1].n * 0.35 && top[1].x - top[0].x >= 25
        && top[0].n < top[2].n * 0.5) {
      const spare = ranked.find(b => !top.includes(b));
      if (spare) top = top.slice(1).concat([spare]).sort((a, b) => a.x - b.x);
      else top = top.slice(1);
    }
    // Not every script separates speech into three columns. Some Like It Hot (1958) sets
    // the cue, the parenthetical AND the dialogue all flush at 1.78" — the only indent on
    // the page besides action. Measured across 30 pages: 1051 lines at x=128 against 390 at
    // x=32, and nothing else above noise. Reading such a page by column assigns every one
    // of those 1051 lines to a single element type, which is how 3,754 of 4,781 elements
    // came back as character cues. When only two columns carry the page, the speech column
    // is one column doing three jobs, and shape has to settle which — see roleOf.
    const major = clusters.filter(b => b.n >= allLines.length * 0.12).sort((a, b) => a.x - b.x);
    const speechCollapsed = major.length === 2;

    const cols = { ...LETTER.cols };
    let parenInvented = false;   // true when no column of parentheticals was found
    if (speechCollapsed) {
      cols.action = major[0].x;
      cols.dialogue = cols.paren = cols.character = major[1].x;
    } else if (top.length >= 4) {
      cols.action = top[0].x; cols.dialogue = top[1].x; cols.paren = top[2].x; cols.character = top[3].x;
    } else if (top.length === 3) { // no parenthetical column of its own
      cols.action = top[0].x; cols.dialogue = top[1].x; cols.character = top[2].x;
      cols.paren = Math.round((cols.dialogue + cols.character) / 2);
      // …but nothing is typed there. The Hateful Eight sets (beat) at the cue indent, and
      // the invented midpoint sat in the gap stealing lines — a speech line that wandered
      // 18pt right was nearer the column that does not exist than the one it belongs to,
      // and 50-odd of them came back unclassified mid-sentence. A bracketed line is
      // recognised by its brackets wherever it lands, so the position is kept only so the
      // four remain distinct, and is not offered to lines looking for their column.
      parenInvented = byEye;   // only a photographed page is loose enough for it to matter
    } else if (top.length > 0) {
      cols.action = top[0].x;
    }

    // -- page number metrics: reuse the source's own position so reprinting matches it
    let pnY = LETTER.pnY, pnRight = pages[0].width - 82;
    const pns = [...furniture].filter(l => FURNITURE_NUM.test(l.text.trim()));
    if (pns.length) {
      pnY = mode(pns.map(l => Math.round(l.y * 2) / 2));
      pnRight = pns.map(l => l.xEnd).sort((a, b) => a - b)[Math.floor(pns.length / 2)];
    }

    // -- transition right edge: caps lines ending ':' not at any col
    const nearCol = x => Object.values(cols).some(c => Math.abs(x - c) < 3);
    const transEnds = allLines
      .filter(l => /[A-Z]/.test(l.text) && l.text === l.text.toUpperCase() && /:\s*$/.test(l.text) && !nearCol(l.x))
      .map(l => l.xEnd);
    const transRight = transEnds.length ? transEnds.sort((a, b) => a - b)[Math.floor(transEnds.length / 2)] : pages[0].width - 96;

    // -- rows per page: highest on-grid row index seen. The tolerance is adaptive: a PDF
    // whose baselines are exact gets a tight one, so deliberately off-grid marks like
    // (MORE) are not mistaken for an extra row; a PDF whose baselines wander gets a loose
    // one, so the count doesn't come out short and repaginate into extra pages.
    let onGrid = 0;
    for (const l of allLines) {
      const r = (l.y - y0) / rowH;
      if (Math.abs(r - Math.round(r)) < 0.15) onGrid++;
    }
    const rowTol = (onGrid / Math.max(1, allLines.length)) >= 0.9 ? 0.15 : 0.32;
    let maxRow = 0;
    for (const l of allLines) {
      const r = (l.y - y0) / rowH;
      if (Math.abs(r - Math.round(r)) < rowTol) maxRow = Math.max(maxRow, Math.round(r));
    }

    // Final Draft's own page setup (Screenplay.fdxt): 72pt top and bottom margins, header
    // and footer at 36pt. Trust what we measured when it is plausible; when a PDF gives a
    // top margin that no screenplay would use, fall back to FD's geometry so the page has
    // the right amount of air above and below the text.
    const FD_MARGIN = 72, FD_HEADER = 36;
    let y0f = y0, rows = maxRow + 1;
    const pageH = pages[0].height;
    if (y0 < FD_MARGIN * 0.85 || y0 > FD_MARGIN * 1.8) y0f = FD_MARGIN + rowH * 0.8;
    const lastAllowed = pageH - FD_MARGIN * 0.85;
    const maxRows = Math.max(10, Math.floor((lastAllowed - y0f) / rowH) + 1);
    if (rows > maxRows || rows < maxRows * 0.75) rows = maxRows;
    // the industry standard is top-right only ("5.", page 1 unnumbered); a source that
    // numbered at the bottom gets normalized to the standard header position
    if (pnY > pageH * 0.5) pnY = LETTER.pnY;
    else pnY = Math.min(Math.max(pnY, FD_HEADER * 0.6), y0f - rowH * 0.8);

    const layout = {
      pageW: pages[0].width, pageH,
      y0: y0f, rowH, rows, pnY, pnRight,
      cols, transRight, charW: charW0,
      widths: { ...LETTER.widths },
      moreDy: 10, contDy: -14,
      ...(revMarks ? { revX: revMarks.x } : {}),
    };

    // Any line still sitting above the body area that reads as apparatus — a header row
    // whose y drifted past the row-bucket, a stray number — is furniture too.
    for (const p of body) for (const l of p.lines) {
      if (furniture.has(l)) continue;
      const t = l.text.trim();
      // A line that is ONLY a CONTINUED, a revision stamp or a provenance note is
      // apparatus wherever it sits. Testing only above the body missed every one of
      // Memento's: 183 of them came through as scene headings, transitions and action.
      // (MORE) is NOT apparatus to be thrown away — it is how a speech that breaks across
      // a page is recognised, so it stays band-restricted with the numbers.
      if (FURNITURE_CONT.test(t) || FURNITURE_HEADER.test(t) || PROVENANCE.test(t)) { furniture.add(l); continue; }
      // A line that is nothing but a page number is apparatus wherever it landed — a scan
      // puts them anywhere. (Kept separate from the tests above so a numbered list item,
      // which always has words after the number, is untouched.)
      if (FURNITURE_NUM.test(t) && t.length <= 5) furniture.add(l);
      // The Hateful Eight's pages are numbered BY HAND, in the top right corner, and a
      // hand does not write the same figure twice: 4. and 4, and 3) and 3 . A page number
      // is not writing either way. Out at the right margin, a couple of characters long,
      // with a digit in it and nothing else — that is the number somebody pencilled on
      // the paper, and it stays off the page.
      if (byEye && l.x > pages[0].width * 0.72 && t.length <= 5
          && /\d/.test(t) && !/[A-Za-z]{2}/.test(t)) furniture.add(l);
    }

    // ---------- classification ----------
    // Assign each line to its nearest column rather than demanding an exact hit, with the
    // tolerance derived from how far apart the columns actually are.
    const colList = [['action', cols.action], ['dialogue', cols.dialogue],
                     ...(parenInvented ? [] : [['paren', cols.paren]]), ['character', cols.character]];
    // DISTINCT column positions: when speech is collapsed, three of the four names share
    // one x, and counting that as a zero gap makes the tolerance negative — every line
    // then matches no column at all and the whole script imports as 'general'.
    const colXs = [...new Set(colList.map(c => c[1]))].sort((a, b) => a - b);
    let minGap = Infinity;
    for (let i = 1; i < colXs.length; i++) minGap = Math.min(minGap, colXs[i] - colXs[i - 1]);
    if (!Number.isFinite(minGap)) minGap = 36;
    // With four columns 36pt apart a tight tolerance keeps them distinct. With only two,
    // 96pt apart, that same tolerance strands every line typed a few spaces in — an
    // indented action beat, a scene number — as 'general'. Widen it to the actual gap.
    // How far does THIS document's typing actually wander off its columns? A file exported
    // by software sits on them to the point, and a tight tolerance keeps the columns
    // distinct. A scan read by OCR does not: There Will Be Blood's baselines drift several
    // points, and at a fixed 9pt tolerance 664 lines — whole speeches, cue and all — matched
    // no column and came back as 'general'. Measure the drift and allow for it, never more
    // than half the gap between columns.
    const halfGap = Math.floor(minGap / 2) - 1;
    const drift = [];
    for (const l of allLines) {
      let d = Infinity;
      for (const c of colXs) d = Math.min(d, Math.abs(l.x - c));
      if (d <= halfGap) drift.push(d);
    }
    drift.sort((a, b) => a - b);
    const p85 = drift.length ? drift[Math.floor(drift.length * 0.85)] : 0;
    // Read by eye, the wobble is not the typist's and not the page's — it is per LINE.
    // The recogniser's box begins at the ink, and a line opening on a T does not begin
    // where one opening on an apostrophe does; nothing measured about the page can
    // correct for it. So a photographed script assigns every line to its nearest column
    // and leaves none stranded: the columns are thirty-five to seventy points apart and
    // nearest is never in doubt.
    const colTol = speechCollapsed || byEye
      ? halfGap
      : Math.max(3, Math.min(halfGap, Math.max(9, Math.ceil(p85) + 1)));
    // A script assembled from pages typed at different times has more than one tab stop for
    // the same thing. There Will Be Blood's cues sit at 3.5" for most of the film and about
    // 4.05" for a stretch of it — 40pt out, which accounted for 100 of the 124 lines it
    // could not place, whole conversations of them. So a busy cluster that is not one of the
    // four columns stands in for whichever column it is nearest, provided it is near enough
    // that no other column could plausibly be meant.
    const alternates = [];
    for (const b of clusters) {
      if (b.n < allLines.length * 0.008) continue;
      let role = null, bd = Infinity, second = Infinity;
      for (const [k, c] of colList) {
        const d = Math.abs(b.x - c);
        if (d < bd) { second = bd; bd = d; role = k; } else if (d < second) second = d;
      }
      if (role && bd > colTol && bd <= 55 && second - bd >= 25) alternates.push([role, b.x]);
    }
    const nearestCol = (x) => {
      let best = null, bd = Infinity;
      for (const [k, c] of colList) { const d = Math.abs(x - c); if (d < bd) { bd = d; best = k; } }
      // With two columns there is no third answer: a line is on one side or the other, and
      // refusing to choose leaves it unclassified ('general'), which is never right.
      if (speechCollapsed || bd <= colTol) return best;
      for (const [k, c] of alternates) if (Math.abs(x - c) <= colTol) return k;
      return null;
    };
    // The cue and parenthetical columns are close together — 3.0" and 3.5" on FD's grid —
    // and a source only has to drift a few points for a line to be assigned to the wrong
    // one. Jackie Brown's "ORDELL (CONT'D)" landed on the parenthetical column, which made
    // it a parenthetical: drawn at the wrong indent, and invisible to the paginator's
    // speech rules, so it sat alone at the foot of a page with its speech overleaf. There
    // Will Be Blood made the opposite mistake and typed "(beat)" as a character.
    //
    // The text's own shape settles it, and outranks a few points of x drift. Wholly
    // bracketed is a parenthetical; SHOUTED and not bracketed is a cue. Only these two
    // columns are cross-checked — shouted dialogue and capitalised action sit elsewhere.
    const whollyBracketed = t => /^\(.*\)$/.test(t);
    const cueShaped = t => t.length <= 45 && /[A-Z]/.test(t) && t === t.toUpperCase() && !whollyBracketed(t);
    // A SCAN DOES NOT SIT STILL — AND IT DOES NOT KEEP ITS SIZE EITHER.
    //
    // There Will Be Blood's columns are at 94/174/252 on its early pages and 102/184/263 by
    // page 70. Correcting that as a shift gets most of it, but on pages 107–114 the error is
    // 9.8pt at the action margin, 21pt at the dialogue column and 23pt at the cue column:
    // the error GROWS with x, because the sheet was enlarged on the copier, not merely laid
    // down askew. A shift fixes the middle and leaves the rightmost column — the character
    // cues — a dozen points out, which is why whole runs of cues came back unclassified
    // while the dialogue beside them was fine.
    //
    // So each page is fitted to the document's columns as x' = a·x + b: first a median
    // shift to get roughly onto them, then a least-squares fit for the stretch. A file
    // exported by software fits a = 1, b = 0 and is left alone.
    const fitPage = (p) => {
      const ls = bodyLines(p);
      const nearest = (x, win) => {
        let c = null, bd = win;
        for (const k of colXs) if (Math.abs(x - k) < bd) { bd = Math.abs(x - k); c = k; }
        return c;
      };
      const apply = (a, b) => {
        for (const l of p.lines) {
          l.x = a * l.x + b;
          if (l.xEnd != null) l.xEnd = a * l.xEnd + b;
          for (const it of l.items || []) it.x = a * it.x + b;
        }
      };
      // 1. the shift: where does this page sit?
      const ds = [];
      for (const l of ls) { const c = nearest(l.x, minGap / 2); if (c != null) ds.push(l.x - c); }
      if (ds.length < 4) return 0;
      ds.sort((x, y) => x - y);
      const b0 = ds[Math.floor(ds.length / 2)];
      if (Math.abs(b0) >= 0.75) apply(1, -b0);
      // 2. the stretch: now that it is roughly on the columns, does the error still grow
      //    with x? Least squares over (x → its column), needing two columns to see a slope.
      const pts = [];
      for (const l of bodyLines(p)) { const c = nearest(l.x, Math.max(12, colTol * 1.5)); if (c != null) pts.push([l.x, c]); }
      const spread = new Set(pts.map(q => q[1])).size;
      if (pts.length >= 8 && spread >= 2) {
        const n = pts.length;
        let sx = 0, sy = 0, sxx = 0, sxy = 0;
        for (const [x, y] of pts) { sx += x; sy += y; sxx += x * x; sxy += x * y; }
        const den = n * sxx - sx * sx;
        if (den !== 0) {
          const a = (n * sxy - sx * sy) / den;
          const b = (sy - a * sx) / n;
          // only a plausible photocopier: a few percent, never a reflow
          if (a > 0.9 && a < 1.1 && (Math.abs(a - 1) > 0.0008 || Math.abs(b) > 0.5)) {
            apply(a, b);
            return 2;
          }
        }
      }
      return Math.abs(b0) >= 0.75 ? 1 : 0;
    };
    for (const p of body) fitPage(p);

    const roleOf = (l) => {
      const col = nearestCol(l.x);
      const near = (c) => Math.abs(l.x - c) <= colTol;
      const t = l.text.trim();
      // A wider tolerance also swallows the transitions, which sit between the two
      // columns: catch them by shape first — capitals ending in a colon is never speech.
      // A shouted line ending in a colon is a transition wherever it sits — a scan's
      // columns wander enough that CUT TO: lands on none of them.
      if (t.length <= 34 && /[A-Z]/.test(t) && t === t.toUpperCase() && /[:;~]$/.test(t)
          && !SCENE_RE.test(t)) return 'transition';
      // …and a colon is a small mark to hang a whole element type on. Read off a
      // photograph it is lost often enough that The Hateful Eight's CUT TO came back
