<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICA — a screenwriting instrument</title>
<meta name="description" content="A screenplay editor that reads and writes the printed page. Import any Final Draft PDF and edit it — identically.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   PICA — MONOGRAPH chrome (grisaille, serif+mono) around a Courier page.
   One ink, no accent. The script page is always paper — it is the object.
   ================================================================ */
:root{
  --serif: ui-serif, "New York", "Iowan Old Style", Palatino, Georgia, "Times New Roman", serif;
  --mono:  ui-monospace, "SF Mono", "Menlo", "Cascadia Code", "Roboto Mono", monospace;
  /* "Courier Prime Local" resolves only inside PICA.app, which bundles the font so the
     native build needs no network. On the web it simply fails and the Google Fonts copy
     below it in the stack takes over. */
  --courier: "Courier Prime Local", "Courier Prime", "Courier New", Courier, monospace;

  --paper:#f6f5f2;  --paper-2:#efeee9;
  --ink:#141413;    --ink-2:#4c4b47;   --faint:#8f8e88;
  --line:#dad9d2;   --rule:#141413;
  --page:#fdfcf8;   --page-ink:#1b1a17;
  --shadow: 0 14px 44px rgba(20,20,19,.14), 0 2px 8px rgba(20,20,19,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#111110;  --paper-2:#181817;
    --ink:#ecebe6;    --ink-2:#b1b0a9;   --faint:#706f69;
    --line:#2a2a27;   --rule:#ecebe6;
    --shadow: 0 18px 54px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --paper:#f6f5f2;  --paper-2:#efeee9;
  --ink:#141413;    --ink-2:#4c4b47;   --faint:#8f8e88;
  --line:#dad9d2;   --rule:#141413;
  --shadow: 0 14px 44px rgba(20,20,19,.14), 0 2px 8px rgba(20,20,19,.08);
}
:root[data-theme="dark"]{
  --paper:#111110;  --paper-2:#181817;
  --ink:#ecebe6;    --ink-2:#b1b0a9;   --faint:#706f69;
  --line:#2a2a27;   --rule:#ecebe6;
  --shadow: 0 18px 54px rgba(0,0,0,.55), 0 2px 10px rgba(0,0,0,.4);
}

@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:block; }
@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Bold.ttf") format("truetype"); font-weight:700; font-style:normal; font-display:block; }
@font-face{ font-family:"Courier Prime Local"; src:url("fonts/CourierPrime-Italic.ttf") format("truetype"); font-weight:400; font-style:italic; font-display:block; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif);
  display:flex; flex-direction:column; overflow:hidden;
}
button{ background:none; border:none; color:inherit; font:inherit; cursor:pointer; }
::selection{ background:var(--ink); color:var(--paper); }
.page ::selection{ background:var(--page-ink); color:var(--page); }

/* ---------- masthead ---------- */
header{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1.2rem;
  padding:.72rem 1.4rem;
  padding-left:var(--titlebar-inset, 1.4rem);   /* PICA.app clears the traffic lights */
  border-bottom:1px solid var(--line);
  flex:none; user-select:none; min-height:3.15rem;
}
.hzone{ display:flex; align-items:center; gap:1.35rem; min-width:0; }
.hzone.right{ justify-content:flex-end; }
.wordmark{ font-family:var(--serif); font-size:1.28rem; font-weight:560; letter-spacing:.045em; }
#docTitle{
  font-family:var(--mono); font-size:.76rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink); outline:none; padding:.22rem .7rem; border-bottom:1px dashed transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; text-align:center;
}
#docTitle:hover{ border-bottom-color:var(--line); }
#docTitle:focus{ border-bottom-color:var(--faint); }
header .grow{ flex:1; }
.hbtn{
  font-family:var(--mono); font-size:.71rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink-2); padding:.3rem .1rem; border-bottom:1px solid transparent;
  transition:color .12s, border-color .12s;
}
.hbtn:hover{ color:var(--ink); border-bottom-color:var(--rule); }
#railToggle{ font-size:.95rem; letter-spacing:0; }

/* ---------- body split ---------- */
#split{ flex:1; display:flex; min-height:0; }

/* ---------- rail ---------- */
#rail{
  width:var(--railw, 16.5rem); flex:none; border-right:1px solid var(--line);
  overflow-y:auto; padding:1.3rem 1.2rem 3rem;
  scrollbar-width:thin; user-select:none; position:relative;
}
body.railhidden #rail, body.railhidden #railGrip{ display:none; }
/* drag handle: a hairline that thickens under the cursor */
#railGrip{
  flex:none; width:7px; margin-left:-4px; cursor:col-resize; position:relative; z-index:5;
  background:transparent;
}
#railGrip::after{
  content:""; position:absolute; inset:0 3px; background:transparent; transition:background .12s;
}
#railGrip:hover::after, #railGrip.dragging::after{ background:var(--rule); }
body.resizing{ cursor:col-resize; user-select:none; }
body.resizing #canvas{ pointer-events:none; }
.eyebrow{
  display:flex; align-items:center; gap:.7rem;
  font-family:var(--mono); font-size:.62rem; letter-spacing:.28em; text-transform:uppercase;
  color:var(--faint); margin:1.4rem 0 .65rem;
}
.eyebrow::after{ content:""; flex:1; height:1px; background:var(--line); }
.eyebrow:first-child{ margin-top:0; }
.doc-item,.scene-item{
  display:flex; gap:.7rem; width:100%; text-align:left;
  font-family:var(--mono); font-size:.71rem; line-height:1.6;
  color:var(--ink-2); padding:.3rem .35rem .3rem .55rem;
  border-left:2px solid transparent;
}
.doc-item:hover,.scene-item:hover{ color:var(--ink); }
.doc-item.current,.scene-item.current{ border-left-color:var(--rule); color:var(--ink); }
.scene-item .no{ color:var(--faint); flex:none; width:1.7em; text-align:right; font-variant-numeric:tabular-nums; }
.scene-item .sl{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.doc-item .pg{ margin-left:auto; color:var(--faint); font-variant-numeric:tabular-nums; flex:none;}
.rail-act{ font-family:var(--mono); font-size:.64rem; letter-spacing:.18em; color:var(--faint); padding:.25rem .45rem; text-transform:uppercase;}
.rail-act:hover{ color:var(--ink); }

/* ---------- canvas ---------- */
#canvas{ flex:1; overflow:auto; background:var(--paper-2); min-width:0; position:relative; }
#pages{ outline:none; padding:2.6rem 1rem 6rem; caret-color:var(--page-ink); }
.pageWrap{ margin:0 auto 2.4rem; position:relative; }
.page{
  position:relative; background:var(--page); color:var(--page-ink);
  box-shadow:var(--shadow); margin:0 auto;
  font-family:var(--courier); font-variant-ligatures:none;
}
.line{
  position:absolute; white-space:pre; min-width:1px;
}
.line:empty::after{ content:"\200B"; }
.gen{ color:var(--page-ink); }
.pageghost{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:.65rem; letter-spacing:.3em; color:var(--faint); }

/* ---------- statusbar ---------- */
footer{
  flex:none; display:flex; align-items:center; gap:1.5rem;
  border-top:1px solid var(--line); padding:.6rem 1.4rem;
  font-family:var(--mono); font-size:.69rem; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); user-select:none; white-space:nowrap; overflow:hidden;
}
#stType{ color:var(--ink); letter-spacing:.2em; border-bottom:1px solid var(--line); padding-bottom:1px; }
#stType:hover{ border-bottom-color:var(--rule); }
footer .grow{ flex:1; }
footer .z{ padding:0 .25rem; color:var(--ink-2); }
footer .z:hover{ color:var(--ink); }
#stSave{ font-variant-numeric:tabular-nums; }
#stPage{ font-variant-numeric:tabular-nums; color:var(--ink-2); }

/* ---------- popups ---------- */
.pop{
  position:fixed; z-index:50; background:var(--paper); border:1px solid var(--line);
  box-shadow:var(--shadow); min-width:15rem; max-width:24rem; padding:.45rem 0;
  font-family:var(--mono); font-size:.73rem; letter-spacing:.06em;
}
.pop .it{
  display:flex; gap:.9rem; padding:.36rem .95rem; color:var(--ink-2); cursor:pointer; align-items:baseline;
}
.pop .it .k{ margin-left:auto; color:var(--faint); font-size:.62rem; letter-spacing:.1em; }
.pop .it.sel{ background:var(--ink); color:var(--paper); }
.pop .it.sel .k{ color:var(--paper); opacity:.6; }
.pop .cap{ padding:.25rem .8rem .35rem; font-size:.58rem; letter-spacing:.26em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); margin-bottom:.25rem;}

/* ---------- overlay (keys / import / confirm) ---------- */
#overlay{
  position:fixed; inset:0; z-index:80; background:color-mix(in srgb, var(--paper) 72%, transparent);
  display:none; align-items:center; justify-content:center; backdrop-filter:blur(2px);
}
#overlay.show{ display:flex; }
.card{
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow);
  max-width:34rem; width:min(34rem, 92vw); max-height:84vh; overflow:auto; padding:1.6rem 1.9rem 1.7rem;
}
.card h2{ font-family:var(--serif); font-weight:560; font-size:1.3rem; letter-spacing:-.01em; margin-bottom:.2rem; }
.card .sub{ font-family:var(--mono); font-size:.62rem; letter-spacing:.24em; text-transform:uppercase; color:var(--faint); margin-bottom:1.1rem; }
.card table{ width:100%; border-collapse:collapse; font-family:var(--mono); font-size:.7rem; }
.card td{ padding:.32rem .2rem; border-top:1px solid var(--line); color:var(--ink-2); vertical-align:top;}
.card td:first-child{ white-space:nowrap; padding-right:1.2rem; color:var(--ink); letter-spacing:.08em; }
.card .foot{ margin-top:1.2rem; display:flex; gap:1.4rem; }
.card p{ font-size:.95rem; line-height:1.55; color:var(--ink-2); max-width:60ch; margin:.4rem 0; }
#importLog{ font-family:var(--mono); font-size:.7rem; line-height:1.9; color:var(--ink-2); white-space:pre-wrap; }

/* toast */
#toast{
  position:fixed; left:50%; bottom:3.2rem; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); font-family:var(--mono); font-size:.66rem;
  letter-spacing:.18em; text-transform:uppercase; padding:.5rem 1rem; opacity:0; transition:.25s; z-index:90;
  pointer-events:none; white-space:nowrap;
}
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- responsive ---------- */
@media (max-width: 880px){
  #rail{ position:fixed; left:0; top:0; bottom:0; z-index:70; background:var(--paper);
    transform:translateX(-100%); transition:.2s; padding-top:3rem; width:16rem !important;}
  #rail.open{ transform:none; box-shadow:var(--shadow); }
  #railGrip{ display:none; }
  body.railhidden #rail{ display:block; }
  #docTitle{ max-width:44vw; letter-spacing:.12em; }
  .hzone{ gap:.7rem; }
  header{ gap:.5rem; padding:.55rem .7rem .5rem; }
  .wordmark{ font-size:1.05rem; }
}

/* ---------- print: the page is the artifact ---------- */
@media print{
  html,body{ overflow:visible; background:#fff; height:auto;}
  header,#rail,footer,.pop,#overlay,#toast{ display:none !important; }
  #split,#canvas{ display:block; overflow:visible; }
  #canvas{ background:#fff; }
  #pages{ padding:0; }
  .pageWrap{ margin:0; break-after:page; }
  .page{ box-shadow:none; background:#fff; color:#000; }
}
</style>
</head>
<body>

<header>
  <div class="hzone left">
    <button id="railToggle" class="hbtn" title="Toggle sidebar (⌘B)">☰</button>
    <div class="wordmark">PICA</div>
  </div>
  <span id="docTitle" contenteditable="true" spellcheck="false"></span>
  <div class="hzone right">
  <button class="hbtn" id="btnNew">New</button>
  <button class="hbtn" id="btnImport">Import</button>
  <button class="hbtn" id="btnExport">Export</button>
  <button class="hbtn" id="btnKeys" title="keyboard grammar">?</button>
  <button class="hbtn" id="btnTheme" title="invert">◐</button>
  </div>
</header>

<div id="split">
  <nav id="rail">
    <div class="eyebrow">Index</div>
    <div id="docList"></div>
    <button class="rail-act" id="railNew">+ new script</button>
    <button class="rail-act" id="railImport">+ import pdf</button>
    <div class="eyebrow">Scenes</div>
    <div id="sceneList"></div>
  </nav>
  <div id="railGrip" title="Drag to resize"></div>
  <main id="canvas">
    <div id="pages" contenteditable="true" spellcheck="false" autocorrect="off" autocapitalize="off"></div>
  </main>
</div>

<footer>
  <button id="stType">—</button>
  <span id="stHint">⌘\ elements · tab cycles · ? keys</span>
  <div class="grow"></div>
  <span id="stPage">—</span>
  <button class="z" id="zOut">−</button><button class="z" id="zFit">fit</button><button class="z" id="zIn">+</button>
  <span id="stSave"></span>
</footer>

<div id="overlay"></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".pdf,.json" style="display:none">

<script>
/*PICA-ENGINE-START*/
const PicaEngine = (() => {
  'use strict';

  // ---------- element types ----------
  const TYPES = ['scene', 'action', 'character', 'paren', 'dialogue', 'transition', 'shot', 'general'];

  // Default layout: US Letter, Final Draft standard (new blank documents)
  const LETTER = {
    pageW: 612, pageH: 792,
    y0: 76.5, rowH: 12, rows: 55,
    pnY: 40.5, pnRight: 576,
    cols: { action: 108, dialogue: 180, paren: 216, character: 266 },
    transRight: 540, charW: 7.2,
    widths: { scene: 57, action: 57, character: 33, paren: 19, dialogue: 35, transition: 30, shot: 57, general: 57 },
    moreDy: 10, contDy: -14,
  };

  const SCENE_RE = /^(INT\.?\s*\/\s*EXT|EXT\.?\s*\/\s*INT|INT|EXT|I\/E|EST)[\s.]/i;
  const uid = () => 'e' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  // ---------- line assembly from positioned text items ----------
  // items: [{x, y (top-origin), w, str}] for one page → lines [{x, xEnd, y, text}]
  function linesFromItems(items, charW) {
    const its = items.filter(i => i.str && i.str.trim() !== '');
    its.sort((a, b) => a.y - b.y || a.x - b.x);
    const lines = [];
    for (const it of its) {
      const last = lines[lines.length - 1];
      if (last && Math.abs(last.y - it.y) < 2.5) last.items.push(it);
      else lines.push({ y: it.y, items: [it] });
    }
    return lines.map(L => {
      L.items.sort((a, b) => a.x - b.x);
      let text = '', xEnd = 0;
      for (let i = 0; i < L.items.length; i++) {
        const it = L.items[i];
        if (i > 0) {
          const gap = it.x - xEnd;
          if (gap > charW * 0.45 && !/\s$/.test(text)) text += ' '.repeat(Math.max(1, Math.round(gap / charW)));
        }
        text += it.str;
        xEnd = it.x + it.w;
      }
      return { x: L.items[0].x, xEnd, y: L.y, text: text.replace(/\s+$/, '') };
    }).filter(L => L.text.length > 0);
  }

  function estimateCharW(pages) {
    const ws = [];
    for (const p of pages) for (const it of p.items || [])
      if (it.str && it.str.trim().length >= 4) ws.push(it.w / it.str.length);
    ws.sort((a, b) => a - b);
    return ws.length ? ws[Math.floor(ws.length / 2)] : 7.2;
  }

  // ---------- text wrapping (greedy, spaces only — Final Draft style) ----------
  function wrapText(text, width) {
    const out = [];
    for (const seg of String(text).split('\n')) {
      if (seg === '') { out.push(''); continue; }
      let rest = seg;
      while (rest.length > width) {
        let cut = rest.lastIndexOf(' ', width);
        if (cut <= 0) cut = width; // unbreakable word
        out.push(rest.slice(0, cut).replace(/\s+$/, ''));
        rest = rest.slice(cut).replace(/^\s+/, '');
      }
      out.push(rest);
    }
    return out.length ? out : [''];
  }

  function wrapElement(el, layout) {
    if (el.text === '') return [''];
    return wrapText(el.text, layout.widths[el.type] || 57);
  }

  // ---------- PDF import: classify pages of lines → document ----------
  const mode = arr => {
    const h = new Map();
    for (const v of arr) h.set(v, (h.get(v) || 0) + 1);
    let best = null, n = 0;
    for (const [v, c] of h) if (c > n) { n = c; best = v; }
    return best;
  };

  function importPdf(rawPages, opts = {}) {
    const charW0 = estimateCharW(rawPages);
    const pages = rawPages.map(p => ({
      width: p.width, height: p.height,
      lines: p.lines ? p.lines : linesFromItems(p.items, charW0),
    }));

    // -- title page detection: first page, few lines, no sluglines, mostly centered-ish
    let titlePage = null, bodyStart = 0;
    if (pages.length > 1) {
      const p0 = pages[0];
      const slug = p0.lines.some(l => SCENE_RE.test(l.text));
      if (p0.lines.length > 0 && p0.lines.length <= 12 && !slug) { titlePage = p0; bodyStart = 1; }
    }
    const body = pages.slice(bodyStart);

    // -- page numbers: short "N." lines in the top margin, right side
    const isPageNum = (l, p) => /^\d+\.$/.test(l.text.trim()) && l.x > p.width * 0.55 && l.y < 60;

    // -- collect body lines / metrics
    const allLines = [];
    for (const p of body) for (const l of p.lines) if (!isPageNum(l, p)) allLines.push(l);
    const gaps = [];
    for (const p of body) {
      const ls = p.lines.filter(l => !isPageNum(l, p));
      for (let i = 1; i < ls.length; i++) {
        const g = Math.round(ls[i].y - ls[i - 1].y);
        if (g > 4 && g < 30) gaps.push(g);
      }
    }
    const rowH = mode(gaps) || 12;
    const firstYs = body.slice(1).map(p => {
      const ls = p.lines.filter(l => !isPageNum(l, p));
      return ls.length ? Math.round(ls[0].y * 2) / 2 : null;
    }).filter(v => v != null);
    // y0 = the most common first-line y that is on the dominant grid
    const y0 = mode(firstYs) ?? 76.5;

    // -- column detection from x histogram
    const xh = new Map();
    for (const l of allLines) {
      const k = Math.round(l.x);
      xh.set(k, (xh.get(k) || 0) + 1);
    }
    // merge near-identical bins (±2pt)
    const bins = [...xh.entries()].sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [x, n] of bins) {
      const last = merged[merged.length - 1];
      if (last && x - last.x <= 2) { last.n += n; last.x = last.n > n ? last.x : x; }
      else merged.push({ x, n });
    }
    const top = merged.filter(b => b.n >= allLines.length * 0.01).sort((a, b) => b.n - a.n).slice(0, 4)
      .sort((a, b) => a.x - b.x);
    const cols = { ...LETTER.cols };
    if (top.length >= 4) {
      cols.action = top[0].x; cols.dialogue = top[1].x; cols.paren = top[2].x; cols.character = top[3].x;
    } else if (top.length === 3) { // no parentheticals in doc
      cols.action = top[0].x; cols.dialogue = top[1].x; cols.character = top[2].x;
      cols.paren = Math.round((cols.dialogue + cols.character) / 2);
    } else if (top.length > 0) {
      cols.action = top[0].x;
    }

    // -- page number metrics
    let pnY = LETTER.pnY, pnRight = pages[0].width - 82;
    const pns = [];
    for (const p of body) for (const l of p.lines) if (isPageNum(l, p)) pns.push(l);
    if (pns.length) {
      pnY = mode(pns.map(l => Math.round(l.y * 2) / 2));
      pnRight = pns.map(l => l.xEnd).sort((a, b) => a - b)[Math.floor(pns.length / 2)];
    }

    // -- transition right edge: caps lines ending ':' not at any col
    const nearCol = x => Object.values(cols).some(c => Math.abs(x - c) < 3);
    const transEnds = allLines
      .filter(l => /[A-Z]/.test(l.text) && l.text === l.text.toUpperCase() && /:\s*$/.test(l.text) && !nearCol(l.x))
      .map(l => l.xEnd);
    const transRight = transEnds.length ? transEnds.sort((a, b) => a - b)[Math.floor(transEnds.length / 2)] : pages[0].width - 96;

    // -- rows per page: highest on-grid row index seen
    let maxRow = 0;
    for (const l of allLines) {
      const r = (l.y - y0) / rowH;
      if (Math.abs(r - Math.round(r)) < 0.15) maxRow = Math.max(maxRow, Math.round(r));
    }
    const rows = maxRow + 1;

    const layout = {
      pageW: pages[0].width, pageH: pages[0].height,
      y0, rowH, rows, pnY, pnRight,
      cols, transRight, charW: charW0,
      widths: { ...LETTER.widths },
      moreDy: 10, contDy: -14,
    };

    // ---------- classification ----------
    const roleOf = (l) => {
      const near = (c) => Math.abs(l.x - c) < 3;
      if (near(cols.action)) return SCENE_RE.test(l.text) ? 'scene' : 'action';
      if (near(cols.dialogue)) return 'dialogue';
      if (near(cols.paren)) return 'paren';
      if (near(cols.character)) {
        if (l.text.trim() === '(MORE)') return 'MORE';
        return 'character';
      }
      if (Math.abs(l.xEnd - transRight) < 4 && l.text === l.text.toUpperCase() && /:\s*$/.test(l.text)) return 'transition';
      return 'general';
    };

    const els = [];
    let open = null;           // currently-open element accumulating source lines
    let pendingSpeech = null;  // set when (MORE) seen at a page end: awaiting continuation
    const flush = () => { if (open) { els.push(open); open = null; } };

    for (let pi = 0; pi < body.length; pi++) {
      const p = body[pi];
      const ls = p.lines.filter(l => !isPageNum(l, p));
      let prevLine = null, pageStart = true;

      for (const l of ls) {
        const contCue = pageStart && /\(CONT'D\)\s*$/.test(l.text) && Math.abs(l.x - cols.character) < 3
          && pendingSpeech;
        if (contCue) { pageStart = false; prevLine = null; continue; } // swallow generated cue

        const role = roleOf(l);
        if (role === 'MORE') { pendingSpeech = open || pendingSpeech || true; flush(); prevLine = null; pageStart = false; continue; }

        const gap = prevLine ? Math.round(l.y - prevLine.y) : null;
        const contSameEl = open && gap !== null && gap <= rowH + 2 && open.type === role
          && (role === 'action' || role === 'dialogue' || role === 'paren');

        if (contSameEl) {
          open.srcLines.push(l);
        } else if (pendingSpeech && !pageStart && prevLine === null && (role === 'dialogue' || role === 'paren')) {
          // continuation after (MORE): resume the split speech
          const prevEl = els[els.length - 1];
          if (role === prevEl?.type && role === 'dialogue') {
            open = els.pop(); open.srcLines.push(l); open.splitJoin = open.srcLines.length - 1;
          } else {
            open = { id: uid(), type: role, srcLines: [l] };
          }
          pendingSpeech = null;
        } else {
          flush();
          open = { id: uid(), type: role, srcLines: [l] };
          if (prevLine) open.gapBefore = Math.max(0, Math.round((l.y - prevLine.y) / rowH) - 1);
          if (role === 'general') open.xOverride = Math.round(l.x * 100) / 100;
          if (role === 'transition') open.align = 'right';
        }
        prevLine = l; pageStart = false;
      }
      flush(); // elements never span pages except via (MORE) handling above
      if (!pendingSpeech) pendingSpeech = null;
    }
    flush();

    // ---------- join source lines → text; calibrate widths; mark hard breaks ----------
    for (const el of els) el.joined = el.srcLines.map(s => s.text).join(' ');

    // width calibration per wrapping type: try candidates, keep the one that soft-wraps the most elements
    for (const type of ['action', 'dialogue', 'paren', 'scene', 'character']) {
      const cands = new Set();
      let maxObs = 0;
      for (const el of els) if (el.type === type)
        for (const s of el.srcLines) maxObs = Math.max(maxObs, s.text.length);
      if (!maxObs) continue;
      for (let w = maxObs; w <= maxObs + 4; w++) cands.add(w);
      let bestW = maxObs, bestScore = -1;
      for (const w of cands) {
        let score = 0;
        for (const el of els) {
          if (el.type !== type) continue;
          const wrapped = wrapText(el.joined, w);
          if (wrapped.length === el.srcLines.length && wrapped.every((t, i) => t === el.srcLines[i].text)) score++;
        }
        if (score > bestScore) { bestScore = score; bestW = w; }
      }
      layout.widths[type] = bestW;
      if (type === 'action') { layout.widths.shot = bestW; layout.widths.general = bestW; }
    }

    // spacing overrides: where the source's blank rows differ from the standard rule
    for (let i = 1; i < els.length; i++) {
      const g = els[i].gapBefore;
      if (g == null) continue;
      const prev = els[i - 1], cur = els[i];
      const speechInternal = (cur.type === 'dialogue' || cur.type === 'paren')
        && (prev.type === 'character' || prev.type === 'dialogue' || prev.type === 'paren');
      const expected = speechInternal ? 0 : blanksBefore(prev.type, cur.type);
      if (g !== expected && !speechInternal) cur.spaceBefore = g;
    }
    for (const el of els) delete el.gapBefore;

    // assign final text: soft where greedy wrap reproduces the source, hard breaks otherwise
    for (const el of els) {
      const w = layout.widths[el.type] || 57;
      const wrapped = wrapText(el.joined, w);
      const src = el.srcLines.map(s => s.text);
      el.text = (wrapped.length === src.length && wrapped.every((t, i) => t === src[i]))
        ? el.joined : src.join('\n');
      delete el.joined; delete el.srcLines; delete el.splitJoin;
    }

    // ---------- title page ----------
    let tp = [];
    if (titlePage) {
      tp = titlePage.lines.map(l => ({
        text: l.text,
        row: Math.round((l.y - y0) / rowH),
        x: Math.round(l.x * 100) / 100,
      }));
    }

    return {
      v: 1,
      title: (tp[0] && tp[0].text) || (els.find(e => e.type === 'scene')?.text ?? 'UNTITLED').slice(0, 40),
      titlePage: tp,
      layout,
      elements: els.map(e => ({ id: e.id, type: e.type, text: e.text, ...(e.xOverride != null ? { xOverride: e.xOverride } : {}), ...(e.align ? { align: e.align } : {}), ...(e.spaceBefore != null ? { spaceBefore: e.spaceBefore } : {}) })),
    };
  }

  // ---------- pagination ----------
  const SENT_END = /[.!?…](["')\]]*)?\s*$|[-–—]\s*$/;

  function xFor(el, line, layout) {
    if (el.xOverride != null) return el.xOverride;
    const c = layout.cols;
    switch (el.type) {
      case 'scene': case 'action': case 'shot': return c.action;
      case 'dialogue': return c.dialogue;
      case 'paren': return c.paren;
      case 'character': return c.character;
      case 'transition': return layout.transRight - line.length * layout.charW;
      case 'general': return c.action;
      default: return c.action;
    }
  }

  // group elements into placement blocks: speeches (character + paren/dialogue run) stay together
  function blocksOf(elements) {
    const blocks = [];
    let i = 0;
    while (i < elements.length) {
      const el = elements[i];
      if (el.type === 'character') {
        const parts = [el]; i++;
        while (i < elements.length && (elements[i].type === 'dialogue' || elements[i].type === 'paren')) { parts.push(elements[i]); i++; }
        blocks.push({ kind: 'speech', parts });
      } else {
        blocks.push({ kind: 'single', parts: [el] }); i++;
      }
    }
    return blocks;
  }

  const blanksBefore = (prevType, curType) => {
    if (!prevType) return 0;
    if (curType === 'scene') return 2;
    return 1;
  };

  function paginate(doc) {
    const L = doc.layout;
    const pages = [];
    // title page
    if (doc.titlePage && doc.titlePage.length) {
      pages.push({
        title: true,
        lines: doc.titlePage.map((t, i) => ({
          x: t.x != null ? t.x : (L.pageW - t.text.length * L.charW) / 2,
          y: L.y0 + (t.row != null ? t.row : 17 + i * 4) * L.rowH,
          text: t.text, el: 'title:' + i, kind: 'title', off: 0,
        })),
      });
    }

    let cur = { lines: [] }, row = 0, prevType = null, scriptPage = 1;
    pages.push(cur);
    const yAt = r => L.y0 + r * L.rowH;

    const newPage = () => {
      scriptPage++;
      cur = { lines: [] };
      if (scriptPage >= 2) {
        const t = scriptPage + '.';
        cur.lines.push({ x: L.pnRight - t.length * L.charW, y: L.pnY, text: t, el: 'pn', kind: 'pn', off: 0 });
      }
      pages.push(cur);
      row = 0; prevType = null;
    };

    // wrapped lines cache with char offsets
    const wrapWithOffsets = (el) => {
      const lines = wrapElement(el, L);
      const out = []; let off = 0; const text = el.text;
      for (const ln of lines) {
        const idx = text.indexOf(ln, off);
        const at = idx >= 0 ? idx : off;
        out.push({ t: ln, off: at });
        off = at + ln.length;
      }
      return out;
    };

    const put = (el, lineObj, r, kind) => {
      cur.lines.push({ x: xFor(el, lineObj.t, L), y: yAt(r), text: lineObj.t, el: el.id, kind: kind || el.type, off: lineObj.off });
    };

    // If a scene heading sits alone at the bottom of the current page and the block
    // after it is moving to a new page, the slugline moves with it (Final Draft rule).
    const retractSlug = () => {
      if (prevType !== 'scene') return null;
      let i = cur.lines.length;
      while (i > 0 && cur.lines[i - 1].kind === 'scene') i--;
      if (i === cur.lines.length) return null;
      return cur.lines.splice(i);
    };
    const replaySlug = (pulled) => {
      for (const sl of pulled) { cur.lines.push({ ...sl, y: yAt(row) }); row++; }
      prevType = 'scene';
    };

    const blocks = blocksOf(doc.elements);

    for (let bi = 0; bi < blocks.length; bi++) {
      const block = blocks[bi];
      const first = block.parts[0];
      const blanks = row === 0 ? 0 : (first.spaceBefore ?? blanksBefore(prevType, first.type));

      if (block.kind === 'single') {
        const el = first;
        const wl = wrapWithOffsets(el);
        const need = blanks + wl.length;

        if (row + need > L.rows) {
          // try splitting long action at a sentence boundary
          if ((el.type === 'action' || el.type === 'general') && wl.length > 2) {
            const avail = L.rows - (row + blanks);
            if (avail >= 2) {
              let k = -1;
              for (let i = Math.min(avail, wl.length - 1) - 1; i >= 1; i--) {
                if (SENT_END.test(wl[i].t)) { k = i + 1; break; }
              }
              if (k >= 2 && wl.length - k >= 1) {
                let r = row + blanks;
                for (let i = 0; i < k; i++) put(el, wl[i], r++);
                newPage();
                for (let i = k; i < wl.length; i++) put(el, wl[i], row++);
                prevType = el.type;
                continue;
              }
            }
          }
          if (wl.length > L.rows) { // absurdly long element: force break
            let r = row + blanks, i = 0;
            for (; i < wl.length; i++) {
              if (r >= L.rows) { newPage(); r = 0; }
              put(el, wl[i], r++);
            }
            row = r; prevType = el.type; continue;
          }
          const pulled = retractSlug();
          newPage();
          if (pulled) replaySlug(pulled);
        }
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of wl) put(el, lo, r++);
        row = r; prevType = el.type;
        continue;
      }

      // ---- speech block ----
      const cueEl = block.parts[0];
      const cueLines = wrapWithOffsets(cueEl);
      const flat = []; // [{el, lineObj, subIdx}]
      for (let si = 1; si < block.parts.length; si++) {
        const sub = block.parts[si];
        for (const lo of wrapWithOffsets(sub)) flat.push({ el: sub, lo, si });
      }
      const totalNeed = blanks + cueLines.length + flat.length;

      if (row + totalNeed <= L.rows) { // fits whole
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (const f of flat) put(f.el, f.lo, r++);
        row = r; prevType = block.parts[block.parts.length - 1].type;
        continue;
      }

      // doesn't fit: try split with (MORE)
      const startR = row === 0 ? 0 : row + blanks;
      const availBody = L.rows - startR - cueLines.length;
      let k = -1; // number of speech lines on this page
      if (availBody >= 2 && flat.length >= 3) {
        for (let i = Math.min(availBody, flat.length - 1); i >= 2; i--) {
          const f = flat[i - 1], nxt = flat[i];
          const subEnd = nxt.si !== f.si; // boundary between dialogue/paren sub-elements
          if ((f.el.type === 'dialogue' && SENT_END.test(f.lo.t)) || subEnd) { k = i; break; }
        }
      }

      if (k >= 2) {
        let r = startR;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (let i = 0; i < k; i++) put(flat[i].el, flat[i].lo, r++);
        const lastY = yAt(r - 1);
        cur.lines.push({ x: L.cols.character, y: lastY + L.moreDy, text: '(MORE)', el: cueEl.id, kind: 'more', off: 0 });
        newPage();
        const cueTxt = /\(CONT'D\)\s*$/.test(cueEl.text) ? cueEl.text : cueEl.text + " (CONT'D)";
        cur.lines.push({ x: L.cols.character, y: L.y0 + L.contDy, text: cueTxt, el: cueEl.id, kind: 'contcue', off: 0 });
        let r2 = 0;
        for (let i = k; i < flat.length; i++) put(flat[i].el, flat[i].lo, r2++);
        row = r2; prevType = block.parts[block.parts.length - 1].type;
      } else {
        const pulled = retractSlug();
        newPage();
        if (pulled) replaySlug(pulled);
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (const f of flat) {
          if (r >= L.rows) { newPage(); r = 0; } // pathological: speech longer than a page
          put(f.el, f.lo, r++);
        }
        row = r; prevType = block.parts[block.parts.length - 1].type;
      }
    }

    return { pages, count: scriptPage };
  }

  // ---------- fountain export ----------
  function toFountain(doc) {
    const out = [];
    if (doc.titlePage.length) {
      out.push('Title: ' + (doc.title || ''));
      const by = doc.titlePage.find(t => /by/i.test(t.text));
      const auth = doc.titlePage[doc.titlePage.length - 1];
      if (auth && auth.text !== doc.title) out.push('Author: ' + auth.text);
      out.push('');
    }
    for (const el of doc.elements) {
      const t = el.text.replace(/\n/g, ' ');
      switch (el.type) {
        case 'scene': out.push('', t.toUpperCase()); break;
        case 'action': case 'general': out.push('', el.text); break;
        case 'shot': out.push('', '!' + t); break;
        case 'character': out.push('', t); break;
        case 'paren': out.push(t); break;
        case 'dialogue': out.push(t); break;
        case 'transition': out.push('', '> ' + t); break;
      }
    }
    return out.join('\n').replace(/^\n+/, '') + '\n';
  }

  function newDoc(title) {
    return {
      v: 1, title: title || 'UNTITLED',
      titlePage: [
        { text: (title || 'UNTITLED').toUpperCase(), row: 17 },
        { text: 'Written by', row: 21 },
        { text: '', row: 24 },
      ],
      layout: JSON.parse(JSON.stringify(LETTER)),
      elements: [{ id: uid(), type: 'scene', text: '' }],
    };
  }

  return { TYPES, LETTER, uid, linesFromItems, estimateCharW, wrapText, wrapElement, importPdf, paginate, toFountain, newDoc, SCENE_RE };
})();
/*PICA-ENGINE-END*/
