// Screenplay.fdxt template; TAB_* is the documented Tab behaviour (hardcoded in FD,
// not a per-element setting). Do not "improve" these — they are what FD does.
const FOLLOW = { scene:'action', action:'action', character:'dialogue', paren:'dialogue', dialogue:'action', transition:'scene', shot:'action', general:'general' };
const TAB_TO = { scene:'action', action:'character', character:'paren', paren:'dialogue', dialogue:'paren', transition:'scene', shot:'character', general:'action' };
const TAB_BLANK = { ...TAB_TO, character:'transition' };  // FD: Tab in a blank Character → Transition
const TAB_BACK = { action:'scene', character:'action', paren:'dialogue', dialogue:'paren', transition:'character', scene:'transition', general:'action' };
// FD shortcut numbers: 1 Scene … 7 Shot, 0 General (8/9 are Cast List / New Act, not modelled)
const SHORTCUT = { '1':'scene', '2':'action', '3':'character', '4':'paren', '5':'dialogue', '6':'transition', '7':'shot', '0':'general' };
const SHORTCUT_OF = Object.fromEntries(Object.entries(SHORTCUT).map(([k, v]) => [v, k]));
const UPPER = t => (t === 'scene' || t === 'character' || t === 'transition' || t === 'shot');
const TYPE_LABEL = { scene:'Scene Heading', action:'Action', character:'Character', paren:'Parenthetical', dialogue:'Dialogue', transition:'Transition', shot:'Shot', general:'General' };

function newEl(type, text){ return { id: E.uid(), type, text: text || '' }; }

// ---------- emphasis ----------
// Stored as an optional `marks` array of [start, end, kind] character ranges, so a
// document written before emphasis existed still loads unchanged. Monospace means
// emphasis never changes the metrics, so the engine and the fidelity gate are untouched.
const MARK_BIT = { b: 1, i: 2, u: 4 };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function markBitsFor(el, off, len){
  if (!el || !el.marks || !el.marks.length) return null;
  const bits = new Uint8Array(len);
  let any = false;
  for (const [s, e, k] of el.marks) {
    const a = Math.max(0, s - off), b = Math.min(len, e - off);
    if (b <= a) continue;
    const bit = MARK_BIT[k] || 0;
    for (let i = a; i < b; i++) { bits[i] |= bit; any = true; }
  }
  return any ? bits : null;
}
function markedHTML(text, bits){
  let out = '', i = 0;
  while (i < text.length) {
    const b = bits[i] || 0;
    let j = i + 1;
    while (j < text.length && (bits[j] || 0) === b) j++;
    const chunk = esc(text.slice(i, j));
    if (!b) out += chunk;
    else {
      let open = '', close = '';
      if (b & 1) { open += '<b>'; close = '</b>' + close; }
      if (b & 2) { open += '<i>'; close = '</i>' + close; }
      if (b & 4) { open += '<u>'; close = '</u>' + close; }
      out += open + chunk + close;
    }
    i = j;
  }
  return out;
}
function shiftMarks(el, at, delta){
  if (!el) return;
  if (el.marks) {
    el.marks = el.marks
      .map(([s, e, k]) => [s >= at ? s + delta : s, e >= at ? e + delta : e, k])
      .filter(([s, e]) => e > s);
    if (!el.marks.length) delete el.marks;
  }
  // margin notes ride the same shifts — but never die with their span: the span
  // is an anchor, the words in the box are his
  if (el.notes) for (const n of el.notes) {
    let s = n.off, e = n.off + n.len;
    if (s >= at) s += delta;
    if (e >= at) e += delta;
    s = Math.max(0, s); e = Math.max(s, e);
    n.off = s; n.len = e - s;
  }
  // storyboard panels are position anchors — same rule, never deleted by an edit
  if (el.panels) for (const p of el.panels)
    if (p.off >= at) p.off = Math.max(0, p.off + delta);
}
// FD keeps emphasis through paragraph merges; PICA also carries its margin data.
// Build the carried fields for a merge: `a` keeps its first aKeepLen chars,
// `b` contributes from bDropLen onward, landing at offset aKeepLen.
function carryMerge(a, aKeepLen, b, bDropLen, totalLen){
  const out = {};
  const marks = [];
  for (const [s0, e0, k] of a.marks || []) if (s0 < aKeepLen) marks.push([s0, Math.min(e0, aKeepLen), k]);
  for (const [s0, e0, k] of b.marks || []) {
    const s1 = Math.max(0, s0 - bDropLen) + aKeepLen, e1 = Math.max(0, e0 - bDropLen) + aKeepLen;
    if (e1 > s1) marks.push([s1, Math.min(e1, totalLen), k]);
  }
  const mv = marks.filter(([x, y]) => y > x)
    .sort((p, q) => (p[2] < q[2] ? -1 : p[2] > q[2] ? 1 : p[0] - q[0]));
  const coal = [];
  for (const m of mv) {
    const last = coal[coal.length - 1];
    if (last && last[2] === m[2] && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]);
    else coal.push([...m]);
  }
  if (coal.length) out.marks = coal;
  const notes = [];
  for (const n of a.notes || []) if (n.off < aKeepLen || n.len === 0)
    notes.push({ ...n, off: Math.min(n.off, aKeepLen), len: Math.max(0, Math.min(n.off + n.len, aKeepLen) - Math.min(n.off, aKeepLen)) });
  for (const n of b.notes || []) {
    const off = Math.max(0, n.off - bDropLen) + aKeepLen;
    notes.push({ ...n, off: Math.min(off, totalLen), len: Math.max(0, Math.min(off + n.len, totalLen) - Math.min(off, totalLen)) });
  }
  if (notes.length) out.notes = notes;
  const panels = [];
  for (const pn of a.panels || []) panels.push({ ...pn, off: Math.min(pn.off, aKeepLen) });
  for (const pn of b.panels || []) panels.push({ ...pn, off: Math.min(Math.max(0, pn.off - bDropLen) + aKeepLen, totalLen) });
  if (panels.length) out.panels = panels;
  return out;
}

function rangeHasMark(el, s, e, kind){
  if (!el.marks) return false;
  for (let i = s; i < e; i++) {
    let has = false;
    for (const [a, b, k] of el.marks) if (k === kind && i >= a && i < b) { has = true; break; }
    if (!has) return false;
  }
  return e > s;
}
function setMark(el, s, e, kind, on){
  if (e <= s) return;
  const kept = [];
  for (const [a, b, k] of (el.marks || [])) {
    if (k !== kind || b <= s || a >= e) { kept.push([a, b, k]); continue; }
    if (a < s) kept.push([a, s, k]);
    if (b > e) kept.push([e, b, k]);
  }
  if (on) kept.push([s, e, kind]);
  kept.sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  // merge touching ranges of the same kind
  const merged = [];
  for (const m of kept) {
    const last = merged[merged.length - 1];
    if (last && last[2] === m[2] && m[0] <= last[1]) last[1] = Math.max(last[1], m[1]);
    else merged.push([...m]);
  }
  if (merged.length) el.marks = merged; else delete el.marks;
}

function applyEmphasis(kind){
  const r = domRange();
  if (!r) return;
  const [a, b] = r;
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return;
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return;
  if (ia === ib && a.off === b.off) {
    // FD: toggling emphasis at a collapsed caret sets the style of what you type
    // NEXT — as an ABSOLUTE state. Typing at the end of an italic run inherits
    // italic (the mark extends), so ⌘I there must mean OFF, and the typed text
    // is carved out of the inherited style.
    if (a.el.startsWith('title:')) return;
    if (!S.pend || S.pend.el !== a.el || S.pend.off !== a.off) {
      const el0 = elById(a.el);
      const inherited = [];
      for (const [s0, e0, k] of (el0 && el0.marks) || [])
        if (a.off > s0 && a.off <= e0 && !inherited.includes(k)) inherited.push(k);
      S.pend = { el: a.el, off: a.off, kinds: inherited };
    }
    const i2 = S.pend.kinds.indexOf(kind);
    if (i2 >= 0) S.pend.kinds.splice(i2, 1); else S.pend.kinds.push(kind);
    const names = { b: 'bold', i: 'italic', u: 'underline' };
    toast(S.pend.kinds.length ? S.pend.kinds.map(k => names[k]).join(' + ') + ' — as you type' : 'plain — as you type');
    return;
  }

  const targets = [];
  for (let i = ia; i <= ib; i++) {
    const el = S.doc.elements[i];
    const s = i === ia ? a.off : 0;
    const e = i === ib ? b.off : el.text.length;
    if (e > s) targets.push([el, s, e]);
  }
  if (!targets.length) return;
  const allOn = targets.every(([el, s, e]) => rangeHasMark(el, s, e, kind));
  pushUndo({ k: 'marks', ids: targets.map(([el]) => el.id),
             before: targets.map(([el]) => el.marks ? JSON.parse(JSON.stringify(el.marks)) : null),
             cb: S.caret, ca: S.caret, ts: Date.now() });
  for (const [el, s, e] of targets) setMark(el, s, e, kind, !allOn);
  S.undo[S.undo.length - 1].after = targets.map(([el]) => el.marks ? JSON.parse(JSON.stringify(el.marks)) : null);
  repaginate(); renderAfterEdit();
  const sel = getSelection();
  if (sel.rangeCount) { /* keep the visible selection where it was */ }
}

// ---------- annotations: margin notes anchored to passages ----------
// A note lives on its element ({id, off, len, text}) so it travels with saves,
// snapshots, drafts and the emergency mirror; its offsets ride the same shifts as
// emphasis marks. On screen: a quiet wash over the passage, and a box in the right
// margin joined to it by a hairline — at the passage's own y, the margin geometry
// the source itself uses. Notes never print: the exported page stays pristine.
function toggleAnnotate(){
  if (inReader()) return;                      // reader owns the page; both tools stay off
  const r = domRange();
  const hasSel = r && (r[0].el !== r[1].el || r[0].off !== r[1].off);
  if (!S.annotate) {
    S.annotate = true;
    document.body.classList.add('annotate');
    $('#btnAnnot')?.classList.add('on');
    renderNotesAll();
    if (hasSel) annotateSelection();
    else toast('annotate — select a passage');
    return;
  }
  if (hasSel) { annotateSelection(); return; } // already on: the button annotates the selection
  S.annotate = false;
  document.body.classList.remove('annotate');
  $('#btnAnnot')?.classList.remove('on');
  document.querySelectorAll('.noteLayer').forEach(d => d.remove());
  toast('annotate off');
}
// ---------- margin-tool undo: notes and panels ride the same ⌘Z stream ----------
// The record shape mirrors emphasis marks: touched element ids + a deep before/after
// of each element's notes (or panels) array. Every structural op — create, delete,
// re-highlight, comment edit, panel move — is one record, so ⌘Z walks back through
// the margins exactly as it walks back through the writing.
function annotRec(key, elIds){
  const ids = [...new Set(elIds)];
  return { k: key, ids,
    before: ids.map(id => { const el = elById(id); const v = el && el[key]; return v ? JSON.parse(JSON.stringify(v)) : null; }),
    cb: S.caret, ca: S.caret, ts: Date.now() };
}
function commitAnnotRec(rec){
  rec.after = rec.ids.map(id => { const el = elById(id); const v = el && el[rec.k]; return v ? JSON.parse(JSON.stringify(v)) : null; });
  pushUndo(rec);
}
// undo made a margin change visible — make sure its layer is actually showing
function ensureAnnotate(){
  if (S.annotate || inReader()) return;
  S.annotate = true; document.body.classList.add('annotate'); $('#btnAnnot')?.classList.add('on');
}
function ensureStoryboard(){
  if (S.storyboard || inReader()) return;
  S.storyboard = true; document.body.classList.add('storyboard'); $('#btnSb')?.classList.add('on');
}

// a selection can run across elements — a cue AND its dialogue is one thought.
// Each covered element gets a span entry sharing the note's id; the words live on
// the first (the owner), continuations carry seg:1. Every entry shifts with its
// own element's edits, which is the whole reason to store them per-element.
function noteTargets(){
  const r = domRange(); if (!r) return null;
  const [a, b] = r;
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return null;
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return null;
  const targets = [];
  for (let i = ia; i <= ib; i++) {
    const el = S.doc.elements[i];
    const s = i === ia ? a.off : 0;
    const e = i === ib ? b.off : el.text.length;
    if (e > s) targets.push([el, s, e]);
  }
  return targets.length ? targets : null;
}
function createNote(targets, text, norec){
  const rec = norec ? null : annotRec('notes', targets.map(([el]) => el.id));
  const nid = E.uid();
  targets.forEach(([el, s, e], i) => {
    const n = { id: nid, off: s, len: e - s, ...(i === 0 ? { text: text || '' } : { seg: 1 }) };
    (el.notes = el.notes || []).push(n);
  });
  if (rec) commitAnnotRec(rec);
  renderNotesAll(); saveSoon();
  return nid;
}
function annotateSelection(){
  const targets = noteTargets(); if (!targets) return;
  if (S.rehl) {                                // "change highlight": move it, keep the words
    let text = '';
    const oldIds = S.doc.elements.filter(el => (el.notes || []).some(n => n.id === S.rehl)).map(el => el.id);
    for (const el of S.doc.elements)
      for (const n of el.notes || []) if (n.id === S.rehl && !n.seg) text = n.text || '';
    const rec = annotRec('notes', [...oldIds, ...targets.map(([el]) => el.id)]); // one record for the whole move
    deleteNote(null, S.rehl, true);
    S.rehl = null;
    getSelection().removeAllRanges();
    createNote(targets, text, true);
    commitAnnotRec(rec);
    toast('highlight moved');
    return;
  }
  const nid = createNote(targets, '');
  getSelection().removeAllRanges();
  document.querySelector('.noteBox[data-note="' + nid + '"] textarea')?.focus();
}
function deleteNote(_elId, noteId, quiet){
  const touched = S.doc.elements.filter(el => (el.notes || []).some(n => n.id === noteId)).map(el => el.id);
  const rec = quiet || !touched.length ? null : annotRec('notes', touched);
  for (const el of S.doc.elements) if (el.notes) {
    el.notes = el.notes.filter(n => n.id !== noteId);
    if (!el.notes.length) delete el.notes;
  }
  if (rec) commitAnnotRec(rec);
  if (!quiet) { renderNotesAll(); saveSoon(); }
}
function goToNote(b){
  S.caret = { el: b.el.id, off: b.n.off };
  const pi = caretPage();
  if (pi >= 0 && S.pageEls[pi]) S.pageEls[pi].wrap.scrollIntoView({ block: 'center' });
  setTimeout(() => { restoreCaret(); status(); }, 90);
}
function renderNotesAll(){
  for (let i = 0; i < S.pageEls.length; i++) if (S.pageEls[i].live) renderNotes(i);
}
function renderNotes(pi){
  const pe = S.pageEls[pi]; if (!pe || !pe.page) return;
  pe.wrap.querySelector('.noteLayer')?.remove();
  if (!S.annotate) return;                     // the pristine page is the default
  const p = S.res.pages[pi]; if (!p || p.title) return;
  const L = S.doc.layout, k = S.k;
  const layer = document.createElement('div');
  layer.className = 'noteLayer';
  layer.contentEditable = 'false';
  const boxes = [];
  for (const l of p.lines) {
    if (l.kind === 'pn' || l.kind === 'more' || l.kind === 'contcue') continue;
    const el = elById(l.el); if (!el || !el.notes) continue;
    for (const n of el.notes) {
      const s = Math.max(n.off, l.off), e = Math.min(n.off + n.len, l.off + l.text.length);
      const yTop = (l.y - S.fontPt * 0.79) * k;
      if (e > s) {
        const h = document.createElement('div');
        h.className = 'noteHl';
        h.style.left = (l.x + (s - l.off) * L.charW) * k + 'px';
        h.style.top = yTop + 'px';
        h.style.width = (e - s) * L.charW * k + 'px';
        h.style.height = L.rowH * k + 'px';
        layer.appendChild(h);
      }
      // the box anchors where the note begins — on its owner entry only
      if (!n.seg && n.off >= l.off && n.off <= l.off + l.text.length && !boxes.some(x => x.n === n))
        boxes.push({ n, el, y: yTop });
    }
  }
  if (!layer.childNodes.length && !boxes.length) return;
  const gutter = L.pageW * k;                 // page's right edge, in layer coords
  // keep the boxes on screen: when the window leaves no room to the right of the
  // page, they slide onto the paper's own margin — where margin notes belong anyway
  const boxW = 210;
  const room = canvasEl.clientWidth - pe.wrap.offsetLeft - boxW - 10;
  const boxLeft = Math.min(gutter + 16, Math.max(room, gutter - boxW * 0.7));
  boxes.sort((x, y) => x.y - y.y);
  for (const b of boxes) {
    const box = document.createElement('div');
    box.className = 'noteBox';
    box.dataset.note = b.n.id; box.dataset.el = b.el.id;
    box.style.left = boxLeft + 'px';
    const ta = document.createElement('textarea');
    ta.rows = 1; ta.value = b.n.text || ''; ta.placeholder = '…';
    ta.spellcheck = false;
    box.appendChild(ta);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.title = 'Delete note';
    x.addEventListener('mousedown', ev => { ev.preventDefault(); ev.stopPropagation(); deleteNote(null, b.n.id); });
    box.appendChild(x);
    layer.appendChild(box);
    b.box = box; b.ta = ta;
    ta.addEventListener('input', () => {
      b.n.text = ta.value;
      ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
      layoutNoteBoxes(layer, boxes, L, k);
      saveSoon();
    });
    ta.addEventListener('keydown', kv => { kv.stopPropagation(); if (kv.key === 'Escape') ta.blur(); });
    ta.addEventListener('focus', () => { ta._orig = ta.value; });
    ta.addEventListener('blur', () => {
      if (!ta.value.trim()) { deleteNote(null, b.n.id); return; }
      // one editing session = one undo step, with the pre-focus words as "before"
      if (ta._orig != null && ta.value !== ta._orig) {
        const rec = annotRec('notes', [b.el.id]);
        const own = (rec.before[0] || []).find(n => n.id === b.n.id);
        if (own) own.text = ta._orig;
        commitAnnotRec(rec);
        ta._orig = ta.value;
      }
    });
    box.addEventListener('contextmenu', ev => {
      ev.preventDefault(); ev.stopPropagation();
      popupAt([
        { label: 'Change highlight', act: 'rehl' },
        { label: 'Go to passage', act: 'go' },
        { label: 'Copy comment', act: 'copy' },
        { label: 'Delete note', act: 'del' },
      ], ev.clientX, ev.clientY, it => {
        if (it.act === 'del') deleteNote(null, b.n.id);
        else if (it.act === 'rehl') { S.rehl = b.n.id; getSelection().removeAllRanges(); toast('select the new passage — Esc cancels'); }
        else if (it.act === 'copy') { navigator.clipboard?.writeText(b.n.text || ''); toast('copied'); }
        else if (it.act === 'go') goToNote(b);
      });
    });
  }
  pe.wrap.appendChild(layer);
  for (const b of boxes) { b.ta.style.height = 'auto'; b.ta.style.height = b.ta.scrollHeight + 'px'; }
  layoutNoteBoxes(layer, boxes, L, k);
}
// stack the boxes without overlap, then join each to its passage with a hairline
// elbow: a stub off the page edge at the passage's y, down the gutter, into the box
function layoutNoteBoxes(layer, boxes, L, k){
  layer.querySelectorAll('.noteLead').forEach(d => d.remove());
  const gutter = L.pageW * k;
  const boxLeft = boxes.length ? parseFloat(boxes[0].box.style.left) : 0;
  const kneeX = Math.min(gutter + 8, boxLeft - 4);
  let prevBottom = -Infinity;
  for (const b of boxes) {
    const top = Math.max(b.y, prevBottom + 10);
    b.box.style.top = top + 'px';
    prevBottom = top + b.box.offsetHeight;
    const aMid = b.y + (L.rowH * k) / 2;
    const bMid = top + b.box.offsetHeight / 2;
    const seg = (x, y, w, h) => {
      const d = document.createElement('div');
      d.className = 'noteLead';
      d.style.left = x + 'px'; d.style.top = y + 'px';
      d.style.width = w + 'px'; d.style.height = h + 'px';
      layer.appendChild(d);
    };
    if (kneeX > gutter + 2) seg(gutter + 2, aMid, kneeX - gutter - 2, 1); // off the page
    if (Math.abs(bMid - aMid) > 1)
      seg(kneeX, Math.min(aMid, bMid), 1, Math.abs(bMid - aMid));         // down the gutter
    if (boxLeft > kneeX) seg(kneeX, bMid, boxLeft - kneeX, 1);            // into the box
  }
}

// ---------- storyboard: e-conte panels in the left margin ----------
// Both traditions agree on the anchor: the Japanese e-conte puts each cut's picture
// against the text row where the cut BEGINS (cut · picture · content · seconds),
// and a lined script marks a shot as starting at a point in the text. So a panel is
// a POSITION anchor — {element, offset} — and the left column read top-down is the
// cut order; coverage runs implicitly to the next panel. Images never live in the
// doc body (snapshots ring-buffer whole docs): each panel carries an imgKey → a
// separate idb 'img.<key>' record, compressed JPEG.
const imgCache = new Map();
async function imgFor(key){
  if (imgCache.has(key)) return imgCache.get(key);
  const v = await idb.get('img.' + key).catch(() => null);
  if (v) imgCache.set(key, v);
  return v;
}
function toggleStoryboard(){
  if (inReader()) return;
  S.storyboard = !S.storyboard;
  document.body.classList.toggle('storyboard', S.storyboard);
  $('#btnSb')?.classList.toggle('on', S.storyboard);
  if (S.storyboard) renderPanelsAll();
  else document.querySelectorAll('.sbLayer').forEach(d => d.remove());
  toast(S.storyboard ? 'storyboard — drop photos where they occur' : 'storyboard off');
}
function packImage(file){
  return new Promise((res, rej) => {
    const img = new Image();
    const u = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(u);
      const MAX = 1400;
      const sc = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * sc), h = Math.round(img.naturalHeight * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      res({ url: c.toDataURL('image/jpeg', 0.82), ar: w / h });
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
    img.src = u;
  });
}
async function addPanelFiles(files, clientX, clientY){
  const hit = forgivingPos(clientX, clientY, null);
  if (!hit) { toast('drop on the page, where the shot begins'); return; }
  const el = elById(hit.d.dataset.el); if (!el) return;
  const off = (+hit.d.dataset.off || 0) + hit.at;
  const rec = annotRec('panels', [el.id]);
  let n = 0;
  for (const f of files) {
    const packed = await packImage(f).catch(() => null);
    if (!packed) { toast('could not read ' + f.name); continue; }
    const key = E.uid();
    try { await idb.put('img.' + key, packed.url); } catch { toast('storage refused the image — not placed'); continue; }
    imgCache.set(key, packed.url);
    (el.panels = el.panels || []).push({ id: E.uid(), off, imgKey: key, ar: packed.ar });
    n++;
  }
  if (n) { commitAnnotRec(rec); renderPanelsAll(); saveSoon(); toast(n === 1 ? 'panel placed' : n + ' panels placed'); }
}
function deletePanel(elId, pid){
  const el = elById(elId); if (!el || !el.panels) return;
  const rec = annotRec('panels', [el.id]);
  el.panels = el.panels.filter(x => x.id !== pid);
  if (!el.panels.length) delete el.panels;
  // the image record stays: ⌘Z must be able to bring the drawing back, and an
  // orphaned image is a far smaller sin than an unrecoverable one
  commitAnnotRec(rec);
  renderPanelsAll(); saveSoon();
}
function renderPanelsAll(){
  for (let i = 0; i < S.pageEls.length; i++) if (S.pageEls[i].live) renderPanels(i);
}
function renderPanels(pi){
  const pe = S.pageEls[pi]; if (!pe || !pe.page) return;
  pe.wrap.querySelector('.sbLayer')?.remove();
  if (!S.storyboard) return;                   // the pristine page is the default
  const p = S.res.pages[pi]; if (!p || p.title) return;
  const L = S.doc.layout, k = S.k;
  const panels = [];
  for (const l of p.lines) {
    if (l.kind === 'pn' || l.kind === 'more' || l.kind === 'contcue') continue;
    const el = elById(l.el); if (!el || !el.panels) continue;
    for (const pn of el.panels)
      if (pn.off >= l.off && pn.off <= l.off + l.text.length && !panels.some(x => x.pn === pn))
        panels.push({ pn, el, y: (l.y - S.fontPt * 0.79) * k });
  }
  if (!panels.length) return;
  const layer = document.createElement('div');
  layer.className = 'sbLayer';
  layer.contentEditable = 'false';
  // left mirror of the note clamp: the canvas cannot scroll into negative space,
  // so when the window leaves no room left of the page, panels slide onto the paper
  const boxW = 240;
  const room = pe.wrap.offsetLeft;
  const boxLeft = Math.min(-boxW * 0.3, Math.max(-(boxW + 16), 10 - room));
  panels.sort((a, b) => a.y - b.y);
  let prevBottom = -Infinity;
  for (const b of panels) {
    const imh = Math.round((boxW - 10) / (b.pn.ar || 1.5));
    const h = imh + 10;                        // deterministic: no image wait for layout
    const top = Math.max(b.y, prevBottom + 10);
    prevBottom = top + h;
    const box = document.createElement('div');
    box.className = 'sbPanel';
    box.dataset.panel = b.pn.id; box.dataset.el = b.el.id;
    box.style.left = boxLeft + 'px'; box.style.top = top + 'px';
    const im = document.createElement('img');
    im.width = boxW - 10; im.height = imh;
    imgFor(b.pn.imgKey).then(u => { if (u) im.src = u; });
    box.appendChild(im);
    const x = document.createElement('button');
    x.className = 'x'; x.textContent = '×'; x.title = 'Remove panel';
    x.addEventListener('mousedown', ev => { ev.preventDefault(); ev.stopPropagation(); deletePanel(b.el.id, b.pn.id); });
    box.appendChild(x);
    wirePanelDrag(box, b);
    layer.appendChild(box);
    // the lead: a stub off the page's left edge at the cut's row, down the gutter,
    // into the panel — the mirror of a note's elbow
    const aMid = b.y + (L.rowH * k) / 2;
    const bMid = top + h / 2;
    const boxRight = boxLeft + boxW;
    const kneeX = Math.max(-8, boxRight + 4);
    const seg = (x2, y2, w2, h2) => {
      const d = document.createElement('div');
      d.className = 'sbLead';
      d.style.left = x2 + 'px'; d.style.top = y2 + 'px';
      d.style.width = w2 + 'px'; d.style.height = h2 + 'px';
      layer.appendChild(d);
    };
    if (kneeX < -2) seg(kneeX, aMid, -2 - kneeX, 1);
    else seg(kneeX, aMid, 7, 1);               // clamped onto the paper: still tick the anchor row
    if (Math.abs(bMid - aMid) > 1) seg(kneeX, Math.min(aMid, bMid), 1, Math.abs(bMid - aMid));
    if (boxRight < kneeX) seg(boxRight, bMid, kneeX - boxRight, 1);
  }
  pe.wrap.appendChild(layer);
}
// click opens the drawing full-size; a real drag re-anchors it where it lands
function wirePanelDrag(box, b){
  box.addEventListener('mousedown', ev => {
    if (ev.button !== 0 || ev.target.closest('.x')) return;
    ev.preventDefault();
    const sx = ev.clientX, sy = ev.clientY;
    let moved = false;
    const mv = e => {
      if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 5) return;
      moved = true;
      box.classList.add('dragging');
      box.style.transform = 'translate(' + (e.clientX - sx) + 'px,' + (e.clientY - sy) + 'px)';
    };
    const up = e => {
      removeEventListener('mousemove', mv); removeEventListener('mouseup', up);
      if (!moved) { sbZoomOpen(b.pn.imgKey); return; }
      box.classList.remove('dragging'); box.style.transform = '';
      const hit = forgivingPos(e.clientX, e.clientY, null);
      const nel = hit && elById(hit.d.dataset.el);
      if (!nel) { renderPanelsAll(); return; }
      const rec = annotRec('panels', [b.el.id, nel.id]);   // the move is one undo step
      const old = elById(b.el.id);
      if (old && old.panels) {
        old.panels = old.panels.filter(x => x.id !== b.pn.id);
        if (!old.panels.length) delete old.panels;
      }
      b.pn.off = (+hit.d.dataset.off || 0) + hit.at;
      (nel.panels = nel.panels || []).push(b.pn);
      commitAnnotRec(rec);
      renderPanelsAll(); saveSoon();
    };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
}
function sbZoomOpen(key){
  imgFor(key).then(u => {
    if (!u) return;
    const z = $('#sbZoom');
    z.querySelector('img').src = u;
    z.classList.add('show');
  });
}

// The caret counts as "at the end" when it sits just inside a parenthetical's closing
// bracket — which is exactly where it lives while you type one. Without this, Tab and
// Enter see an interior caret and split the element instead of moving you to dialogue.
function atElementEnd(el, off){
  if (off >= el.text.length) return true;
  if (el.type === 'paren') {
    const m = el.text.match(/\)+\s*$/);
    if (m && off >= el.text.length - m[0].length) return true;
  }
  return false;
}

function handleEnter(){
  closePops();
  const c = syncCaret(); if (!c) return;
  if (c.el.startsWith('title:')) { // new title line
    const i = +c.el.slice(6);
    const t = S.doc.titlePage[i];
    pushUndo({ k: 'tsplice', i: i + 1, ts: Date.now(), cb: S.caret, ca: { el: 'title:' + (i + 1), off: 0 } });
    S.doc.titlePage.splice(i + 1, 0, { text: '', row: (t.row || 0) + 2 });
    S.caret = { el: 'title:' + (i + 1), off: 0 };
    repaginate(); renderAfterEdit(); return;
  }
  const el = elById(c.el); if (!el) return;
  if (el.text === '') {
    // A blank element + Return, with no list open, means "never mind": an empty
    // Character obviously wants Action, an abandoned Parenthetical wants the
    // Dialogue it was modifying. Only a blank Action asks the question — that is
    // the one place the element menu belongs.
    const back = { character: 'action', dialogue: 'action', paren: 'dialogue', transition: 'action', shot: 'action', scene: 'action' }[el.type];
    if (back) { opConvert(el.id, back); return; }
    openElementMenu(); return;
  }
  // a written parenthetical never splits on Enter — you leave it, into the dialogue
  if (el.type === 'paren') c.off = el.text.length;
  // all-caps + TO: → transition
  if (el.type === 'action' && /TO:\s*$/.test(el.text) && el.text === el.text.toUpperCase()) {
    opConvert(el.id, 'transition');
  }
  const i = elIndex(c.el);
  // FD's auto-(CONT\'D): the same speaker again, with no other speaker between
  // The append lengthens the cue, so the caret must move to the new end WITH it —
  // otherwise the at-end check below sees an interior caret and SPLITS the cue
  // into "CHAIR" + a stray "(CONT'D)" element on the next line.
  let preContd = null;   // snapshot for one ATOMIC undo step: append + new element
  if (el.type === 'character' && el.text && S.pref?.autoContd !== false && !/CONT['’]D/i.test(el.text)) {
    const base = el.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    for (let j = i - 1; j >= 0; j--) {
      const p = S.doc.elements[j];
      if (p.type !== 'character') continue;
      const pb = p.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
      if (pb && pb === base && atElementEnd(el, c.off)) { preContd = { ...el }; el.text += " (CONT'D)"; c.off = el.text.length; }
      break;
    }
  }
  if (atElementEnd(el, c.off)) {
    const nt = FOLLOW[el.type] || 'action';
    const ne = newEl(nt, '');
    if (preContd) {
      // ⌘Z must take back the (CONT'D) it added, not just the dialogue after it
      pushUndo({ k: 'splice', i, removed: [preContd], inserted: [{ ...el }, { ...ne }], cb: S.caret, ca: { el: ne.id, off: 0 }, ts: Date.now() });
      S.doc.elements.splice(i + 1, 0, ne);
      S.caret = { el: ne.id, off: 0 };
      repaginate(); renderAfterEdit();
    } else {
      opSplice(i + 1, 0, [ne], { el: ne.id, off: 0 });
      if (nt === 'character') guessCharacter(ne.id);
    }
  } else if (c.off === 0) {
    const ne = newEl(el.type === 'dialogue' ? 'character' : el.type, '');
    opSplice(i, 0, [ne], { el: el.id, off: 0 });
  } else { // split element — FD keeps emphasis (and PICA's margin data) on BOTH sides
    const raw = el.text;
    const head = raw.slice(0, c.off).replace(/\s+$/, '');
    const tailRaw = raw.slice(c.off);
    const lead = tailRaw.length - tailRaw.replace(/^\s+/, '').length;
    const tail = tailRaw.slice(lead);
    const tailOff = c.off + lead;             // original index of the tail's first char
    const ne = newEl(el.type, tail);
    const removedSnap = JSON.parse(JSON.stringify({ ...el }));
    if (el.marks) {
      const hm = [], tm = [];
      for (const [s0, e0, k] of el.marks) {
        if (s0 < head.length && e0 > 0) hm.push([Math.max(0, s0), Math.min(e0, head.length), k]);
        if (e0 > tailOff) tm.push([Math.max(0, s0 - tailOff), Math.min(tail.length, e0 - tailOff), k]);
      }
      const hv = hm.filter(([a, b]) => b > a), tv = tm.filter(([a, b]) => b > a);
      if (hv.length) el.marks = hv; else delete el.marks;
      if (tv.length) ne.marks = tv;
    }
    if (el.notes) {
      const hn = [], tn = [];
      for (const n of el.notes) {
        if (n.off >= tailOff) tn.push({ ...n, off: n.off - tailOff, len: Math.max(0, Math.min(n.len, tail.length - (n.off - tailOff))) });
        else hn.push({ ...n, off: Math.min(n.off, head.length), len: Math.max(0, Math.min(n.off + n.len, head.length) - Math.min(n.off, head.length)) });
      }
      if (hn.length) el.notes = hn; else delete el.notes;
      if (tn.length) ne.notes = tn;
    }
    if (el.panels) {
      const hp = [], tp2 = [];
      for (const pn of el.panels) {
        if (pn.off >= tailOff) tp2.push({ ...pn, off: pn.off - tailOff });
        else hp.push({ ...pn, off: Math.min(pn.off, head.length) });
      }
      if (hp.length) el.panels = hp; else delete el.panels;
      if (tp2.length) ne.panels = tp2;
    }
    el.text = head;
    pushUndo({ k: 'splice', i, removed: [removedSnap], inserted: [JSON.parse(JSON.stringify({ ...el })), JSON.parse(JSON.stringify({ ...ne }))], cb: S.caret, ca: { el: ne.id, off: 0 }, ts: Date.now() });
    S.doc.elements.splice(i + 1, 0, ne);
    S.caret = { el: ne.id, off: 0 };
    repaginate(); renderAfterEdit();
  }
}

// The separator this script actually uses between location and time (" - " vs " – ").
function sceneSep(){
  const hits = new Map();
  for (const e of S.doc.elements) if (e.type === 'scene') {
    const m = e.text.match(/\s([-–—])\s/);
    if (m) hits.set(m[1], (hits.get(m[1]) || 0) + 1);
  }
  let best = null, n = 0;
  for (const [k, c] of hits) if (c > n) { n = c; best = k; }
  return best ? ' ' + best + ' ' : ' - ';
}

// FD: inside a Scene Heading, Tab walks the sub-fields — intro, then location, then time,
// raising the matching SmartType list at each stop.
function sceneTab(el){
  const t = el.text;
  if (/^(INT\.?\/EXT|EXT\.?\/INT|I\/E|INT|EXT|EST)\.?$/i.test(t.trim())) {
    const txt = t.trim().toUpperCase().replace(/\.$/, '') + '. ';
    opText(el.id, txt, { el: el.id, off: txt.length });
    smartType(elById(el.id));
    return true;
  }
  if (!/\s[-–—]\s/.test(t)) {
    const txt = t.replace(/\s+$/, '') + sceneSep();
    opText(el.id, txt, { el: el.id, off: txt.length });
    smartType(elById(el.id));
    return true;
  }
  return false;   // time already present → Tab falls through to a new Action paragraph
}

// FD's "auto-guess next character": in a two-hander, offer the *other* speaker first.
function guessCharacter(id){
  const i = elIndex(id);
  const recent = [];
  for (let j = i - 1; j >= 0 && recent.length < 2; j--) {
    const e = S.doc.elements[j];
    if (e.type !== 'character') continue;
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base && !recent.includes(base)) recent.push(base);
  }
  const guess = recent[1] || recent[0];
  const names = characterNames();
  const ordered = guess ? [guess, ...names.filter(n => n !== guess)] : names;
  if (!ordered.length) return;
  popup(ordered.slice(0, 6).map(n => ({ label: n })), { kind: 'smart', onPick: it => {
    opText(id, it.label, { el: id, off: it.label.length });
  }});
}

function handleTab(shift){
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  closePops();

  // FD: Tab in a blank paragraph converts it — one deterministic jump, never a cycle.
  if (el.text === '') {
    const next = (shift ? TAB_BACK : TAB_BLANK)[el.type];
    if (!next) return;
    opConvert(el.id, next);
    if (next === 'paren') opText(el.id, '()', { el: el.id, off: 1 });   // visible at once, caret inside
    if (next === 'character') guessCharacter(el.id);
    return;
  }
  // a written parenthetical: Tab leaves it for the dialogue from anywhere inside
  if (el.type === 'paren' && !shift) {
    const i = elIndex(el.id);
    const nxt = S.doc.elements[i + 1];
    if (nxt && nxt.type === 'dialogue') { S.caret = { el: nxt.id, off: nxt.text.length }; restoreCaret(); status(); return; }
    const ne = newEl('dialogue', '');
    opSplice(i + 1, 0, [ne], { el: ne.id, off: 0 });
    return;
  }
  if (shift) return;
  // FD: Tab acts from ANYWHERE in a written paragraph — the next element is
  // created after it. The slug's sub-field walk still needs the caret at the end.
  if (el.type === 'scene' && atElementEnd(el, c.off) && sceneTab(el)) return;

  const nt = TAB_TO[el.type] || 'character';
  const ne = newEl(nt, nt === 'paren' ? '()' : '');
  opSplice(elIndex(el.id) + 1, 0, [ne], { el: ne.id, off: nt === 'paren' ? 1 : 0 });
  if (nt === 'character') guessCharacter(ne.id);
}

function handleInsertText(data){
  const c = syncCaret(); if (!c) return;
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) { deleteRange(r); }
  const cc = S.caret;
  if (cc.el.startsWith('title:')) {
    const t = S.doc.titlePage[+cc.el.slice(6)]; if (!t) return;
    const txt = t.text.slice(0, cc.off) + data + t.text.slice(cc.off);
    opText(cc.el, txt, { el: cc.el, off: cc.off + data.length });
    return;
  }
  const el = elById(cc.el); if (!el) return;
  let ins = data;
  if (UPPER(el.type)) ins = ins.toUpperCase();
  shiftMarks(el, cc.off, ins.length);
  // "(" at start of empty dialogue → parenthetical
  if (el.type === 'dialogue' && el.text === '' && ins === '(') {
    opConvert(el.id, 'paren');
    opText(el.id, '()', { el: el.id, off: 1 });
    return;
  }
  // typing into an empty parenthetical wraps itself in brackets
  if (el.type === 'paren' && el.text === '' && ins !== '(') {
    opText(el.id, '(' + ins + ')', { el: el.id, off: 1 + ins.length });
    smartType(el);
    return;
  }
  // skip over the closing paren
  if (el.type === 'paren' && ins === ')' && el.text[cc.off] === ')') {
    S.caret = { el: el.id, off: cc.off + 1 }; restoreCaret(); status(); return;
  }
  let text = el.text.slice(0, cc.off) + ins + el.text.slice(cc.off);
  let caretOff = cc.off + ins.length;
  // int./ext. auto-detects a scene heading
  if ((!S.pref || S.pref.autoDetect) && el.type === 'action'
      && /^(INT|EXT|I\/E|EST)([./]|[./]\s?EXT)/i.test(text) && !/^(INT|EXT|I\/E|EST)$/i.test(text)) {
    el.type = 'scene'; text = text.toUpperCase();
  }
  opText(el.id, text, { el: el.id, off: caretOff });
  // a pending ⌘B/I/U (armed at a collapsed caret) sets the ABSOLUTE style of
  // what lands here — including switching an inherited style OFF
  if (S.pend && S.pend.el === el.id && S.pend.off === cc.off && ins) {
    for (const k of ['b', 'i', 'u']) setMark(el, cc.off, cc.off + ins.length, k, S.pend.kinds.includes(k));
    S.pend.off = cc.off + ins.length;
  }
  // FD: "(" in a Character cue raises the Character Extension list
  if (el.type === 'character' && ins === '(') { openExtMenu(); return; }
  smartType(el);
}

function deleteRange([a, b]){
  if (a.el === b.el) {
    if (a.el.startsWith('title:')) {
      const t = S.doc.titlePage[+a.el.slice(6)];
      opText(a.el, t.text.slice(0, a.off) + t.text.slice(b.off), { el: a.el, off: a.off });
    } else {
      const el = elById(a.el); if (!el) return;
      opText(a.el, el.text.slice(0, a.off) + el.text.slice(b.off), { el: a.el, off: a.off });
    }
    return;
  }
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return; // don't cross the title boundary
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return;
  const ea = elById(a.el), eb = elById(b.el);
  const mtext = ea.text.slice(0, a.off) + eb.text.slice(b.off);
  const merged = { ...ea, text: mtext, marks: undefined, notes: undefined, panels: undefined,
    ...carryMerge(ea, a.off, eb, b.off, mtext.length) };
  if (!merged.marks) delete merged.marks;
  if (!merged.notes) delete merged.notes;
  if (!merged.panels) delete merged.panels;
  opSplice(ia, ib - ia + 1, [merged], { el: merged.id, off: a.off });
}

function handleBackspace(){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c) return;
  if (c.el.startsWith('title:')) {
    const i = +c.el.slice(6); const t = S.doc.titlePage[i];
    if (c.off > 0) return opText(c.el, t.text.slice(0, c.off - 1) + t.text.slice(c.off), { el: c.el, off: c.off - 1 });
    if (t.text === '' && S.doc.titlePage.length > 1) {
      pushUndo({ k: 'tsplice-del', i, entry: { ...t }, cb: S.caret, ca: { el: 'title:' + Math.max(0, i - 1), off: (S.doc.titlePage[i - 1] || { text: '' }).text.length }, ts: Date.now() });
      S.doc.titlePage.splice(i, 1);
      S.caret = { el: 'title:' + Math.max(0, i - 1), off: (S.doc.titlePage[Math.max(0, i - 1)] || { text: '' }).text.length };
      repaginate(); renderAfterEdit();
    }
    return;
  }
  const el = elById(c.el); if (!el) return;
  if (c.off > 0) {
    shiftMarks(el, c.off, -1);
    opText(c.el, el.text.slice(0, c.off - 1) + el.text.slice(c.off), { el: c.el, off: c.off - 1 });
    smartType(el);
    return;
  }
  const i = elIndex(c.el);
  if (i <= 0) return;
  const prev = S.doc.elements[i - 1];
  if (el.text === '') opSplice(i, 1, [], { el: prev.id, off: prev.text.length });
  else {
    const mtext = prev.text + el.text;
    const merged = { ...prev, text: mtext, marks: undefined, notes: undefined, panels: undefined,
      ...carryMerge(prev, prev.text.length, el, 0, mtext.length) };
    if (!merged.marks) delete merged.marks;
    if (!merged.notes) delete merged.notes;
    if (!merged.panels) delete merged.panels;
    opSplice(i - 1, 2, [merged], { el: prev.id, off: prev.text.length });
  }
}
function handleDelete(){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  if (c.off < el.text.length) {
    shiftMarks(el, c.off + 1, -1);
    return opText(c.el, el.text.slice(0, c.off) + el.text.slice(c.off + 1), { el: c.el, off: c.off });
  }
  const i = elIndex(c.el);
  const next = S.doc.elements[i + 1]; if (!next) return;
  if (next.text === '') opSplice(i + 1, 1, [], { el: el.id, off: c.off });
  else {
    const mtext = el.text + next.text;
    const merged = { ...el, text: mtext, marks: undefined, notes: undefined, panels: undefined,
      ...carryMerge(el, el.text.length, next, 0, mtext.length) };
    if (!merged.marks) delete merged.marks;
    if (!merged.notes) delete merged.notes;
    if (!merged.panels) delete merged.panels;
    opSplice(i, 2, [merged], { el: el.id, off: c.off });
  }
}

// ---------- popups: element menu, smarttype, extensions, export ----------
function closePops(){
  document.querySelectorAll('.pop').forEach(p => p.remove());
  document.querySelectorAll('.doc-item.menuing, .scene-item.menuing').forEach(n => n.classList.remove('menuing'));
  S.menu = null;
}

function caretRect(){
  const sel = getSelection();
  if (sel.rangeCount) {
    const r = sel.getRangeAt(0).cloneRange();
    const rects = r.getClientRects();
    if (rects.length) return rects[0];
    const n = sel.anchorNode;
    const el = n && (n.nodeType === 3 ? n.parentElement : n);
    if (el && el.getBoundingClientRect) return el.getBoundingClientRect();
  }
  return { left: innerWidth / 2, bottom: innerHeight / 2, top: innerHeight / 2 };
}

// a popup anchored to a point rather than to the caret
function popupAt(items, x, y, onPick){
  closePops();
  const pop = document.createElement('div');
  pop.className = 'pop';
  items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'it' + (idx === 0 ? ' sel' : '');
    d.textContent = it.label;
    d.addEventListener('mousedown', ev => { ev.preventDefault(); closePops(); onPick(it); });
    pop.appendChild(d);
  });
  document.body.appendChild(pop);
  pop.style.left = Math.min(x, innerWidth - pop.offsetWidth - 8) + 'px';
  pop.style.top = Math.min(y, innerHeight - pop.offsetHeight - 8) + 'px';
  const away = e => { if (!pop.contains(e.target)) { closePops(); removeEventListener('mousedown', away, true); } };
  setTimeout(() => addEventListener('mousedown', away, true), 0);
}

function popup(items, opts){
  closePops();
  const pop = document.createElement('div');
  pop.className = 'pop';
  if (opts.cap) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = opts.cap; pop.appendChild(c); }
  items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'it' + (idx === 0 ? ' sel' : '');
    d.innerHTML = '<span></span><span class="k"></span>';
    d.firstChild.textContent = it.label;
    d.lastChild.textContent = it.key || '';
    d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(idx); });
    pop.appendChild(d);
  });
  document.body.appendChild(pop);
  const r = caretRect();
  const W = pop.offsetWidth, H = pop.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - W - 8);
  let y = r.bottom + 6; if (y + H > innerHeight - 8) y = Math.max(8, r.top - H - 6);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  const state = { el: pop, items, sel: 0, kind: opts.kind || 'menu' };
  S.menu = state;
  function pick(i){ const it = items[i]; closePops(); opts.onPick(it, i); }
  state.move = d => {
    state.sel = (state.sel + d + items.length) % items.length;
    [...pop.querySelectorAll('.it')].forEach((n, i) => n.classList.toggle('sel', i === state.sel));
  };
  state.accept = () => pick(state.sel);
}

function openElementMenu(){

// ---------- retyping: guess what a run of text wants to be ----------
function guessTypes(el){
  const t = el.text.trim();
  const i = elIndex(el.id);
  const prev = S.doc.elements[i - 1];
  const order = [];
  const push = ty => { if (ty && ty !== el.type && !order.includes(ty)) order.push(ty); };
  if (E.SCENE_RE.test(t)) push('scene');
  if (/TO:$/.test(t) && t === t.toUpperCase()) push('transition');
  if (/^\(.*\)?$/.test(t) && t.length < 60) push('paren');
  // a lone name: short, few words, no sentence punctuation — the classic mis-typed cue
  const words = t.split(/\s+/).filter(Boolean);
  if (t && t.length <= 30 && words.length <= 4 && !/[.!?,]$/.test(t) && /^[A-Za-z0-9 .'()-]+$/.test(t)) push('character');
  if (prev && (prev.type === 'character' || prev.type === 'paren')) push('dialogue');
  if (t === t.toUpperCase() && /[A-Z]/.test(t) && words.length <= 6) push('shot');
  push('dialogue'); push('action');
  for (const ty of E.TYPES) push(ty);
  return order;
}

function selectionElements(){
  const r = domRange();
  if (!r) return null;
  const [a, b] = r;
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return null;
  if (a.el === b.el && a.off === b.off) return null;      // collapsed
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return null;
  return S.doc.elements.slice(ia, ib + 1).map(e => e.id);
}

// the chooser used by right-click and by Tab/Enter on a selection: guesses first
function openRetypeMenu(ids, at){
  const first = elById(ids[0]); if (!first) return;
  const guesses = guessTypes(first);
  const items = guesses.map(ty => ({
    label: TYPE_LABEL[ty] + (ty === guesses[0] ? '   · guess' : ''),
    key: '⌘' + SHORTCUT_OF[ty], type: ty,
  }));
  const cap = ids.length > 1
    ? ids.length + ' elements — change to'
    : 'this is ' + TYPE_LABEL[first.type].toUpperCase() + ' — change to';
  if (at) {
    const hasSel = !!selectionElements();
    const extra = hasSel ? [
      { label: 'Bold', key: '⌘B', mark: 'b' },
      { label: 'Italic', key: '⌘I', mark: 'i' },
      { label: 'Underline', key: '⌘U', mark: 'u' },
    ] : [];
    popupAt([{ label: cap.toUpperCase(), act: null },
             ...items.map(it => ({ ...it, act: 'go' })), ...extra], at.x, at.y,
            it => { if (it.mark) applyEmphasis(it.mark); else if (it.act) opRetype(ids, it.type); });
  } else {
    popup(items, { cap, kind: 'element', onPick: it => opRetype(ids, it.type) });
  }
}

// SmartType — FD's six lists. Seeds below are FD12's shipped defaults; characters and
// locations come from the script itself.
const TIMES = ['DAY', 'NIGHT', 'AFTERNOON', 'MORNING', 'EVENING', 'LATER', 'MOMENTS LATER', 'CONTINUOUS', 'THE NEXT DAY', 'MAGIC HOUR', 'DAWN', 'DUSK', 'SAME', 'SAME TIME'];
const TRANSITIONS = ['CUT TO:', 'FADE IN:', 'FADE OUT.', 'FADE TO:', 'DISSOLVE TO:', 'BACK TO:', 'MATCH CUT TO:', 'JUMP CUT TO:', 'FADE TO BLACK.', 'SMASH CUT TO:', 'CUT TO BLACK.', 'TIME CUT:'];

function characterNames(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'character') {
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base) freq.set(base, (freq.get(base) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function locations(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'scene') {
    const m = e.text.match(/^(?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT|EXT|I\/E|EST)[.\s]+(.*?)(?:\s+[–—-]\s+[A-Z' ]+)?$/);
    if (m && m[1]) freq.set(m[1].trim(), (freq.get(m[1]) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function smartType(el){
  if (S.pref && !S.pref.smartType) return;
  if (!S.caret || S.caret.el !== el.id || S.caret.off < el.text.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  let sugg = [], replFrom = 0;
  const t = el.text;
  if (el.type === 'character') {
    sugg = characterNames().filter(n => n.startsWith(t.toUpperCase()) && n !== t.toUpperCase());
    replFrom = 0;
  } else if (el.type === 'scene') {
    const mTime = t.match(/^(.*[–—-]\s+)([A-Z ]*)$/);
    const mLoc = t.match(/^((?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT\.|EXT\.|I\/E\.?|EST\.)\s+)(.*)$/);
    if (mTime) { sugg = TIMES.filter(x => x.startsWith(mTime[2]) && x !== mTime[2]); replFrom = mTime[1].length; }
    else if (mLoc) { sugg = locations().filter(x => x.startsWith(mLoc[2].toUpperCase()) && x !== mLoc[2].toUpperCase()); replFrom = mLoc[1].length; }
    else { sugg = ['INT. ', 'EXT. ', 'INT./EXT. ', 'EST. '].filter(x => x.startsWith(t.toUpperCase()) && t.length > 0); replFrom = 0; }
  } else if (el.type === 'transition') {
    sugg = TRANSITIONS.filter(x => x.startsWith(t.toUpperCase()) && x !== t.toUpperCase()); replFrom = 0;
  } else { if (S.menu?.kind === 'smart') closePops(); return; }
  sugg = sugg.slice(0, 6);
  if (!sugg.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  popup(sugg.map(x => ({ label: x })), { kind: 'smart', onPick: it => {
    const txt = el.text.slice(0, replFrom) + it.label;
    opText(el.id, txt, { el: el.id, off: txt.length });
  }});
}

// ---------- find & replace ----------
const F = { hits: [], at: -1, q: '' };
function findRecompute(){
  const q = $('#findIn').value;
  F.q = q; F.hits = []; F.at = -1;
  if (q.length >= 1) {
    const needle = q.toLowerCase();
    for (const el of S.doc.elements) {
      const hay = el.text.toLowerCase();
      let i = 0;
      while ((i = hay.indexOf(needle, i)) !== -1) { F.hits.push({ id: el.id, off: i, len: q.length }); i += Math.max(1, q.length); }
    }
  }
  $('#findCount').textContent = F.hits.length ? '0 / ' + F.hits.length : (q ? '0 / 0' : '–');
}
function findJump(dir){
  if (!F.hits.length) return;
  F.at = ((F.at + dir) % F.hits.length + F.hits.length) % F.hits.length;
  $('#findCount').textContent = (F.at + 1) + ' / ' + F.hits.length;
  const h = F.hits[F.at];
  // locate the page holding this offset and bring it in
  let pi = -1, hitLine = null;
  outer: for (let i = 0; i < S.res.pages.length; i++)
    for (const l of S.res.pages[i].lines)
      if (l.el === h.id && h.off >= l.off && h.off <= l.off + l.text.length) { pi = i; hitLine = l; break outer; }
  if (pi < 0) return;
  S.pageEls[pi]?.wrap.scrollIntoView({ block: 'center' });
  setTimeout(() => {
    renderPage(pi);
    // select the match (clipped to its first rendered line)
    const pe = S.pageEls[pi];
    for (const d of pe.page?.children || []) {
      if (d.dataset.el !== h.id) continue;
      const start = +d.dataset.off || 0;
      if (h.off < start || h.off > start + d.textContent.length) continue;
      const from = h.off - start;
      const to = Math.min(d.textContent.length, from + h.len);
      const r = document.createRange();
      const walk = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      let acc = 0, n, sN = null, sO = 0, eN = null, eO = 0;
      while ((n = walk.nextNode())) {
        if (!sN && from <= acc + n.length) { sN = n; sO = from - acc; }
        if (to <= acc + n.length) { eN = n; eO = to - acc; break; }
        acc += n.length;
      }
      if (sN && eN) { r.setStart(sN, sO); r.setEnd(eN, eO); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      S.caret = { el: h.id, off: h.off + h.len };
      break;
    }
    status();
  }, 90);
}
function findOpen(){
  $('#findBar').hidden = false;
  const sel = getSelection().toString();
  if (sel && sel.length < 60) $('#findIn').value = sel;
  $('#findIn').focus(); $('#findIn').select();
  findRecompute();
}
function findClose(){ $('#findBar').hidden = true; F.hits = []; F.at = -1; pagesEl.focus(); }
function replaceCurrent(){
  if (inReader()) { toast('reader — no edits'); return; }
  if (F.at < 0 || !F.hits[F.at]) { findJump(1); return; }
  const h = F.hits[F.at];
  const el = elById(h.id); if (!el) return;
  const rep = $('#replIn').value;
  opText(el.id, el.text.slice(0, h.off) + rep + el.text.slice(h.off + h.len), { el: el.id, off: h.off + rep.length });
  const wasAt = F.at;
  findRecompute();
  F.at = Math.min(wasAt - 1, F.hits.length - 1);
  findJump(1);
}
function replaceAll(){
  if (inReader()) { toast('reader — no edits'); return; }
  if (!F.q || !F.hits.length) return;
  const rep = $('#replIn').value;
  const needle = F.q.toLowerCase();
  const changes = [];
  for (const el of S.doc.elements) {
    const hay = el.text.toLowerCase();
    if (!hay.includes(needle)) continue;
    let out = '', i = 0, j;
    while ((j = hay.indexOf(needle, i)) !== -1) { out += el.text.slice(i, j) + rep; i = j + F.q.length; }
    out += el.text.slice(i);
    changes.push({ id: el.id, text: out });
  }
  const n = F.hits.length;
  opTexts(changes);
  findRecompute();
  toast(n + ' replaced');
}

// ---------- draft mode: named drafts, stored inside the document ----------
function draftsOf(){ if (!Array.isArray(S.doc.drafts)) S.doc.drafts = []; return S.doc.drafts; }

function restoreDraft(dr){

  toast('restored · ' + dr.name);
}

// per-scene comparison: segment both versions by slugline, diff scene text
function sceneMapOf(els){
  const map = new Map(); const order = [];
  let cur = { slug: '— before the first slugline —', texts: [] }, seen = new Map();
  const push = () => {
    if (!cur.texts.length && !map.size && cur.slug.startsWith('—')) return;
    const n = (seen.get(cur.slug) || 0) + 1; seen.set(cur.slug, n);
    const key = cur.slug + (n > 1 ? ' (' + n + ')' : '');
    map.set(key, cur.texts.join('\n')); order.push(key);
  };
  for (const e of els) {
    if (e.type === 'scene') { push(); cur = { slug: e.text || '(blank slugline)', texts: [] }; }
    else cur.texts.push(e.type + ': ' + e.text);
  }
  push();
  return { map, order };
}

function compareDraft(dr){
  const A = sceneMapOf(dr.elements), B = sceneMapOf(S.doc.elements);
  const keys = [...new Set([...A.order, ...B.order])];
  let changed = 0, added = 0, removed = 0;
  const rows = keys.map(k => {
    const a = A.map.get(k), b = B.map.get(k);
    let st;
    if (a == null) { st = 'added'; added++; }
    else if (b == null) { st = 'removed'; removed++; }
    else if (a !== b) { st = 'changed'; changed++; }
    else st = 'same';
    return { k, st, a, b };
  });
  const esc2 = t => (t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  overlayCard('<h2>' + esc2(dr.name) + ' → current</h2>' +
    '<div class="sub">' + changed + ' changed · ' + added + ' added · ' + removed + ' removed · ' + (rows.length - changed - added - removed) + ' untouched</div>' +
    '<div id="cmpList">' + rows.filter(r => r.st !== 'same').map((r, i) =>
      '<div class="cmp-row" data-i="' + i + '"><span class="cmp-st cmp-' + r.st + '">' + r.st + '</span> <span class="cmp-slug">' + esc2(r.k) + '</span>' +
      '<div class="cmp-body" hidden><div class="cmp-col"><h4>' + esc2(dr.name) + '</h4><pre>' + esc2(r.a || '—') + '</pre></div>' +
      '<div class="cmp-col"><h4>current</h4><pre>' + esc2(r.b || '—') + '</pre></div></div></div>').join('') +
    (rows.some(r => r.st !== 'same') ? '' : '<p>Identical — nothing has changed since this draft.</p>') + '</div>' +
    '<div class="foot"><button class="hbtn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">close</button></div>');
  document.querySelectorAll('.cmp-row').forEach(rw => {
    rw.addEventListener('mousedown', ev => {
      if (ev.target.closest('.cmp-body')) return;
      ev.preventDefault();
      const b = rw.querySelector('.cmp-body'); b.hidden = !b.hidden;
    });
  });
}

// ---------- rail / status ----------
function rail(){
  const dl = $('#docList');
  // Where every row sits BEFORE the rebuild. After it, any row that has moved is
  // animated from its old place to its new one, so a delete, a drag or a pin visibly
  // settles instead of the list snapping to a different shape. Web Animations rather
  // than a transition: nothing is left behind on the element, and it needs no rAF.
  const wasAt = new Map();
  for (const n of dl.querySelectorAll('.doc-item[data-doc]'))
    wasAt.set(n.dataset.doc, n.getBoundingClientRect().top);
  dl.innerHTML = '';
  const pinned = new Set(LS.get('pica.ui', {}).pinned || []);
  const archived = new Set(LS.get('pica.ui', {}).archived || []);
  const all = store.index().slice().sort((a, b) =>
    (pinned.has(b.id) ? 1 : 0) - (pinned.has(a.id) ? 1 : 0));
  const list = all.filter(d => !archived.has(d.id));
  const shelf = all.filter(d => archived.has(d.id));
  for (const d of list.concat(shelf.length ? [{ __shelf: shelf }] : [])) {
    if (d.__shelf) {
      const eb = document.createElement('button');
      eb.className = 'eyebrow';
      eb.textContent = 'Archive · ' + d.__shelf.length;
      const wrap = document.createElement('div');
      wrap.hidden = !(LS.get('pica.ui', {}).collapse || {}).archOpen;
      eb.addEventListener('mousedown', ev => {
        ev.preventDefault();
        wrap.hidden = !wrap.hidden;
        const u = LS.get('pica.ui', {});
        u.collapse = Object.assign({}, u.collapse, { archOpen: !wrap.hidden });
        LS.set('pica.ui', u);
      });
      dl.appendChild(eb); dl.appendChild(wrap);
      for (const a of d.__shelf) dl.__shelfWrap = wrap, addDocRow(a, wrap, pinned, true);
      continue;
    }
    addDocRow(d, dl, pinned, false);
  }
  function addDocRow(d, host, pinned, inShelf) {
    const b = document.createElement('button');
    b.className = 'doc-item' + (d.id === S.docId ? ' current' : '');
    b.innerHTML = '<span class="ttl"></span><span class="pg"></span>';
    b.firstChild.textContent = (pinned.has(d.id) ? '• ' : '') + (d.title || 'Untitled');
    b.firstChild.style.opacity = inShelf ? '.55' : '';
    b.lastChild.textContent = d.pages ? d.pages + 'p' : '';
    b.addEventListener('mousedown', ev => { if (ev.button !== 0) return; if (d.id !== S.docId) openDoc(d.id); });
    // the row the menu belongs to says so, so a Delete can never land on the wrong script
    b.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      docMenu(d, ev);            // opens the popup, which clears any previous mark…
      b.classList.add('menuing');  // …so this row marks itself afterwards
    });
    // drag to reorder — the index array IS the manual order
    b.draggable = true;
    b.addEventListener('dragstart', ev => {
      ev.dataTransfer.setData('text/pica-doc', d.id);
      ev.dataTransfer.effectAllowed = 'move';
      b.classList.add('dragging');
    });
    b.addEventListener('dragend', () => b.classList.remove('dragging'));
    b.addEventListener('dragover', ev => {
      ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
      const r = b.getBoundingClientRect();
      b.classList.toggle('drop-above', ev.clientY < r.top + r.height / 2);
      b.classList.toggle('drop-below', ev.clientY >= r.top + r.height / 2);
    });
    b.addEventListener('dragleave', () => b.classList.remove('drop-above', 'drop-below'));
    b.addEventListener('drop', ev => {
      ev.preventDefault();
      const below = b.classList.contains('drop-below');
      b.classList.remove('drop-above', 'drop-below');
      const src = ev.dataTransfer.getData('text/pica-doc');
      if (!src || src === d.id) return;
      const ix = store.index();
      const from = ix.findIndex(x => x.id === src);
      if (from < 0) return;
      const [moved] = ix.splice(from, 1);
      let to = ix.findIndex(x => x.id === d.id);
      if (below) to += 1;
      ix.splice(to, 0, moved);
      store.saveIndex(ix);
      rail();
    });
    b.dataset.doc = d.id;
    host.appendChild(b);
  }
  // the list settles into its new shape rather than jumping to it
  if (wasAt.size && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (const n of dl.querySelectorAll('.doc-item[data-doc]')) {
      const before = wasAt.get(n.dataset.doc);
      if (before == null) {                        // a row that wasn't there: fade it in
        if (n.animate) n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
        continue;
      }
      const dy = before - n.getBoundingClientRect().top;
      if (Math.abs(dy) > 0.5 && n.animate)
        n.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }],
          { duration: 220, easing: 'cubic-bezier(.22,.61,.36,1)' });
    }
  }
  // characters: base name + cue count; click jumps to their next cue
  const cl = $('#charList');
  cl.innerHTML = '';
  const counts = new Map();
  for (const e of S.doc.elements) if (e.type === 'character') {
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base) counts.set(base, (counts.get(base) || 0) + 1);
  }
  for (const [name, cnt] of [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 40)) {
    const b = document.createElement('button');
    b.className = 'scene-item';
    b.innerHTML = '<span class="sl"></span><span class="pg" style="margin-left:auto"></span>';
    b.firstChild.textContent = name;
    b.lastChild.textContent = cnt;
    b.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      // next cue for this name after the caret, wrapping
      const start = S.caret && !S.caret.el.startsWith('title:') ? elIndex(S.caret.el) : -1;
      const idx = S.doc.elements.findIndex((e, i) => i > start && e.type === 'character'
        && e.text.replace(/\s*\([^)]*\)\s*$/, '').trim() === name);
      const j = idx >= 0 ? idx : S.doc.elements.findIndex(e => e.type === 'character'
        && e.text.replace(/\s*\([^)]*\)\s*$/, '').trim() === name);
      if (j < 0) return;
      const el = S.doc.elements[j];
      let pi = -1;
      outer: for (let i = 0; i < S.res.pages.length; i++)
        for (const l of S.res.pages[i].lines) if (l.el === el.id) { pi = i; break outer; }
      if (pi >= 0) {
        S.pageEls[pi]?.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        S.caret = { el: el.id, off: el.text.length };
        setTimeout(() => { renderAllVisible(); restoreCaret(); status(); }, 80);
      }
    });
    cl.appendChild(b);
  }

  // fold state: click an eyebrow, the list disappears; click again, it returns
  const coll = LS.get('pica.ui', {}).collapse || {};
  $('#docList').hidden = !!coll.index;
  $('#sceneList').hidden = !!coll.scenes;
  $('#charList').hidden = !!coll.chars;

  const sl = $('#sceneList');
  sl.innerHTML = '';
  let n = 0;
  const seen = new Set();
  for (let i = 0; i < S.res.pages.length; i++) for (const l of S.res.pages[i].lines) {
    if (l.kind !== 'scene' || seen.has(l.el) ) continue;
    seen.add(l.el);
    n++;
    const b = document.createElement('button');
    b.className = 'scene-item';
    b.dataset.el = l.el;
    b.innerHTML = '<span class="no"></span><span class="sl"></span>';
    b.firstChild.textContent = n;
    b.lastChild.textContent = l.text;
    const pi = i, elid = l.el;
    b.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      S.pageEls[pi]?.wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      S.caret = { el: elid, off: 0 };
      setTimeout(() => { renderAllVisible(); restoreCaret(); status(); }, 60);
      $('#rail').classList.remove('open');
    });
    sl.appendChild(b);
  }
}

// right-click a script in the index
function docMenu(d, ev){
  const ui = LS.get('pica.ui', {});
  const pinned = new Set(ui.pinned || []);
  const isPinned = pinned.has(d.id);
  const savePinned = () => { ui.pinned = [...pinned]; LS.set('pica.ui', ui); };
  const items = [
    { label: 'Rename…', act: 'rename' },
    { label: 'Duplicate', act: 'dup' },
    { label: 'New with this layout', act: 'newlike' },
    { label: isPinned ? 'Unpin' : 'Pin to top', act: 'pin' },
    { label: (LS.get('pica.ui', {}).archived || []).includes(d.id) ? 'Unarchive' : 'Archive', act: 'arch' },
    { label: 'Export JSON', act: 'json' },
    { label: 'Delete…', act: 'del' },
  ];
  popupAt(items, ev.clientX, ev.clientY, (it) => {
    if (it.act === 'rename') {
      const name = prompt('Rename script', d.title || 'UNTITLED');
      if (name == null) return;
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (!doc) return;
      doc.title = name.trim() || 'UNTITLED';
      if (doc.titlePage && doc.titlePage[0]) doc.titlePage[0].text = doc.title.toUpperCase();
      store.save(d.id, doc);
      if (d.id === S.docId) { S.doc = doc; $('#docTitle').textContent = doc.title; repaginate(); renderAfterEdit(); }
      rail(); toast('renamed');
      })();
    } else if (it.act === 'dup') {
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (!doc) return;
      const copy = JSON.parse(JSON.stringify(doc));
      copy.title = (doc.title || 'UNTITLED') + ' copy';
      copy.elements = copy.elements.map(e => ({ ...e, id: E.uid() }));
      // storyboard images are separate idb records — re-key and copy them, or the
      // twin docs would share images and deleting a panel in one would blind the other
      for (const el of copy.elements) if (el.panels) for (const pn of el.panels) {
        const ok = pn.imgKey, nk = E.uid();
        pn.imgKey = nk; pn.id = E.uid();
        idb.get('img.' + ok).then(v => { if (v != null) return idb.put('img.' + nk, v); }).catch(() => {});
      }
      const id = E.uid();
      store.save(id, copy);
      openDoc(id); toast('duplicated');
      })();
    } else if (it.act === 'newlike') {
      // transcribing an import needs ITS margins, not the blank default's — a
      // fresh script that wraps exactly where the source wraps
      (async () => {
        const src = d.id === S.docId ? S.doc : await store.load(d.id);
        if (!src) return;
        const nd = E.newDoc('UNTITLED');
        nd.layout = JSON.parse(JSON.stringify(src.layout));
        delete nd.layout.revX;
        const id = E.uid();
        store.save(id, nd);
        openDoc(id);
        toast('new script — wraps like “' + (src.title || 'source') + '”');
      })();
    } else if (it.act === 'pin') {
      if (isPinned) pinned.delete(d.id); else pinned.add(d.id);
      savePinned(); rail(); toast(isPinned ? 'unpinned' : 'pinned');
    } else if (it.act === 'arch') {
      const u = LS.get('pica.ui', {});
      const set = new Set(u.archived || []);
      const was = set.has(d.id);
      was ? set.delete(d.id) : set.add(d.id);
      u.archived = [...set]; LS.set('pica.ui', u);
      rail(); toast(was ? 'unarchived' : 'archived');
    } else if (it.act === 'json') {
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (doc) download((doc.title || 'script').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json',
                        JSON.stringify(doc, null, 1), 'application/json');
      })();
    } else if (it.act === 'del') {
      // a script is never removed without saying so, and never silently
      if (!confirm('Delete “' + (d.title || 'UNTITLED') + '”?\n\nThis removes it from PICA on this device. Export it first if you want to keep a copy.')) return;
      store.gone.add(d.id);            // no pending or later write may resurrect it
      const ix = store.index().filter(x => x.id !== d.id);
      store.saveIndex(ix);
      store.cache.delete(d.id);
      if (d.id === S.docId) { clearTimeout(S.saveTimer); S.saveTimer = null; }
      idb.del('doc.' + d.id); idb.del('snap.' + d.id);
      try { localStorage.removeItem('pica.doc.' + d.id); localStorage.removeItem('pica.snap.' + d.id); } catch {}
      pinned.delete(d.id); savePinned();
      // scrub the satellites too, or the id haunts the app: a stale lastDoc used
      // to resurrect at boot as a saved UNTITLED
      { const u = LS.get('pica.ui', {}); if (u.lastDoc === d.id) { delete u.lastDoc; LS.set('pica.ui', u); }
        const sc = LS.get('pica.scroll', {}); if (sc[d.id] != null) { delete sc[d.id]; LS.set('pica.scroll', sc); }
        const em = LS.get('pica.emergency', null); if (em && em.id === d.id) { try { localStorage.removeItem('pica.emergency'); } catch {} } }
      if (d.id === S.docId) {
        const next = ix[0] && ix[0].id;
        if (next) openDoc(next);
        else { const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); }
      }
      rail(); toast('deleted');
    }
  });
}
