// ---------- reading a script nobody typed ----------
// A scan usually carries a hidden text layer somebody else's OCR left behind, and the
// importer reads that. Some scans carry nothing at all — The Hateful Eight is 168
// photographs of paper and two fonts, both on the cover. There is no text to find.
//
// So the words are read off the picture. The Mac's own text recogniser does it, in the
// app, offline; what comes back is shaped exactly like a PDF's own text layer — string,
// position, width, in page points — so the importer never learns where it came from and
// every rule about columns, cues and continueds applies unchanged.
const OCR_JOBS = new Map();
function ocrAvailable(){ return !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pica) || !!S.ocrStub; }
function b64of(bytes){
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
// Returns [{page,width,height,items:[{x,y,w,str,conf}]}] or null if nothing can read it.
async function readByEye(bytes, pages, log){
  if (S.ocrStub) return await S.ocrStub(pages);
  const mh = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pica;
  if (!mh || !bytes) return null;
  const token = 'ocr' + Math.random().toString(36).slice(2, 10);
  return await new Promise(resolve => {
    // a script this long is minutes of work at worst; give up rather than hang forever
    const bail = setTimeout(() => { OCR_JOBS.delete(token); resolve(null); }, 12 * 60e3);
    OCR_JOBS.set(token, {
      progress: (d, t) => log('reading page ' + d + ' / ' + t + ' by eye…'),
      done: async url => {
        clearTimeout(bail); OCR_JOBS.delete(token);
        try { resolve(await (await fetch(url)).json()); } catch { resolve(null); }
      },
    });
    log('no text in this file — reading it by eye…');
    mh.postMessage({ ocr: { token, pages, data: b64of(bytes) } });
  });
}
// ── the same word, read four different ways ────────────────────────────────────────
// A recogniser is not wrong so much as inconsistent. Across The Hateful Eight one
// character's cue comes back as MAJ.WARREN 85 times, MAJ-WARREN 60, MAJ. WARREN 39 and
// MAJ- WARREN 5 — the same name, the period read as a hyphen. Another is O.B., o.B. and
// 0.В. (that В is Cyrillic), and the two lower-case readings stop it being a cue at all,
// because a cue is capitals.
//
// The script itself is the dictionary. A line that repeats is a line we have several
// readings of, and they can be made to agree: strip everything but the letters, put the
// readings that came back in clean capitals to a vote, and let the winner stand for all
// of them. Nothing is invented — a spelling can only ever be replaced by one the
// recogniser itself produced elsewhere in the same document, more often, more cleanly.
const OCR_LOOKALIKE = {
  'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','У':'Y','Х':'X','І':'I','Ј':'J','Ѕ':'S',
  'Α':'A','Β':'B','Ε':'E','Ζ':'Z','Η':'H','Ι':'I','Κ':'K','Μ':'M','Ν':'N','Ο':'O','Ρ':'P','Τ':'T','Υ':'Y','Χ':'X',
};
const ocrLatin = s => s.replace(/[^\x00-\x7F]/g, c => OCR_LOOKALIKE[c] || c);
// what two readings of the same words have in common: the letters, and nothing else
const ocrKey = s => ocrLatin(s).toUpperCase().replace(/[^A-Z0-9]/g, '')
  .replace(/0/g, 'O').replace(/1/g, 'I').replace(/5/g, 'S');
// capitals, digits and punctuation — how a cue, a slug or a transition is actually typed
const ocrClean = s => /^[A-Z0-9 .,:;'’()\[\]#&*/-]+$/.test(ocrLatin(s)) && /[A-Z]/.test(ocrLatin(s));
const ocrShouted = s => {
  const letters = ocrLatin(s).replace(/[^A-Za-z]/g, '');
  if (!letters) return false;
  return letters.replace(/[^A-Z]/g, '').length >= letters.length * 0.5;
};
function repairByConsensus(pages){
  // the letters test has to be applied to the LATIN reading of the string: "0.В." is
  // O.B. with a Cyrillic B and a zero, and contains no [A-Za-z] at all
  const eligible = t => t.length <= 28 && t.split(/\s+/).length <= 4
    && /[A-Za-z]/.test(ocrLatin(t)) && ocrKey(t).length >= 2;
  const votes = new Map();                       // letters-only key → spelling → count
  for (const pg of pages) for (const it of pg.items || []) {
    const t = it.str.trim();
    if (!eligible(t) || !ocrClean(t)) continue;
    const k = ocrKey(t);
    if (!votes.has(k)) votes.set(k, new Map());
    const m = votes.get(k);
    m.set(t, (m.get(t) || 0) + 1);
  }
  const winner = new Map();
  for (const [k, m] of votes) {
    let best = null, bestN = 0;
    for (const [t, n] of m) if (n > bestN) { best = t; bestN = n; }
    if (best) winner.set(k, best);
  }
  let fixed = 0;
  for (const pg of pages) for (const it of pg.items || []) {
    const t = it.str.trim();
    if (!eligible(t)) continue;
    const w = winner.get(ocrKey(t));
    // A muddled reading is only corrected if it was already trying to be capitals —
    // otherwise a line of dialogue reading "and" would be shouted into an "AND"
    // that exists somewhere else in the script.
    if (!w || w === t || (!ocrClean(t) && !ocrShouted(t))) continue;
    it.str = w; fixed++;
  }
  return fixed;
}

// Recognised lines → the same items pdf.js would have produced.
function itemsFromOCR(page){
  return (page.items || []).filter(i => {
    const t = (i.str || '').trim();
    // A speck on the paper, the edge of a staple hole, one end of a rule: the recogniser
    // offers it as a dash or a dot, standing on its own out in the margin. It is not
    // writing, and as an element it is a blank line in the middle of a scene.
    return t && /[A-Za-z0-9]/.test(t);
  }).map(i => ({ x: i.x, y: i.y, w: i.w, str: i.str, font: 'OCR', fs: 0 }));
}

// ---------- import ----------
async function importPdfBuffer(buf, name, opts){
  opts = opts || {};
  if (!opts.quiet) overlayCard(`<h2>Importing</h2><div class="sub">${(name || 'pdf').replace(/</g,'&lt;')}</div><div id="importLog">reading…</div>`);
  const log = m => { const n = $('#importLog'); if (n) n.textContent = m; };
  try {
    // PICA.app bundles pdf.js so import works with no network; the web build uses the CDN.
    let mod, workerSrc;
    try {
      mod = await import('./vendor/pdf.min.mjs');
      workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href;
    } catch {
      mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs');
      workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs';
    }
    mod.GlobalWorkerOptions.workerSrc = workerSrc;
    // pdf.js hands the bytes to its worker and they are gone from here; keep a copy in
    // case the file turns out to be a picture that has to be read by eye.
    const ocrBytes = ocrAvailable() ? new Uint8Array(buf.slice(0)) : null;
    const base = workerSrc.replace(/pdf\.worker\.min\.mjs$/, '');
    const pdf = await mod.getDocument({
      data: buf,
      standardFontDataUrl: base.startsWith('http') ? base.replace(/build\/$/, 'standard_fonts/') : undefined,
    }).promise;
    const raw = [];
    let badPages = 0, rasterOk = true;
    // font style by name (Bold/Italic faces), cached per font id
    const styleCache = new Map();
    // pdf.js exposes Util.transform; multiply by hand if this build does not.
    const xform = (a, b) => (mod.Util && mod.Util.transform) ? mod.Util.transform(a, b) : [
      a[0] * b[0] + a[2] * b[1], a[1] * b[0] + a[3] * b[1],
      a[0] * b[2] + a[2] * b[3], a[1] * b[2] + a[3] * b[3],
      a[0] * b[4] + a[2] * b[5] + a[4], a[1] * b[4] + a[3] * b[5] + a[5],
    ];
    const styleOf = (page, fn) => {
      if (styleCache.has(fn)) return styleCache.get(fn);
      let v = 0;
      try {
        const f = page.commonObjs.get(fn);
        const nm = (f && f.name) || '';
        if (/bold|black|heavy/i.test(nm)) v |= 1;
        if (/ital|obli/i.test(nm)) v |= 2;
      } catch {}
      styleCache.set(fn, v);
      return v;
    };
    // Some scripts are not typeset files at all: There Will Be Blood is a SCAN — a
    // page image with a hidden OCR text layer (font "HiddenHorzOCR") and not one
    // vector path on the page. Its underlines are pixels, so no amount of walking the
    // operator list will ever find them. For those pages, render the image and read
    // the rules straight off it: an underline is a run of dark pixels that is long
    // and thin, which is exactly what a row of text is not.
    const rasterCanvas = document.createElement('canvas');
    const RS = 2;                                   // render scale: a 1pt rule → 2px
    const underlinesFromRaster = async (page, vp) => {
      const w = Math.ceil(vp.width * RS), h = Math.ceil(vp.height * RS);
      rasterCanvas.width = w; rasterCanvas.height = h;
      const ctx = rasterCanvas.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      await page.render({ canvasContext: ctx, viewport: page.getViewport({ scale: RS }) }).promise;
      const px = ctx.getImageData(0, 0, w, h).data;
      const minLen = Math.round(10 * RS), maxLen = Math.round(vp.width * 0.85 * RS);
      // horizontal runs of dark pixels, row by row
      const runs = [];
      for (let y = 0; y < h; y++) {
        let start = -1;
        const row = y * w;
        for (let x = 0; x <= w; x++) {
          const i = (row + x) * 4;
          const dark = x < w && (px[i] + px[i + 1] + px[i + 2]) < 450;
          if (dark) { if (start < 0) start = x; }
          else if (start >= 0) {
            const len = x - start;
            if (len >= minLen && len <= maxLen) runs.push({ y, x1: start, x2: x });
            start = -1;
          }
        }
      }
      // stack overlapping runs from consecutive rows: a rule stays thin, a line of
      // text grows into a band as tall as its type and is thrown away
      const bands = [];
      for (const r of runs) {
        let into = null;
        for (let i = bands.length - 1; i >= 0; i--) {
          const b = bands[i];
          if (b.y2 < r.y - 1 || r.x1 >= b.x2 + 1 || r.x2 <= b.x1 - 1) continue;
          if (into) {                              // this run bridges two bands: fuse them
            into.y1 = Math.min(into.y1, b.y1); into.y2 = Math.max(into.y2, b.y2);
            into.x1 = Math.min(into.x1, b.x1); into.x2 = Math.max(into.x2, b.x2);
            bands.splice(i, 1);
          } else {
            b.y1 = Math.min(b.y1, r.y); b.y2 = Math.max(b.y2, r.y);
            b.x1 = Math.min(b.x1, r.x1); b.x2 = Math.max(b.x2, r.x2);
            into = b;
          }
        }
        if (!into) bands.push({ y1: r.y, y2: r.y, x1: r.x1, x2: r.x2 });
      }
      const maxThick = Math.round(3 * RS);
      return bands.filter(b => b.y2 - b.y1 <= maxThick)
        .map(b => ({ x1: b.x1 / RS, x2: b.x2 / RS, y: b.y1 / RS }));
    };

    // underlines are DRAWN, not encoded: walk the operator list for thin horizontal
    // ink (fill/stroke, never clip) with the transform tracked, in page space
    const OPS = mod.OPS;
    const INK = new Set([OPS.fill, OPS.eoFill, OPS.stroke, OPS.fillStroke, OPS.eoFillStroke, OPS.closeStroke, OPS.closeFillStroke, OPS.closeEOFillStroke].filter(x => x != null));
    const underlinesFrom = (ol, vp) => {
      const out = [];
      let ctm = vp.transform.slice(); const stack = [];   // page space, rotation and all
      const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
      for (let i = 0; i < ol.fnArray.length; i++) {
        const fn = ol.fnArray[i];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || vp.transform.slice();
        else if (fn === OPS.transform) ctm = mul(ctm, ol.argsArray[i]);
        else if (fn === OPS.constructPath && INK.has(ol.fnArray[i + 1])) {
          const [ops, co] = ol.argsArray[i];
          let ci = 0, cur = null;
          const seg = (x1, y1, x2, y2) => {
            const tx1 = ctm[0]*x1 + ctm[2]*y1 + ctm[4], ty1 = ctm[1]*x1 + ctm[3]*y1 + ctm[5];
            const tx2 = ctm[0]*x2 + ctm[2]*y2 + ctm[4], ty2 = ctm[1]*x2 + ctm[3]*y2 + ctm[5];
            if (Math.abs(ty2 - ty1) < 2.6 && Math.abs(tx2 - tx1) > 4 && Math.abs(tx2 - tx1) < vp.width * 0.85)
              out.push({ x1: Math.min(tx1, tx2), x2: Math.max(tx1, tx2), y: Math.min(ty1, ty2) });
          };
          for (const op of ops) {
            if (op === OPS.moveTo) { cur = [co[ci], co[ci + 1]]; ci += 2; }
            else if (op === OPS.lineTo) { if (cur) seg(cur[0], cur[1], co[ci], co[ci + 1]); cur = [co[ci], co[ci + 1]]; ci += 2; }
            else if (op === OPS.rectangle) { seg(co[ci], co[ci + 1], co[ci] + co[ci + 2], co[ci + 1] + co[ci + 3]); ci += 4; }
            else if (op === OPS.curveTo) ci += 6;
            else if (op === OPS.curveTo2 || op === OPS.curveTo3) ci += 4;
          }
        }
      }
      return out;
    };
    for (let p = 1; p <= pdf.numPages; p++) {
      // one unreadable page must cost one page, never the whole script
      try {
        const page = await pdf.getPage(p);
        const vp = page.getViewport({ scale: 1 });
        let ul = [], hasImg = false;
        try {
          const ol = await page.getOperatorList();
          ul = underlinesFrom(ol, vp);
          // Every way pdf.js says "a picture was painted here". The Hateful Eight's pages
          // are JBIG2 — one bit per pixel — and those arrive as image MASKS, which this
          // list did not have. The app therefore never noticed the file was a photograph
          // and imported its cover page alone: three elements out of a hundred and sixty
          // eight pages. The build in the browser and the build in the app disagreed
          // about the op, which is why it passed everywhere except where it mattered.
          hasImg = ol.fnArray.some(f => f === OPS.paintImageXObject || f === OPS.paintJpegXObject
            || f === OPS.paintImageMaskXObject || f === OPS.paintInlineImageXObject
            || f === OPS.paintImageXObjectRepeat || f === OPS.paintImageMaskXObjectRepeat
            || f === OPS.paintImageMaskXObjectGroup || f === OPS.paintInlineImageXObjectGroup);
          // a scanned page draws an image and no ink at all — read its rules off the
          // pixels instead, or the script imports with every underline missing.
          //
          // Time-boxed, and abandoned for the whole document the first time it overruns:
          // drawing a page needs a page that is actually being drawn, and in a window
          // that is not on screen the render simply never finishes. An import must not
          // hang because the underlines could not be measured — they are the smallest
          // thing on the page, and the script is the point.
          if (!ul.length && hasImg && rasterOk) {
            const got = await Promise.race([
              underlinesFromRaster(page, vp).then(v => v || []).catch(() => []),
              new Promise(res => setTimeout(() => res(null), 4000)),
            ]);
            if (got === null) rasterOk = false; else ul = got;
          }
        } catch {}
        const tc = await page.getTextContent();
        raw.push({
          width: vp.width, height: vp.height, ul, hasImg,
          // Text arrives in the PDF's own space. Putting it through the VIEWPORT transform
          // is what turns it into where the ink is on the page — it carries the page's
          // rotation and any mediaBox offset. Reading transform[4]/[5] raw is only right
          // for an unrotated page: LA Confidential and Lost in Translation are both
          // scanned at /Rotate 180, so their x came out mirrored (a slugline at 76pt read
          // as 536pt) and their y upside down. Nothing classified.
          items: tc.items.filter(i => i.str && i.str.length).map(i => {
            const m = xform(vp.transform, i.transform);
            return { x: m[4], y: m[5], w: i.width, str: i.str, font: i.fontName,
                     fs: styleOf(page, i.fontName) };
          }),
        });
      } catch (pageErr) {
        badPages++;
        raw.push({ width: raw[0]?.width || 612, height: raw[0]?.height || 792, items: [] });
      }
      if (p % 10 === 0 || p === pdf.numPages) log('reading page ' + p + ' / ' + pdf.numPages + ' …');
    }
    // Pages that are a picture and nothing else. The Hateful Eight's cover page carries
    // the only two fonts in the file, so "does this document have any text?" is the wrong
    // question — it is asked one page at a time.
    // …AND THE REAL TEST IS SIMPLER THAN THAT: a page with no words on it has no words on
    // it, whatever operators drew it. Naming the ways a picture can be painted is a list
    // that can always be missing an entry — this cannot. A page is offered to the
    // recogniser when it came back with (almost) nothing, and the document is treated as
    // a photographed one when most of it did: an ordinary script has no blank pages, and
    // a genuinely empty page costs a second and reads back as empty.
    const textless = raw.map((p, i) => (p.items.length < 3 ? i + 1 : 0)).filter(Boolean);
    const mostlyPictures = textless.length >= Math.max(3, raw.length * 0.2);
    const unread = mostlyPictures ? textless
      : raw.map((p, i) => (p.hasImg && p.items.length < 3 ? i + 1 : 0)).filter(Boolean);
    if (unread.length) {
      const seen = await readByEye(ocrBytes, unread, log);
      if (seen && seen.length) repairByConsensus(seen);
      if (seen) for (const pg of seen) {
        const r = raw[pg.page - 1];
        if (!r || !pg.items || !pg.items.length) continue;
        // the recogniser measured the page itself; trust its size over the media box,
        // which on a rotated scan describes the paper before it was turned
        r.width = pg.width; r.height = pg.height;
        r.items = itemsFromOCR(pg);
        r.ocr = true;
      }
      const stillBlank = unread.filter(n => !raw[n - 1].items.length).length;
      if (stillBlank && stillBlank === unread.length)
        throw new Error(ocrAvailable()
          ? 'this scan could not be read'
          : 'this PDF is a scan with no text in it — open it in PICA for Mac, which reads the page itself');
    }
    if (!raw.some(p => p.items.length)) throw new Error('no text layer — this looks like a scanned PDF');
    log('classifying…');
    await new Promise(r => setTimeout(r, 30));
    // measured exactly, then conformed — an import is Final Draft typeset, always
    const doc = E.toFinalDraft(E.importPdf(raw));
    doc.src = 'pdf';
    if (!doc.elements.some(e => e.text.trim() !== '')) throw new Error('nothing readable came out of this PDF');
    const fileTitle = titleFromFilename(name, 'pdf');
    // A COVER IS NOT A TITLE PAGE. The Hateful Eight's first page is an awards mailing:
    // FOR YOUR CONSIDERATION over the name, over BEST ORIGINAL SCREENPLAY. Read as a
    // title page it names the script "FOR YOUR CONSIDERATION" — and the typewriter
    // letter-spaces it, so it arrives as "F O R  Y O U R …" and survives every test for
    // garbled text, because those are all real letters.
    const squished = (doc.title || '').replace(/\s+/g, '').toUpperCase();
    if (/^(FORYOURCONSIDERATION|BEST(ORIGINAL|ADAPTED)?SCREENPLAY|ACADEMYAWARD|SCREENPLAYBY|WRITTENBY)/.test(squished))
      doc.title = '';
    // A word on the cover that the recogniser was unsure of can be checked against the
    // one witness that never misreads: the file's own name. HATEFUL EICHT on the page,
    // "The Hateful Eight.pdf" on disk — one letter apart, and the disk is right.
    if (doc.__read && doc.__read.ocr && doc.titlePage) {
      const known = fileTitle.split(/\s+/).filter(w => w.length >= 4);
      const near = (a, b) => {                       // same length, one letter different
        if (a.length !== b.length) return false;
        let d = 0;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++d > 1) return false;
        return d === 1;
      };
      for (const t of doc.titlePage) {
        if (!t.text) continue;
        t.text = t.text.split(/(\s+)/).map(w => {
          const up = w.toUpperCase();
          const hit = known.find(k => near(k, up));
          return hit ? (w === up ? hit : hit[0] + hit.slice(1).toLowerCase()) : w;
        }).join('');
      }
    }
    // a garbled or missing title (tiny unmapped title-page fonts) falls back to the filename
    const junk = (doc.title || '').replace(/[A-Za-z0-9\s.,:'!?&-]/g, '').length;
    // 'UNTITLED' counts as no title: it is the placeholder the importer falls back to when
    // it finds no title page, and leaving it there means a script called UNTITLED forever.
    // A title-page-less script usually opens on its own name in capitals — Some Like It
    // Hot does — so prefer that, then the filename.
    if (!doc.title || doc.title === 'UNTITLED' || junk > (doc.title.length * 0.3)) {
      const head = (doc.elements[0] || {}).text || '';
      const shouted = head.trim();
      // a title page often prints the name in quotes — they are not part of the title
      const bare = shouted.replace(/^["“”'']+|["“”'']+$/g, '').replace(/\s+/g, ' ').trim();
      // The opening line is only the title if it READS like one. The Social Network's copy
      // opens "FROM THE BLACK WE HEAR--", which is a stage direction, not a name: a title
      // does not trail off, end in punctuation, or describe a shot.
      const titleish = bare && bare.length <= 45 && !bare.includes('\n')
        && /[A-Z]/.test(bare) && bare === bare.toUpperCase()
        && /[A-Z0-9)]$/.test(bare) && !/--|\.\.\./.test(bare)
        && !E.SCENE_RE.test(bare) && !/\b(WE |CAMERA|ANGLE|FADE|CUT|DISSOLVE|INT|EXT)\b/.test(bare);
      doc.title = titleish ? bare : fileTitle;
    }
    if (badPages) doc.importNote = (doc.importNote ? doc.importNote + ' · ' : '') + badPages + ' unreadable page(s) skipped';
    const id = E.uid();
    if (opts.trial) { store.trials.add(id); S.trial = { id, prev: S.docId }; }
    store.save(id, doc);
    if (opts.trial) store.cache.set(id, doc);          // openDoc reads it from here
    closeOverlay();
    // wait for it to open: the toast reads S.res, and unawaited it reported the
    // page count of the script that was on screen BEFORE the import
    await openDoc(id);
    if (opts.trial) return { id, doc, pages: S.res.count };
    toast(doc.importNote
      ? 'imported · ' + S.res.count + ' pages · ' + doc.importNote
      : 'imported · ' + S.res.count + ' pages · ' + doc.elements.length + ' elements');
  } catch (err) {
    if (opts.trial) { S.trial = null; throw err; }     // the caller tries the next one
    overlayCard(`<h2>Import failed</h2><div class="sub">pdf</div><p>${String(err.message || err).replace(/</g,'&lt;')}</p>
      <p>PICA needs a text-layer PDF (one exported from screenwriting software — not a scan). It also needs the network once, to fetch the PDF reader.</p>
      <div class="foot"><button class="hbtn" onclick="document.getElementById('overlay').classList.remove('show')">close</button></div>`);
  }
}

// "ThereWillBeBlood.pdf" is a title, not a word: separators become spaces and runs of
// CamelCase come apart at their capitals, so it reads THERE WILL BE BLOOD. Filenames
// that are already spaced or already shouting are left exactly as they are.
function titleFromFilename(name, ext){
  let s = (name || 'IMPORTED').replace(new RegExp('\\.' + ext + '$', 'i'), '');
  s = s.replace(/[_\-.]+/g, ' ').trim();
  if (!/\s/.test(s) && /[a-z]/.test(s) && /[A-Z]/.test(s)) {
    s = s.replace(/([a-z0-9])([A-Z])/g, '$1 $2')      // thereWill → there Will
         .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');  // ABCWord   → ABC Word
  }
  return s.replace(/\s+/g, ' ').trim().toUpperCase() || 'IMPORTED';
}

function importFdxText(text, name){
  try {
    const doc = E.toFinalDraft(E.importFdx(text));
    doc.src = 'fdx';
    if (!doc.title || doc.title === 'UNTITLED') doc.title = titleFromFilename(name || 'SCRIPT', 'fdx');
    const id = E.uid();
    store.save(id, doc);
    openDoc(id);
    toast('imported from final draft · ' + S.res.count + ' pages');
  } catch (e) { toast(String(e.message || e)); }
}

function importJson(text, name){
  try {
    const doc = JSON.parse(text);
    if (!doc || !Array.isArray(doc.elements) || !doc.layout) throw new Error('not a PICA document');
    const id = E.uid();
    store.save(id, doc);
    openDoc(id);
    toast('opened · ' + (doc.title || name));
  } catch (e) { toast('could not read json'); }
}

// ---------- export ----------
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function safeName(){ return (S.doc.title || 'script').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'script'; }
function doExport(act){
  if (act === 'fountain') download(safeName() + '.fountain', E.toFountain(S.doc));
  else if (act === 'fdx') download(safeName() + '.fdx', E.toFdx(S.doc), 'application/xml');
  else if (act === 'json') download(safeName() + '.json', JSON.stringify(S.doc, null, 1), 'application/json');
  else if (act === 'pdf') {
    // in PICA.app this writes a real .pdf via the native save panel — no print dialog
    if (window.webkit?.messageHandlers?.pica) window.webkit.messageHandlers.pica.postMessage({ exportPdf: true, name: safeName() });
    else printAll();
  }
}
function printPageCSS(){
  let st = $('#printPage');
  if (!st) { st = document.createElement('style'); st.id = 'printPage'; document.head.appendChild(st); }
  st.textContent = '@page{ size:' + S.doc.layout.pageW + 'pt ' + S.doc.layout.pageH + 'pt; margin:0; }';
}
function printAll(){
  const zoomWas = S.zoom;
  // The layout is in POINTS and the sheet is declared in points (@page 612pt x 792pt), but
  // the page box is written in CSS PIXELS: pageW * k. True size therefore needs k = 96/72
  // = 4/3, which is zoom 1 — not zoom 0.75, which gives k = 1 and a box 612 PIXELS wide on
  // a 612 POINT sheet. That is 75% of the width, anchored left: the lopsided print.
  S.zoom = 1;                    // k = 4/3 → 1 layout point = 1 printed point
  computeK();
  for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
  requestAnimationFrame(() => { window.print(); S.zoom = zoomWas; rerenderAll(); });
}

// ---------- overlay ----------
function overlayCard(html){
  const o = $('#overlay');
  o.innerHTML = '<div class="card">' + html + '</div>';
  o.classList.add('show');
}
function closeOverlay(){ const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = ''; }
$('#overlay').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeOverlay(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const z = $('#sbZoom');
    if (z && z.classList.contains('show')) { e.preventDefault(); z.classList.remove('show'); return; }
    if (S.rehl) { S.rehl = null; toast('re-highlight cancelled'); }
    if ($('#overlay').classList.contains('show')) { e.preventDefault(); closeOverlay(); }
    closePops();
  }
}, true);

// ---------- settings ----------
function applyUiPrefs(){
  const ui = LS.get('pica.ui', {});
  document.documentElement.style.setProperty('--ui-base', (ui.uiBase || 20) + 'px');
  document.documentElement.style.setProperty('--page', ui.paper === 'white' ? '#ffffff' : '#fdfcf8');
  S.pref = { smartType: ui.smartType !== false, autoDetect: ui.autoDetect !== false, autoContd: ui.autoContd !== false };
  // footer items: zoom and ⚙ are permanent; page/scenes on by default; the rest opt-in
  document.documentElement.style.setProperty('--rfoot', (ui.readerFoot === 'max') ? '.6rem' : '.22rem');
  document.body.classList.toggle('uifont-screenplay', ui.uiFont === 'screenplay');

// ---------- events ----------
pagesEl.addEventListener('beforeinput', ev => {
  if (ev.target.closest?.('.noteLayer')) return;   // note boxes edit themselves
  ev.preventDefault();
  const t = ev.inputType;
  if (t === 'insertText' && ev.data != null) handleInsertText(ev.data);
  else if (t === 'insertParagraph') handleEnter();
  else if (t === 'insertLineBreak') { const c = S.caret; if (c && !c.el.startsWith('title:')) { const el = elById(c.el); if (el) opText(el.id, el.text.slice(0, c.off) + '\n' + el.text.slice(c.off), { el: el.id, off: c.off + 1 }); } }
  else if (t === 'deleteContentBackward') handleBackspace();
  else if (t === 'deleteContentForward') handleDelete();
  else if (t === 'deleteWordBackward' || t === 'deleteWordForward' || t === 'deleteSoftLineBackward') handleBigDelete(t);
  else if (t === 'insertFromPaste') {
    const txt = ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '';
    if (txt) handleInsertText(txt.replace(/\r/g, ''));
  }
  else if (t === 'insertReplacementText') {
    // macOS substitutions: double-space→period, smart quotes, autocorrect,
    // accepted spelling suggestions. The system tells us what range it is
    // replacing — honour it, or the keystroke vanishes.
    const txt = ev.data != null ? ev.data : (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
    if (txt != null && txt !== '') {
      const ranges = ev.getTargetRanges ? ev.getTargetRanges() : [];
      let done = false;
      if (ranges.length) {
        const a = pointFrom(ranges[0].startContainer, ranges[0].startOffset);
        const b = pointFrom(ranges[0].endContainer, ranges[0].endOffset);
        if (a && b && a.el === b.el && !a.el.startsWith('title:')) {
          const el = elById(a.el);
          if (el) {
            const s0 = Math.min(a.off, b.off), e0 = Math.max(a.off, b.off);
            shiftMarks(el, e0, s0 - e0 + txt.length);
            opText(el.id, el.text.slice(0, s0) + txt + el.text.slice(e0), { el: el.id, off: s0 + txt.length });
            done = true;
          }
        }
      }
      if (!done) handleInsertText(txt);         // never eat it
    }
  }
  else if (t === 'historyUndo') undo(false);
  else if (t === 'historyRedo') undo(true);
  else if (t === 'insertCompositionText' || t === 'deleteCompositionText') { /* composition owns the DOM until compositionend */ }
  else if (/^insert/.test(t) && ev.data) handleInsertText(ev.data);   // unknown insert: never eat typed text
});

// ⌥⌫ / ⌥-fn-⌫ / ⌘⌫ — word and line deletes, in the model
function handleBigDelete(kind){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  if (kind === 'deleteWordBackward') {
    if (c.off === 0) return handleBackspace();
    let s0 = c.off;
    while (s0 > 0 && /\s/.test(el.text[s0 - 1])) s0--;
    while (s0 > 0 && !/\s/.test(el.text[s0 - 1])) s0--;
    shiftMarks(el, c.off, s0 - c.off);
    opText(el.id, el.text.slice(0, s0) + el.text.slice(c.off), { el: el.id, off: s0 });
  } else if (kind === 'deleteWordForward') {
    if (c.off >= el.text.length) return handleDelete();
    let e0 = c.off;
    while (e0 < el.text.length && /\s/.test(el.text[e0])) e0++;
    while (e0 < el.text.length && !/\s/.test(el.text[e0])) e0++;
    shiftMarks(el, e0, c.off - e0);
    opText(el.id, el.text.slice(0, c.off) + el.text.slice(e0), { el: el.id, off: c.off });
  } else {                                       // deleteSoftLineBackward (⌘⌫)
    if (c.off === 0) return handleBackspace();
    shiftMarks(el, c.off, -c.off);
    opText(el.id, el.text.slice(c.off), { el: el.id, off: 0 });
  }
}

pagesEl.addEventListener('keydown', ev => {
  if (ev.target.closest?.('.noteLayer')) return;   // note boxes edit themselves
  if (inReader()) {
    // reading: only find, settings, zoom and navigation get through
    const mod = ev.metaKey || ev.ctrlKey;
    const allowed = (mod && ['f', ',', 't', 'e', 'r', '=', '-', '0', 'c', 'a'].includes(ev.key.toLowerCase()))
      || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape'].includes(ev.key);
    if (!allowed) { ev.preventDefault(); return; }
  }
  if (S.menu) {
    if (ev.key === 'ArrowDown') { S.menu.move(1); ev.preventDefault(); return; }
    if (ev.key === 'ArrowUp') { S.menu.move(-1); ev.preventDefault(); return; }
    if (ev.key === 'Tab' && S.menu.kind === 'element') { S.menu.move(ev.shiftKey ? -1 : 1); ev.preventDefault(); return; }
    if (ev.key === 'Enter' || (ev.key === 'Tab' && !ev.shiftKey)) {
      const kind = S.menu.kind;
      const c0 = S.caret;
      const onCue = !!(c0 && !c0.el.startsWith('title:') && elById(c0.el)?.type === 'character');
      ev.preventDefault();
      S.menu.accept();
      // FD: taking a character name from SmartType with Return carries straight on to
      // the dialogue — otherwise Return looks like it did nothing.
      if (kind === 'smart' && ev.key === 'Enter' && onCue) handleEnter();
      return;
    }
    if (ev.key === 'Escape') { closePops(); ev.preventDefault(); return; }
    // FD: choose from the element popup by number, or by the element's first letter
    if (S.menu.kind === 'element') {
      if (SHORTCUT[ev.key]) {
        const i = S.menu.items.findIndex(it => it.type === SHORTCUT[ev.key]);
        if (i >= 0) { S.menu.sel = i; S.menu.accept(); ev.preventDefault(); return; }
      }
      if (/^[a-z]$/i.test(ev.key)) {
        const k = ev.key.toLowerCase();
        const hits = S.menu.items.map((it, i) => [it, i]).filter(([it]) => it.label[0].toLowerCase() === k);
        if (hits.length) {
          const at = hits.findIndex(([, i]) => i === S.menu.sel);
          S.menu.sel = hits[(at + 1) % hits.length][1];
          if (hits.length === 1) S.menu.accept(); else S.menu.move(0);
          ev.preventDefault(); return;
        }
      }
    }
    // FD: Right-Arrow completes the highlighted SmartType match
    if (S.menu.kind === 'smart' && ev.key === 'ArrowRight') { ev.preventDefault(); S.menu.accept(); return; }
  }
  // a selection + Tab or Enter opens the chooser: retype what's selected
  if ((ev.key === 'Tab' || ev.key === 'Enter') && !ev.metaKey && !ev.ctrlKey) {
    const ids = selectionElements();
    if (ids) { ev.preventDefault(); openRetypeMenu(ids, null); return; }
  }
  if (ev.key === 'Tab') { ev.preventDefault(); handleTab(ev.shiftKey); return; }
  if (ev.key === 'Escape') { closePops(); return; }
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && !ev.shiftKey && !ev.altKey && SHORTCUT[ev.key]) {
    ev.preventDefault();
    const c = S.caret; if (!c || c.el.startsWith('title:')) return;
    opConvert(c.el, SHORTCUT[ev.key]);
    if (SHORTCUT[ev.key] === 'character') guessCharacter(c.el);
    return;
  }
  // emphasis, where a writer expects it
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'b') { ev.preventDefault(); applyEmphasis('b'); return; }
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'i') { ev.preventDefault(); applyEmphasis('i'); return; }
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'u') { ev.preventDefault(); applyEmphasis('u'); return; }
  if (mod && ev.altKey && ev.key.toLowerCase() === 's') { ev.preventDefault(); toggleRail(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 't') { ev.preventDefault(); toggleRail(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'e') { ev.preventDefault(); openExportMenu(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'r') { ev.preventDefault(); inReader() ? readerOff() : readerOn(); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 't') { ev.preventDefault(); toggleTitlePage(); return; }
  if (mod && ev.key === ',') { ev.preventDefault(); showSettings(); return; }
  if (mod && ev.key === '\\') { ev.preventDefault(); openElementMenu(); return; }
  if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(false); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(true); return; }
  if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'y') { ev.preventDefault(); undo(true); return; }
  if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); flushSave(); toast('saved'); return; }
  if (mod && ev.key.toLowerCase() === 'p') { ev.preventDefault(); printAll(); return; }

// Forgiving caret placement: a click anywhere on the paper lands the cursor at the
// nearest text position — end of the nearest line when you click past its edge —
// instead of demanding a pixel-perfect hit on the type itself.
function forgivingPos(clientX, clientY, pageHint){
  let page = pageHint || document.elementFromPoint(clientX, clientY)?.closest?.('.page');
  if (!page) {                                          // beside/between pages: nearest live page
    let bd = Infinity;
    for (const pe of S.pageEls) {
      if (!pe.live || !pe.page) continue;
      const r = pe.page.getBoundingClientRect();
      const dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
      if (dy < bd) { bd = dy; page = pe.page; }
    }
  }
  if (!page) return null;
  const lines = [...page.children].filter(d =>
    d.classList.contains('line') && d.dataset.el && !d.dataset.el.startsWith('title:') &&
    d.dataset.kind !== 'pn' && d.dataset.kind !== 'more' && d.dataset.kind !== 'contcue');
  if (!lines.length) return null;
  let best = null, bd = Infinity;
  for (const d of lines) {
    const r = d.getBoundingClientRect();
    const dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
    const dx = clientX < r.left ? r.left - clientX : (clientX > r.right ? clientX - r.right : 0);
    const score = dy * 120 + dx;                        // the same row wins decisively
    if (score < bd) { bd = score; best = { d, r }; }
  }
  if (!best) return null;
  const len = best.d.textContent.length;
  const cw = len ? best.r.width / len : 1;
  const at = Math.max(0, Math.min(len, Math.round((clientX - best.r.left) / cw)));
  return { d: best.d, at };
}
pagesEl.addEventListener('mousedown', ev => {
  if (ev.button !== 0 || inReader()) return;
  const page = ev.target.closest('.page');
  const lineHit = ev.target.closest('.line');
  if (!page || (lineHit && lineHit.dataset.el)) return; // direct text clicks behave natively
  const hit = forgivingPos(ev.clientX, ev.clientY, page);
  if (!hit) return;
  ev.preventDefault();
  placeCaret(hit.d, hit.at);
  S.caret = { el: hit.d.dataset.el, off: (+hit.d.dataset.off || 0) + hit.at };
  status();
  // preventDefault above killed the browser's own drag anchor — so a selection
  // started on blank paper (the natural grip when sweeping up from the end of a
  // passage) is extended by hand from the forgiven position
  const [an, ao] = domPosIn(hit.d, hit.at);
  let moved = false;
  const move = mv => {
    const p = forgivingPos(mv.clientX, mv.clientY, null);
    if (!p) return;
    moved = true;
    const [fn, fo] = domPosIn(p.d, p.at);
    getSelection().setBaseAndExtent(an, ao, fn, fo);
  };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (moved) syncCaret();
  };
  addEventListener('mousemove', move);
  addEventListener('mouseup', up);
});

function renderBShells(){
  const host = $('#pagesB');

  }, { root: $('#canvasB'), rootMargin: '500px 0px' });

  page.style.height = (L.pageH * k) + 'px';
  page.style.fontSize = (fontPt * k) + 'px';
  page.style.lineHeight = (L.rowH * k) + 'px';
  for (const l of B.res.pages[i].lines) {
    const d = document.createElement('div');
    d.className = 'line';
    d.style.left = (l.x * k) + 'px';
    d.style.top = ((l.y - fontPt * 0.79) * k) + 'px';
    d.style.height = (L.rowH * k) + 'px';

// sync scrolling: page for page — page N tops page N, carrying the fraction into the
// page across; a title page on one side only is offset away so script pages align
let bSyncLock = false;
function syncFrom(src, dst){
  if (!document.body.classList.contains('split') || !LS.get('pica.ui', {}).syncScroll) return;
  if (bSyncLock) return;
  const srcIsA = src === canvasEl;
  const sp = srcIsA ? S.pageEls : B.els;
  const dp = srcIsA ? B.els : S.pageEls;
  if (!sp || sp.length < 1 || !dp || dp.length < 1) return;
  const sTitle = S.showTitle && ((srcIsA ? S.doc : B.doc)?.titlePage?.length ? 1 : 0);
  const dTitle = S.showTitle && ((srcIsA ? B.doc : S.doc)?.titlePage?.length ? 1 : 0);
  bSyncLock = true;
  const sTop0 = sp[0].wrap.offsetTop;
  const sStep = sp.length > 1 ? sp[1].wrap.offsetTop - sTop0 : sp[0].wrap.offsetHeight;
  const sH = sp[0].wrap.offsetHeight || 1;
  let idx = Math.floor((src.scrollTop - sTop0) / Math.max(1, sStep));
  idx = Math.max(0, Math.min(sp.length - 1, idx));
  let frac = (src.scrollTop - (sTop0 + idx * sStep)) / sH;
  frac = Math.max(0, Math.min(1, frac));
  let j = idx - (sTitle ? 1 : 0) + (dTitle ? 1 : 0);
  j = Math.max(0, Math.min(dp.length - 1, j));
  const dTop0 = dp[0].wrap.offsetTop;
  const dStep = dp.length > 1 ? dp[1].wrap.offsetTop - dTop0 : dp[0].wrap.offsetHeight;
  const dH = dp[0].wrap.offsetHeight || 1;
  dst.scrollTop = dTop0 + j * dStep + frac * dH;
  requestAnimationFrame(() => { bSyncLock = false; });
}

// ---------- native bridge ----------
// PICA.app drives the page through this. Harmless in a browser; the app's menu bar,
// Dock drops and Print command all land here rather than duplicating any editor logic.
/* ══════════════════════════════════════════════════════════════════════════════
   FIND A SCREENPLAY — type a film's name, read what comes back, keep it or don't.
   Nothing is saved unless he says Accept. Try again moves to the next candidate;
   Cancel puts back whatever he was reading.
   ══════════════════════════════════════════════════════════════════════════════ */

// One GET. The native app proxies through its own scheme handler (a WKWebView on a
// custom scheme is subject to CORS like anything else); the web build goes direct and
// gets what CORS allows.
// A seam for the tests: they stub the network so the DECISION can be exercised —
// nothing reaches the library unless he accepts — without depending on the internet.
let NET_STUB = null;
const WEB = {
  proxied: () => location.protocol === 'pica:',
  url: u => WEB.proxied() ? 'pica://app/__web/' + encodeURIComponent(u) : u,
  async text(u){
    const r = await fetch(WEB.url(u), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  },
  async bytes(u){
    if (NET_STUB && NET_STUB.bytes) return NET_STUB.bytes(u);
    const r = await fetch(WEB.url(u), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const b = await r.arrayBuffer();
    if (b.byteLength < 6000) throw new Error('too small to be a screenplay');
    const head = new TextDecoder('latin1').decode(new Uint8Array(b.slice(0, 5)));
    if (head !== '%PDF-') throw new Error('not a PDF');
    return b;
  },
};

// The archives worth reading, and the index page each one publishes. Searching these is
// better than searching the web: they are curated, the links are stable, and what comes
// back is a screenplay rather than a review of one. Fetched once per session.
const SCRIPT_INDEXES = [
  'https://www.dailyscript.com/movie.html',
  'https://www.dailyscript.com/movie_n-z.html',
  'https://www.moviescriptsandscreenplays.com/',
  'https://www.awesomefilm.com/',
  'https://tarantinoesque.github.io/',        // a small, clean, all-PDF shelf
];
const SCRIPT_HOSTS = [
  'dailyscript.com', 'moviescriptsandscreenplays.com', 'awesomefilm.com',
  'thescriptsavant.com', 'scriptslug.com', 'imsdb.com', 'sfy.ru', 'screenplays.io',
  // studios and trades post the real thing during awards season, and the archive keeps it
  'deadline.com', 'archive.org', 'indiegroundfilms.files.wordpress.com',
  'thesuccessfulscreenwriter.com', 'raindance.org', 'nofilmschool.com',
  'tarantinoesque.github.io',
];
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const slugify = q => q.toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const norm = t => t.toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();

const indexCache = new Map();
async function readIndex(url){
  if (indexCache.has(url)) return indexCache.get(url);
  let links = [];
  try {
    const html = await WEB.text(url);
    const base = new URL(url);
    for (const m of html.matchAll(/href="([^"]+)"[^>]*>([^<]{2,120})</gi)) {
      let href = m[1];
      if (!/\.pdf(\?|$)/i.test(href)) continue;           // PICA imports PDFs
      try { href = new URL(href, base).href; } catch { continue; }
      links.push({ url: href, text: m[2].replace(/&amp;/g, '&').trim() });
    }
  } catch {}
  indexCache.set(url, links);
  return links;
}

// DuckDuckGo needs no key and is the fallback when the archives have nothing.
async function searchWeb(query){
  const html = await WEB.text('https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query));
  const out = [];
  for (const m of html.matchAll(/href="(\/\/duckduckgo\.com\/l\/\?uddg=[^"]+|https?:\/\/[^"]+)"/g)) {
    let href = m[1];
    if (href.startsWith('//')) href = 'https:' + href;
    const wrapped = /[?&]uddg=([^&"]+)/.exec(href);
    if (wrapped) { try { href = decodeURIComponent(wrapped[1]); } catch { continue; } }
    if (!/^https?:\/\//.test(href) || /duckduckgo\.com/.test(href)) continue;
    if (!out.includes(href)) out.push(href);
  }
  return out;
}

// How well does a link answer the question? Every significant word of the title has to be
// there, in the link's own text or its URL; an archive scores above the open web.
function scoreLink(link, query){
  const words = norm(query).split(' ').filter(w => w.length > 2);
  const hay = norm((link.text || '') + ' ' + decodeURIComponent(link.url));
  if (!words.length) return 0;
  const hits = words.filter(w => hay.includes(w)).length;
  if (hits < words.length) return 0;                      // partial matches are noise
  let score = 40 + Math.round(20 * (hits / words.length));
  if (SCRIPT_HOSTS.includes(hostOf(link.url))) score += 30;
  if (norm(link.text || '') === norm(query)) score += 25;  // the archive names it exactly
  if (/trailer|poster|review|wikipedia|imdb|reddit|youtube|amazon|ebay/.test(link.url.toLowerCase())) score -= 80;
  return score;
}

// The hunt: the archives first, the open web after, best first, no duplicates.
async function gatherCandidates(query){
  if (NET_STUB && NET_STUB.candidates) return NET_STUB.candidates(query);
  const found = [];
  const lists = await Promise.all(SCRIPT_INDEXES.map(readIndex));
  for (const list of lists) for (const l of list) {
    const score = scoreLink(l, query);
    if (score > 0) found.push({ url: l.url, host: hostOf(l.url), label: l.text, score });
  }
  if (found.length < 3) {
    for (const q of ['"' + query + '" screenplay pdf', query + ' screenplay script pdf']) {
      try {
        for (const u of await searchWeb(q)) {
          if (!/\.pdf(\?|$)/i.test(u)) continue;
          const score = scoreLink({ url: u, text: '' }, query);
          if (score > 0) found.push({ url: u, host: hostOf(u), label: '', score: score - 5 });
        }
      } catch {}
      if (found.length >= 3) break;
    }
  }
  const seen = new Set();
  return found.sort((a, b) => b.score - a.score)
    .filter(c => { const k = c.url.replace(/[?#].*$/, '').toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, 8);
}

// ---------- is this copy any good? ----------
// The web has several copies of most scripts and they are not equally good: one is a clean
// export, the next a photocopy read by a machine. The same structure the importer relies on
// says which is which — a screenplay is scene headings, cues, and speech under the cues —
// so PICA reads each copy it fetches and keeps looking if it can do better.
function scoreImport(doc){
  const els = doc.elements || [];
  const n = els.length || 1;
  const t = {};
  for (const e of els) t[e.type] = (t[e.type] || 0) + 1;
  const cues = t.character || 0, dlg = t.dialogue || 0, scenes = t.scene || 0;
  let cueNoSpeech = 0, speechNoCue = 0;
  els.forEach((e, i) => {
    const nx = els[i + 1], pv = els[i - 1];
    if (e.type === 'character' && (!nx || (nx.type !== 'dialogue' && nx.type !== 'paren'))) cueNoSpeech++;
    if (e.type === 'dialogue' && (!pv || (pv.type !== 'character' && pv.type !== 'paren' && pv.type !== 'dialogue'))) speechNoCue++;
  });
  const unread = (t.general || 0) / n;
  const notes = [];
  let score = 100;
  // lines the importer could not place at all — the clearest sign of a bad copy
  if (unread > 0.01) { score -= Math.min(50, Math.round(unread * 300)); notes.push(Math.round(unread * 100) + '% unplaced'); }
  // a cue with nothing under it, or speech with nobody saying it
  const loose = (cueNoSpeech + speechNoCue) / Math.max(1, cues);
  if (loose > 0.02) { score -= Math.min(30, Math.round(loose * 150)); notes.push(Math.round(loose * 100) + '% loose speech'); }
  // and the things a screenplay simply has
  if (!scenes) { score -= 40; notes.push('no scene headings'); }
  if (!cues || !dlg) { score -= 40; notes.push('no dialogue'); }
  if (n < 400) { score -= 25; notes.push('only ' + n + ' elements'); }
  return { score: Math.max(0, score), notes, unread, cues, dlg, scenes };
}

// ---------- reformat ----------
// A copy can be nearly right: the words are all there and the shape is mostly correct, but
// a run of speech came back as action, a slug lost its type, a bracket is sitting in the
// wrong element. Reformat reads the script again and repairs what its own shape gives away
// — the same judgements the importer makes, but from the text alone, since the positions on
// the original page are long gone by then.
function reformatDoc(doc){
  E.toFinalDraft(doc);                       // geometry, spacing, reflow, base faces
  const els = doc.elements;
  const CAPS = t => t === t.toUpperCase() && /[A-Z]/.test(t);
  const txt = e => e.text.trim();

  for (const e of els) {
    const t = txt(e);
    if (!t) continue;
    // a shouted line ending in a colon is a transition, wherever it ended up
    if (t.length <= 34 && CAPS(t) && /[:;~]$/.test(t) && !E.SCENE_RE.test(t)) { e.type = 'transition'; continue; }
    // a slugline is a slugline
    if (E.SCENE_RE.test(t) && !t.includes('\n')) { e.type = 'scene'; continue; }
    // wholly bracketed is a parenthetical
    if (t !== '(MORE)' && /^\(.*\)$/.test(t) && t.length <= 60) { e.type = 'paren'; continue; }
  }
  // a short shout that introduces speech is the name of whoever says it
  for (let i = 0; i < els.length - 1; i++) {
    const e = els[i], n = els[i + 1], t = txt(e);
    if (e.type !== 'action' && e.type !== 'general') continue;
    if ((n.type === 'dialogue' || n.type === 'paren')
        && t.length <= 35 && !t.includes('\n') && CAPS(t) && !/[.!?]$/.test(t)) e.type = 'character';
  }
  // and what follows a cue is what was said
  for (let i = 1; i < els.length; i++) {
    const prev = els[i - 1].type;
    if (els[i].type === 'action' && (prev === 'character' || prev === 'paren')) els[i].type = 'dialogue';
  }
  // nothing is left unclassified: 'general' is not an element of a screenplay
  for (const e of els) if (e.type === 'general') e.type = 'action';
  return doc;
}

/* ---------- the trial ---------- */
const TRIAL = { query: '', list: [], at: -1, running: false, prev: null, best: null, showing: null, rejected: false };

const trialBar = () => document.getElementById('trialBar');
function trialShow(state, info){
  const bar = trialBar(); if (!bar) return;
  bar.hidden = false;
  const set = (id, t) => { const n = document.getElementById(id); if (n) n.textContent = t; };
  const btn = (id, on) => { const n = document.getElementById(id); if (n) n.style.display = on ? '' : 'none'; };
  if (state === 'searching') {
    set('tbTitle', 'Looking for “' + TRIAL.query + '”…');
    set('tbMeta', ''); set('tbFrom', WEB.proxied() ? 'searching the web' : 'searching the web (browser build — some sites will refuse)');
    set('tbCount', '');
    btn('tbAccept', false); btn('tbAgain', false); btn('tbCancel', true);
  } else if (state === 'trial') {
    set('tbTitle', info.title);
    set('tbMeta', info.pages + ' pages · ' + info.elements + ' elements');
    set('tbFrom', 'from ' + info.host
      + (info.quality ? (info.quality.score >= CLEAN_ENOUGH ? ' · clean'
        : ' · ' + info.quality.notes.join(', ')) : ''));
    set('tbCount', 'candidate ' + (TRIAL.at + 1) + ' of ' + TRIAL.list.length);
    btn('tbAccept', true); btn('tbAgain', true); btn('tbCancel', true);
  } else if (state === 'empty') {
    set('tbTitle', info.title);
    set('tbMeta', ''); set('tbFrom', info.detail || ''); set('tbCount', '');
    btn('tbAccept', false); btn('tbAgain', !!info.canRetry); btn('tbCancel', true);
  }
}
function trialHide(){ const b = trialBar(); if (b) b.hidden = true; }

// Put back whatever he was reading, and leave nothing of the trial behind.
async function trialDiscard(){
  const t = S.trial;
  if (!t) return;
  // The guard must OUTLIVE the switch. openDoc begins by flushing a save of the document
  // it is leaving — which is the trial — so clearing S.trial first is exactly how a
  // rejected script ended up in the library anyway. Tombstone it as well, so no pending
  // write can bring it back a second later.
  store.gone.add(t.id);
  store.cache.delete(t.id);
  try { await idb.del('doc.' + t.id); } catch {}
  const ix = store.index();
  const back = (t.prev && t.prev !== t.id && ix.some(d => d.id === t.prev)) ? t.prev
    : (ix[0] ? ix[0].id : null);
  if (back) await openDoc(back);
  else { S.trial = null; const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); await openDoc(id); }
  S.trial = null;
}

// Walk the candidates, reading each one. A copy that scores clean is shown at once; a
// poor one is remembered and the next is tried, and if none is clean the best of them is
// what he sees — with what is wrong with it written on the bar. Trying again from there
// steps past the best to whatever else was found.
const CLEAN_ENOUGH = 88;

async function presentTrial(entry){
  TRIAL.showing = entry;
  S.trial = { id: entry.id, prev: TRIAL.prev };
  store.cache.set(entry.id, entry.doc);
  await openDoc(entry.id);
  trialShow('trial', {
    title: entry.doc.title || TRIAL.query,
    pages: S.res.count,
    elements: entry.doc.elements.length,
    host: entry.cand.host,
    quality: entry.quality,
  });
  focusScript();
}

async function trialNext(){
  if (TRIAL.running) return;
  TRIAL.running = true;
  const form = document.getElementById('getForm');
  if (form) form.classList.add('busy');
  try {
    let best = TRIAL.rejected ? null : TRIAL.best;   // "try again" steps past the best
    while (TRIAL.at + 1 < TRIAL.list.length) {
      TRIAL.at++;
      const c = TRIAL.list[TRIAL.at];
      trialShow('empty', { title: 'Reading a copy from ' + c.host + '…',
        detail: 'candidate ' + (TRIAL.at + 1) + ' of ' + TRIAL.list.length, canRetry: false });
      try {
        const buf = await WEB.bytes(c.url);
        await trialDiscard();
        const r = await importPdfBuffer(buf, TRIAL.query + '.pdf', { trial: true, quiet: true });
        if (!r) throw new Error('nothing readable came out of it');
        const q = scoreImport(r.doc);
        const entry = { id: r.id, doc: r.doc, cand: c, quality: q };
        // hold on to it: openDoc's own copy is discarded when the next one is read
        S.trial = null;
        if (q.score >= CLEAN_ENOUGH) { TRIAL.best = entry; TRIAL.rejected = false; await presentTrial(entry); return; }
        if (!best || q.score > best.quality.score) best = entry;
        trialShow('empty', {
          title: 'That copy is rough — looking for a better one',
          detail: c.host + ' · ' + q.notes.join(', '), canRetry: false });
        await new Promise(r2 => setTimeout(r2, 350));
      } catch (e) {
        trialShow('empty', { title: 'That one was no good', detail: c.host + ' — ' + (e.message || e), canRetry: false });
        await new Promise(r2 => setTimeout(r2, 350));
      }
    }
    if (best) {                       // nothing clean: the best of what there was
      TRIAL.best = best; TRIAL.rejected = false;
      await presentTrial(best);
      return;
    }
    trialShow('empty', {
      title: 'Nothing usable for “' + TRIAL.query + '”',
      detail: TRIAL.list.length ? 'tried ' + TRIAL.list.length + ' copies' :
        (WEB.proxied() ? 'no results' : 'the browser build cannot reach most script archives — use PICA.app'),
      canRetry: false });
  } finally {
    TRIAL.running = false;
    if (form) form.classList.remove('busy');
  }
}

async function findScreenplay(query){
  query = (query || '').trim();
  if (!query) return;
  if (S.trial) await trialDiscard();
  TRIAL.query = query; TRIAL.list = []; TRIAL.at = -1;
  TRIAL.best = null; TRIAL.showing = null; TRIAL.rejected = false;
  TRIAL.prev = S.docId;
  trialShow('searching');
  const form = document.getElementById('getForm');
  if (form) form.classList.add('busy');
  try {
    TRIAL.list = await gatherCandidates(query);
  } catch (e) {
    trialShow('empty', { title: 'Could not search', detail: String(e.message || e) });
    if (form) form.classList.remove('busy');
    return;
  }
  if (form) form.classList.remove('busy');
  if (!TRIAL.list.length) {
    trialShow('empty', { title: 'Found nothing for “' + query + '”',
      detail: WEB.proxied() ? 'try the film\'s full title' : 'the browser build cannot reach most script archives — use PICA.app' });
    return;
  }
  await trialNext();
}

(() => {
  const form = document.getElementById('getForm');
  const input = document.getElementById('getIn');
  if (form) form.addEventListener('submit', ev => { ev.preventDefault(); input.blur(); findScreenplay(input.value); });
  // Put the caret back where he writes. Clicking a control must never leave the next
  // thing he types with nowhere to go.
  const focusScript = () => {
    const p2 = document.getElementById('pages');
    if (p2) { try { p2.focus(); } catch {} }
    try { restoreCaret(); } catch {}
  };
  // Every other control in this app acts on MOUSEDOWN and preventDefaults, which is why
  // the caret never leaves the page when you press one. These were on 'click', so after
  // Accept the focus sat on the button and everything typed afterwards went nowhere —
  // the app "eating inputs". The click path stays for synthetic events in the tests.
  const on = (id, fn) => {
    const n = document.getElementById(id);
    if (!n) return;
    let acted = 0;
    const run = () => { acted = Date.now(); fn(); };
    n.addEventListener('mousedown', ev => { ev.preventDefault(); run(); });
    n.addEventListener('click', () => { if (Date.now() - acted > 400) run(); });
  };
  on('tbAccept', async () => {
    const t = S.trial; if (!t) { trialHide(); return; }
    const doc = S.doc;
    S.trial = null;
    store.trials.delete(t.id);                       // the guard lifts, and it saves
    store.gone.delete(t.id);                         // it was never rejected
    store.save(t.id, doc);
    rail();
    trialHide();
    if (input) input.value = '';
    focusScript();
    toast('saved · ' + (doc.title || 'UNTITLED') + ' · ' + S.res.count + ' pages');
  });
  on('tbFix', async () => {
    if (!S.doc) return;
    const was = scoreImport(S.doc);
    reformatDoc(S.doc);
    repaginate(); buildPages(); renderAllVisible(); status();
    const now = scoreImport(S.doc);
    const showing = TRIAL.showing;
    if (showing) {
      showing.quality = now;
      trialShow('trial', { title: S.doc.title || TRIAL.query, pages: S.res.count,
        elements: S.doc.elements.length, host: showing.cand.host, quality: now });
    }
    focusScript();
    toast(now.score > was.score ? 'reformatted · ' + was.score + ' → ' + now.score
      : 'reformatted · already as good as it reads');
  });
  on('tbAgain', () => { TRIAL.rejected = true; TRIAL.best = null; trialNext(); });
  on('tbCancel', async () => { trialHide(); await trialDiscard(); TRIAL.list = []; TRIAL.at = -1; focusScript(); });
})();

window.PICA_API = {
  newDoc(){ const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); toast('new script'); },
  importPdf(){ $('#fileIn').click(); },
  // Files opened natively arrive as a URL the app serves, not as inline bytes — a
  // screenplay-sized base64 literal does not survive evaluateJavaScript.
  importUrl(url, name){
    fetch(url).then(r => {
      if (!r.ok) throw new Error('could not read ' + name);
      return r.arrayBuffer();
    }).then(buf => {
      if (/\.json$/i.test(name || '')) importJson(new TextDecoder().decode(buf), name);
      else if (/\.fdx$/i.test(name || '')) importFdxText(new TextDecoder().decode(buf), name);
      else importPdfBuffer(buf, name);
    }).catch(e => toast(String(e.message || e)));
  },
  // the Mac side reading a scan by eye, reporting in and handing back
  ocrProgress(token, done, total){ const j = OCR_JOBS.get(token); if (j) j.progress(done, total); },
  ocrDone(token, url){ const j = OCR_JOBS.get(token); if (j) j.done(url); },
  exportMenu(){ openExportMenu(); },
  elementMenu(){ openElementMenu(); },
  showKeys(){ showKeys(); },
  undo(){ undo(false); },
  redo(){ undo(true); },
  save(){ flushSave(); },
  toggleRail(){ toggleRail(); },
  toggleTitlePage(){ toggleTitlePage(); },
  toggleReader(){ inReader() ? readerOff() : readerOn(); },
  toggleAnnotate(){ toggleAnnotate(); },
  toggleStoryboard(){ toggleStoryboard(); },
  titleShown(){ return S.showTitle; },
  settings(){ showSettings(); },
  escape(){ if ($('#overlay').classList.contains('show')) closeOverlay(); closePops(); },
  mark(kind){ applyEmphasis(kind); },
  // Scriptable hooks. The automated grammar test drives these, so Final Draft's
  // Enter/Tab behaviour is checked on every build rather than by hand.
  test: {
    reset(){ const id = E.uid(); store.save(id, E.newDoc('TEST')); return openDoc(id).then(() => id); },
    caret(i, off){
      const el = S.doc.elements[i]; if (!el) return false;
      S.caret = { el: el.id, off: off == null ? el.text.length : off };
      restoreCaret(); return true;
    },
    type(str){ for (const ch of str) handleInsertText(ch); return true; },
    enter(){ closePops(); handleEnter(); return true; },
    tab(shift){ handleTab(!!shift); return true; },
    esc(){ closePops(); return true; },
    state(){ return S.doc.elements.map(e => e.type + '|' + e.text); },
    // the search feature: stub the network, then drive Accept / Try again / Cancel
    stubNet(s){ NET_STUB = s; },
    // stand in for the Mac's recogniser: a browser has none, so the gate replays a
    // reading captured from the real one against the real file
    stubOcr(fn){ S.ocrStub = fn; },
    find(q){ return findScreenplay(q); },
    search(q){ return gatherCandidates(q); },
    trialId(){ return S.trial ? S.trial.id : null; },
    // per-character emphasis as the model holds it: '.' plain, else b/i/u letters
    marks(i){
      const el = S.doc.elements[i]; if (!el) return '';
      const bits = markBitsFor(el, 0, el.text.length);
      let out = '';
      for (let k = 0; k < el.text.length; k++) {
        const b = (bits && bits[k]) || 0;
        out += b ? ((b & 1 ? 'b' : '') + (b & 2 ? 'i' : '') + (b & 4 ? 'u' : '')) : '.';
      }
      return out;
    },
    caretAt(){ const c = S.caret; return c ? (elIndex(c.el) + ':' + c.off) : 'none'; },
    note(i, off, len, text){
      const el = S.doc.elements[i]; if (!el) return false;
      const n = { id: E.uid(), off, len, text: text || '' };
      (el.notes = el.notes || []).push(n);
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      renderNotesAll(); saveSoon(); return n.id;
    },
    notes(i){ const el = S.doc.elements[i]; return JSON.stringify((el && el.notes) || []); },
    delNote(i, id){ deleteNote(null, id); return true; },
    openId(id){ return openDoc(id); },
    // Measured against where the cues are actually DRAWN whenever any is on screen —
    // comparing the title with the same formula that places it can only ever agree
    // with itself, which is how a misaligned title passed this check for days.
    titleDelta(){
      const tEl = document.getElementById('docTitle'); const page = document.querySelector('.page');
      if (!tEl || !page) return 'no-dom';
      const t = tEl.getBoundingClientRect(), p = page.getBoundingClientRect();
      const cs = getComputedStyle(tEl);
      const textLeft = t.left + (parseFloat(cs.paddingLeft) || 0);
      let want = null;
      for (const d of document.querySelectorAll('#pages div[data-el]')) {
        const el = elById(d.dataset.el);
        if (!el || el.type !== 'character' || el.dual) continue;
        const r = d.getBoundingClientRect();
        if (r.width) { want = r.left; break; }          // every cue shares this edge
      }
      if (want == null) want = p.left + titleAxisX() * S.k;
      return Math.abs(textLeft - want) < 1.5;
    },
    noteMulti(i1, o1, i2, o2){
      const targets = [];
      for (let i = i1; i <= i2; i++) {
        const el = S.doc.elements[i]; if (!el) return false;
        const s = i === i1 ? o1 : 0, e = i === i2 ? o2 : el.text.length;
        if (e > s) targets.push([el, s, e]);
      }
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      return createNote(targets, '');
    },
    noteBoxes(){ return document.querySelectorAll('.noteBox').length + ':' + document.querySelectorAll('.noteHl').length; },
    panel(i, off){
      const el = S.doc.elements[i]; if (!el) return false;
      const key = E.uid();
      const url = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
      imgCache.set(key, url); idb.put('img.' + key, url).catch(() => {});
      const n = { id: E.uid(), off, imgKey: key, ar: 1.5 };
      (el.panels = el.panels || []).push(n);
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      renderPanelsAll(); saveSoon(); return n.id;
    },
    panels(i){ const el = S.doc.elements[i]; return JSON.stringify((el && el.panels) || []); },
    delPanel(i, id){ const el = S.doc.elements[i]; if (el) deletePanel(el.id, id); return true; },
    sbCount(){ return document.querySelectorAll('.sbPanel').length; },
  },
  toggleTheme(){ $('#btnTheme').dispatchEvent(new Event('mousedown')); },
  zoom(d){ S.zoom = Math.max(.3, Math.min(1.6, (S.zoom ?? fitZoom()) + d)); rerenderAll(); },
  zoomFit(){ S.zoom = null; rerenderAll(); },
  // print at true page size, and report the paper the script actually uses
  preparePrint(){
    S.printZoom = S.zoom; S.zoom = 1; computeK();   // k = 4/3 → true point size
    for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
    return { w: S.doc.layout.pageW, h: S.doc.layout.pageH };
  },
  endPrint(){ S.zoom = S.printZoom ?? null; rerenderAll(); },
  title(){ return S.doc.title; },
};
function notifyNative(){
  try { window.webkit?.messageHandlers?.pica?.postMessage({ title: S.doc.title, pages: S.res.count }); }
  catch {}
}

window.__pica = S; // debug handle
boot().catch(e => {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:serif;background:#f6f5f2;color:#141413;z-index:99"><div><h2>PICA could not start</h2><p>' +
    String(e && e.message || e).replace(/</g, '&lt;') + '</p></div></div>');
});
})();
</script>
</body>
</html>
