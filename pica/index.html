<script>
/* ================================================================
   PICA UI — the editor around the engine.
   The model is the truth; contenteditable is only a caret.
   ================================================================ */
(() => {
'use strict';
const E = PicaEngine;
const $ = s => document.querySelector(s);
const pagesEl = $('#pages'), canvasEl = $('#canvas');

// ---------- state ----------
const S = {
  doc: null, docId: null, res: null,
  caret: null,            // {el, off} — el is element id, 'title:N', or null
  zoom: null,             // null = fit
  k: 1,                   // px per pt
  undo: [], redo: [],
  pageEls: [],            // [{wrap, page, sig, live}]
  vis: new Set(),         // visible page indices
  menu: null,             // active popup {el, items, sel, onPick, kind}
  fontPt: 12,
  showTitle: false,       // the title page is opt-in; see toggleTitlePage()
  saveTimer: null, lastSave: null, snapAt: 0,
};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
};

// ---------- document store (never lose anything) ----------
const store = {
  index(){ return LS.get('pica.index', []); },
  saveIndex(ix){ LS.set('pica.index', ix); },
  load(id){ return LS.get('pica.doc.' + id, null); },
  save(id, doc){
    if (!LS.set('pica.doc.' + id, doc)) { // quota: drop oldest snapshot and retry
      const snaps = LS.get('pica.snap.' + id, []); snaps.shift(); LS.set('pica.snap.' + id, snaps);
      if (!LS.set('pica.doc.' + id, doc)) toast('STORAGE FULL — EXPORT YOUR WORK');
    }
    const ix = store.index();
    const it = ix.find(d => d.id === id);
    const meta = { id, title: doc.title || 'UNTITLED', pages: S.res ? S.res.count : 0, at: Date.now() };
    if (it) Object.assign(it, meta); else ix.unshift(meta);
    store.saveIndex(ix);
  },
  snapshot(id, doc){
    const snaps = LS.get('pica.snap.' + id, []);
    snaps.push({ t: Date.now(), doc });
    while (snaps.length > 5) snaps.shift();
    LS.set('pica.snap.' + id, snaps);
  },
};

// ---------- boot ----------
function boot(){
  const ui0 = LS.get('pica.ui', {});
  if (ui0.theme) document.documentElement.dataset.theme = ui0.theme;
  S.showTitle = !!ui0.showTitle;
  applyRailPrefs();
  const ix = store.index();
  const last = LS.get('pica.ui', {}).lastDoc;
  let id = (last && ix.some(d => d.id === last)) ? last : (ix[0] && ix[0].id);
  if (!id) { id = E.uid(); const doc = E.newDoc('UNTITLED'); store.save(id, doc); }
  openDoc(id);
  const m = location.search.match(/[?&]open=([^&]+)/);
  if (m) fetch(decodeURIComponent(m[1])).then(r => r.arrayBuffer()).then(b => importPdfBuffer(b, decodeURIComponent(m[1]).split('/').pop())).catch(()=>{});
}

function openDoc(id){
  if (S.docId && S.doc) { flushSave(); store.snapshot(S.docId, S.doc); }
  const doc = store.load(id) || E.newDoc('UNTITLED');
  S.doc = doc; S.docId = id; S.undo = []; S.redo = [];
  S.caret = doc.elements[0] ? { el: doc.elements[0].id, off: 0 } : null;
  const ui = LS.get('pica.ui', {}); ui.lastDoc = id; LS.set('pica.ui', ui);
  S.fontPt = doc.layout.charW / 0.6;
  repaginate(); buildPages(); renderAllVisible(); rail(); status();
  $('#docTitle').textContent = doc.title;
  canvasEl.scrollTop = 0;
  printPageCSS();
  store.save(id, doc); // refresh index metadata (page count) now that we have S.res
}

// ---------- geometry ----------
function fitZoom(){
  const avail = canvasEl.clientWidth - 32;
  return Math.min(1.08, Math.max(.3, avail / (S.doc.layout.pageW * 4 / 3)));
}
function computeK(){ S.k = (S.zoom == null ? fitZoom() : S.zoom) * 4 / 3; }

// ---------- pagination + rendering ----------
// The title page is a separate artifact, not part of the writing surface — hidden unless
// asked for (⌘⇧T). Passing an empty titlePage omits page 0; script pagination is untouched.
function repaginate(){
  S.res = E.paginate(S.showTitle ? S.doc : Object.assign({}, S.doc, { titlePage: [] }));
}
function toggleTitlePage(){
  S.showTitle = !S.showTitle;
  const ui = LS.get('pica.ui', {}); ui.showTitle = S.showTitle; LS.set('pica.ui', ui);
  const keep = S.caret;
  repaginate(); buildPages(); renderAllVisible();
  S.caret = keep && keep.el.startsWith('title:') && !S.showTitle
    ? (S.doc.elements[0] ? { el: S.doc.elements[0].id, off: 0 } : null) : keep;
  restoreCaret(); rail(); status();
  toast(S.showTitle ? 'title page shown' : 'title page hidden');
}

function pageSig(p){
  let s = '';
  for (const l of p.lines) s += l.x + '|' + l.y + '|' + l.el + '|' + l.text + '\n';
  return s;
}

function buildPages(){       // (re)create page shells to match page count
  computeK();
  const n = S.res.pages.length;
  pagesEl.innerHTML = '';
  S.pageEls = [];
  for (let i = 0; i < n; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'pageWrap'; wrap.dataset.i = i;
    wrap.style.width = (S.doc.layout.pageW * S.k) + 'px';
    wrap.style.height = (S.doc.layout.pageH * S.k) + 'px';
    const ghost = document.createElement('div');
    ghost.className = 'pageghost'; ghost.textContent = '· ' + (i + 1) + ' ·';
    ghost.contentEditable = 'false';
    wrap.appendChild(ghost);
    pagesEl.appendChild(wrap);
    S.pageEls.push({ wrap, page: null, sig: null, live: false });
  }
  io.disconnect();
  for (const pe of S.pageEls) io.observe(pe.wrap);
}

const io = new IntersectionObserver(ents => {
  for (const en of ents) {
    const i = +en.target.dataset.i;
    if (en.isIntersecting) S.vis.add(i); else S.vis.delete(i);
  }
  renderAllVisible();
}, { root: canvasEl, rootMargin: '600px 0px' });

function renderAllVisible(){
  const want = new Set(S.vis);
  const ci = caretPage(); if (ci >= 0) { want.add(ci); want.add(ci + 1); }
  for (let i = 0; i < S.pageEls.length; i++) {
    const pe = S.pageEls[i];
    if (want.has(i)) renderPage(i);
    else if (pe.live && !want.has(i)) { /* keep rendered pages; cheap */ }
  }
}

function renderPage(i){
  const pe = S.pageEls[i]; if (!pe) return;
  const p = S.res.pages[i];
  const sig = pageSig(p) + '|k' + S.k;
  if (pe.live && pe.sig === sig) return;
  const L = S.doc.layout, k = S.k;
  const page = document.createElement('div');
  page.className = 'page';
  page.style.width = (L.pageW * k) + 'px';
  page.style.height = (L.pageH * k) + 'px';
  page.style.fontSize = (S.fontPt * k) + 'px';
  page.style.lineHeight = (L.rowH * k) + 'px';
  for (const l of p.lines) {
    const d = document.createElement('div');
    d.className = 'line';
    const editable = l.kind !== 'pn' && l.kind !== 'more' && l.kind !== 'contcue';
    if (!editable) { d.contentEditable = 'false'; d.classList.add('gen'); }
    d.dataset.el = l.el; d.dataset.off = l.off; d.dataset.kind = l.kind;
    d.style.left = (l.x * k) + 'px';
    d.style.top = ((l.y - S.fontPt * 0.79) * k) + 'px';
    d.style.height = (L.rowH * k) + 'px';
    d.textContent = l.text;
    page.appendChild(d);
  }
  pe.wrap.replaceChildren(page);
  pe.wrap.style.width = (L.pageW * k) + 'px';
  pe.wrap.style.height = (L.pageH * k) + 'px';
  pe.page = page; pe.sig = sig; pe.live = true;
}

function renderAfterEdit(){
  const n = S.res.pages.length;
  if (n !== S.pageEls.length) { buildPages(); }
  renderAllVisible();
  restoreCaret();
  rail(); status(); saveSoon();
}

function rerenderAll(){ computeK(); for (const pe of S.pageEls){ pe.sig=null; } buildPages(); renderAllVisible(); restoreCaret(); }

// ---------- caret mapping ----------
function caretPage(){
  if (!S.caret) return -1;
  for (let i = 0; i < S.res.pages.length; i++)
    for (const l of S.res.pages[i].lines)
      if (l.el === S.caret.el) return i;
  return -1;
}

function domCaret(){        // DOM selection -> {el, off} | null
  const sel = getSelection();
  if (!sel.anchorNode) return null;
  let n = sel.anchorNode;
  const line = (n.nodeType === 3 ? n.parentElement : n).closest?.('.line');
  if (!line || !line.dataset.el || line.dataset.el === 'pn') return null;
  const within = n.nodeType === 3 ? sel.anchorOffset : 0;
  return { el: line.dataset.el, off: (+line.dataset.off || 0) + within };
}
function domRange(){        // both ends, ordered by document position
  const sel = getSelection();
  if (sel.rangeCount === 0) return null;
  const a = pointFrom(sel.anchorNode, sel.anchorOffset);
  const f = pointFrom(sel.focusNode, sel.focusOffset);
  if (!a || !f) return null;
  if (a.el === f.el) return a.off <= f.off ? [a, f] : [f, a];
  const ia = orderKey(a), ifo = orderKey(f);
  return ia <= ifo ? [a, f] : [f, a];
}
function pointFrom(node, offset){
  if (!node) return null;
  const el = (node.nodeType === 3 ? node.parentElement : node);
  const line = el.closest?.('.line');
  if (!line || !line.dataset.el) return null;
  const within = node.nodeType === 3 ? offset : (offset > 0 ? line.textContent.length : 0);
  return { el: line.dataset.el, off: (+line.dataset.off || 0) + within };
}
function orderKey(pt){
  if (pt.el.startsWith('title:')) return -1e6 + (+pt.el.slice(6));
  const i = S.doc.elements.findIndex(e => e.id === pt.el);
  return i * 1e6 + pt.off;
}

function syncCaret(){ const dc = domCaret(); if (dc) S.caret = dc; return S.caret; }

function restoreCaret(){
  if (!S.caret) return;
  const { el, off } = S.caret;
  let best = null;
  for (const pe of S.pageEls) {
    if (!pe.live || !pe.page) continue;
    for (const d of pe.page.children) {
      if (d.dataset.el !== el) continue;
      const start = +d.dataset.off || 0, len = d.textContent.length;
      if (off >= start && off <= start + len) { best = { d, at: off - start }; }
      else if (!best && off >= start) best = { d, at: len };
    }
  }
  if (!best) { const i = caretPage(); if (i >= 0) { renderPage(i); return restoreCaretOnce(el, off); } return; }
  placeCaret(best.d, best.at);
}
function restoreCaretOnce(el, off){
  for (const pe of S.pageEls) if (pe.live && pe.page)
    for (const d of pe.page.children)
      if (d.dataset.el === el) {
        const start = +d.dataset.off || 0, len = d.textContent.length;
        if (off >= start && off <= start + len) return placeCaret(d, off - start);
      }
}
function placeCaret(lineDiv, at){
  const r = document.createRange();
  const tn = lineDiv.firstChild;
  if (tn && tn.nodeType === 3) r.setStart(tn, Math.min(at, tn.length));
  else r.setStart(lineDiv, 0);
  r.collapse(true);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

// ---------- model ops + undo ----------
const elById = id => S.doc.elements.find(e => e.id === id);
const elIndex = id => S.doc.elements.findIndex(e => e.id === id);

function pushUndo(rec){ S.redo = []; S.undo.push(rec); if (S.undo.length > 600) S.undo.shift(); }

function opText(id, text, caretAfter){
  const el = id.startsWith('title:') ? null : elById(id);
  if (id.startsWith('title:')) {
    const i = +id.slice(6); const t = S.doc.titlePage[i]; if (!t) return;
    const last = S.undo[S.undo.length - 1];
    if (last && last.k === 'ttext' && last.i === i && Date.now() - last.ts < 900) { last.after = text; last.ca = caretAfter; last.ts = Date.now(); }
    else pushUndo({ k: 'ttext', i, before: t.text, after: text, cb: S.caret, ca: caretAfter, ts: Date.now() });
    t.text = text; delete t.x; // recenter on edit
    if (i === 0) { S.doc.title = text || 'UNTITLED'; $('#docTitle').textContent = S.doc.title; }
  } else {
    if (!el) return;
    const last = S.undo[S.undo.length - 1];
    if (last && last.k === 'text' && last.id === id && Date.now() - last.ts < 900) { last.after = text; last.ca = caretAfter; last.ts = Date.now(); }
    else pushUndo({ k: 'text', id, before: el.text, after: text, cb: S.caret, ca: caretAfter, ts: Date.now() });
    el.text = text;
  }
  S.caret = caretAfter;
  repaginate(); renderAfterEdit();
}

function opSplice(i, delCount, inserted, caretAfter){
  const removed = S.doc.elements.slice(i, i + delCount).map(e => ({ ...e }));
  pushUndo({ k: 'splice', i, removed, inserted: inserted.map(e => ({ ...e })), cb: S.caret, ca: caretAfter, ts: Date.now() });
  S.doc.elements.splice(i, delCount, ...inserted);
  S.caret = caretAfter;
  repaginate(); renderAfterEdit();
}

function opConvert(id, type){
  const el = elById(id); if (!el) return;
  pushUndo({ k: 'convert', id, before: el.type, after: type, cb: S.caret, ca: S.caret, ts: Date.now() });
  el.type = type;
  if (type === 'scene' || type === 'character' || type === 'transition' || type === 'shot') el.text = el.text.toUpperCase();
  repaginate(); renderAfterEdit();
}

function undo(redo){
  const src = redo ? S.redo : S.undo, dst = redo ? S.undo : S.redo;
  const rec = src.pop(); if (!rec) return;
  dst.push(rec);
  if (rec.k === 'text') { const el = elById(rec.id); if (el) el.text = redo ? rec.after : rec.before; }
  else if (rec.k === 'ttext') { const t = S.doc.titlePage[rec.i]; if (t) { t.text = redo ? rec.after : rec.before; if (rec.i === 0) { S.doc.title = t.text; $('#docTitle').textContent = t.text; } } }
  else if (rec.k === 'splice') {
    if (redo) S.doc.elements.splice(rec.i, rec.removed.length, ...rec.inserted.map(e => ({ ...e })));
    else S.doc.elements.splice(rec.i, rec.inserted.length, ...rec.removed.map(e => ({ ...e })));
  }
  else if (rec.k === 'convert') { const el = elById(rec.id); if (el) el.type = redo ? rec.after : rec.before; }
  S.caret = redo ? rec.ca : rec.cb;
  repaginate(); renderAfterEdit();
}

// ---------- editing behaviour: the Final Draft grammar ----------
// Final Draft's own grammar. FOLLOW is the ReturnKey= attribute from FD12's shipped
// Screenplay.fdxt template; TAB_* is the documented Tab behaviour (hardcoded in FD,
// not a per-element setting). Do not "improve" these — they are what FD does.
const FOLLOW = { scene:'action', action:'action', character:'dialogue', paren:'dialogue', dialogue:'action', transition:'scene', shot:'action', general:'general' };
const TAB_TO = { scene:'action', action:'character', character:'paren', paren:'dialogue', dialogue:'paren', transition:'scene', shot:'character', general:'action' };
const TAB_BLANK = { ...TAB_TO, character:'transition' };  // FD: Tab in a blank Character → Transition
const TAB_BACK = { action:'scene', character:'action', paren:'dialogue', dialogue:'paren', transition:'character', scene:'transition', general:'action' };
// FD shortcut numbers: 1 Scene … 7 Shot, 0 General (8/9 are Cast List / New Act, not modelled)
const SHORTCUT = { '1':'scene', '2':'action', '3':'character', '4':'paren', '5':'dialogue', '6':'transition', '7':'shot', '0':'general' };
const SHORTCUT_OF = Object.fromEntries(Object.entries(SHORTCUT).map(([k, v]) => [v, k]));
const UPPER = t => (t === 'scene' || t === 'character' || t === 'transition' || t === 'shot');
const TYPE_LABEL = { scene:'Scene Heading', action:'Action', character:'Character', paren:'Parenthetical', dialogue:'Dialogue', transition:'Transition', shot:'Shot', general:'General' };

function newEl(type, text){ return { id: E.uid(), type, text: text || '' }; }

function handleEnter(){
  closePops();
  const c = syncCaret(); if (!c) return;
  if (c.el.startsWith('title:')) { // new title line
    const i = +c.el.slice(6);
    const t = S.doc.titlePage[i];
    pushUndo({ k: 'tsplice', i: i + 1, ts: Date.now(), cb: S.caret, ca: { el: 'title:' + (i + 1), off: 0 } });
    S.doc.titlePage.splice(i + 1, 0, { text: '', row: (t.row || 0) + 2 });
    S.caret = { el: 'title:' + (i + 1), off: 0 };
    repaginate(); renderAfterEdit(); return;
  }
  const el = elById(c.el); if (!el) return;
  if (el.text === '') { openElementMenu(); return; }        // FD: Return on empty → element menu
  // all-caps + TO: → transition
  if (el.type === 'action' && /TO:\s*$/.test(el.text) && el.text === el.text.toUpperCase()) {
    opConvert(el.id, 'transition');
  }
  const i = elIndex(c.el);
  if (c.off >= el.text.length) {
    const nt = FOLLOW[el.type] || 'action';
    const ne = newEl(nt, '');
    opSplice(i + 1, 0, [ne], { el: ne.id, off: 0 });
  } else if (c.off === 0) {
    const ne = newEl(el.type === 'dialogue' ? 'character' : el.type, '');
    opSplice(i, 0, [ne], { el: el.id, off: 0 });
  } else { // split element
    const head = el.text.slice(0, c.off).replace(/\s+$/, '');
    const tail = el.text.slice(c.off).replace(/^\s+/, '');
    const ne = newEl(el.type, tail);
    pushUndo({ k: 'splice', i, removed: [{ ...el }], inserted: [{ ...el, text: head }, { ...ne }], cb: S.caret, ca: { el: ne.id, off: 0 }, ts: Date.now() });
    el.text = head;
    S.doc.elements.splice(i + 1, 0, ne);
    S.caret = { el: ne.id, off: 0 };
    repaginate(); renderAfterEdit();
  }
}

// The separator this script actually uses between location and time (" - " vs " – ").
function sceneSep(){
  const hits = new Map();
  for (const e of S.doc.elements) if (e.type === 'scene') {
    const m = e.text.match(/\s([-–—])\s/);
    if (m) hits.set(m[1], (hits.get(m[1]) || 0) + 1);
  }
  let best = null, n = 0;
  for (const [k, c] of hits) if (c > n) { n = c; best = k; }
  return best ? ' ' + best + ' ' : ' - ';
}

// FD: inside a Scene Heading, Tab walks the sub-fields — intro, then location, then time,
// raising the matching SmartType list at each stop.
function sceneTab(el){
  const t = el.text;
  if (/^(INT\.?\/EXT|EXT\.?\/INT|I\/E|INT|EXT|EST)\.?$/i.test(t.trim())) {
    const txt = t.trim().toUpperCase().replace(/\.$/, '') + '. ';
    opText(el.id, txt, { el: el.id, off: txt.length });
    smartType(elById(el.id));
    return true;
  }
  if (!/\s[-–—]\s/.test(t)) {
    const txt = t.replace(/\s+$/, '') + sceneSep();
    opText(el.id, txt, { el: el.id, off: txt.length });
    smartType(elById(el.id));
    return true;
  }
  return false;   // time already present → Tab falls through to a new Action paragraph
}

// FD's "auto-guess next character": in a two-hander, offer the *other* speaker first.
function guessCharacter(id){
  const i = elIndex(id);
  const recent = [];
  for (let j = i - 1; j >= 0 && recent.length < 2; j--) {
    const e = S.doc.elements[j];
    if (e.type !== 'character') continue;
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base && !recent.includes(base)) recent.push(base);
  }
  const guess = recent[1] || recent[0];
  const names = characterNames();
  const ordered = guess ? [guess, ...names.filter(n => n !== guess)] : names;
  if (!ordered.length) return;
  popup(ordered.slice(0, 6).map(n => ({ label: n })), { kind: 'smart', onPick: it => {
    opText(id, it.label, { el: id, off: it.label.length });
  }});
}

function handleTab(shift){
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  closePops();

  // FD: Tab in a blank paragraph converts it — one deterministic jump, never a cycle.
  if (el.text === '') {
    const next = (shift ? TAB_BACK : TAB_BLANK)[el.type];
    if (!next) return;
    opConvert(el.id, next);
    if (next === 'character') guessCharacter(el.id);
    return;
  }
  if (shift || c.off < el.text.length) return;   // Tab acts only from the end of a paragraph
  if (el.type === 'scene' && sceneTab(el)) return;

  const nt = TAB_TO[el.type] || 'character';
  const ne = newEl(nt, nt === 'paren' ? '()' : '');
  opSplice(elIndex(el.id) + 1, 0, [ne], { el: ne.id, off: nt === 'paren' ? 1 : 0 });
  if (nt === 'character') guessCharacter(ne.id);
}

function handleInsertText(data){
  const c = syncCaret(); if (!c) return;
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) { deleteRange(r); }
  const cc = S.caret;
  if (cc.el.startsWith('title:')) {
    const t = S.doc.titlePage[+cc.el.slice(6)]; if (!t) return;
    const txt = t.text.slice(0, cc.off) + data + t.text.slice(cc.off);
    opText(cc.el, txt, { el: cc.el, off: cc.off + data.length });
    return;
  }
  const el = elById(cc.el); if (!el) return;
  let ins = data;
  if (UPPER(el.type)) ins = ins.toUpperCase();
  // "(" at start of empty dialogue → parenthetical
  if (el.type === 'dialogue' && el.text === '' && ins === '(') {
    opConvert(el.id, 'paren');
    opText(el.id, '()', { el: el.id, off: 1 });
    return;
  }
  // skip over the closing paren
  if (el.type === 'paren' && ins === ')' && el.text[cc.off] === ')') {
    S.caret = { el: el.id, off: cc.off + 1 }; restoreCaret(); status(); return;
  }
  let text = el.text.slice(0, cc.off) + ins + el.text.slice(cc.off);
  let caretOff = cc.off + ins.length;
  // int./ext. auto-detects a scene heading
  if (el.type === 'action' && /^(INT|EXT|I\/E|EST)([./]|[./]\s?EXT)/i.test(text) && !/^(INT|EXT|I\/E|EST)$/i.test(text)) {
    el.type = 'scene'; text = text.toUpperCase();
  }
  opText(el.id, text, { el: el.id, off: caretOff });
  // FD: "(" in a Character cue raises the Character Extension list
  if (el.type === 'character' && ins === '(') { openExtMenu(); return; }
  smartType(el);
}

function deleteRange([a, b]){
  if (a.el === b.el) {
    if (a.el.startsWith('title:')) {
      const t = S.doc.titlePage[+a.el.slice(6)];
      opText(a.el, t.text.slice(0, a.off) + t.text.slice(b.off), { el: a.el, off: a.off });
    } else {
      const el = elById(a.el); if (!el) return;
      opText(a.el, el.text.slice(0, a.off) + el.text.slice(b.off), { el: a.el, off: a.off });
    }
    return;
  }
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return; // don't cross the title boundary
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return;
  const ea = elById(a.el), eb = elById(b.el);
  const merged = { ...ea, text: ea.text.slice(0, a.off) + eb.text.slice(b.off) };
  opSplice(ia, ib - ia + 1, [merged], { el: merged.id, off: a.off });
}

function handleBackspace(){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c) return;
  if (c.el.startsWith('title:')) {
    const i = +c.el.slice(6); const t = S.doc.titlePage[i];
    if (c.off > 0) return opText(c.el, t.text.slice(0, c.off - 1) + t.text.slice(c.off), { el: c.el, off: c.off - 1 });
    if (t.text === '' && S.doc.titlePage.length > 1) {
      pushUndo({ k: 'tsplice-del', i, entry: { ...t }, cb: S.caret, ca: { el: 'title:' + Math.max(0, i - 1), off: (S.doc.titlePage[i - 1] || { text: '' }).text.length }, ts: Date.now() });
      S.doc.titlePage.splice(i, 1);
      S.caret = { el: 'title:' + Math.max(0, i - 1), off: (S.doc.titlePage[Math.max(0, i - 1)] || { text: '' }).text.length };
      repaginate(); renderAfterEdit();
    }
    return;
  }
  const el = elById(c.el); if (!el) return;
  if (c.off > 0) {
    opText(c.el, el.text.slice(0, c.off - 1) + el.text.slice(c.off), { el: c.el, off: c.off - 1 });
    smartType(el);
    return;
  }
  const i = elIndex(c.el);
  if (i <= 0) return;
  const prev = S.doc.elements[i - 1];
  if (el.text === '') opSplice(i, 1, [], { el: prev.id, off: prev.text.length });
  else {
    const merged = { ...prev, text: prev.text + el.text };
    opSplice(i - 1, 2, [merged], { el: prev.id, off: prev.text.length });
  }
}
function handleDelete(){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  if (c.off < el.text.length) return opText(c.el, el.text.slice(0, c.off) + el.text.slice(c.off + 1), { el: c.el, off: c.off });
  const i = elIndex(c.el);
  const next = S.doc.elements[i + 1]; if (!next) return;
  if (next.text === '') opSplice(i + 1, 1, [], { el: el.id, off: c.off });
  else { const merged = { ...el, text: el.text + next.text }; opSplice(i, 2, [merged], { el: el.id, off: c.off }); }
}

// ---------- popups: element menu, smarttype, extensions, export ----------
function closePops(){ document.querySelectorAll('.pop').forEach(p => p.remove()); S.menu = null; }

function caretRect(){
  const sel = getSelection();
  if (sel.rangeCount) {
    const r = sel.getRangeAt(0).cloneRange();
    const rects = r.getClientRects();
    if (rects.length) return rects[0];
    const n = sel.anchorNode;
    const el = n && (n.nodeType === 3 ? n.parentElement : n);
    if (el && el.getBoundingClientRect) return el.getBoundingClientRect();
  }
  return { left: innerWidth / 2, bottom: innerHeight / 2, top: innerHeight / 2 };
}

function popup(items, opts){
  closePops();
  const pop = document.createElement('div');
  pop.className = 'pop';
  if (opts.cap) { const c = document.createElement('div'); c.className = 'cap'; c.textContent = opts.cap; pop.appendChild(c); }
  items.forEach((it, idx) => {
    const d = document.createElement('div');
    d.className = 'it' + (idx === 0 ? ' sel' : '');
    d.innerHTML = '<span></span><span class="k"></span>';
    d.firstChild.textContent = it.label;
    d.lastChild.textContent = it.key || '';
    d.addEventListener('mousedown', ev => { ev.preventDefault(); pick(idx); });
    pop.appendChild(d);
  });
  document.body.appendChild(pop);
  const r = caretRect();
  const W = pop.offsetWidth, H = pop.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - W - 8);
  let y = r.bottom + 6; if (y + H > innerHeight - 8) y = Math.max(8, r.top - H - 6);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  const state = { el: pop, items, sel: 0, kind: opts.kind || 'menu' };
  S.menu = state;
  function pick(i){ const it = items[i]; closePops(); opts.onPick(it, i); }
  state.move = d => {
    state.sel = (state.sel + d + items.length) % items.length;
    [...pop.querySelectorAll('.it')].forEach((n, i) => n.classList.toggle('sel', i === state.sel));
  };
  state.accept = () => pick(state.sel);
}

function openElementMenu(){
  const c = S.caret; if (!c || c.el.startsWith('title:')) return;
  const items = E.TYPES.map(t => ({ label: TYPE_LABEL[t], key: '⌘' + SHORTCUT_OF[t], type: t }));
  popup(items, { cap: 'element', kind: 'element', onPick: it => {
    const el = elById(S.caret.el); if (!el) return;
    opConvert(el.id, it.type);
    if (it.type === 'character') guessCharacter(el.id);
  }});
}

// FD's Character Extension list (shipped defaults, from Screenplay.fdxt <SmartType>)
const EXTENSIONS = ['(V.O.)', '(O.S.)', '(O.C.)', "(CONT'D)", '(SUBTITLE)', '(TEXT)'];
function openExtMenu(){
  popup(EXTENSIONS.map(x => ({ label: x })), { cap: 'extension', kind: 'ext', onPick: it => {
    const el = elById(S.caret.el); if (!el) return;
    const base = el.text.replace(/\s*\([^)]*\)?\s*$/, '');
    const txt = base + ' ' + it.label;
    opText(el.id, txt, { el: el.id, off: txt.length });
  }});
}

function openExportMenu(){
  popup([
    { label: 'PDF — print / save as pdf', key: '⌘P', act: 'pdf' },
    { label: 'Fountain (.fountain)', act: 'fountain' },
    { label: 'PICA JSON (.json)', act: 'json' },
  ], { cap: 'export', kind: 'export', onPick: it => doExport(it.act) });
}

// SmartType — FD's six lists. Seeds below are FD12's shipped defaults; characters and
// locations come from the script itself.
const TIMES = ['DAY', 'NIGHT', 'AFTERNOON', 'MORNING', 'EVENING', 'LATER', 'MOMENTS LATER', 'CONTINUOUS', 'THE NEXT DAY', 'MAGIC HOUR', 'DAWN', 'DUSK', 'SAME', 'SAME TIME'];
const TRANSITIONS = ['CUT TO:', 'FADE IN:', 'FADE OUT.', 'FADE TO:', 'DISSOLVE TO:', 'BACK TO:', 'MATCH CUT TO:', 'JUMP CUT TO:', 'FADE TO BLACK.', 'SMASH CUT TO:', 'CUT TO BLACK.', 'TIME CUT:'];

function characterNames(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'character') {
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base) freq.set(base, (freq.get(base) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function locations(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'scene') {
    const m = e.text.match(/^(?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT|EXT|I\/E|EST)[.\s]+(.*?)(?:\s+[–—-]\s+[A-Z' ]+)?$/);
    if (m && m[1]) freq.set(m[1].trim(), (freq.get(m[1]) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function smartType(el){
  if (!S.caret || S.caret.el !== el.id || S.caret.off < el.text.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  let sugg = [], replFrom = 0;
  const t = el.text;
  if (el.type === 'character') {
    sugg = characterNames().filter(n => n.startsWith(t.toUpperCase()) && n !== t.toUpperCase());
    replFrom = 0;
  } else if (el.type === 'scene') {
    const mTime = t.match(/^(.*[–—-]\s+)([A-Z ]*)$/);
    const mLoc = t.match(/^((?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT\.|EXT\.|I\/E\.?|EST\.)\s+)(.*)$/);
    if (mTime) { sugg = TIMES.filter(x => x.startsWith(mTime[2]) && x !== mTime[2]); replFrom = mTime[1].length; }
    else if (mLoc) { sugg = locations().filter(x => x.startsWith(mLoc[2].toUpperCase()) && x !== mLoc[2].toUpperCase()); replFrom = mLoc[1].length; }
    else { sugg = ['INT. ', 'EXT. ', 'INT./EXT. ', 'EST. '].filter(x => x.startsWith(t.toUpperCase()) && t.length > 0); replFrom = 0; }
  } else if (el.type === 'transition') {
    sugg = TRANSITIONS.filter(x => x.startsWith(t.toUpperCase()) && x !== t.toUpperCase()); replFrom = 0;
  } else { if (S.menu?.kind === 'smart') closePops(); return; }
  sugg = sugg.slice(0, 6);
  if (!sugg.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  popup(sugg.map(x => ({ label: x })), { kind: 'smart', onPick: it => {
    const txt = el.text.slice(0, replFrom) + it.label;
    opText(el.id, txt, { el: el.id, off: txt.length });
  }});
}

// ---------- rail / status ----------
function rail(){
  const dl = $('#docList');
  dl.innerHTML = '';
  for (const d of store.index()) {
    const b = document.createElement('button');
    b.className = 'doc-item' + (d.id === S.docId ? ' current' : '');
    b.innerHTML = '<span class="ttl"></span><span class="pg"></span>';
    b.firstChild.textContent = (d.title || 'UNTITLED').toLowerCase();
    b.lastChild.textContent = d.pages ? d.pages + 'p' : '';
    b.addEventListener('mousedown', ev => { ev.preventDefault(); if (d.id !== S.docId) openDoc(d.id); });
    dl.appendChild(b);
  }
  const sl = $('#sceneList');
  sl.innerHTML = '';
  let n = 0;
  const seen = new Set();
  for (let i = 0; i < S.res.pages.length; i++) for (const l of S.res.pages[i].lines) {
    if (l.kind !== 'scene' || seen.has(l.el) ) continue;
    seen.add(l.el);
    n++;
    const b = document.createElement('button');
    b.className = 'scene-item';
    b.dataset.el = l.el;
    b.innerHTML = '<span class="no"></span><span class="sl"></span>';
    b.firstChild.textContent = n;
    b.lastChild.textContent = l.text;
    const pi = i, elid = l.el;
    b.addEventListener('mousedown', ev => {
      ev.preventDefault();
      S.pageEls[pi]?.wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      S.caret = { el: elid, off: 0 };
      setTimeout(() => { renderAllVisible(); restoreCaret(); status(); }, 60);
      $('#rail').classList.remove('open');
    });
    sl.appendChild(b);
  }
}

function status(){
  const c = S.caret;
  let label = '—';
  if (c) {
    if (c.el.startsWith('title:')) label = 'TITLE PAGE';
    else { const el = elById(c.el); if (el) label = TYPE_LABEL[el.type].toUpperCase() + ' · ⌘' + SHORTCUT_OF[el.type]; }
  }
  $('#stType').textContent = label;
  // FD's status bar tells you what Enter and Tab will insert next
  let hint = '⌘\\ elements · ? keys';
  if (c && !c.el.startsWith('title:')) {
    const el = elById(c.el);
    if (el) {
      const blank = el.text === '';
      const ent = blank ? 'element menu' : TYPE_LABEL[FOLLOW[el.type]];
      let tab;
      if (blank) tab = TYPE_LABEL[TAB_BLANK[el.type]] || '—';
      else if (el.type === 'scene') tab = /\s[-–—]\s/.test(el.text) ? TYPE_LABEL.action : (/^(INT\.?\/EXT|EXT\.?\/INT|I\/E|INT|EXT|EST)\.?$/i.test(el.text.trim()) ? 'location' : 'time');
      else tab = TYPE_LABEL[TAB_TO[el.type]] || '—';
      hint = '⏎ ' + ent + '  ·  ⇥ ' + tab;
    }
  }
  $('#stHint').textContent = hint;
  const total = S.res.count;
  const scenes = S.doc.elements.filter(e => e.type === 'scene').length;
  const vis = [...S.vis].sort((a, b) => a - b)[0] ?? 0;
  const pn = Math.max(1, (S.showTitle && S.doc.titlePage.length ? vis : vis + 1));
  $('#stPage').textContent = 'page ' + Math.min(pn, total) + ' / ' + total + ' · ' + scenes + ' scenes';
  notifyNative();
}

function saveSoon(){
  clearTimeout(S.saveTimer);
  $('#stSave').textContent = '· · ·';
  S.saveTimer = setTimeout(flushSave, 700);
}
function flushSave(){
  if (!S.doc) return;
  store.save(S.docId, S.doc);
  S.lastSave = new Date();
  $('#stSave').textContent = 'saved ' + S.lastSave.toTimeString().slice(0, 5);
  if (Date.now() - S.snapAt > 4 * 60e3) { store.snapshot(S.docId, S.doc); S.snapAt = Date.now(); }
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- import ----------
async function importPdfBuffer(buf, name){
  overlayCard(`<h2>Importing</h2><div class="sub">${(name || 'pdf').replace(/</g,'&lt;')}</div><div id="importLog">reading…</div>`);
  const log = m => { const n = $('#importLog'); if (n) n.textContent = m; };
  try {
    // PICA.app bundles pdf.js so import works with no network; the web build uses the CDN.
    let mod, workerSrc;
    try {
      mod = await import('./vendor/pdf.min.mjs');
      workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href;
    } catch {
      mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs');
      workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs';
    }
    mod.GlobalWorkerOptions.workerSrc = workerSrc;
    const pdf = await mod.getDocument({ data: buf }).promise;
    const raw = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      raw.push({
        width: vp.width, height: vp.height,
        items: tc.items.filter(i => i.str && i.str.length).map(i => ({
          x: i.transform[4], y: vp.height - i.transform[5], w: i.width, str: i.str,
        })),
      });
      if (p % 10 === 0 || p === pdf.numPages) log('reading page ' + p + ' / ' + pdf.numPages + ' …');
    }
    if (!raw.some(p => p.items.length)) throw new Error('no text layer — this looks like a scanned PDF');
    log('classifying…');
    await new Promise(r => setTimeout(r, 30));
    const doc = E.importPdf(raw);
    doc.title = doc.title || (name || 'IMPORTED').replace(/\.pdf$/i, '').toUpperCase();
    const id = E.uid();
    store.save(id, doc);
    closeOverlay();
    openDoc(id);
    toast('imported · ' + S.res.count + ' pages · ' + doc.elements.length + ' elements');
  } catch (err) {
    overlayCard(`<h2>Import failed</h2><div class="sub">pdf</div><p>${String(err.message || err).replace(/</g,'&lt;')}</p>
      <p>PICA needs a text-layer PDF (one exported from screenwriting software — not a scan). It also needs the network once, to fetch the PDF reader.</p>
      <div class="foot"><button class="hbtn" onclick="document.getElementById('overlay').classList.remove('show')">close</button></div>`);
  }
}

function importJson(text, name){
  try {
    const doc = JSON.parse(text);
    if (!doc || !Array.isArray(doc.elements) || !doc.layout) throw new Error('not a PICA document');
    const id = E.uid();
    store.save(id, doc);
    openDoc(id);
    toast('opened · ' + (doc.title || name));
  } catch (e) { toast('could not read json'); }
}

// ---------- export ----------
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function safeName(){ return (S.doc.title || 'script').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'script'; }
function doExport(act){
  if (act === 'fountain') download(safeName() + '.fountain', E.toFountain(S.doc));
  else if (act === 'json') download(safeName() + '.json', JSON.stringify(S.doc, null, 1), 'application/json');
  else if (act === 'pdf') printAll();
}
function printPageCSS(){
  let st = $('#printPage');
  if (!st) { st = document.createElement('style'); st.id = 'printPage'; document.head.appendChild(st); }
  st.textContent = '@page{ size:' + S.doc.layout.pageW + 'pt ' + S.doc.layout.pageH + 'pt; margin:0; }';
}
function printAll(){
  const zoomWas = S.zoom;
  S.zoom = 0.75; // k = 1 → true pt size
  computeK();
  for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
  requestAnimationFrame(() => { window.print(); S.zoom = zoomWas; rerenderAll(); });
}

// ---------- overlay ----------
function overlayCard(html){
  const o = $('#overlay');
  o.innerHTML = '<div class="card">' + html + '</div>';
  o.classList.add('show');
}
function closeOverlay(){ const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = ''; }
$('#overlay').addEventListener('mousedown', e => { if (e.target === e.currentTarget) closeOverlay(); });

function showKeys(){
  overlayCard(`<h2>The grammar</h2><div class="sub">tab to cycle · enter to advance</div>
  <table>
  <tr><td>Enter</td><td>the next element, exactly as Final Draft defines it — Scene Heading→Action, Action→Action, Character→Dialogue, Parenthetical→Dialogue, Dialogue→Action, Transition→Scene Heading, Shot→Action. On a <em>blank</em> element it opens the element menu instead (choose by number, first letter or arrows).</td></tr>
  <tr><td>Tab</td><td>one deterministic jump, not a cycle. From a blank paragraph it converts it; from the end of a written one it starts the next: Scene Heading→Action, Action→Character, Character→Parenthetical (a <em>blank</em> Character→Transition), Dialogue→Parenthetical, Parenthetical→Dialogue, Transition→Scene Heading. ⇧Tab steps back.</td></tr>
  <tr><td>Tab in a slug</td><td>walks the scene heading itself: INT → adds “. ” and offers your locations → adds “ – ” and offers times → then Action.</td></tr>
  <tr><td>⌘1 – ⌘7, ⌘0</td><td>set element type directly — ${E.TYPES.map(t=>SHORTCUT_OF[t]+' '+TYPE_LABEL[t]).join(' · ')}</td></tr>
  <tr><td>⌘\\</td><td>element menu</td></tr>
  <tr><td>⌘B</td><td>show / hide the sidebar (drag its edge to resize, double-click to reset)</td></tr>
  <tr><td>⇧⌘T</td><td>show / hide the title page — hidden by default, so page 1 is the first page you write</td></tr>
  <tr><td>int. / ext.</td><td>typed in Action, becomes a Scene Heading as you type. ALL-CAPS ending in TO: becomes a Transition on Enter. “(” in empty Dialogue becomes a Parenthetical; “(” in a Character cue offers extensions.</td></tr>
  <tr><td>type ahead</td><td>SmartType completes character names, locations, times, transitions and extensions — → accepts. In a two-hander it offers the other speaker first.</td></tr>
  <tr><td>⌘Z / ⇧⌘Z</td><td>undo / redo</td></tr>
  <tr><td>⌘P</td><td>print · save as PDF — identical to the imported page</td></tr>
  <tr><td>⇧Enter</td><td>hard line break inside an element</td></tr>
  </table>
  <div class="foot"><button class="hbtn" onclick="document.getElementById('overlay').classList.remove('show')">close</button></div>`);
}

// ---------- events ----------
pagesEl.addEventListener('beforeinput', ev => {
  ev.preventDefault();
  const t = ev.inputType;
  if (t === 'insertText' && ev.data != null) handleInsertText(ev.data);
  else if (t === 'insertParagraph') handleEnter();
  else if (t === 'insertLineBreak') { const c = S.caret; if (c && !c.el.startsWith('title:')) { const el = elById(c.el); if (el) opText(el.id, el.text.slice(0, c.off) + '\n' + el.text.slice(c.off), { el: el.id, off: c.off + 1 }); } }
  else if (t === 'deleteContentBackward') handleBackspace();
  else if (t === 'deleteContentForward') handleDelete();
  else if (t === 'insertFromPaste') {
    const txt = ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '';
    if (txt) handleInsertText(txt.replace(/\r/g, ''));
  }
  else if (t === 'historyUndo') undo(false);
  else if (t === 'historyRedo') undo(true);
});

pagesEl.addEventListener('keydown', ev => {
  if (S.menu) {
    if (ev.key === 'ArrowDown') { S.menu.move(1); ev.preventDefault(); return; }
    if (ev.key === 'ArrowUp') { S.menu.move(-1); ev.preventDefault(); return; }
    if (ev.key === 'Tab' && S.menu.kind === 'element') { S.menu.move(ev.shiftKey ? -1 : 1); ev.preventDefault(); return; }
    if (ev.key === 'Enter' || (ev.key === 'Tab' && !ev.shiftKey)) { ev.preventDefault(); S.menu.accept(); return; }
    if (ev.key === 'Escape') { closePops(); ev.preventDefault(); return; }
    // FD: choose from the element popup by number, or by the element's first letter
    if (S.menu.kind === 'element') {
      if (SHORTCUT[ev.key]) {
        const i = S.menu.items.findIndex(it => it.type === SHORTCUT[ev.key]);
        if (i >= 0) { S.menu.sel = i; S.menu.accept(); ev.preventDefault(); return; }
      }
      if (/^[a-z]$/i.test(ev.key)) {
        const k = ev.key.toLowerCase();
        const hits = S.menu.items.map((it, i) => [it, i]).filter(([it]) => it.label[0].toLowerCase() === k);
        if (hits.length) {
          const at = hits.findIndex(([, i]) => i === S.menu.sel);
          S.menu.sel = hits[(at + 1) % hits.length][1];
          if (hits.length === 1) S.menu.accept(); else S.menu.move(0);
          ev.preventDefault(); return;
        }
      }
    }
    // FD: Right-Arrow completes the highlighted SmartType match
    if (S.menu.kind === 'smart' && ev.key === 'ArrowRight') { ev.preventDefault(); S.menu.accept(); return; }
  }
  if (ev.key === 'Tab') { ev.preventDefault(); handleTab(ev.shiftKey); return; }
  if (ev.key === 'Escape') { closePops(); return; }
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && !ev.shiftKey && !ev.altKey && SHORTCUT[ev.key]) {
    ev.preventDefault();
    const c = S.caret; if (!c || c.el.startsWith('title:')) return;
    opConvert(c.el, SHORTCUT[ev.key]);
    if (SHORTCUT[ev.key] === 'character') guessCharacter(c.el);
    return;
  }
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'b') { ev.preventDefault(); toggleRail(); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 't') { ev.preventDefault(); toggleTitlePage(); return; }
  if (mod && ev.key === '\\') { ev.preventDefault(); openElementMenu(); return; }
  if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(false); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(true); return; }
  if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); flushSave(); toast('saved'); return; }
  if (mod && ev.key.toLowerCase() === 'p') { ev.preventDefault(); printAll(); return; }
});

document.addEventListener('selectionchange', () => {
  const c = domCaret();
  if (c) { S.caret = c; status(); }
});
pagesEl.addEventListener('mousedown', () => { closePops(); });

canvasEl.addEventListener('scroll', () => { clearTimeout(canvasEl._t); canvasEl._t = setTimeout(status, 120); });

// header + footer buttons
$('#btnNew').addEventListener('mousedown', ev => { ev.preventDefault(); const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); toast('new script'); });
$('#railNew').addEventListener('mousedown', ev => { ev.preventDefault(); $('#btnNew').dispatchEvent(new Event('mousedown')); });
$('#btnImport').addEventListener('mousedown', ev => { ev.preventDefault(); $('#fileIn').click(); });
$('#railImport').addEventListener('mousedown', ev => { ev.preventDefault(); $('#fileIn').click(); });
$('#btnExport').addEventListener('mousedown', ev => { ev.preventDefault(); openExportMenu(); });
$('#btnKeys').addEventListener('mousedown', ev => { ev.preventDefault(); showKeys(); });
$('#btnTheme').addEventListener('mousedown', ev => {
  ev.preventDefault();
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  const ui = LS.get('pica.ui', {}); ui.theme = next; LS.set('pica.ui', ui);
});
// ---------- sidebar: collapsible (⌘B / ☰) and drag-resizable ----------
function toggleRail(){
  if (matchMedia('(max-width: 880px)').matches) { $('#rail').classList.toggle('open'); return; }
  const hidden = document.body.classList.toggle('railhidden');
  const ui = LS.get('pica.ui', {}); ui.railHidden = hidden; LS.set('pica.ui', ui);
  if (S.zoom == null) setTimeout(rerenderAll, 30);   // refit the page to the wider canvas
}
function applyRailPrefs(){
  const ui = LS.get('pica.ui', {});
  if (ui.railW) document.documentElement.style.setProperty('--railw', ui.railW + 'px');
  document.body.classList.toggle('railhidden', !!ui.railHidden);
}
$('#railToggle').addEventListener('mousedown', ev => { ev.preventDefault(); toggleRail(); });
$('#railGrip').addEventListener('mousedown', ev => {
  ev.preventDefault();
  const grip = $('#railGrip');
  grip.classList.add('dragging'); document.body.classList.add('resizing');
  const move = e => {
    const w = Math.max(150, Math.min(560, e.clientX));
    document.documentElement.style.setProperty('--railw', w + 'px');
  };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    grip.classList.remove('dragging'); document.body.classList.remove('resizing');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--railw')) || 248;
    const ui = LS.get('pica.ui', {}); ui.railW = w; LS.set('pica.ui', ui);
    if (S.zoom == null) rerenderAll();
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('#railGrip').addEventListener('dblclick', () => {
  document.documentElement.style.setProperty('--railw', '15.5rem');
  const ui = LS.get('pica.ui', {}); delete ui.railW; LS.set('pica.ui', ui);
  if (S.zoom == null) rerenderAll();
});
$('#zIn').addEventListener('mousedown', ev => { ev.preventDefault(); S.zoom = Math.min(1.6, (S.zoom ?? fitZoom()) + .1); rerenderAll(); });
$('#zOut').addEventListener('mousedown', ev => { ev.preventDefault(); S.zoom = Math.max(.3, (S.zoom ?? fitZoom()) - .1); rerenderAll(); });
$('#zFit').addEventListener('mousedown', ev => { ev.preventDefault(); S.zoom = null; rerenderAll(); });

$('#fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  if (/\.json$/i.test(f.name)) importJson(await f.text(), f.name);
  else importPdfBuffer(await f.arrayBuffer(), f.name);
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (/\.json$/i.test(f.name)) importJson(await f.text(), f.name);
  else if (/\.pdf$/i.test(f.name)) importPdfBuffer(await f.arrayBuffer(), f.name);
});

$('#docTitle').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); } });
$('#docTitle').addEventListener('blur', ev => {
  const t = ev.target.textContent.trim() || 'UNTITLED';
  S.doc.title = t;
  if (S.doc.titlePage[0]) S.doc.titlePage[0].text = t.toUpperCase();
  ev.target.textContent = t;
  repaginate(); renderAfterEdit();
});

addEventListener('resize', () => { if (S.zoom == null) { clearTimeout(window._rz); window._rz = setTimeout(rerenderAll, 150); } });
addEventListener('beforeunload', () => flushSave());
addEventListener('beforeprint', () => {});

// ---------- native bridge ----------
// PICA.app drives the page through this. Harmless in a browser; the app's menu bar,
// Dock drops and Print command all land here rather than duplicating any editor logic.
window.PICA_API = {
  newDoc(){ const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); toast('new script'); },
  importPdf(){ $('#fileIn').click(); },
  // Files opened natively arrive as a URL the app serves, not as inline bytes — a
  // screenplay-sized base64 literal does not survive evaluateJavaScript.
  importUrl(url, name){
    fetch(url).then(r => {
      if (!r.ok) throw new Error('could not read ' + name);
      return r.arrayBuffer();
    }).then(buf => {
      if (/\.json$/i.test(name || '')) importJson(new TextDecoder().decode(buf), name);
      else importPdfBuffer(buf, name);
    }).catch(e => toast(String(e.message || e)));
  },
  exportMenu(){ openExportMenu(); },
  elementMenu(){ openElementMenu(); },
  showKeys(){ showKeys(); },
  undo(){ undo(false); },
  redo(){ undo(true); },
  save(){ flushSave(); },
  toggleRail(){ toggleRail(); },
  toggleTitlePage(){ toggleTitlePage(); },
  titleShown(){ return S.showTitle; },
  toggleTheme(){ $('#btnTheme').dispatchEvent(new Event('mousedown')); },
  zoom(d){ S.zoom = Math.max(.3, Math.min(1.6, (S.zoom ?? fitZoom()) + d)); rerenderAll(); },
  zoomFit(){ S.zoom = null; rerenderAll(); },
  // print at true page size, and report the paper the script actually uses
  preparePrint(){
    S.printZoom = S.zoom; S.zoom = 0.75; computeK();
    for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
    return { w: S.doc.layout.pageW, h: S.doc.layout.pageH };
  },
  endPrint(){ S.zoom = S.printZoom ?? null; rerenderAll(); },
  title(){ return S.doc.title; },
};
function notifyNative(){
  try { window.webkit?.messageHandlers?.pica?.postMessage({ title: S.doc.title, pages: S.res.count }); }
  catch {}
}

window.__pica = S; // debug handle
boot();
})();
