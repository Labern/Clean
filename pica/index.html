function openExportMenu(){
  popup([
    { label: 'PDF — print / save as pdf', key: '⌘P', act: 'pdf' },
    { label: 'Final Draft (.fdx)', act: 'fdx' },
    { label: 'Fountain (.fountain)', act: 'fountain' },
    { label: 'PICA JSON (.json)', act: 'json' },
  ], { cap: 'export', kind: 'export', onPick: it => doExport(it.act) });
}

// ---------- retyping: guess what a run of text wants to be ----------
function guessTypes(el){
  const t = el.text.trim();
  const i = elIndex(el.id);
  const prev = S.doc.elements[i - 1];
  const order = [];
  const push = ty => { if (ty && ty !== el.type && !order.includes(ty)) order.push(ty); };
  if (E.SCENE_RE.test(t)) push('scene');
  if (/TO:$/.test(t) && t === t.toUpperCase()) push('transition');
  if (/^\(.*\)?$/.test(t) && t.length < 60) push('paren');
  // a lone name: short, few words, no sentence punctuation — the classic mis-typed cue
  const words = t.split(/\s+/).filter(Boolean);
  if (t && t.length <= 30 && words.length <= 4 && !/[.!?,]$/.test(t) && /^[A-Za-z0-9 .'()-]+$/.test(t)) push('character');
  if (prev && (prev.type === 'character' || prev.type === 'paren')) push('dialogue');
  if (t === t.toUpperCase() && /[A-Z]/.test(t) && words.length <= 6) push('shot');
  push('dialogue'); push('action');
  for (const ty of E.TYPES) push(ty);
  return order;
}

function selectionElements(){
  const r = domRange();
  if (!r) return null;
  const [a, b] = r;
  if (a.el.startsWith('title:') || b.el.startsWith('title:')) return null;
  if (a.el === b.el && a.off === b.off) return null;      // collapsed
  const ia = elIndex(a.el), ib = elIndex(b.el);
  if (ia < 0 || ib < 0) return null;
  return S.doc.elements.slice(ia, ib + 1).map(e => e.id);
}

// the chooser used by right-click and by Tab/Enter on a selection: guesses first
function openRetypeMenu(ids, at){
  const first = elById(ids[0]); if (!first) return;
  const guesses = guessTypes(first);
  const items = guesses.map(ty => ({
    label: TYPE_LABEL[ty] + (ty === guesses[0] ? '   · guess' : ''),
    key: '⌘' + SHORTCUT_OF[ty], type: ty,
  }));
  const cap = ids.length > 1
    ? ids.length + ' elements — change to'
    : 'this is ' + TYPE_LABEL[first.type].toUpperCase() + ' — change to';
  if (at) {
    const hasSel = !!selectionElements();
    const extra = hasSel ? [
      { label: 'Bold', key: '⌘B', mark: 'b' },
      { label: 'Italic', key: '⌘I', mark: 'i' },
      { label: 'Underline', key: '⌘U', mark: 'u' },
    ] : [];
    popupAt([{ label: cap.toUpperCase(), act: null },
             ...items.map(it => ({ ...it, act: 'go' })), ...extra], at.x, at.y,
            it => { if (it.mark) applyEmphasis(it.mark); else if (it.act) opRetype(ids, it.type); });
  } else {
    popup(items, { cap, kind: 'element', onPick: it => opRetype(ids, it.type) });
  }
}

// SmartType — FD's six lists. Seeds below are FD12's shipped defaults; characters and
// locations come from the script itself.
const TIMES = ['DAY', 'NIGHT', 'AFTERNOON', 'MORNING', 'EVENING', 'LATER', 'MOMENTS LATER', 'CONTINUOUS', 'THE NEXT DAY', 'MAGIC HOUR', 'DAWN', 'DUSK', 'SAME', 'SAME TIME'];
const TRANSITIONS = ['CUT TO:', 'FADE IN:', 'FADE OUT.', 'FADE TO:', 'DISSOLVE TO:', 'BACK TO:', 'MATCH CUT TO:', 'JUMP CUT TO:', 'FADE TO BLACK.', 'SMASH CUT TO:', 'CUT TO BLACK.', 'TIME CUT:'];

function characterNames(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'character') {
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base) freq.set(base, (freq.get(base) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function locations(){
  const freq = new Map();
  for (const e of S.doc.elements) if (e.type === 'scene') {
    const m = e.text.match(/^(?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT|EXT|I\/E|EST)[.\s]+(.*?)(?:\s+[–—-]\s+[A-Z' ]+)?$/);
    if (m && m[1]) freq.set(m[1].trim(), (freq.get(m[1]) || 0) + 1);
  }
  return [...freq.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

function smartType(el){
  if (S.pref && !S.pref.smartType) return;
  if (!S.caret || S.caret.el !== el.id || S.caret.off < el.text.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  let sugg = [], replFrom = 0;
  const t = el.text;
  if (el.type === 'character') {
    sugg = characterNames().filter(n => n.startsWith(t.toUpperCase()) && n !== t.toUpperCase());
    replFrom = 0;
  } else if (el.type === 'scene') {
    const mTime = t.match(/^(.*[–—-]\s+)([A-Z ]*)$/);
    const mLoc = t.match(/^((?:INT\.?\/?EXT\.?|EXT\.?\/?INT\.?|INT\.|EXT\.|I\/E\.?|EST\.)\s+)(.*)$/);
    if (mTime) { sugg = TIMES.filter(x => x.startsWith(mTime[2]) && x !== mTime[2]); replFrom = mTime[1].length; }
    else if (mLoc) { sugg = locations().filter(x => x.startsWith(mLoc[2].toUpperCase()) && x !== mLoc[2].toUpperCase()); replFrom = mLoc[1].length; }
    else { sugg = ['INT. ', 'EXT. ', 'INT./EXT. ', 'EST. '].filter(x => x.startsWith(t.toUpperCase()) && t.length > 0); replFrom = 0; }
  } else if (el.type === 'transition') {
    sugg = TRANSITIONS.filter(x => x.startsWith(t.toUpperCase()) && x !== t.toUpperCase()); replFrom = 0;
  } else { if (S.menu?.kind === 'smart') closePops(); return; }
  sugg = sugg.slice(0, 6);
  if (!sugg.length) { if (S.menu?.kind === 'smart') closePops(); return; }
  popup(sugg.map(x => ({ label: x })), { kind: 'smart', onPick: it => {
    const txt = el.text.slice(0, replFrom) + it.label;
    opText(el.id, txt, { el: el.id, off: txt.length });
  }});
}

// ---------- find & replace ----------
const F = { hits: [], at: -1, q: '' };
function findRecompute(){
  const q = $('#findIn').value;
  F.q = q; F.hits = []; F.at = -1;
  if (q.length >= 1) {
    const needle = q.toLowerCase();
    for (const el of S.doc.elements) {
      const hay = el.text.toLowerCase();
      let i = 0;
      while ((i = hay.indexOf(needle, i)) !== -1) { F.hits.push({ id: el.id, off: i, len: q.length }); i += Math.max(1, q.length); }
    }
  }
  $('#findCount').textContent = F.hits.length ? '0 / ' + F.hits.length : (q ? '0 / 0' : '–');
}
function findJump(dir){
  if (!F.hits.length) return;
  F.at = ((F.at + dir) % F.hits.length + F.hits.length) % F.hits.length;
  $('#findCount').textContent = (F.at + 1) + ' / ' + F.hits.length;
  const h = F.hits[F.at];
  // locate the page holding this offset and bring it in
  let pi = -1, hitLine = null;
  outer: for (let i = 0; i < S.res.pages.length; i++)
    for (const l of S.res.pages[i].lines)
      if (l.el === h.id && h.off >= l.off && h.off <= l.off + l.text.length) { pi = i; hitLine = l; break outer; }
  if (pi < 0) return;
  S.pageEls[pi]?.wrap.scrollIntoView({ block: 'center' });
  setTimeout(() => {
    renderPage(pi);
    // select the match (clipped to its first rendered line)
    const pe = S.pageEls[pi];
    for (const d of pe.page?.children || []) {
      if (d.dataset.el !== h.id) continue;
      const start = +d.dataset.off || 0;
      if (h.off < start || h.off > start + d.textContent.length) continue;
      const from = h.off - start;
      const to = Math.min(d.textContent.length, from + h.len);
      const r = document.createRange();
      const walk = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
      let acc = 0, n, sN = null, sO = 0, eN = null, eO = 0;
      while ((n = walk.nextNode())) {
        if (!sN && from <= acc + n.length) { sN = n; sO = from - acc; }
        if (to <= acc + n.length) { eN = n; eO = to - acc; break; }
        acc += n.length;
      }
      if (sN && eN) { r.setStart(sN, sO); r.setEnd(eN, eO); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      S.caret = { el: h.id, off: h.off + h.len };
      break;
    }
    status();
  }, 90);
}
function findOpen(){
  $('#findBar').hidden = false;
  const sel = getSelection().toString();
  if (sel && sel.length < 60) $('#findIn').value = sel;
  $('#findIn').focus(); $('#findIn').select();
  findRecompute();
}
function findClose(){ $('#findBar').hidden = true; F.hits = []; F.at = -1; pagesEl.focus(); }
function replaceCurrent(){
  if (inReader()) { toast('reader — no edits'); return; }
  if (F.at < 0 || !F.hits[F.at]) { findJump(1); return; }
  const h = F.hits[F.at];
  const el = elById(h.id); if (!el) return;
  const rep = $('#replIn').value;
  opText(el.id, el.text.slice(0, h.off) + rep + el.text.slice(h.off + h.len), { el: el.id, off: h.off + rep.length });
  const wasAt = F.at;
  findRecompute();
  F.at = Math.min(wasAt - 1, F.hits.length - 1);
  findJump(1);
}
function replaceAll(){
  if (inReader()) { toast('reader — no edits'); return; }
  if (!F.q || !F.hits.length) return;
  const rep = $('#replIn').value;
  const needle = F.q.toLowerCase();
  const changes = [];
  for (const el of S.doc.elements) {
    const hay = el.text.toLowerCase();
    if (!hay.includes(needle)) continue;
    let out = '', i = 0, j;
    while ((j = hay.indexOf(needle, i)) !== -1) { out += el.text.slice(i, j) + rep; i = j + F.q.length; }
    out += el.text.slice(i);
    changes.push({ id: el.id, text: out });
  }
  const n = F.hits.length;
  opTexts(changes);
  findRecompute();
  toast(n + ' replaced');
}

// ---------- draft mode: named drafts, stored inside the document ----------
function draftsOf(){ if (!Array.isArray(S.doc.drafts)) S.doc.drafts = []; return S.doc.drafts; }

function saveDraft(){
  const drafts = draftsOf();
  const name = prompt('Name this draft', 'Draft ' + (drafts.length + 1));
  if (name == null) return;
  drafts.push({
    id: E.uid(), name: (name.trim() || 'Draft ' + (drafts.length + 1)).slice(0, 40), t: Date.now(),
    elements: JSON.parse(JSON.stringify(S.doc.elements)),
    titlePage: JSON.parse(JSON.stringify(S.doc.titlePage)),
  });
  flushSave(); draftChip(); toast('draft saved · ' + drafts[drafts.length - 1].name);
}

function restoreDraft(dr){
  if (!confirm('Restore “' + dr.name + '”? The current state is kept as its own draft first.')) return;
  const drafts = draftsOf();
  drafts.push({ id: E.uid(), name: 'Before restoring ' + dr.name, t: Date.now(),
    elements: JSON.parse(JSON.stringify(S.doc.elements)), titlePage: JSON.parse(JSON.stringify(S.doc.titlePage)) });
  const ne = JSON.parse(JSON.stringify(dr.elements));
  opSplice(0, S.doc.elements.length, ne, ne[0] ? { el: ne[0].id, off: 0 } : null);
  S.doc.titlePage = JSON.parse(JSON.stringify(dr.titlePage || []));
  repaginate(); buildPages(); renderAllVisible(); restoreCaret(); rail(); status(); flushSave(); draftChip();
  toast('restored · ' + dr.name);
}

// per-scene comparison: segment both versions by slugline, diff scene text
function sceneMapOf(els){
  const map = new Map(); const order = [];
  let cur = { slug: '— before the first slugline —', texts: [] }, seen = new Map();
  const push = () => {
    if (!cur.texts.length && !map.size && cur.slug.startsWith('—')) return;
    const n = (seen.get(cur.slug) || 0) + 1; seen.set(cur.slug, n);
    const key = cur.slug + (n > 1 ? ' (' + n + ')' : '');
    map.set(key, cur.texts.join('\n')); order.push(key);
  };
  for (const e of els) {
    if (e.type === 'scene') { push(); cur = { slug: e.text || '(blank slugline)', texts: [] }; }
    else cur.texts.push(e.type + ': ' + e.text);
  }
  push();
  return { map, order };
}

function compareDraft(dr){
  const A = sceneMapOf(dr.elements), B = sceneMapOf(S.doc.elements);
  const keys = [...new Set([...A.order, ...B.order])];
  let changed = 0, added = 0, removed = 0;
  const rows = keys.map(k => {
    const a = A.map.get(k), b = B.map.get(k);
    let st;
    if (a == null) { st = 'added'; added++; }
    else if (b == null) { st = 'removed'; removed++; }
    else if (a !== b) { st = 'changed'; changed++; }
    else st = 'same';
    return { k, st, a, b };
  });
  const esc2 = t => (t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  overlayCard('<h2>' + esc2(dr.name) + ' → current</h2>' +
    '<div class="sub">' + changed + ' changed · ' + added + ' added · ' + removed + ' removed · ' + (rows.length - changed - added - removed) + ' untouched</div>' +
    '<div id="cmpList">' + rows.filter(r => r.st !== 'same').map((r, i) =>
      '<div class="cmp-row" data-i="' + i + '"><span class="cmp-st cmp-' + r.st + '">' + r.st + '</span> <span class="cmp-slug">' + esc2(r.k) + '</span>' +
      '<div class="cmp-body" hidden><div class="cmp-col"><h4>' + esc2(dr.name) + '</h4><pre>' + esc2(r.a || '—') + '</pre></div>' +
      '<div class="cmp-col"><h4>current</h4><pre>' + esc2(r.b || '—') + '</pre></div></div></div>').join('') +
    (rows.some(r => r.st !== 'same') ? '' : '<p>Identical — nothing has changed since this draft.</p>') + '</div>' +
    '<div class="foot"><button class="hbtn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">close</button></div>');
  document.querySelectorAll('.cmp-row').forEach(rw => {
    rw.addEventListener('mousedown', ev => {
      if (ev.target.closest('.cmp-body')) return;
      ev.preventDefault();
      const b = rw.querySelector('.cmp-body'); b.hidden = !b.hidden;
    });
  });
}

function draftChip(){

// ---------- rail / status ----------
function rail(){
  const dl = $('#docList');
  dl.innerHTML = '';
  const pinned = new Set(LS.get('pica.ui', {}).pinned || []);
  const archived = new Set(LS.get('pica.ui', {}).archived || []);
  const all = store.index().slice().sort((a, b) =>
    (pinned.has(b.id) ? 1 : 0) - (pinned.has(a.id) ? 1 : 0));
  const list = all.filter(d => !archived.has(d.id));
  const shelf = all.filter(d => archived.has(d.id));
  for (const d of list.concat(shelf.length ? [{ __shelf: shelf }] : [])) {
    if (d.__shelf) {
      const eb = document.createElement('button');
      eb.className = 'eyebrow';
      eb.textContent = 'Archive · ' + d.__shelf.length;
      const wrap = document.createElement('div');
      wrap.hidden = !(LS.get('pica.ui', {}).collapse || {}).archOpen;
      eb.addEventListener('mousedown', ev => {
        ev.preventDefault();
        wrap.hidden = !wrap.hidden;
        const u = LS.get('pica.ui', {});
        u.collapse = Object.assign({}, u.collapse, { archOpen: !wrap.hidden });
        LS.set('pica.ui', u);
      });
      dl.appendChild(eb); dl.appendChild(wrap);
      for (const a of d.__shelf) dl.__shelfWrap = wrap, addDocRow(a, wrap, pinned, true);
      continue;
    }
    addDocRow(d, dl, pinned, false);
  }
  function addDocRow(d, host, pinned, inShelf) {
    const b = document.createElement('button');
    b.className = 'doc-item' + (d.id === S.docId ? ' current' : '');
    b.innerHTML = '<span class="ttl"></span><span class="pg"></span>';
    b.firstChild.textContent = (pinned.has(d.id) ? '• ' : '') + (d.title || 'Untitled');
    b.firstChild.style.opacity = inShelf ? '.55' : '';
    b.lastChild.textContent = d.pages ? d.pages + 'p' : '';
    b.addEventListener('mousedown', ev => { if (ev.button !== 0) return; if (d.id !== S.docId) openDoc(d.id); });
    b.addEventListener('contextmenu', ev => { ev.preventDefault(); docMenu(d, ev); });
    // drag to reorder — the index array IS the manual order
    b.draggable = true;
    b.addEventListener('dragstart', ev => {
      ev.dataTransfer.setData('text/pica-doc', d.id);
      ev.dataTransfer.effectAllowed = 'move';
      b.classList.add('dragging');
    });
    b.addEventListener('dragend', () => b.classList.remove('dragging'));
    b.addEventListener('dragover', ev => {
      ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
      const r = b.getBoundingClientRect();
      b.classList.toggle('drop-above', ev.clientY < r.top + r.height / 2);
      b.classList.toggle('drop-below', ev.clientY >= r.top + r.height / 2);
    });
    b.addEventListener('dragleave', () => b.classList.remove('drop-above', 'drop-below'));
    b.addEventListener('drop', ev => {
      ev.preventDefault();
      const below = b.classList.contains('drop-below');
      b.classList.remove('drop-above', 'drop-below');
      const src = ev.dataTransfer.getData('text/pica-doc');
      if (!src || src === d.id) return;
      const ix = store.index();
      const from = ix.findIndex(x => x.id === src);
      if (from < 0) return;
      const [moved] = ix.splice(from, 1);
      let to = ix.findIndex(x => x.id === d.id);
      if (below) to += 1;
      ix.splice(to, 0, moved);
      store.saveIndex(ix);
      rail();
    });
    host.appendChild(b);
  }
  // characters: base name + cue count; click jumps to their next cue
  const cl = $('#charList');
  cl.innerHTML = '';
  const counts = new Map();
  for (const e of S.doc.elements) if (e.type === 'character') {
    const base = e.text.replace(/\s*\([^)]*\)\s*$/, '').trim();
    if (base) counts.set(base, (counts.get(base) || 0) + 1);
  }
  for (const [name, cnt] of [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 40)) {
    const b = document.createElement('button');
    b.className = 'scene-item';
    b.innerHTML = '<span class="sl"></span><span class="pg" style="margin-left:auto"></span>';
    b.firstChild.textContent = name;
    b.lastChild.textContent = cnt;
    b.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      // next cue for this name after the caret, wrapping
      const start = S.caret && !S.caret.el.startsWith('title:') ? elIndex(S.caret.el) : -1;
      const idx = S.doc.elements.findIndex((e, i) => i > start && e.type === 'character'
        && e.text.replace(/\s*\([^)]*\)\s*$/, '').trim() === name);
      const j = idx >= 0 ? idx : S.doc.elements.findIndex(e => e.type === 'character'
        && e.text.replace(/\s*\([^)]*\)\s*$/, '').trim() === name);
      if (j < 0) return;
      const el = S.doc.elements[j];
      let pi = -1;
      outer: for (let i = 0; i < S.res.pages.length; i++)
        for (const l of S.res.pages[i].lines) if (l.el === el.id) { pi = i; break outer; }
      if (pi >= 0) {
        S.pageEls[pi]?.wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
        S.caret = { el: el.id, off: el.text.length };
        setTimeout(() => { renderAllVisible(); restoreCaret(); status(); }, 80);
      }
    });
    cl.appendChild(b);
  }

  // fold state: click an eyebrow, the list disappears; click again, it returns
  const coll = LS.get('pica.ui', {}).collapse || {};
  $('#docList').hidden = !!coll.index;
  $('#sceneList').hidden = !!coll.scenes;
  $('#charList').hidden = !!coll.chars;

  const sl = $('#sceneList');
  sl.innerHTML = '';
  let n = 0;
  const seen = new Set();
  for (let i = 0; i < S.res.pages.length; i++) for (const l of S.res.pages[i].lines) {
    if (l.kind !== 'scene' || seen.has(l.el) ) continue;
    seen.add(l.el);
    n++;
    const b = document.createElement('button');
    b.className = 'scene-item';
    b.dataset.el = l.el;
    b.innerHTML = '<span class="no"></span><span class="sl"></span>';
    b.firstChild.textContent = n;
    b.lastChild.textContent = l.text;
    const pi = i, elid = l.el;
    b.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault();
      S.pageEls[pi]?.wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      S.caret = { el: elid, off: 0 };
      setTimeout(() => { renderAllVisible(); restoreCaret(); status(); }, 60);
      $('#rail').classList.remove('open');
    });
    sl.appendChild(b);
  }
}

// right-click a script in the index
function docMenu(d, ev){
  const ui = LS.get('pica.ui', {});
  const pinned = new Set(ui.pinned || []);
  const isPinned = pinned.has(d.id);
  const savePinned = () => { ui.pinned = [...pinned]; LS.set('pica.ui', ui); };
  const items = [
    { label: 'Rename…', act: 'rename' },
    { label: 'Duplicate', act: 'dup' },
    { label: 'New with this layout', act: 'newlike' },
    { label: isPinned ? 'Unpin' : 'Pin to top', act: 'pin' },
    { label: (LS.get('pica.ui', {}).archived || []).includes(d.id) ? 'Unarchive' : 'Archive', act: 'arch' },
    { label: 'Export JSON', act: 'json' },
    { label: 'Delete…', act: 'del' },
  ];
  popupAt(items, ev.clientX, ev.clientY, (it) => {
    if (it.act === 'rename') {
      const name = prompt('Rename script', d.title || 'UNTITLED');
      if (name == null) return;
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (!doc) return;
      doc.title = name.trim() || 'UNTITLED';
      if (doc.titlePage && doc.titlePage[0]) doc.titlePage[0].text = doc.title.toUpperCase();
      store.save(d.id, doc);
      if (d.id === S.docId) { S.doc = doc; $('#docTitle').textContent = doc.title; repaginate(); renderAfterEdit(); }
      rail(); toast('renamed');
      })();
    } else if (it.act === 'dup') {
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (!doc) return;
      const copy = JSON.parse(JSON.stringify(doc));
      copy.title = (doc.title || 'UNTITLED') + ' copy';
      copy.elements = copy.elements.map(e => ({ ...e, id: E.uid() }));
      // storyboard images are separate idb records — re-key and copy them, or the
      // twin docs would share images and deleting a panel in one would blind the other
      for (const el of copy.elements) if (el.panels) for (const pn of el.panels) {
        const ok = pn.imgKey, nk = E.uid();
        pn.imgKey = nk; pn.id = E.uid();
        idb.get('img.' + ok).then(v => { if (v != null) return idb.put('img.' + nk, v); }).catch(() => {});
      }
      const id = E.uid();
      store.save(id, copy);
      openDoc(id); toast('duplicated');
      })();
    } else if (it.act === 'newlike') {
      // transcribing an import needs ITS margins, not the blank default's — a
      // fresh script that wraps exactly where the source wraps
      (async () => {
        const src = d.id === S.docId ? S.doc : await store.load(d.id);
        if (!src) return;
        const nd = E.newDoc('UNTITLED');
        nd.layout = JSON.parse(JSON.stringify(src.layout));
        delete nd.layout.revX;
        const id = E.uid();
        store.save(id, nd);
        openDoc(id);
        toast('new script — wraps like “' + (src.title || 'source') + '”');
      })();
    } else if (it.act === 'pin') {
      if (isPinned) pinned.delete(d.id); else pinned.add(d.id);
      savePinned(); rail(); toast(isPinned ? 'unpinned' : 'pinned');
    } else if (it.act === 'arch') {
      const u = LS.get('pica.ui', {});
      const set = new Set(u.archived || []);
      const was = set.has(d.id);
      was ? set.delete(d.id) : set.add(d.id);
      u.archived = [...set]; LS.set('pica.ui', u);
      rail(); toast(was ? 'unarchived' : 'archived');
    } else if (it.act === 'json') {
      (async () => {
      const doc = d.id === S.docId ? S.doc : await store.load(d.id);
      if (doc) download((doc.title || 'script').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json',
                        JSON.stringify(doc, null, 1), 'application/json');
      })();
    } else if (it.act === 'del') {
      // a script is never removed without saying so, and never silently
      if (!confirm('Delete “' + (d.title || 'UNTITLED') + '”?\n\nThis removes it from PICA on this device. Export it first if you want to keep a copy.')) return;
      const ix = store.index().filter(x => x.id !== d.id);
      store.saveIndex(ix);
      store.cache.delete(d.id);
      idb.del('doc.' + d.id); idb.del('snap.' + d.id);
      try { localStorage.removeItem('pica.doc.' + d.id); localStorage.removeItem('pica.snap.' + d.id); } catch {}
      pinned.delete(d.id); savePinned();
      // scrub the satellites too, or the id haunts the app: a stale lastDoc used
      // to resurrect at boot as a saved UNTITLED
      { const u = LS.get('pica.ui', {}); if (u.lastDoc === d.id) { delete u.lastDoc; LS.set('pica.ui', u); }
        const sc = LS.get('pica.scroll', {}); if (sc[d.id] != null) { delete sc[d.id]; LS.set('pica.scroll', sc); }
        const em = LS.get('pica.emergency', null); if (em && em.id === d.id) { try { localStorage.removeItem('pica.emergency'); } catch {} } }
      if (d.id === S.docId) {
        const next = ix[0] && ix[0].id;
        if (next) openDoc(next);
        else { const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); }
      }
      rail(); toast('deleted');
    }
  });
}

// ---------- import ----------
async function importPdfBuffer(buf, name){
  overlayCard(`<h2>Importing</h2><div class="sub">${(name || 'pdf').replace(/</g,'&lt;')}</div><div id="importLog">reading…</div>`);
  const log = m => { const n = $('#importLog'); if (n) n.textContent = m; };
  try {
    // PICA.app bundles pdf.js so import works with no network; the web build uses the CDN.
    let mod, workerSrc;
    try {
      mod = await import('./vendor/pdf.min.mjs');
      workerSrc = new URL('./vendor/pdf.worker.min.mjs', location.href).href;
    } catch {
      mod = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs');
      workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs';
    }
    mod.GlobalWorkerOptions.workerSrc = workerSrc;
    const base = workerSrc.replace(/pdf\.worker\.min\.mjs$/, '');
    const pdf = await mod.getDocument({
      data: buf,
      standardFontDataUrl: base.startsWith('http') ? base.replace(/build\/$/, 'standard_fonts/') : undefined,
    }).promise;
    const raw = [];
    let badPages = 0;
    // font style by name (Bold/Italic faces), cached per font id
    const styleCache = new Map();
    const styleOf = (page, fn) => {
      if (styleCache.has(fn)) return styleCache.get(fn);
      let v = 0;
      try {
        const f = page.commonObjs.get(fn);
        const nm = (f && f.name) || '';
        if (/bold|black|heavy/i.test(nm)) v |= 1;
        if (/ital|obli/i.test(nm)) v |= 2;
      } catch {}
      styleCache.set(fn, v);
      return v;
    };
    // underlines are DRAWN, not encoded: walk the operator list for thin horizontal
    // ink (fill/stroke, never clip) with the transform tracked, in page space
    const OPS = mod.OPS;
    const INK = new Set([OPS.fill, OPS.eoFill, OPS.stroke, OPS.fillStroke, OPS.eoFillStroke, OPS.closeStroke, OPS.closeFillStroke, OPS.closeEOFillStroke].filter(x => x != null));
    const underlinesFrom = (ol, vp) => {
      const out = [];
      let ctm = [1, 0, 0, 1, 0, 0]; const stack = [];
      const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
      for (let i = 0; i < ol.fnArray.length; i++) {
        const fn = ol.fnArray[i];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
        else if (fn === OPS.transform) ctm = mul(ctm, ol.argsArray[i]);
        else if (fn === OPS.constructPath && INK.has(ol.fnArray[i + 1])) {
          const [ops, co] = ol.argsArray[i];
          let ci = 0, cur = null;
          const seg = (x1, y1, x2, y2) => {
            const tx1 = ctm[0]*x1 + ctm[2]*y1 + ctm[4], ty1 = ctm[1]*x1 + ctm[3]*y1 + ctm[5];
            const tx2 = ctm[0]*x2 + ctm[2]*y2 + ctm[4], ty2 = ctm[1]*x2 + ctm[3]*y2 + ctm[5];
            if (Math.abs(ty2 - ty1) < 2.6 && Math.abs(tx2 - tx1) > 4 && Math.abs(tx2 - tx1) < vp.width * 0.85)
              out.push({ x1: Math.min(tx1, tx2), x2: Math.max(tx1, tx2), y: vp.height - Math.max(ty1, ty2) });
          };
          for (const op of ops) {
            if (op === OPS.moveTo) { cur = [co[ci], co[ci + 1]]; ci += 2; }
            else if (op === OPS.lineTo) { if (cur) seg(cur[0], cur[1], co[ci], co[ci + 1]); cur = [co[ci], co[ci + 1]]; ci += 2; }
            else if (op === OPS.rectangle) { seg(co[ci], co[ci + 1], co[ci] + co[ci + 2], co[ci + 1] + co[ci + 3]); ci += 4; }
            else if (op === OPS.curveTo) ci += 6;
            else if (op === OPS.curveTo2 || op === OPS.curveTo3) ci += 4;
          }
        }
      }
      return out;
    };
    for (let p = 1; p <= pdf.numPages; p++) {
      // one unreadable page must cost one page, never the whole script
      try {
        const page = await pdf.getPage(p);
        const vp = page.getViewport({ scale: 1 });
        let ul = [];
        try { ul = underlinesFrom(await page.getOperatorList(), vp); } catch {}
        const tc = await page.getTextContent();
        raw.push({
          width: vp.width, height: vp.height, ul,
          items: tc.items.filter(i => i.str && i.str.length).map(i => ({
            x: i.transform[4], y: vp.height - i.transform[5], w: i.width, str: i.str, font: i.fontName,
            fs: styleOf(page, i.fontName),
          })),
        });
      } catch (pageErr) {
        badPages++;
        raw.push({ width: raw[0]?.width || 612, height: raw[0]?.height || 792, items: [] });
      }
      if (p % 10 === 0 || p === pdf.numPages) log('reading page ' + p + ' / ' + pdf.numPages + ' …');
    }
    if (!raw.some(p => p.items.length)) throw new Error('no text layer — this looks like a scanned PDF');
    log('classifying…');
    await new Promise(r => setTimeout(r, 30));
    const doc = E.importPdf(raw);
    if (!doc.elements.some(e => e.text.trim() !== '')) throw new Error('nothing readable came out of this PDF');
    const fileTitle = (name || 'IMPORTED').replace(/\.pdf$/i, '').replace(/[_-]+/g, ' ').trim().toUpperCase();
    // a garbled or missing title (tiny unmapped title-page fonts) falls back to the filename
    const junk = (doc.title || '').replace(/[A-Za-z0-9\s.,:'!?&-]/g, '').length;
    if (!doc.title || junk > (doc.title.length * 0.3)) doc.title = fileTitle;
    if (badPages) doc.importNote = (doc.importNote ? doc.importNote + ' · ' : '') + badPages + ' unreadable page(s) skipped';
    const id = E.uid();
    store.save(id, doc);
    closeOverlay();
    openDoc(id);
    toast(doc.importNote
      ? 'imported · ' + S.res.count + ' pages · ' + doc.importNote
      : 'imported · ' + S.res.count + ' pages · ' + doc.elements.length + ' elements');
  } catch (err) {
    overlayCard(`<h2>Import failed</h2><div class="sub">pdf</div><p>${String(err.message || err).replace(/</g,'&lt;')}</p>
      <p>PICA needs a text-layer PDF (one exported from screenwriting software — not a scan). It also needs the network once, to fetch the PDF reader.</p>
      <div class="foot"><button class="hbtn" onclick="document.getElementById('overlay').classList.remove('show')">close</button></div>`);
  }
}

function importFdxText(text, name){
  try {
    const doc = E.importFdx(text);
    if (!doc.title || doc.title === 'UNTITLED') doc.title = (name || 'SCRIPT').replace(/\.fdx$/i, '').replace(/[_-]+/g, ' ').toUpperCase();
    const id = E.uid();
    store.save(id, doc);
    openDoc(id);
    toast('imported from final draft · ' + S.res.count + ' pages');
  } catch (e) { toast(String(e.message || e)); }
}

function importJson(text, name){
  try {
    const doc = JSON.parse(text);
    if (!doc || !Array.isArray(doc.elements) || !doc.layout) throw new Error('not a PICA document');
    const id = E.uid();
    store.save(id, doc);
    openDoc(id);
    toast('opened · ' + (doc.title || name));
  } catch (e) { toast('could not read json'); }
}

// ---------- export ----------
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function safeName(){ return (S.doc.title || 'script').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'script'; }
function doExport(act){
  if (act === 'fountain') download(safeName() + '.fountain', E.toFountain(S.doc));
  else if (act === 'fdx') download(safeName() + '.fdx', E.toFdx(S.doc), 'application/xml');
  else if (act === 'json') download(safeName() + '.json', JSON.stringify(S.doc, null, 1), 'application/json');
  else if (act === 'pdf') {
    // in PICA.app this writes a real .pdf via the native save panel — no print dialog
    if (window.webkit?.messageHandlers?.pica) window.webkit.messageHandlers.pica.postMessage({ exportPdf: true, name: safeName() });
    else printAll();
  }
}
function printPageCSS(){
  let st = $('#printPage');
  if (!st) { st = document.createElement('style'); st.id = 'printPage'; document.head.appendChild(st); }
  st.textContent = '@page{ size:' + S.doc.layout.pageW + 'pt ' + S.doc.layout.pageH + 'pt; margin:0; }';
}
function printAll(){
  const zoomWas = S.zoom;
  S.zoom = 0.75; // k = 1 → true pt size
  computeK();
  for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
  requestAnimationFrame(() => { window.print(); S.zoom = zoomWas; rerenderAll(); });
}

  const o = $('#overlay');
  o.innerHTML = '<div class="card">' + html + '</div>';

}
function closeOverlay(){ const o = $('#overlay'); o.classList.remove('show'); o.innerHTML = ''; }

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const z = $('#sbZoom');
    if (z && z.classList.contains('show')) { e.preventDefault(); z.classList.remove('show'); return; }

}, true);

// ---------- settings ----------
function applyUiPrefs(){
  const ui = LS.get('pica.ui', {});
  document.documentElement.style.setProperty('--ui-base', (ui.uiBase || 20) + 'px');
  document.documentElement.style.setProperty('--page', ui.paper === 'white' ? '#ffffff' : '#fdfcf8');
  S.pref = { smartType: ui.smartType !== false, autoDetect: ui.autoDetect !== false, autoContd: ui.autoContd !== false };
  // footer items: zoom and ⚙ are permanent; page/scenes on by default; the rest opt-in
  document.documentElement.style.setProperty('--rfoot', (ui.readerFoot === 'max') ? '.6rem' : '.22rem');
  document.body.classList.toggle('uifont-screenplay', ui.uiFont === 'screenplay');
  const gaps = { none: '2px', compact: '.55rem', roomy: '2.4rem', wide: '4.4rem', max: '7rem' };
  document.documentElement.style.setProperty('--pagegap', gaps[ui.pageGap] || gaps.max);
  const foot = Object.assign({ page: true, type: false, hint: false, drafts: false, link: false, saved: false }, ui.foot || {});
  S.foot = foot;
  for (const el of document.querySelectorAll('[data-foot]')) el.hidden = !foot[el.dataset.foot];
  // header actions live in the sidebar's button block now; these are opt-in returns
  const head = Object.assign({ new: false, imp: false, exp: false, title: false, theme: false }, ui.head || {});
  S.head = head;
  for (const el of document.querySelectorAll('[data-head]')) el.hidden = !head[el.dataset.head];
  // the sidebar's optional Export / Title buttons — off unless asked for
  const side = Object.assign({ exp: false, title: false }, ui.side || {});
  S.side = side;
  for (const el of document.querySelectorAll('[data-side]')) el.hidden = !side[el.dataset.side];
}
function setUiBase(px){
  const ui = LS.get('pica.ui', {}); ui.uiBase = px; LS.set('pica.ui', ui);
  document.documentElement.style.setProperty('--ui-base', px + 'px');
  if (S.zoom == null) { clearTimeout(window._uiz); window._uiz = setTimeout(rerenderAll, 120); }

  const ui = LS.get('pica.ui', {}); ui.theme = mode === 'auto' ? null : mode; LS.set('pica.ui', ui);

pagesEl.addEventListener('beforeinput', ev => {
  if (ev.target.closest?.('.noteLayer')) return;   // note boxes edit themselves
  ev.preventDefault();
  const t = ev.inputType;
  if (t === 'insertText' && ev.data != null) handleInsertText(ev.data);
  else if (t === 'insertParagraph') handleEnter();
  else if (t === 'insertLineBreak') { const c = S.caret; if (c && !c.el.startsWith('title:')) { const el = elById(c.el); if (el) opText(el.id, el.text.slice(0, c.off) + '\n' + el.text.slice(c.off), { el: el.id, off: c.off + 1 }); } }
  else if (t === 'deleteContentBackward') handleBackspace();
  else if (t === 'deleteContentForward') handleDelete();
  else if (t === 'deleteWordBackward' || t === 'deleteWordForward' || t === 'deleteSoftLineBackward') handleBigDelete(t);
  else if (t === 'insertFromPaste') {
    const txt = ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '';
    if (txt) handleInsertText(txt.replace(/\r/g, ''));
  }
  else if (t === 'insertReplacementText') {
    // macOS substitutions: double-space→period, smart quotes, autocorrect,
    // accepted spelling suggestions. The system tells us what range it is
    // replacing — honour it, or the keystroke vanishes.
    const txt = ev.data != null ? ev.data : (ev.dataTransfer ? ev.dataTransfer.getData('text/plain') : '');
    if (txt != null && txt !== '') {
      const ranges = ev.getTargetRanges ? ev.getTargetRanges() : [];
      let done = false;
      if (ranges.length) {
        const a = pointFrom(ranges[0].startContainer, ranges[0].startOffset);
        const b = pointFrom(ranges[0].endContainer, ranges[0].endOffset);
        if (a && b && a.el === b.el && !a.el.startsWith('title:')) {
          const el = elById(a.el);
          if (el) {
            const s0 = Math.min(a.off, b.off), e0 = Math.max(a.off, b.off);
            shiftMarks(el, e0, s0 - e0 + txt.length);
            opText(el.id, el.text.slice(0, s0) + txt + el.text.slice(e0), { el: el.id, off: s0 + txt.length });
            done = true;
          }
        }
      }
      if (!done) handleInsertText(txt);         // never eat it
    }
  }
  else if (t === 'historyUndo') undo(false);
  else if (t === 'historyRedo') undo(true);
  else if (t === 'insertCompositionText' || t === 'deleteCompositionText') { /* composition owns the DOM until compositionend */ }
  else if (/^insert/.test(t) && ev.data) handleInsertText(ev.data);   // unknown insert: never eat typed text
});

// ⌥⌫ / ⌥-fn-⌫ / ⌘⌫ — word and line deletes, in the model
function handleBigDelete(kind){
  const r = domRange();
  if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) return deleteRange(r);
  const c = syncCaret(); if (!c || c.el.startsWith('title:')) return;
  const el = elById(c.el); if (!el) return;
  if (kind === 'deleteWordBackward') {
    if (c.off === 0) return handleBackspace();
    let s0 = c.off;
    while (s0 > 0 && /\s/.test(el.text[s0 - 1])) s0--;
    while (s0 > 0 && !/\s/.test(el.text[s0 - 1])) s0--;
    shiftMarks(el, c.off, s0 - c.off);
    opText(el.id, el.text.slice(0, s0) + el.text.slice(c.off), { el: el.id, off: s0 });
  } else if (kind === 'deleteWordForward') {
    if (c.off >= el.text.length) return handleDelete();
    let e0 = c.off;
    while (e0 < el.text.length && /\s/.test(el.text[e0])) e0++;
    while (e0 < el.text.length && !/\s/.test(el.text[e0])) e0++;
    shiftMarks(el, e0, c.off - e0);
    opText(el.id, el.text.slice(0, c.off) + el.text.slice(e0), { el: el.id, off: c.off });
  } else {                                       // deleteSoftLineBackward (⌘⌫)
    if (c.off === 0) return handleBackspace();
    shiftMarks(el, c.off, -c.off);
    opText(el.id, el.text.slice(c.off), { el: el.id, off: 0 });
  }
}

pagesEl.addEventListener('keydown', ev => {
  if (ev.target.closest?.('.noteLayer')) return;   // note boxes edit themselves
  if (inReader()) {
    // reading: only find, settings, zoom and navigation get through
    const mod = ev.metaKey || ev.ctrlKey;
    const allowed = (mod && ['f', ',', 't', 'e', 'r', '=', '-', '0', 'c', 'a'].includes(ev.key.toLowerCase()))
      || ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Escape'].includes(ev.key);
    if (!allowed) { ev.preventDefault(); return; }
  }
  if (S.menu) {
    if (ev.key === 'ArrowDown') { S.menu.move(1); ev.preventDefault(); return; }
    if (ev.key === 'ArrowUp') { S.menu.move(-1); ev.preventDefault(); return; }
    if (ev.key === 'Tab' && S.menu.kind === 'element') { S.menu.move(ev.shiftKey ? -1 : 1); ev.preventDefault(); return; }
    if (ev.key === 'Enter' || (ev.key === 'Tab' && !ev.shiftKey)) {
      const kind = S.menu.kind;
      const c0 = S.caret;
      const onCue = !!(c0 && !c0.el.startsWith('title:') && elById(c0.el)?.type === 'character');
      ev.preventDefault();
      S.menu.accept();
      // FD: taking a character name from SmartType with Return carries straight on to
      // the dialogue — otherwise Return looks like it did nothing.
      if (kind === 'smart' && ev.key === 'Enter' && onCue) handleEnter();
      return;
    }
    if (ev.key === 'Escape') { closePops(); ev.preventDefault(); return; }
    // FD: choose from the element popup by number, or by the element's first letter
    if (S.menu.kind === 'element') {
      if (SHORTCUT[ev.key]) {
        const i = S.menu.items.findIndex(it => it.type === SHORTCUT[ev.key]);
        if (i >= 0) { S.menu.sel = i; S.menu.accept(); ev.preventDefault(); return; }
      }
      if (/^[a-z]$/i.test(ev.key)) {
        const k = ev.key.toLowerCase();
        const hits = S.menu.items.map((it, i) => [it, i]).filter(([it]) => it.label[0].toLowerCase() === k);
        if (hits.length) {
          const at = hits.findIndex(([, i]) => i === S.menu.sel);
          S.menu.sel = hits[(at + 1) % hits.length][1];
          if (hits.length === 1) S.menu.accept(); else S.menu.move(0);
          ev.preventDefault(); return;
        }
      }
    }
    // FD: Right-Arrow completes the highlighted SmartType match
    if (S.menu.kind === 'smart' && ev.key === 'ArrowRight') { ev.preventDefault(); S.menu.accept(); return; }
  }
  // a selection + Tab or Enter opens the chooser: retype what's selected
  if ((ev.key === 'Tab' || ev.key === 'Enter') && !ev.metaKey && !ev.ctrlKey) {
    const ids = selectionElements();
    if (ids) { ev.preventDefault(); openRetypeMenu(ids, null); return; }
  }
  if (ev.key === 'Tab') { ev.preventDefault(); handleTab(ev.shiftKey); return; }
  if (ev.key === 'Escape') { closePops(); return; }
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && !ev.shiftKey && !ev.altKey && SHORTCUT[ev.key]) {
    ev.preventDefault();
    const c = S.caret; if (!c || c.el.startsWith('title:')) return;
    opConvert(c.el, SHORTCUT[ev.key]);
    if (SHORTCUT[ev.key] === 'character') guessCharacter(c.el);
    return;
  }
  // emphasis, where a writer expects it
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'b') { ev.preventDefault(); applyEmphasis('b'); return; }
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'i') { ev.preventDefault(); applyEmphasis('i'); return; }
  if (mod && !ev.altKey && ev.key.toLowerCase() === 'u') { ev.preventDefault(); applyEmphasis('u'); return; }
  if (mod && ev.altKey && ev.key.toLowerCase() === 's') { ev.preventDefault(); toggleRail(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 't') { ev.preventDefault(); toggleRail(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'e') { ev.preventDefault(); openExportMenu(); return; }
  if (mod && !ev.shiftKey && !ev.altKey && ev.key.toLowerCase() === 'r') { ev.preventDefault(); inReader() ? readerOff() : readerOn(); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 't') { ev.preventDefault(); toggleTitlePage(); return; }
  if (mod && ev.key === ',') { ev.preventDefault(); showSettings(); return; }
  if (mod && ev.key === '\\') { ev.preventDefault(); openElementMenu(); return; }
  if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(false); return; }
  if (mod && ev.shiftKey && ev.key.toLowerCase() === 'z') { ev.preventDefault(); undo(true); return; }
  if (mod && !ev.shiftKey && ev.key.toLowerCase() === 'y') { ev.preventDefault(); undo(true); return; }
  if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); flushSave(); toast('saved'); return; }
  if (mod && ev.key.toLowerCase() === 'p') { ev.preventDefault(); printAll(); return; }
});

// Forgiving caret placement: a click anywhere on the paper lands the cursor at the
// nearest text position — end of the nearest line when you click past its edge —
// instead of demanding a pixel-perfect hit on the type itself.
function forgivingPos(clientX, clientY, pageHint){
  let page = pageHint || document.elementFromPoint(clientX, clientY)?.closest?.('.page');
  if (!page) {                                          // beside/between pages: nearest live page
    let bd = Infinity;
    for (const pe of S.pageEls) {
      if (!pe.live || !pe.page) continue;
      const r = pe.page.getBoundingClientRect();
      const dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
      if (dy < bd) { bd = dy; page = pe.page; }
    }
  }
  if (!page) return null;
  const lines = [...page.children].filter(d =>
    d.classList.contains('line') && d.dataset.el && !d.dataset.el.startsWith('title:') &&
    d.dataset.kind !== 'pn' && d.dataset.kind !== 'more' && d.dataset.kind !== 'contcue');
  if (!lines.length) return null;
  let best = null, bd = Infinity;
  for (const d of lines) {
    const r = d.getBoundingClientRect();
    const dy = clientY < r.top ? r.top - clientY : (clientY > r.bottom ? clientY - r.bottom : 0);
    const dx = clientX < r.left ? r.left - clientX : (clientX > r.right ? clientX - r.right : 0);
    const score = dy * 120 + dx;                        // the same row wins decisively
    if (score < bd) { bd = score; best = { d, r }; }
  }
  if (!best) return null;
  const len = best.d.textContent.length;
  const cw = len ? best.r.width / len : 1;
  const at = Math.max(0, Math.min(len, Math.round((clientX - best.r.left) / cw)));
  return { d: best.d, at };
}
pagesEl.addEventListener('mousedown', ev => {
  if (ev.button !== 0 || inReader()) return;
  const page = ev.target.closest('.page');
  const lineHit = ev.target.closest('.line');
  if (!page || (lineHit && lineHit.dataset.el)) return; // direct text clicks behave natively
  const hit = forgivingPos(ev.clientX, ev.clientY, page);
  if (!hit) return;
  ev.preventDefault();
  placeCaret(hit.d, hit.at);
  S.caret = { el: hit.d.dataset.el, off: (+hit.d.dataset.off || 0) + hit.at };
  status();
  // preventDefault above killed the browser's own drag anchor — so a selection
  // started on blank paper (the natural grip when sweeping up from the end of a
  // passage) is extended by hand from the forgiven position
  const [an, ao] = domPosIn(hit.d, hit.at);
  let moved = false;
  const move = mv => {
    const p = forgivingPos(mv.clientX, mv.clientY, null);
    if (!p) return;
    moved = true;
    const [fn, fo] = domPosIn(p.d, p.at);
    getSelection().setBaseAndExtent(an, ao, fn, fo);
  };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (moved) syncCaret();
  };
  addEventListener('mousemove', move);
  addEventListener('mouseup', up);
});

function renderBShells(){
  const host = $('#pagesB');

  const L = B.doc.layout;
  const avail = $('#canvasB').clientWidth - 26;
  B.k = Math.min(1.08, Math.max(.25, avail / (L.pageW * 4 / 3))) * 4 / 3;
  if (B.io) B.io.disconnect();
  B.io = new IntersectionObserver(ents => {
    for (const en of ents) if (en.isIntersecting) renderBPage(+en.target.dataset.i);
  }, { root: $('#canvasB'), rootMargin: '500px 0px' });

    const wrap = document.createElement('div');

    wrap.style.width = (L.pageW * B.k) + 'px';
    wrap.style.height = (L.pageH * B.k) + 'px';
    host.appendChild(wrap);
    B.els.push({ wrap, live: false });
    B.io.observe(wrap);
  }
}

function renderBPage(i){
  const pe = B.els[i];
  if (!pe || pe.live) return;
  const L = B.doc.layout, k = B.k, fontPt = L.charW / 0.6;
  const page = document.createElement('div');
  page.className = 'page';
  page.style.width = (L.pageW * k) + 'px';
  page.style.height = (L.pageH * k) + 'px';
  page.style.fontSize = (fontPt * k) + 'px';
  page.style.lineHeight = (L.rowH * k) + 'px';
  for (const l of B.res.pages[i].lines) {
    const d = document.createElement('div');
    d.className = 'line';
    d.style.left = (l.x * k) + 'px';
    d.style.top = ((l.y - fontPt * 0.79) * k) + 'px';
    d.style.height = (L.rowH * k) + 'px';
    d.textContent = l.text;
    page.appendChild(d);

}

// sync scrolling: page for page — page N tops page N, carrying the fraction into the
// page across; a title page on one side only is offset away so script pages align
let bSyncLock = false;
function syncFrom(src, dst){
  if (!document.body.classList.contains('split') || !LS.get('pica.ui', {}).syncScroll) return;
  if (bSyncLock) return;
  const srcIsA = src === canvasEl;
  const sp = srcIsA ? S.pageEls : B.els;
  const dp = srcIsA ? B.els : S.pageEls;
  if (!sp || sp.length < 1 || !dp || dp.length < 1) return;
  const sTitle = S.showTitle && ((srcIsA ? S.doc : B.doc)?.titlePage?.length ? 1 : 0);
  const dTitle = S.showTitle && ((srcIsA ? B.doc : S.doc)?.titlePage?.length ? 1 : 0);
  bSyncLock = true;
  const sTop0 = sp[0].wrap.offsetTop;
  const sStep = sp.length > 1 ? sp[1].wrap.offsetTop - sTop0 : sp[0].wrap.offsetHeight;
  const sH = sp[0].wrap.offsetHeight || 1;
  let idx = Math.floor((src.scrollTop - sTop0) / Math.max(1, sStep));
  idx = Math.max(0, Math.min(sp.length - 1, idx));
  let frac = (src.scrollTop - (sTop0 + idx * sStep)) / sH;
  frac = Math.max(0, Math.min(1, frac));
  let j = idx - (sTitle ? 1 : 0) + (dTitle ? 1 : 0);
  j = Math.max(0, Math.min(dp.length - 1, j));
  const dTop0 = dp[0].wrap.offsetTop;
  const dStep = dp.length > 1 ? dp[1].wrap.offsetTop - dTop0 : dp[0].wrap.offsetHeight;
  const dH = dp[0].wrap.offsetHeight || 1;
  dst.scrollTop = dTop0 + j * dStep + frac * dH;
  requestAnimationFrame(() => { bSyncLock = false; });
}
canvasEl.addEventListener('scroll', () => syncFrom(canvasEl, $('#canvasB')));
$('#canvasB').addEventListener('scroll', () => syncFrom($('#canvasB'), canvasEl));
function applySyncBtn(){ $('#bSync').classList.toggle('on', !!LS.get('pica.ui', {}).syncScroll); }
$('#bSync').addEventListener('mousedown', ev => {
  ev.preventDefault();
  const u = LS.get('pica.ui', {}); u.syncScroll = !u.syncScroll; LS.set('pica.ui', u);
  applySyncBtn();
  toast(u.syncScroll ? 'synced — page for page' : 'pages independent');
});
$('#bClose').addEventListener('mousedown', ev => { ev.preventDefault(); splitOff(); });
$('#bDocSel').addEventListener('change', ev => loadB(ev.target.value));

$('#railToggle').addEventListener('mousedown', ev => { ev.preventDefault(); toggleRail(); });
$('#stDrafts').addEventListener('mousedown', ev => { ev.preventDefault(); draftsMenu(ev); });
$('#railGrip').addEventListener('mousedown', ev => {
  ev.preventDefault();
  const grip = $('#railGrip');
  grip.classList.add('dragging'); document.body.classList.add('resizing');
  const move = e => {
    const w = Math.max(150, Math.min(560, e.clientX));
    document.documentElement.style.setProperty('--railw', w + 'px');
    positionTitle();
  };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    grip.classList.remove('dragging'); document.body.classList.remove('resizing');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--railw')) || 248;
    const ui = LS.get('pica.ui', {}); ui.railW = w; LS.set('pica.ui', ui);
    if (S.zoom == null) rerenderAll();
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});
$('#railGrip').addEventListener('dblclick', () => {
  document.documentElement.style.setProperty('--railw', '15.5rem');
  const ui = LS.get('pica.ui', {}); delete ui.railW; LS.set('pica.ui', ui);
  positionTitle();
  if (S.zoom == null) rerenderAll();
});
$('#zIn').addEventListener('mousedown', ev => { ev.preventDefault(); S.zoom = Math.min(1.6, (S.zoom ?? fitZoom()) + .1); rerenderAll(); });
$('#zOut').addEventListener('mousedown', ev => { ev.preventDefault(); S.zoom = Math.max(.3, (S.zoom ?? fitZoom()) - .1); rerenderAll(); });
// single click fits the page; double click resets to exactly 100%
$('#zPct').addEventListener('mousedown', ev => {
  ev.preventDefault();
  clearTimeout(window._zClick);
  if (ev.detail >= 2) { S.zoom = 1; rerenderAll(); }
  else window._zClick = setTimeout(() => { S.zoom = null; rerenderAll(); }, 260);
});

$('#fileIn').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  if (/\.json$/i.test(f.name)) importJson(await f.text(), f.name);
  else if (/\.fdx$/i.test(f.name)) importFdxText(await f.text(), f.name);
  else importPdfBuffer(await f.arrayBuffer(), f.name);
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files]; if (!files.length) return;
  // photos are storyboard panels — but only when the tool is on (zero interference)
  const imgs = files.filter(f => /^image\//.test(f.type) || /\.(png|jpe?g|heic|heif|webp|gif|tiff?)$/i.test(f.name));
  if (imgs.length === files.length) {
    if (S.storyboard) addPanelFiles(imgs, e.clientX, e.clientY);
    else toast('turn on storyboard mode to place panels');
    return;
  }
  const f = files[0];
  if (/\.json$/i.test(f.name)) importJson(await f.text(), f.name);
  else if (/\.fdx$/i.test(f.name)) importFdxText(await f.text(), f.name);
  else if (/\.pdf$/i.test(f.name)) importPdfBuffer(await f.arrayBuffer(), f.name);
});

$('#findIn').addEventListener('input', findRecompute);
$('#findIn').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); findJump(ev.shiftKey ? -1 : 1); }
  if (ev.key === 'Escape') { ev.preventDefault(); findClose(); }
});
$('#replIn').addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); replaceCurrent(); }
  if (ev.key === 'Escape') { ev.preventDefault(); findClose(); }
});
$('#findNext').addEventListener('mousedown', ev => { ev.preventDefault(); findJump(1); });
$('#findPrev').addEventListener('mousedown', ev => { ev.preventDefault(); findJump(-1); });
$('#replOne').addEventListener('mousedown', ev => { ev.preventDefault(); replaceCurrent(); });
$('#replAll').addEventListener('mousedown', ev => { ev.preventDefault(); replaceAll(); });
$('#findClose').addEventListener('mousedown', ev => { ev.preventDefault(); findClose(); });
document.addEventListener('keydown', ev => {
  if ((ev.metaKey || ev.ctrlKey) && !ev.shiftKey && ev.key.toLowerCase() === 'f') { ev.preventDefault(); findOpen(); }
  if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key.toLowerCase() === 'a') { ev.preventDefault(); toggleAnnotate(); }
  if ((ev.metaKey || ev.ctrlKey) && ev.shiftKey && ev.key.toLowerCase() === 's') { ev.preventDefault(); toggleStoryboard(); }
});

// annotate mode: finishing a selection spawns its margin note, ready to type
document.addEventListener('mouseup', ev => {
  if (!S.annotate || ev.target.closest?.('.noteLayer')) return;
  setTimeout(() => {                      // let the selection settle first
    const r = domRange();
    if (r && (r[0].el !== r[1].el || r[0].off !== r[1].off)) annotateSelection();
  }, 0);
});

$('#docTitle').addEventListener('keydown', ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); } });
$('#docTitle').addEventListener('blur', ev => {
  const t = ev.target.textContent.trim() || 'UNTITLED';
  S.doc.title = t;
  if (S.doc.titlePage[0]) S.doc.titlePage[0].text = t.toUpperCase();
  ev.target.textContent = t;
  repaginate(); renderAfterEdit();
});

addEventListener('resize', () => {
  positionTitle();
  if (S.zoom == null) { clearTimeout(window._rz); window._rz = setTimeout(rerenderAll, 150); }
  if (B.doc) { clearTimeout(window._rzB); window._rzB = setTimeout(renderBShells, 170); }
});
addEventListener('beforeunload', () => flushSave());
addEventListener('pagehide', () => {
  flushSave();
  if (S.docId && S.doc) LS.set('pica.emergency', { id: S.docId, doc: S.doc, t: Date.now() });
});
addEventListener('beforeprint', () => {});

// ---------- native bridge ----------
// PICA.app drives the page through this. Harmless in a browser; the app's menu bar,
// Dock drops and Print command all land here rather than duplicating any editor logic.
window.PICA_API = {
  newDoc(){ const id = E.uid(); store.save(id, E.newDoc('UNTITLED')); openDoc(id); toast('new script'); },
  importPdf(){ $('#fileIn').click(); },
  // Files opened natively arrive as a URL the app serves, not as inline bytes — a
  // screenplay-sized base64 literal does not survive evaluateJavaScript.
  importUrl(url, name){
    fetch(url).then(r => {
      if (!r.ok) throw new Error('could not read ' + name);
      return r.arrayBuffer();
    }).then(buf => {
      if (/\.json$/i.test(name || '')) importJson(new TextDecoder().decode(buf), name);
      else if (/\.fdx$/i.test(name || '')) importFdxText(new TextDecoder().decode(buf), name);
      else importPdfBuffer(buf, name);
    }).catch(e => toast(String(e.message || e)));
  },
  exportMenu(){ openExportMenu(); },
  elementMenu(){ openElementMenu(); },
  showKeys(){ showKeys(); },
  undo(){ undo(false); },
  redo(){ undo(true); },
  save(){ flushSave(); },
  toggleRail(){ toggleRail(); },
  toggleTitlePage(){ toggleTitlePage(); },
  toggleReader(){ inReader() ? readerOff() : readerOn(); },
  toggleAnnotate(){ toggleAnnotate(); },
  toggleStoryboard(){ toggleStoryboard(); },
  titleShown(){ return S.showTitle; },
  settings(){ showSettings(); },
  escape(){ if ($('#overlay').classList.contains('show')) closeOverlay(); closePops(); },
  mark(kind){ applyEmphasis(kind); },
  // Scriptable hooks. The automated grammar test drives these, so Final Draft's
  // Enter/Tab behaviour is checked on every build rather than by hand.
  test: {
    reset(){ const id = E.uid(); store.save(id, E.newDoc('TEST')); return openDoc(id).then(() => id); },
    caret(i, off){
      const el = S.doc.elements[i]; if (!el) return false;
      S.caret = { el: el.id, off: off == null ? el.text.length : off };
      restoreCaret(); return true;
    },
    type(str){ for (const ch of str) handleInsertText(ch); return true; },
    enter(){ closePops(); handleEnter(); return true; },
    tab(shift){ handleTab(!!shift); return true; },
    esc(){ closePops(); return true; },
    state(){ return S.doc.elements.map(e => e.type + '|' + e.text); },
    caretAt(){ const c = S.caret; return c ? (elIndex(c.el) + ':' + c.off) : 'none'; },
    note(i, off, len, text){
      const el = S.doc.elements[i]; if (!el) return false;
      const n = { id: E.uid(), off, len, text: text || '' };
      (el.notes = el.notes || []).push(n);
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      renderNotesAll(); saveSoon(); return n.id;
    },
    notes(i){ const el = S.doc.elements[i]; return JSON.stringify((el && el.notes) || []); },
    delNote(i, id){ deleteNote(null, id); return true; },
    openId(id){ return openDoc(id); },
    titleDelta(){
      const tEl = document.getElementById('docTitle'); const page = document.querySelector('.page');
      if (!tEl || !page) return 'no-dom';
      const t = tEl.getBoundingClientRect(); const p = page.getBoundingClientRect();
      const L = S.doc.layout;
      const cues = S.doc.elements.filter(e => e.type === 'character' && !e.dual).slice(0, 400);
      const axis = cues.length ? cues.reduce((a, e) => a + L.cols.character + (e.text.length * L.charW) / 2, 0) / cues.length : L.pageW / 2;
      return Math.abs((t.left + t.width / 2) - (p.left + axis * S.k)) < 1.5;
    },
    noteMulti(i1, o1, i2, o2){
      const targets = [];
      for (let i = i1; i <= i2; i++) {
        const el = S.doc.elements[i]; if (!el) return false;
        const s = i === i1 ? o1 : 0, e = i === i2 ? o2 : el.text.length;
        if (e > s) targets.push([el, s, e]);
      }
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      return createNote(targets, '');
    },
    noteBoxes(){ return document.querySelectorAll('.noteBox').length + ':' + document.querySelectorAll('.noteHl').length; },
    panel(i, off){
      const el = S.doc.elements[i]; if (!el) return false;
      const key = E.uid();
      const url = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
      imgCache.set(key, url); idb.put('img.' + key, url).catch(() => {});
      const n = { id: E.uid(), off, imgKey: key, ar: 1.5 };
      (el.panels = el.panels || []).push(n);
      for (let p = 0; p < S.pageEls.length; p++) renderPage(p);
      renderPanelsAll(); saveSoon(); return n.id;
    },
    panels(i){ const el = S.doc.elements[i]; return JSON.stringify((el && el.panels) || []); },
    delPanel(i, id){ const el = S.doc.elements[i]; if (el) deletePanel(el.id, id); return true; },
    sbCount(){ return document.querySelectorAll('.sbPanel').length; },
  },
  toggleTheme(){ $('#btnTheme').dispatchEvent(new Event('mousedown')); },
  zoom(d){ S.zoom = Math.max(.3, Math.min(1.6, (S.zoom ?? fitZoom()) + d)); rerenderAll(); },
  zoomFit(){ S.zoom = null; rerenderAll(); },
  // print at true page size, and report the paper the script actually uses
  preparePrint(){
    S.printZoom = S.zoom; S.zoom = 0.75; computeK();
    for (let i = 0; i < S.pageEls.length; i++) { S.pageEls[i].sig = null; renderPage(i); }
    return { w: S.doc.layout.pageW, h: S.doc.layout.pageH };
  },
  endPrint(){ S.zoom = S.printZoom ?? null; rerenderAll(); },
  title(){ return S.doc.title; },
};
function notifyNative(){
  try { window.webkit?.messageHandlers?.pica?.postMessage({ title: S.doc.title, pages: S.res.count }); }
  catch {}
}

window.__pica = S; // debug handle
boot().catch(e => {
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:serif;background:#f6f5f2;color:#141413;z-index:99"><div><h2>PICA could not start</h2><p>' +
    String(e && e.message || e).replace(/</g, '&lt;') + '</p></div></div>');
});
})();
</script>
