      // sometimes as a character cue and sometimes as nothing at all. The phrase itself
      // is unmistakable — no one is called CUT TO — so it stands on its own. Only for a
      // page read by eye: in a file that says where its ink is, Tenet's closing FADE OUT.
      // is placed by its own x, and overruling that moved it.
      if (byEye && TRANSITION_PHRASE.test(t)) return 'transition';
      // a slugline is a slugline wherever it sits: with one shared speech column an
      // indented scene heading otherwise reads as somebody's dialogue
      if (speechCollapsed && SCENE_RE.test(t)) return 'scene';
      // Likewise a bracket and a cue are unmistakable wherever they sit. A speech line
      // typed a few spaces off lands nearer the action margin than the speech one, and
      // then a cue merges with the parenthetical under it into a lump of action.
      // A parenthetical may run onto a second line, so the first one closes no bracket:
      // testing for a WHOLLY bracketed line leaves "(points to the cord running across"
      // as action, which then swallows the cue above it.
      if (t !== '(MORE)' && whollyBracketed(t) && t.length <= 60) return 'paren';
      if (speechCollapsed && t !== '(MORE)' && /^\(/.test(t)) return 'paren';
      // a numbered slug is a slug wherever it sits: on a drifting scan the line often lands
      // on no column at all, and it was ending up unclassified
      if (l.slugNo != null) return 'scene';
      if (col === 'action') return SCENE_RE.test(l.text) ? 'scene' : 'action';
      // One column doing three jobs: nothing positional can separate them, so read the
      // line. Bracketed is a parenthetical; a short shout with no sentence ending is a cue
      // ("JOE", "NELLIE'S VOICE", "JOE (CONT'D)"); everything else is what was said —
      // including a shouted line, because that ends in . ! or ?
      if (speechCollapsed && (col === 'dialogue' || col === 'paren' || col === 'character')) {
        if (t === '(MORE)') return 'MORE';
        if (whollyBracketed(t)) return 'paren';
        if (cueShaped(t) && t.length <= 35 && !/[.!?]$/.test(t)) return 'character';
        return 'dialogue';
      }
      if (col === 'dialogue') return 'dialogue';
      if (col === 'paren') return cueShaped(t) ? 'character' : 'paren';
      if (col === 'character') {
        if (t === '(MORE)') return 'MORE';
        // A parenthetical that runs onto a second line does not close on the first —
        // "(meaning the three / men)". At the cue indent an opening bracket can only be
        // a parenthetical, and reading it as a cue left the real cue above it with
        // nothing to say and put a stage direction in a character's mouth.
        return whollyBracketed(t) || /^\(/.test(t) ? 'paren' : 'character';
      }
      if (Math.abs(l.xEnd - transRight) < 4 && l.text === l.text.toUpperCase() && /:\s*$/.test(l.text)) return 'transition';
      // end marks without the colon — FADE OUT. / CUT TO BLACK. — are transitions too
      if (l.text === l.text.toUpperCase() && /^(FADE OUT|FADE TO BLACK|CUT TO BLACK)\.?\s*$/.test(l.text.trim())) return 'transition';
      return 'general';
    };

    // -- dual dialogue --------------------------------------------------------------
    // Two speeches side by side. The left column's dialogue x can COINCIDE with the
    // action column (Oppenheimer: both 108), so no per-line classification can ever
    // recover it — the region must be detected by shape and rebuilt whole. Shape: a
    // run of rows whose items split into two clusters (left starting in the body,
    // right starting past mid-page, wide gap between), plus the cue row above.
    // Rebuilt as L-cue, L-dialogue, R-cue, R-dialogue sharing a dual group: each
    // element keeps its true x and its row offset inside the region, and the
    // paginator lays the group back down as one unbreakable two-column block.
    const pageWd = body[0] ? body[0].width : 612;
    // strict gap to OPEN a region (no false positives on ordinary spacing), a
    // lenient one to CONTINUE it — inside a known dual, columns can run close
    const splitDual = (l, lenient) => {
      const its = l.items || [];
      if (its.length < 2) return null;
      let gi = -1, gap = 0;
      for (let i = 1; i < its.length; i++) {
        const g = its[i].x - (its[i - 1].x + its[i - 1].w);
        if (g > gap) { gap = g; gi = i; }
      }
      if (gi < 1 || gap < (lenient ? 28 : 48)) return null;
      const right = its[gi];
      if (right.x < pageWd * 0.5) return null;
      if (its[0].x > pageWd * 0.35) return null;
      // a slugline never speaks in two columns, and a right cluster that is only a
      // scene number / revision junk is a gutter the stripper missed, not a voice
      if (SCENE_RE.test(l.text)) return null;
      const rt = its.slice(gi).map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
      if (/^[A-Z]{0,2}\d{1,3}[A-Z]{0,2}(?:[-–][A-Z]{0,2}\d{1,3}[A-Z]{0,2})?[*'.\s]*$/.test(rt)) return null;
      return { left: its.slice(0, gi), right: its.slice(gi) };
    };
    const CUEISH = t => {
      const s = t.trim();
      if (s !== s.toUpperCase() || !/[A-Z]/.test(s) || s.length >= 34) return false;
      const bare = s.replace(/\s*\([^)]*\)\s*$/, '');   // "PIANIST (O.S.)" → "PIANIST"
      return bare.length > 0 && !/[.!?,]$/.test(bare);
    };
    for (const p of body) {
      const ls = bodyLines(p);
      for (let i = 0; i < ls.length; i++) {
        if (ls[i].dualSkip || ls[i].dualRegion) continue;
        const sp = splitDual(ls[i]);
        if (!sp) continue;
        // grow the region: consecutive tight rows that also split, or tight rows
        // hugging the left column (a longer left speech running past the right one)
        const rows = [{ l: ls[i], sp }];
        let j = i + 1;
        while (j < ls.length) {
          const dy = ls[j].y - ls[j - 1].y;
          if (dy > rowH * 2.2) break;              // a column may skip one row (staggers do)
          const s2 = splitDual(ls[j], true);
          if (s2) rows.push({ l: ls[j], sp: s2 });
          // left-only continuation only at a TIGHT gap — anything after a blank row
          // at the left x is the next action line, not more of this column
          else if (dy <= rowH * 1.2 && Math.abs(ls[j].x - sp.left[0].x) <= 2) rows.push({ l: ls[j], sp: { left: ls[j].items, right: [] } });
          else if (ls[j].x >= pageWd * 0.5
                   && !(ls[j].text === ls[j].text.toUpperCase() && /:\s*$/.test(ls[j].text)))
            rows.push({ l: ls[j], sp: { left: [], right: ls[j].items } });
          else break;
          j++;
        }
        // the left cue usually sits one row above the first split row
        let cueLine = null;
        if (i > 0 && ls[i].y - ls[i - 1].y <= rowH * 1.2 && ls[i - 1].items.length
            && !ls[i - 1].dualRegion && !ls[i - 1].dualSkip
            && CUEISH(ls[i - 1].text) && ls[i - 1].x > cols.action + 20 && ls[i - 1].x < pageWd * 0.5)
          cueLine = ls[i - 1];
        const y00 = cueLine ? cueLine.y : rows[0].l.y;
        const rel = y => Math.round((y - y00) / rowH);
        const g = uid();
        const mk = (type, its, y, rev) => ({
          id: uid(), type,
          srcLines: [{ text: joinItems(its, charW0).text, x: its[0].x, xEnd: 0, y, items: its, ...(rev ? { rev: true } : {}) }],
          xOverride: Math.round(its[0].x * 100) / 100,
          dual: { g, r: rel(y) },
        });
        const L = [], R = [];
        if (cueLine) L.push(mk('character', cueLine.items, cueLine.y, cueLine.rev));
        for (const r of rows) {
          if (r.sp.left.length) {
            const t = joinItems(r.sp.left, charW0).text;
            const last = L[L.length - 1];
            if (!CUEISH(t) && last && last.type === 'dialogue' && rel(r.l.y) === last.dual.r + last.srcLines.length)
              last.srcLines.push({ text: t, x: r.sp.left[0].x, xEnd: 0, y: r.l.y, items: r.sp.left, ...(r.l.rev ? { rev: true } : {}) });
            else L.push(mk(CUEISH(t) ? 'character' : 'dialogue', r.sp.left, r.l.y, r.l.rev));
          }
          if (r.sp.right.length) {
            const t = joinItems(r.sp.right, charW0).text;
            const last = R[R.length - 1];
            const rrev = r.l.rev && !r.sp.left.length;   // star belongs to the row once — left owns it when present
            if (!CUEISH(t) && last && last.type === 'dialogue' && rel(r.l.y) === last.dual.r + last.srcLines.length)
              last.srcLines.push({ text: t, x: r.sp.right[0].x, xEnd: 0, y: r.l.y, items: r.sp.right, ...(rrev ? { rev: true } : {}) });
            else R.push(mk(CUEISH(t) ? 'character' : 'dialogue', r.sp.right, r.l.y, rrev));
          }
        }
        const group = [...L, ...R];
        // Dual dialogue is two people SPEAKING at once, so at least one column has to be
        // headed by a character cue. Without that test any two blocks of text sharing a
        // row band qualify — Some Like It Hot's title page paired the production
        // company's address with the date, and the two then printed through each other.
        const hasCue = group.some(e => e.type === 'character');
        if (hasCue && group.length >= 2 && rows.length >= 2) {   // one lonely split row is noise, not a dual
          const anchor = cueLine || rows[0].l;   // region starts at the cue: spacing above it survives
          anchor.dualRegion = { els: group, lastY: rows[rows.length - 1].l.y };
          for (const r of rows) if (r.l !== anchor) r.l.dualSkip = true;
        }
      }
    }

    const els = [];
    let open = null;           // currently-open element accumulating source lines
    let pendingSpeech = null;  // set when (MORE) seen at a page end: awaiting continuation
    const flush = () => { if (open) { els.push(open); open = null; } };

    let pendingAt = -1;   // the page whose (MORE) set pendingSpeech
    for (let pi = 0; pi < body.length; pi++) {
      const p = body[pi];
      const ls = bodyLines(p);
      let prevLine = null, pageStart = true, openParen = false;
      // a (MORE) promises a continuation at the TOP of the next page and nowhere
      // else — carried further it swallows some later, unrelated (CONT'D) cue
      if (pendingSpeech && pendingAt !== pi - 1) pendingSpeech = null;

      for (const l of ls) {
        if (l.dualSkip) { prevLine = l; pageStart = false; continue; }
        if (l.dualRegion) {
          flush();
          const first = l.dualRegion.els[0];
          if (prevLine) first.gapBefore = Math.max(0, Math.round((l.y - prevLine.y) / rowH) - 1);
          els.push(...l.dualRegion.els);
          prevLine = { y: l.dualRegion.lastY };
          pageStart = false;
          continue;
        }
        const contCue = pageStart && /\(CONT['’]D\)\s*$/.test(l.text) && Math.abs(l.x - cols.character) < 3
          && pendingSpeech;
        if (contCue) { pageStart = false; prevLine = null; continue; } // swallow generated cue

        let role = roleOf(l);
        // A parenthetical may take two lines, and the second closes the bracket without
        // opening one — on a collapsed column it would otherwise read as dialogue and
        // orphan the speech beneath it. Keep the parenthetical open until it closes.
        if (speechCollapsed) {
          if (openParen) role = 'paren';
          const o = (l.text.match(/\(/g) || []).length, c = (l.text.match(/\)/g) || []).length;
          openParen = role === 'paren' && o > c;
        }
        if (role === 'MORE') { pendingSpeech = open || pendingSpeech || true; pendingAt = pi; flush(); prevLine = null; pageStart = false; continue; }

        const gap = prevLine ? Math.round(l.y - prevLine.y) : null;
        const contSameEl = open && gap !== null && gap <= rowH + 2 && open.type === role
          && (role === 'action' || role === 'dialogue' || role === 'paren');

        if (contSameEl) {
          open.srcLines.push(l);
        } else if (pendingSpeech && !pageStart && prevLine === null && (role === 'dialogue' || role === 'paren')) {
          // continuation after (MORE): resume the split speech
          const prevEl = els[els.length - 1];
          if (role === prevEl?.type && role === 'dialogue') {
            open = els.pop(); open.srcLines.push(l); open.splitJoin = open.srcLines.length - 1;
          } else {
            open = { id: uid(), type: role, srcLines: [l] };
          }
          pendingSpeech = null;
        } else {
          flush();
          open = { id: uid(), type: role, srcLines: [l] };
          if (prevLine) open.gapBefore = Math.max(0, Math.round((l.y - prevLine.y) / rowH) - 1);
          if (role === 'general') open.xOverride = Math.round(l.x * 100) / 100;
          if (role === 'transition') open.align = 'right';
        }
        prevLine = l; pageStart = false;
      }
      flush(); // elements never span pages except via (MORE) handling above
    }
    flush();

    // ---------- join source lines → text; calibrate widths; mark hard breaks ----------
    for (const el of els) el.joined = el.srcLines.map(s => s.text).join(' ');

    // width calibration per wrapping type: try candidates, keep the one that soft-wraps the most elements
    for (const type of ['action', 'dialogue', 'paren', 'scene', 'character']) {
      const cands = new Set();
      let maxObs = 0;
      for (const el of els) if (el.type === type)
        for (const s of el.srcLines) maxObs = Math.max(maxObs, s.text.length);
      if (!maxObs) continue;
      for (let w = maxObs; w <= maxObs + 4; w++) cands.add(w);
      let bestW = maxObs, bestScore = -1;
      for (const w of cands) {
        let score = 0;
        for (const el of els) {
          if (el.type !== type) continue;
          const wrapped = wrapText(el.joined, w);
          if (wrapped.length === el.srcLines.length && wrapped.every((t, i) => t === el.srcLines[i].text)) score++;
        }
        if (score > bestScore) { bestScore = score; bestW = w; }
      }
      layout.widths[type] = bestW;
      if (type === 'action') { layout.widths.shot = bestW; layout.widths.general = bestW; }
    }

    // an isolated provenance stamp that slipped through as its own element is dropped
    for (let i = els.length - 1; i >= 0; i--) {
      const e = els[i];
      if ((e.type === 'general' || e.type === 'action') && e.srcLines.length === 1
          && e.srcLines[0].text.length < 70 && PROVENANCE.test(e.srcLines[0].text)
          && /^(downloaded|imported|provided|courtesy)\b|www\.|https?:|scriptslug|script\s*savant|imsdb|for educational/i.test(e.srcLines[0].text.trim())) {
        els.splice(i, 1);
      }
    }

    // A character cue is always followed by what was said. When one shared column carries
    // every kind of speech, a line typed a little off falls to the action margin and comes
    // back as action — leaving the cue above it with nothing to say. Give it its speech.
    if (speechCollapsed) {
      // A cue is only a cue if something is SAID after it. Judged on the line alone, every
      // piece of signage in the script qualifies — OMITTED, WELCOME DELEGATES, FADE OUT —
      // so the test is the element that follows.
      const cueText = t => t.length <= 35 && !t.includes('\n') && /[A-Z]/.test(t)
        && t === t.toUpperCase() && !/[.!?]$/.test(t) && !/^\(.*\)$/.test(t);
      // element text is not assigned until finalisation — read the source lines
      const txtOf = e => (e.srcLines || []).map(sl => sl.text).join('\n').trim();
      for (let i = 0; i < els.length - 1; i++) {
        const e = els[i], nxt = els[i + 1];
        if (e.type === 'action' && (nxt.type === 'paren' || nxt.type === 'dialogue')
            && cueText(txtOf(e))) e.type = 'character';
      }
      // …and once it is a cue, what follows it is what was said, not action.
      for (let i = 1; i < els.length; i++) {
        if (els[i].type !== 'action') continue;
        const prev = els[i - 1].type;
        if (prev === 'character' || prev === 'paren') els[i].type = 'dialogue';
      }
    }

    // spacing overrides: where the source's blank rows differ from the standard rule
    for (let i = 1; i < els.length; i++) {
      const g = els[i].gapBefore;
      if (g == null) continue;
      const prev = els[i - 1], cur = els[i];
      const speechInternal = (cur.type === 'dialogue' || cur.type === 'paren')
        && (prev.type === 'character' || prev.type === 'dialogue' || prev.type === 'paren');
      const expected = speechInternal ? 0 : blanksBefore(prev.type, cur.type);
      if (g !== expected && !speechInternal) cur.spaceBefore = g;
    }
    for (const el of els) delete el.gapBefore;

    // typography per source line → char ranges, replaying joinItems' exact layout
    const lineMarkRanges = (line) => {
      const its = line.items || [];
      if (!its.length) return null;
      const out = [];
      let text = '', xEnd = 0;
      const spans = [];
      for (let i = 0; i < its.length; i++) {
        const it = its[i];
        if (i > 0) {
          const gap = it.x - xEnd;
          if (gap > charW0 * 0.45 && !/\s$/.test(text)) text += ' '.repeat(Math.max(1, Math.round(gap / charW0)));
        }
        spans.push({ it, s: text.length });
        text += it.str; xEnd = it.x + it.w;
      }
      for (const { it, s } of spans) {
        if (it.fs & 1) out.push([s, s + it.str.length, 'b']);
        if (it.fs & 2) out.push([s, s + it.str.length, 'i']);
      }
      for (const u of line.us || []) {
        let s = -1, e = -1;
        for (const { it, s: cs } of spans) {
          const n = it.str.length || 1, cw = it.w / n;
          for (let k = 0; k < n; k++) {
            const cx = it.x + k * cw;
            if (cx + cw > u.x1 + 0.5 && cx < u.x2 - 0.5) { if (s < 0) s = cs + k; e = cs + k + 1; }
          }
        }
        if (s >= 0 && e > s) out.push([s, e, 'u']);
      }
      return out.length ? out : null;
    };
    const attachMarks = (el, src) => {
      const marks = [];
      let off = 0;
      for (let k = 0; k < el.srcLines.length; k++) {
        const rs = lineMarkRanges(el.srcLines[k]);
        if (rs) for (const [s, e, kind] of rs) marks.push([off + s, off + e, kind]);
        off += src[k].length + 1;                  // ' ' and '\n' joins both cost 1
      }
      if (!marks.length) return;
      marks.sort((a, b) => (a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : a[0] - b[0]));
      const merged = [];
      for (const m of marks) {
        const last = merged[merged.length - 1];
        if (last && last[2] === m[2] && m[0] <= last[1] + 1) last[1] = Math.max(last[1], m[1]);
        else merged.push([...m]);
      }
      el.marks = merged;
    };

    // assign final text: soft where greedy wrap reproduces the source, hard breaks otherwise
    for (const el of els) {
      const src = el.srcLines.map(s => s.text);
      if (el.dual) {                 // dual columns keep their exact source lines
        el.text = src.join('\n');
        attachMarks(el, src);
        const rl0 = [];
        el.srcLines.forEach((s, i) => { if (s.rev) rl0.push(i); });
        if (rl0.length) el.rev = rl0;
        delete el.joined; delete el.srcLines; delete el.splitJoin;
        continue;
      }
      const w = layout.widths[el.type] || 57;
      const wrapped = wrapText(el.joined, w);
      el.text = (wrapped.length === src.length && wrapped.every((t, i) => t === src[i]))
        ? el.joined : src.join('\n');
      // A typewriter puts two spaces after a full stop, so slugs arrive as
      // "EXT.  PIER - NIGHT." Final Draft sets one. Scene headings only — the same
      // double space inside action is the writer's own rhythm and is left alone.
      if (el.type === 'scene') el.text = el.text.replace(/[ \t]{2,}/g, ' ').trim();
      // some shooting scripts carry a typed (CONT'D) inside the character name AND
      // FD's own appended one — "GROVES (CONT'D) (CONT’D)". One is apparatus stutter.
      if (el.type === 'character')
        el.text = el.text.replace(/\(CONT['’]D\)\s*(?:\(CONT['’]D\)\s*)+$/, "(CONT’D)");
      attachMarks(el, src);
      const rl = [];
      el.srcLines.forEach((s, i) => { if (s.rev) rl.push(i); });
      if (rl.length) el.rev = rl; // starred wrap-lines, by index — render restores the stars
      delete el.joined; delete el.srcLines; delete el.splitJoin;
    }

    // ---------- title page ----------
    let tp = [];
    if (titlePage) {
      tp = titlePage.lines.filter(l => !PROVENANCE.test(l.text)).map(l => ({
        text: l.text,
        row: Math.round((l.y - y0f) / rowH),   // the paginator draws at y0f; same base or the title drifts
        x: Math.round(l.x * 100) / 100,
      }));
    } else if (titleHead) {
      // The header lifted off page one becomes the title page, dropped down the sheet the
      // way Final Draft sets one rather than clinging to the top margin.
      // Rows come from the block's OWN line spacing, not the document's measured pitch:
      // one is measured over the whole script and rounds the title block's blank lines
      // away, welding "SOME LIKE IT HOT" onto the address above it. The median gap
      // between these lines IS one row here, by construction.
      const gaps = [];
      for (let g = 1; g < titleHead.length; g++) gaps.push(titleHead[g].y - titleHead[g - 1].y);
      const sorted = gaps.slice().sort((a, b) => a - b);
      const unit = sorted.length ? sorted[Math.floor(sorted.length / 2)] : rowH;
      const rowAt = new Map();
      let cursor = 14;
      rowAt.set(titleHead[0], cursor);
      for (let g = 1; g < titleHead.length; g++) {
        cursor += Math.max(1, Math.round((titleHead[g].y - titleHead[g - 1].y) / (unit || rowH)));
        rowAt.set(titleHead[g], cursor);
      }
      const rx = x => Math.round(x * 100) / 100;
      for (const l of titleHead) {
        if (PROVENANCE.test(l.text)) continue;
        const row = rowAt.get(l);
        // A title line often carries TWO columns — the company on the left, the date on
        // the right — held apart by a run of spaces. Kept as one padded string it is far
        // wider than the page once set in FD's character, and the right-hand half runs
        // off the edge ("November 12, 195"). Two columns, two entries.
        const m = /^(.*?\S)(\s{6,})(\S.*)$/.exec(l.text);
        if (m) {
          tp.push({ text: m[1].trim(), row, x: rx(l.x) });
          tp.push({ text: m[3].trim(), row, x: rx(l.x + (m[1].length + m[2].length) * charW0) });
        } else {
          tp.push({ text: l.text.trim(), row, x: rx(l.x) });
        }
      }
    }

    return {
      v: 1,
      // A slugline is never a title. With no title page, say so and let the caller decide —
      // it knows the filename and can read the script's own opening line.
      // a title page usually prints the name in quotes — they are not part of the title
      // a title page usually prints the name in quotes, and a typewriter spaces it out —
      // neither belongs in the title, and a site's stamp is not a title at all
      title: (() => {
        const t0 = ((tp[0] && tp[0].text) || '').replace(/^["“”']+|["“”']+$/g, '').replace(/\s+/g, ' ').trim();
        return (!t0 || PROVENANCE.test(t0)) ? 'UNTITLED' : t0;
      })(),
      titlePage: tp,
      // what the reading decided about this document's geometry — the first thing worth
      // knowing when an import comes out wrong
      __read: { cols, speechCollapsed, colTol, transRight, rowH, ocr: byEye },
      ...(decodeNote ? { importNote: decodeNote } : {}),
      layout,
      elements: els.map(e => ({ id: e.id, type: e.type, text: e.text, ...(e.xOverride != null ? { xOverride: e.xOverride } : {}), ...(e.align ? { align: e.align } : {}), ...(e.spaceBefore != null ? { spaceBefore: e.spaceBefore } : {}), ...(e.rev ? { rev: e.rev } : {}), ...(e.dual ? { dual: e.dual } : {}), ...(e.marks ? { marks: e.marks } : {}) })),
    };
  }

  // ---------- pagination ----------
  const SENT_END = /[.!?…](["')\]]*)?\s*$|[-–—]\s*$/;

  function xFor(el, line, layout, idx) {
    if (el.xOverride != null) return el.xOverride;
    const c = layout.cols;
    switch (el.type) {
      case 'scene': case 'action': case 'shot': return c.action;
      case 'dialogue': return c.dialogue;
      case 'paren': return layout.parenHang && idx === 0 ? c.paren - layout.charW : c.paren;
      case 'character': return c.character;
      case 'transition': return layout.transRight - line.length * layout.charW;
      case 'general': return c.action;
      default: return c.action;
    }
  }

  // group elements into placement blocks: speeches (character + paren/dialogue run) stay together
  function blocksOf(elements) {
    const blocks = [];
    let i = 0;
    while (i < elements.length) {
      const el = elements[i];
      if (el.dual) {                 // a dual group travels as one unbreakable block
        const g = el.dual.g, parts = [];
        while (i < elements.length && elements[i].dual && elements[i].dual.g === g) { parts.push(elements[i]); i++; }
        blocks.push({ kind: 'dual', parts });
        continue;
      }
      if (el.type === 'character') {
        const parts = [el]; i++;
        while (i < elements.length && (elements[i].type === 'dialogue' || elements[i].type === 'paren')) { parts.push(elements[i]); i++; }
        blocks.push({ kind: 'speech', parts });
      } else {
        blocks.push({ kind: 'single', parts: [el] }); i++;
      }
    }
    return blocks;
  }

  const blanksBefore = (prevType, curType) => {
    if (!prevType) return 0;
    if (curType === 'scene') return 2;
    return 1;
  };

  function paginate(doc) {
    const L = doc.layout;
    const pages = [];
    // title page
    if (doc.titlePage && doc.titlePage.length) {
      pages.push({
        title: true,
        lines: doc.titlePage.map((t, i) => ({
          x: t.x != null ? t.x : (L.pageW - t.text.length * L.charW) / 2,
          y: L.y0 + (t.row != null ? t.row : 17 + i * 4) * L.rowH,
          text: t.text, el: 'title:' + i, kind: 'title', off: 0,
        })),
      });
    }

    let cur = { lines: [] }, row = 0, prevType = null, scriptPage = 1;
    pages.push(cur);
    const yAt = r => L.y0 + r * L.rowH;

    const newPage = () => {
      scriptPage++;
      cur = { lines: [] };
      if (scriptPage >= 2) {
        const t = scriptPage + '.';
        cur.lines.push({ x: L.pnRight - t.length * L.charW, y: L.pnY, text: t, el: 'pn', kind: 'pn', off: 0 });
      }
      pages.push(cur);
      row = 0; prevType = null;
    };

    // wrapped lines cache with char offsets
    const wrapWithOffsets = (el) => {
      const lines = wrapElement(el, L);
      const out = []; let off = 0; const text = el.text;
      for (const ln of lines) {
        const idx = text.indexOf(ln, off);
        const at = idx >= 0 ? idx : off;
        out.push({ t: ln, off: at, i: out.length });
        off = at + ln.length;
      }
      return out;
    };

    const put = (el, lineObj, r, kind) => {
      cur.lines.push({ x: xFor(el, lineObj.t, L, lineObj.i), y: yAt(r), text: lineObj.t, el: el.id, kind: kind || el.type, off: lineObj.off,
        ...(el.rev && el.rev.includes(lineObj.i) ? { rev: true } : {}) });
    };

    // If a scene heading sits alone at the bottom of the current page and the block
    // after it is moving to a new page, the slugline moves with it (Final Draft rule).
    const retractSlug = () => {
      if (prevType !== 'scene') return null;
      let i = cur.lines.length;
      while (i > 0 && cur.lines[i - 1].kind === 'scene') i--;
      if (i === cur.lines.length) return null;
      return cur.lines.splice(i);
    };
    const replaySlug = (pulled) => {
      for (const sl of pulled) { cur.lines.push({ ...sl, y: yAt(row) }); row++; }
      prevType = 'scene';
    };

    const blocks = blocksOf(doc.elements);

    for (let bi = 0; bi < blocks.length; bi++) {
      const block = blocks[bi];
      const first = block.parts[0];
      const blanks = row === 0 ? 0 : (first.spaceBefore ?? blanksBefore(prevType, first.type));

      if (block.kind === 'single') {
        const el = first;
        const wl = wrapWithOffsets(el);
        const need = blanks + wl.length;

        if (row + need > L.rows) {
          // try splitting long action at a sentence boundary
          if ((el.type === 'action' || el.type === 'general') && wl.length > 2) {
            const avail = L.rows - (row + blanks);
            if (avail >= 2) {
              let k = -1;
              for (let i = Math.min(avail, wl.length - 1) - 1; i >= 1; i--) {
                if (SENT_END.test(wl[i].t)) { k = i + 1; break; }
              }
              if (k >= 2 && wl.length - k >= 1) {
                let r = row + blanks;
                for (let i = 0; i < k; i++) put(el, wl[i], r++);
                newPage();
                for (let i = k; i < wl.length; i++) put(el, wl[i], row++);
                prevType = el.type;
                continue;
              }
            }
          }
          if (wl.length > L.rows) { // absurdly long element: force break
            let r = row + blanks, i = 0;
            for (; i < wl.length; i++) {
              if (r >= L.rows) { newPage(); r = 0; }
              put(el, wl[i], r++);
            }
            row = r; prevType = el.type; continue;
          }
          const pulled = retractSlug();
          newPage();
          if (pulled) replaySlug(pulled);
        }
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of wl) put(el, lo, r++);
        row = r; prevType = el.type;
        continue;
      }

      if (block.kind === 'dual') {
        // two columns, one block: every element lays down at its own x, offset by
        // its row inside the region — the source's exact stagger — and the whole
        // thing moves to the next page rather than ever splitting
        const partLines = block.parts.map(el => ({ el, wl: wrapWithOffsets(el) }));
        let needRows = 0;
        for (const p2 of partLines) needRows = Math.max(needRows, p2.el.dual.r + p2.wl.length);
        if (row !== 0 && row + blanks + needRows > L.rows) {
          const pulled = retractSlug();
          newPage();
          if (pulled) replaySlug(pulled);
        }
        const start = row === 0 ? 0 : row + blanks;
        for (const p2 of partLines) {
          let r = start + p2.el.dual.r;
          for (const lo of p2.wl) put(p2.el, lo, r++);
        }
        row = start + needRows; prevType = 'dialogue';
        continue;
      }

      // ---- speech block ----
      const cueEl = block.parts[0];
      const cueLines = wrapWithOffsets(cueEl);
      const flat = []; // [{el, lineObj, subIdx}]
      for (let si = 1; si < block.parts.length; si++) {
        const sub = block.parts[si];
        for (const lo of wrapWithOffsets(sub)) flat.push({ el: sub, lo, si });
      }
      // A cue with nothing under it must still not be the last thing on a page: a name
      // alone at the foot of a sheet, its speech overleaf, is the fault he reported. Ask
      // for one row more than it needs so it moves over instead.
      const lonely = flat.length === 0 ? 1 : 0;
      const totalNeed = blanks + cueLines.length + flat.length + lonely;

      if (row + totalNeed <= L.rows) { // fits whole
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (const f of flat) put(f.el, f.lo, r++);
        row = r; prevType = block.parts[block.parts.length - 1].type;
        continue;
      }

      // doesn't fit: try split with (MORE)
      const startR = row === 0 ? 0 : row + blanks;
      const availBody = L.rows - startR - cueLines.length;
      let k = -1; // number of speech lines on this page
      if (availBody >= 2 && flat.length >= 3) {
        for (let i = Math.min(availBody, flat.length - 1); i >= 2; i--) {
          const f = flat[i - 1], nxt = flat[i];
          // a sub-element boundary is breakable — but never straight after a
          // parenthetical: FD keeps "(beat)" welded to the dialogue it modifies
          const subEnd = nxt.si !== f.si && f.el.type !== 'paren';
          if ((f.el.type === 'dialogue' && SENT_END.test(f.lo.t)) || subEnd) { k = i; break; }
        }
      }

      if (k >= 2) {
        let r = startR;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (let i = 0; i < k; i++) put(flat[i].el, flat[i].lo, r++);
        const lastY = yAt(r - 1);
        cur.lines.push({ x: L.cols.character, y: lastY + L.moreDy, text: '(MORE)', el: cueEl.id, kind: 'more', off: 0 });
        newPage();
        const cueTxt = /\(CONT['’]D\)\s*$/.test(cueEl.text) ? cueEl.text : cueEl.text + " (CONT'D)";
        cur.lines.push({ x: L.cols.character, y: L.y0 + L.contDy, text: cueTxt, el: cueEl.id, kind: 'contcue', off: 0 });
        let r2 = 0;
        for (let i = k; i < flat.length; i++) {
          if (r2 >= L.rows) { newPage(); r2 = 0; }   // a speech can outlast a second page
          put(flat[i].el, flat[i].lo, r2++);
        }
        row = r2; prevType = block.parts[block.parts.length - 1].type;
      } else {
        const pulled = retractSlug();
        newPage();
        if (pulled) replaySlug(pulled);
        let r = row === 0 ? 0 : row + blanks;
        for (const lo of cueLines) put(cueEl, lo, r++);
        for (const f of flat) {
          if (r >= L.rows) { newPage(); r = 0; } // pathological: speech longer than a page
          put(f.el, f.lo, r++);
        }
        row = r; prevType = block.parts[block.parts.length - 1].type;
      }
    }

    return { pages, count: scriptPage };
  }

  // ---------- FDX: Final Draft's own format, both directions ----------
  // Parsed with a purpose-built reader for the FDX subset (Paragraph/Text/TitlePage) —
  // no DOMParser, so the same code runs in the browser, the app, and node tests.
  const FDX_TYPES = {
    'Scene Heading': 'scene', 'Action': 'action', 'Character': 'character',
    'Parenthetical': 'paren', 'Dialogue': 'dialogue', 'Transition': 'transition',
    'Shot': 'shot', 'General': 'general', 'Cast List': 'general',
  };
  const FDX_REV = { scene: 'Scene Heading', action: 'Action', character: 'Character', paren: 'Parenthetical', dialogue: 'Dialogue', transition: 'Transition', shot: 'Shot', general: 'General' };
  const unxml = s => s.replace(/&#x([0-9a-f]+);/gi, (_, n) => String.fromCodePoint(parseInt(n, 16)))
    .replace(/&#(\d+);/g, (_, n) => String.fromCodePoint(+n))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  const toxml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  function fdxParagraphs(xml) {
    const out = [];
    for (const m of xml.matchAll(/<Paragraph\b([^>]*?)\/>|<Paragraph\b([^>]*)>([\s\S]*?)<\/Paragraph>/g)) {
      const attrs = m[1] ?? m[2] ?? '';
      const inner = m[3] ?? '';
      const type = (attrs.match(/Type="([^"]*)"/) || [])[1] || 'Action';
      let text = '';
      const marks = [];
      for (const t of inner.matchAll(/<Text\b([^>]*?)\/>|<Text\b([^>]*)>([\s\S]*?)<\/Text>/g)) {
        const tAttrs = t[1] ?? t[2] ?? '';
        const chunk = unxml((t[3] ?? '').replace(/<[^>]+>/g, ''));
        if (!chunk) continue;
        const style = (tAttrs.match(/Style="([^"]*)"/) || [])[1] || '';
        const s0 = text.length;
        text += chunk;
        if (/Bold/i.test(style)) marks.push([s0, text.length, 'b']);
        if (/Italic/i.test(style)) marks.push([s0, text.length, 'i']);
        if (/Underline/i.test(style)) marks.push([s0, text.length, 'u']);
      }
      out.push({ type, text, marks });
    }
    return out;
  }

  function importFdx(xml) {
    if (!/<FinalDraft\b/.test(xml)) throw new Error('not a Final Draft document');
    const tpm = xml.match(/<TitlePage>[\s\S]*?<\/TitlePage>/);
    const bodyXml = tpm ? xml.replace(tpm[0], '') : xml;
    const els = [];
    for (const p of fdxParagraphs(bodyXml)) {
      const type = FDX_TYPES[p.type];
      if (!type) continue;                       // outline/act furniture stays behind
      const el = { id: uid(), type, text: p.text };
      if (p.marks.length) el.marks = p.marks;
      els.push(el);
    }
    if (!els.length) throw new Error('no script paragraphs in this FDX');
    const doc = newDoc('UNTITLED');
    doc.elements = els;
    doc.titlePage = [];
    if (tpm) {
      const lines = fdxParagraphs(tpm[0]).map(p => p.text);
      let row = 16;
      for (const t of lines.slice(0, 24)) { doc.titlePage.push({ text: t, row }); row += t.trim() ? 2 : 1; }
    }
    const tpTitle = doc.titlePage.find(t => /[A-Za-z]{2,}/.test(t.text));
    doc.title = (tpTitle && tpTitle.text.trim().slice(0, 40))
      || (els.find(e => e.type === 'scene' && e.text.trim())?.text ?? 'UNTITLED').slice(0, 40);
    return doc;
  }

  function markRunsOf(el) {
    const text = el.text || '';
    if (!el.marks || !el.marks.length) return [{ text, style: '' }];
    const bits = new Uint8Array(text.length);
    const BIT = { b: 1, i: 2, u: 4 };
    for (const [s, e, k] of el.marks) for (let i = Math.max(0, s); i < Math.min(text.length, e); i++) bits[i] |= BIT[k] || 0;
    const runs = [];
    let i = 0;
    while (i < text.length) {
      const b = bits[i];
      let j = i + 1;
      while (j < text.length && bits[j] === b) j++;
      const style = [b & 1 && 'Bold', b & 2 && 'Italic', b & 4 && 'Underline'].filter(Boolean).join('+');
      runs.push({ text: text.slice(i, j), style });
      i = j;
    }
    return runs;
  }

  function toFdx(doc) {
    const para = el => {
      const runs = markRunsOf(el).map(r =>
        '<Text' + (r.style ? ' Style="' + r.style + '"' : '') + '>' + toxml(r.text.replace(/\n/g, ' ')) + '</Text>').join('');
      return '    <Paragraph Type="' + FDX_REV[el.type] + '">' + (runs || '<Text></Text>') + '</Paragraph>';
    };
    const tp = (doc.titlePage || []).filter(t => t.text != null).map(t =>
      '      <Paragraph Type="General" Alignment="Center"><Text>' + toxml(t.text) + '</Text></Paragraph>').join('\n');
    return '<?xml version="1.0" encoding="UTF-8" standalone="no" ?>\n' +
      '<FinalDraft DocumentType="Script" Template="No" Version="5">\n' +
      '  <Content>\n' + doc.elements.map(para).join('\n') + '\n  </Content>\n' +
      (tp ? '  <TitlePage>\n    <Content>\n' + tp + '\n    </Content>\n  </TitlePage>\n' : '') +
      '</FinalDraft>\n';
  }

  // ---------- fountain export ----------
  function toFountain(doc) {
    const out = [];
    if (doc.titlePage.length) {
      out.push('Title: ' + (doc.title || ''));
      const by = doc.titlePage.find(t => /by/i.test(t.text));
      const auth = doc.titlePage[doc.titlePage.length - 1];
      if (auth && auth.text !== doc.title) out.push('Author: ' + auth.text);
      out.push('');
    }
    for (const el of doc.elements) {
      const t = el.text.replace(/\n/g, ' ');
      switch (el.type) {
        case 'scene': out.push('', t.toUpperCase()); break;
        case 'action': case 'general': out.push('', el.text); break;
        case 'shot': out.push('', '!' + t); break;
        case 'character': out.push('', t); break;
        case 'paren': out.push(t); break;
        case 'dialogue': out.push(t); break;
        case 'transition': out.push('', '> ' + t); break;
      }
    }
    return out.join('\n').replace(/^\n+/, '') + '\n';
  }

  // ---------- conforming an import to Final Draft ----------
  // A PDF carries whatever geometry its author happened to use. There Will Be
  // Blood is set ~11.2pt on 25pt leading — double spaced, 69 characters to the
  // action line; Jackie Brown is its own shape again. Reproducing that faithfully
  // gives you the source's typesetting, not a screenplay: text splits onto lines
  // Final Draft would never break, and anything typed afterwards wraps somewhere
  // else entirely. So the extractor measures the source exactly (that is what
  // proves the read was right) and everything that reaches the editor is then
  // conformed to FD12's grid. The words are the source's; the typesetting is FD's.
  function toFinalDraft(doc) {
    const L = doc.layout || LETTER;
    const fd = { ...JSON.parse(JSON.stringify(LETTER)), parenHang: 1 };
    const srcMidX = (L.pageW || fd.pageW) / 2;
    const xScale = fd.charW / (L.charW || fd.charW);
    const rowScale = (L.rowH || fd.rowH) / fd.rowH;
    // Map x from the LEFT TEXT MARGIN, not the page centre. Some Like It Hot sets its
    // block at x=32 with a 6.0pt character, and scaling that about the centre threw every
    // title-page line to x=-22.8 — off the sheet. Anchoring on the margin keeps a narrow
    // source on the page, and for a source already on FD's grid it is a pure translation.
    const srcLeft = (L.cols && L.cols.action != null) ? L.cols.action : fd.cols.action;
    const toFdX = x => Math.max(0, Math.min(fd.pageW - 12,
      Math.round((fd.cols.action + (x - srcLeft) * xScale) * 100) / 100));

    // A source line break is either a decision or an accident. The importer keeps
    // the source's breaks verbatim whenever greedy wrap can't reproduce them, which
    // is right for reproduction and wrong for conformance: a break the source made
    // because it ran out of room at 69 characters becomes a permanent hard break on
    // FD's 60-character grid — text splitting onto lines for no reason. So ask of
    // every break: would the next word have fitted? If it would have, the writer
    // meant it and it stays; if it wouldn't, the source simply ran out of room and
    // the text flows again. (Joining swaps "\n" for " " — one character for one —
    // so emphasis offsets are untouched.)
    // Greedy wrap at width W produces exactly these lines when every line fits
    // (W ≥ longest line) and every break was forced (W < line + 1 + the next
    // line's first word). That pins W to an interval; if the interval is
    // non-empty, some width explains all of it and the breaks are the source's
    // margin talking, not the writer. A blank line, or a break with room to
    // spare, empties the interval — and those breaks are kept.
    for (const el of doc.elements) {
      if (el.dual) continue;                       // columns keep their exact lines
      if (el.text.indexOf('\n') < 0) continue;
      const lines = el.text.split('\n');
      const srcW = (L.widths && L.widths[el.type]) || 0;
      // Inside a paragraph, a line break belongs to the page it was set on, not to
      // the writing: a Final Draft export breaks where its margin fell, and a typed
      // transcription — There Will Be Blood is one — breaks wherever the typist hit
      // return, at no consistent width at all. Neither survives a change of measure,
      // so the paragraph flows and FD's margin breaks it again. Two exceptions: a
      // blank line is structure, and a short line in capitals is a shot or slug the
      // importer folded into the paragraph below, which must not be swallowed by it.
      const CAPS = s => s === s.toUpperCase() && /[A-Z]/.test(s);
      const foldedHeading = /^(action|shot|general|scene)$/.test(el.type);
      let out = lines[0];
      for (let i = 1; i < lines.length; i++) {
        const prev = lines[i - 1];
        const heading = foldedHeading && CAPS(prev) && prev.length < (srcW || 60) * 0.8;
        // A numbered list is structure, not a paragraph that happened to wrap: Kill Bill
        // opens on its table of contents, and flowing it turned the chapter titles into
        // one run of prose. A line that STARTS a numbered item keeps the break above it.
        const listItem = /^\s*\d{1,3}[.)]\s/.test(lines[i]);
        const keep = lines[i] === '' || prev === '' || heading || listItem;
        out += (keep ? '\n' : ' ') + lines[i];
      }
      el.text = out;
    }

    // the title page is positioned rather than flowed, so it moves with the grid
    if (doc.titlePage) doc.titlePage = doc.titlePage.map(t => {
      const o = { ...t };
      if (o.row != null) o.row = Math.max(0, Math.round(o.row * rowScale));
      if (o.x != null) {
        // Clamping the START of the line keeps its first character on the page and lets
        // the rest run off the edge: a date set against the right margin came back as
        // "November 12, 195". Place it so the line ENDS inside the margin.
        const w = ((o.text || '').length) * fd.charW;
        const rightMost = Math.max(0, fd.pageW - 72 - w);
        o.x = Math.max(0, Math.min(toFdX(o.x), rightMost));
      }
      return o;
    });
    for (const el of doc.elements) {
      // measured blank-row gaps encode the source's rhythm (double spacing lives
      // here); dropping them hands spacing back to FD's own rule
      delete el.spaceBefore;
      // A hard x from the source fights FD's columns, so it goes — EXCEPT for dual
      // dialogue, whose two side-by-side columns ARE its xOverride. Dropping it there
      // stacks both speeches on the same x and they print through each other.
      if (el.dual) { if (el.xOverride != null) el.xOverride = toFdX(el.xOverride); }
      else delete el.xOverride;
    }
    // Emphasis is what DIFFERS from the base face. Jackie Brown's PDF sets every
    // speech in a bold Courier and every action line in an oblique one — import that
    // literally and the whole script arrives bold and italic. So per element type:
    // if a style covers almost all of that type's text it is the source's typeface,
    // not the writer emphasising anything, and it goes. A few italic words inside
    // ordinary action are nowhere near the threshold and stay.
    {
      const total = {}, byKind = {};
      for (const el of doc.elements) {
        if (!el.text) continue;
        total[el.type] = (total[el.type] || 0) + el.text.length;
        for (const [s, e, k] of el.marks || []) {
          byKind[el.type] = byKind[el.type] || {};
          byKind[el.type][k] = (byKind[el.type][k] || 0) + Math.max(0, Math.min(e, el.text.length) - Math.max(0, s));
        }
      }
      const base = {};
      for (const t of Object.keys(byKind)) {
        if ((total[t] || 0) < 200) continue;       // too little text to judge a face
        for (const k of Object.keys(byKind[t])) {
          // Only bold and italic can be a typeface: they are read off the font's NAME,
          // so a PDF set in a bold Courier reports every speech as bold. An underline
          // is ink somebody drew — on a scan, pixels somebody typed over — and is
          // always deliberate, however much of the script carries it. There Will Be
          // Blood underlines every slug, and that is the script, not its typesetting.
          if (k === 'u') continue;
          if (byKind[t][k] / total[t] >= 0.8) (base[t] = base[t] || new Set()).add(k);
        }
      }
      if (Object.keys(base).length) for (const el of doc.elements) {
        const drop = base[el.type];
        if (!drop || !el.marks) continue;
        el.marks = el.marks.filter(m => !drop.has(m[2]));
        if (!el.marks.length) delete el.marks;
      }
    }

    if (L.revX != null) fd.revX = fd.pageW - 54;   // revision stars at FD's right margin
    doc.layout = fd;
    return doc;
  }

  function newDoc(title) {
    return {
      v: 1, title: title || 'UNTITLED',
      titlePage: [
        { text: (title || 'UNTITLED').toUpperCase(), row: 17 },
        { text: 'Written by', row: 21 },
        { text: '', row: 24 },
      ],
      layout: { ...JSON.parse(JSON.stringify(LETTER)), parenHang: 1 },   // FD's -0.10" first indent: the "(" hangs
      elements: [{ id: uid(), type: 'scene', text: '' }],
    };
  }

  return { TYPES, LETTER, uid, linesFromItems, estimateCharW, wrapText, wrapElement, importPdf, importFdx, toFdx, toFinalDraft, paginate, toFountain, newDoc, SCENE_RE };
})();
/*PICA-ENGINE-END*/
</script>
<script>
/* ================================================================
   PICA UI — the editor around the engine.
   The model is the truth; contenteditable is only a caret.
   ================================================================ */
(() => {
'use strict';
const E = PicaEngine;
const $ = s => document.querySelector(s);
const pagesEl = $('#pages'), canvasEl = $('#canvas');

// ---------- state ----------
const S = {
  doc: null, docId: null, res: null,
  caret: null,            // {el, off} — el is element id, 'title:N', or null
  zoom: null,             // null = fit
  k: 1,                   // px per pt
  undo: [], redo: [],
  pageEls: [],            // [{wrap, page, sig, live}]
  vis: new Set(),         // visible page indices
  menu: null,             // active popup {el, items, sel, onPick, kind}
  fontPt: 12,
  showTitle: false,       // the title page is opt-in; see toggleTitlePage()
  saveTimer: null, lastSave: null, snapAt: 0,
};
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
};

// ---------- document store (never lose anything) ----------
// Documents and snapshots live in IndexedDB. They used to live in localStorage, whose
// ~5MB origin quota a few 150-page scripts plus rolling snapshots exceed — at which
// point WebKit rejects the write, and an import "succeeded" into an index entry whose
// body never saved: the 1-page blank ghost. IndexedDB has no such ceiling here.
// A save that fails now SAYS SO and touches nothing; a load that fails never
// fabricates a blank. The small stuff (index, prefs) stays in localStorage.
const idb = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      const r = indexedDB.open('pica', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
      r.onsuccess = () => { idb.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  put(k, v){
    return new Promise((res, rej) => {
      const t = idb.db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = () => res();
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error || new Error('aborted'));
    });
  },
  get(k){
    return new Promise((res, rej) => {
      const t = idb.db.transaction('kv', 'readonly');
      const q = t.objectStore('kv').get(k);
      q.onsuccess = () => res(q.result ?? null);
      q.onerror = () => rej(q.error);
    });
  },
  del(k){
    return new Promise((res) => {
      const t = idb.db.transaction('kv', 'readwrite');
      t.objectStore('kv').delete(k);
      t.oncomplete = () => res(); t.onerror = () => res(); t.onabort = () => res();
    });
  },
};

const store = {
  cache: new Map(),          // id → doc; the in-memory truth while the app runs
  index(){ return LS.get('pica.index', []); },
  saveIndex(ix){ LS.set('pica.index', ix); },
  async load(id){
    if (store.cache.has(id)) return store.cache.get(id);
    let doc = null;
    try { doc = await idb.get('doc.' + id); } catch {}
    if (!doc) {
      doc = LS.get('pica.doc.' + id, null);            // legacy localStorage copy
      if (doc) idb.put('doc.' + id, doc).catch(() => {});
    }
    if (doc) { store.conformImport(doc, id); store.upgradeTypedLayout(doc); store.cache.set(id, doc); }
    return doc;
  },
  // Scripts imported before conforming existed still carry their source's
  // typesetting — There Will Be Blood double-spaced at 69 characters to the line.
  // Their layout still holds the measured widths, so the same conversion works on
  // open, and nothing has to be imported twice.
  conformImport(doc, id){
    const L = doc && doc.layout;
    if (!L || !L.widths) return;
    if (L.charW === 7.2 && L.rowH === 12 && L.widths.action === 60 && L.pageW === 612) return;
    const measured = doc.src || doc.importNote || L.revX != null
      || (doc.titlePage || []).some(t => t.x != null)
      || (doc.elements || []).some(e => e.xOverride != null || e.spaceBefore != null || e.rev || e.dual);
    if (!measured) return;                       // a typed doc — upgradeTypedLayout's job
    E.toFinalDraft(doc);
    doc.src = doc.src || 'pdf';
    if (id) store.save(id, doc);
  },
  // Layouts freeze into each doc at creation — so geometry fixes only ever reached
  // NEW docs, and a script typed last week keeps wrapping at the old widths
  // ("action wraps too early", "paren issue still there"). A TYPED doc is
  // recognisable: its layout is exactly a former LETTER (imports carry measured
  // geometry, import notes or star bands). Those upgrade in place to FD12's
  // numbers; imported docs are never touched — they reproduce their sources.
  upgradeTypedLayout(doc){
    const L = doc && doc.layout;
    // never an import: those carry provenance now, and older ones are recognised
    // by the traces only a measured document has (import note, star margin,
    // positioned title page, per-element geometry)
    if (!L || doc.src || doc.importNote || L.revX != null) return;
    if ((doc.titlePage || []).some(t => t.x != null)) return;
    if ((doc.elements || []).some(e => e.xOverride != null || e.align || e.spaceBefore != null || e.rev || e.dual)) return;
    const typed = L.pageW === 612 && L.cols && L.cols.action === 108 && L.cols.dialogue === 180
      && L.cols.paren === 216 && (L.cols.character === 266 || L.cols.character === 252)
      && (L.widths.action === 57 || L.widths.action === 60);
    if (!typed) return;
    const fresh = JSON.parse(JSON.stringify(E.LETTER));
    doc.layout = { ...L, cols: fresh.cols, widths: fresh.widths, transRight: fresh.transRight, parenHang: 1 };
  },
  // A deleted script must never be written back. Deleting the one that is OPEN used to
  // do nothing at all: the delete filtered the index, then openDoc() flushed a save of
  // the outgoing document, and that save put the row straight back. A debounced save,
  // a snapshot or the pagehide mirror could do the same a second later. So the id is
  // remembered as gone, and every write checks.
  gone: new Set(),
  // every copy fetched by search, until he accepts one: reading several to pick the
  // cleanest means more than one is alive at a time, so the guard cannot be "the current
  // trial" — it is the set of them
  trials: new Set(),
  save(id, doc){
    if (store.gone.has(id)) return;
    // A script found by search is on TRIAL until he accepts it: it opens, it paginates,
    // it can be read — but nothing about it reaches the library. Guarding here rather
    // than at the call sites catches the debounced save and the page-count refresh too.
    if (store.trials.has(id)) { store.cache.set(id, doc); return; }
    store.cache.set(id, doc);
    // the index is small and synchronous — write it NOW so the sidebar shows the script
    // immediately; only the document body travels through IndexedDB
    const ix = store.index();
    const it = ix.find(d => d.id === id);
    const meta = { id, title: doc.title || 'UNTITLED', pages: S.res ? S.res.count : 0, at: Date.now() };
    if (it) Object.assign(it, meta); else ix.unshift(meta);
    store.saveIndex(ix);
    idb.put('doc.' + id, doc).catch(err => {
      // the body failed to persist: withdraw the index entry rather than lie
      store.saveIndex(store.index().filter(d => d.id !== id));
      try { rail(); } catch {}
      overlayCard('<h2>Could not save</h2><div class="sub">storage</div>' +
        '<p>The database refused the write (' + String(err && err.message || err).replace(/</g, '&lt;') +
        '). Nothing was recorded as saved. Export your work now — Export → JSON — and tell me about this.</p>' +
        '<div class="foot"><button class="hbtn" onclick="document.getElementById(\'overlay\').classList.remove(\'show\')">close</button></div>');
    });
  },
  async snapshot(id, doc){
    if (store.gone.has(id)) return;
    let snaps = null;
    try { snaps = await idb.get('snap.' + id); } catch {}
    if (!snaps) snaps = LS.get('pica.snap.' + id, []);
    snaps.push({ t: Date.now(), doc });
    while (snaps.length > 5) snaps.shift();
    S.snaps = snaps;
    idb.put('snap.' + id, snaps).catch(() => {});
  },
  // one-time sweep: copy legacy localStorage documents into IndexedDB, verify the copy
  // reads back, and only then free the localStorage blob — reclaiming the quota that
  // was silently breaking saves. Anything unverified stays exactly where it is.
  async migrate(){
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('pica.doc.') || k.startsWith('pica.snap.'))) keys.push(k);
    }
    for (const k of keys) {
      const idbKey = k.replace('pica.doc.', 'doc.').replace('pica.snap.', 'snap.');
      try {
        const existing = await idb.get(idbKey);
        const legacy = LS.get(k, null);
        if (legacy == null) continue;
        if (!existing) {
          await idb.put(idbKey, legacy);
          const back = await idb.get(idbKey);
          if (!back || JSON.stringify(back).length !== JSON.stringify(legacy).length) continue; // keep legacy
        }
        localStorage.removeItem(k);
      } catch { /* keep the legacy copy */ }
    }
    // an emergency mirror from a previous session becomes a snapshot, never an overwrite
    const em = LS.get('pica.emergency', null);
    if (em && em.id && em.doc) {
      try {
        const current = await idb.get('doc.' + em.id);
        if (!current || JSON.stringify(current) !== JSON.stringify(em.doc)) await store.snapshot(em.id, em.doc);
      } catch {}
      try { localStorage.removeItem('pica.emergency'); } catch {}
    }
  },
};

// ---------- boot ----------
// ── the studio card ────────────────────────────────────────────────────────────────
// ★★★★★ × PARADOX, for a beat, the way a film company's mark precedes a film. The
// card is NOT written here: it is ~/Desktop/★★★★★/brand/studio-card.html, shipped
// beside this file, and loaded in a frame. One file, every product — a mark that
// exists in two places starts drifting the moment one of them is edited.
function studioCard(){
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;'
    + 'background:transparent;z-index:98;';
  f.src = 'studio-card.html?' + new URLSearchParams({
    variant: 'icon', product: 'PICA', icon: 'app-icon.png',
    year: String(new Date().getFullYear()), mode: 'overlay',
  });
  let gone = false;
  const drop = () => { if (gone) return; gone = true; window.removeEventListener('message', onMsg); f.remove(); };
  const onMsg = ev => { if (ev.data === 'paradox-card-done') drop(); };
  window.addEventListener('message', onMsg);
  // it says when it has finished; the timer is only there in case it never loads at
  // all, because a missing brand asset must never leave a sheet over the editor
  f.addEventListener('error', drop);
  setTimeout(drop, 4000);
  document.body.appendChild(f);
}

async function boot(){
  try { studioCard(); } catch {}
  const ui0 = LS.get('pica.ui', {});
  if (ui0.theme) document.documentElement.dataset.theme = ui0.theme;
  S.showTitle = !!ui0.showTitle;
  applyUiPrefs();
  applyRailPrefs();
  await idb.open();
  await store.migrate();
  // hygiene: an UNTITLED with no words, no title page, no notes, no panels and no
  // drafts is provably content-free — a fabrication or abandoned scratch. Those
  // rows don't belong in the index. Anything with a single character stays.
  try {
    const ix0 = store.index();
    const keep = [];
    for (const d of ix0) {
      if (d.title !== 'UNTITLED') { keep.push(d); continue; }
      const doc = await store.load(d.id);
      const empty = !doc || ((doc.elements || []).every(e => !e.text && !(e.notes || []).length && !(e.panels || []).length)
        && !(doc.titlePage || []).some(t => t.text) && !(doc.drafts || []).length);
      if (empty) { store.cache.delete(d.id); idb.del('doc.' + d.id); idb.del('snap.' + d.id); }
      else keep.push(d);
    }
    if (keep.length !== ix0.length) store.saveIndex(keep);
  } catch {}
  const ix = store.index();
  const last = LS.get('pica.ui', {}).lastDoc;
  let id = (last && ix.some(d => d.id === last)) ? last : (ix[0] && ix[0].id);
  if (!id) { id = E.uid(); const doc = E.newDoc('UNTITLED'); store.save(id, doc); }
  await openDoc(id);
  if (LS.get('pica.ui', {}).reader) readerOn();
  if (LS.get('pica.ui', {}).split) splitOn();
  const m = location.search.match(/[?&]open=([^&]+)/);
  if (m) fetch(decodeURIComponent(m[1])).then(r => r.arrayBuffer()).then(b => importPdfBuffer(b, decodeURIComponent(m[1]).split('/').pop())).catch(()=>{});
}

async function openDoc(id, _tried){
  if (S.docId && S.doc) { flushSave(); store.snapshot(S.docId, S.doc); }
  let doc = await store.load(id);
  if (!doc) {
    // never fabricate a blank in place of a script that would not load — and never
    // resurrect a stale or deleted id as a saved UNTITLED: that is how ghost
    // entries linger in the index. Walk to the next real script instead;
    // fabricate only when nothing in the library will open.
    const ix = store.index();
    if (ix.some(d => d.id === id)) toast('could not load that script — its data is missing');
    if (S.doc) return;
    const tried = _tried || new Set();
    tried.add(id);
    const fallback = ix.find(d => !tried.has(d.id));
    if (fallback) return openDoc(fallback.id, tried);
    id = E.uid();                       // fresh id: never overwrite a broken entry
    doc = E.newDoc('UNTITLED');
    store.save(id, doc);
  }
  S.snaps = [];
  idb.get('snap.' + id).then(v => { S.snaps = v || LS.get('pica.snap.' + id, []); }).catch(() => {});
  S.doc = doc; S.docId = id; S.undo = []; S.redo = [];
  S.caret = doc.elements[0] ? { el: doc.elements[0].id, off: 0 } : null;
  const ui = LS.get('pica.ui', {}); ui.lastDoc = id; LS.set('pica.ui', ui);
  S.fontPt = doc.layout.charW / 0.6;
  repaginate(); buildPages(); renderAllVisible(); status();
  $('#docTitle').textContent = doc.title;
  $('#docGenre').textContent = doc.genre || '';
  const saved = LS.get('pica.scroll', {})[id];
  canvasEl.scrollTop = 0;
  if (saved) requestAnimationFrame(() => {
    canvasEl.scrollTop = saved;          // land back where he stopped reading
    setTimeout(() => { canvasEl.scrollTop = saved; renderAllVisible(); status(); }, 90);
  });
  printPageCSS();
  // the index row is written from S.res, so it has to be saved AND drawn after
  // pagination — drawing it first is what left every freshly imported script
  // reading "1p" in the sidebar until something else happened to redraw it
  store.save(id, doc);
  rail();
  positionTitle();     // the cue axis only exists once the pages are laid out
  draftChip();
}

// ---------- geometry ----------
function fitZoom(){
  const avail = canvasEl.clientWidth - 32;
  return Math.min(1.08, Math.max(.3, avail / (S.doc.layout.pageW * 4 / 3)));
}
function computeK(){
  S.k = (S.zoom == null ? fitZoom() : S.zoom) * 4 / 3;
  const z = document.getElementById('zPct');
  if (z) z.textContent = Math.round((S.zoom == null ? fitZoom() : S.zoom) * 100) + '%';
}

// ---------- pagination + rendering ----------
// The title page is a separate artifact, not part of the writing surface — hidden unless
// asked for (⌘⇧T). Passing an empty titlePage omits page 0; script pagination is untouched.
function repaginate(){
  S.res = E.paginate(S.showTitle ? S.doc : Object.assign({}, S.doc, { titlePage: [] }));
}
function toggleTitlePage(){
  S.showTitle = !S.showTitle;
  if (B.doc) setTimeout(repaginateB, 0);
  const ui = LS.get('pica.ui', {}); ui.showTitle = S.showTitle; LS.set('pica.ui', ui);
  const keep = S.caret;
  repaginate(); buildPages(); renderAllVisible();
  S.caret = keep && keep.el.startsWith('title:') && !S.showTitle
    ? (S.doc.elements[0] ? { el: S.doc.elements[0].id, off: 0 } : null) : keep;
  restoreCaret(); rail(); status();
  toast(S.showTitle ? 'title page shown' : 'title page hidden');
}

function pageSig(p){
  let s = '';
  const seen = new Set();
  for (const l of p.lines) {
    s += l.x + '|' + l.y + '|' + l.el + '|' + l.text + '\n';
    // emphasis changes no text and no geometry — without the marks in the
    // signature, ⌘B/I/U never repaints and "underline doesn't work at all"
    if (!seen.has(l.el)) {
      seen.add(l.el);
      const el = elById(l.el);
      if (el && el.marks) s += 'm' + JSON.stringify(el.marks) + '\n';
    }
  }
  return s;
}

function buildPages(){       // (re)create page shells to match page count
  computeK();
  const n = S.res.pages.length;
  pagesEl.innerHTML = '';
  S.pageEls = [];
  for (let i = 0; i < n; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'pageWrap'; wrap.dataset.i = i;
    wrap.style.width = (S.doc.layout.pageW * S.k) + 'px';
    wrap.style.height = (S.doc.layout.pageH * S.k) + 'px';
    const ghost = document.createElement('div');
    ghost.className = 'pageghost'; ghost.textContent = '· ' + (i + 1) + ' ·';
    ghost.contentEditable = 'false';
    wrap.appendChild(ghost);
    pagesEl.appendChild(wrap);
    S.pageEls.push({ wrap, page: null, sig: null, live: false });
  }
  io.disconnect();
  for (const pe of S.pageEls) io.observe(pe.wrap);
}

const io = new IntersectionObserver(ents => {
  for (const en of ents) {
    const i = +en.target.dataset.i;
    if (en.isIntersecting) S.vis.add(i); else S.vis.delete(i);
  }
  renderAllVisible();
}, { root: canvasEl, rootMargin: '600px 0px' });

function renderAllVisible(){
  const want = new Set(S.vis);
  const ci = caretPage(); if (ci >= 0) { want.add(ci); want.add(ci + 1); }
  for (let i = 0; i < S.pageEls.length; i++) {
    const pe = S.pageEls[i];
    if (want.has(i)) renderPage(i);
    else if (pe.live && !want.has(i)) { /* keep rendered pages; cheap */ }
  }
  positionTitle();
}

// The title begins where the character names begin.
//
// Every cue starts at the same x — 3.5" on FD's grid — so that edge is a hard vertical
// line running the length of the script, and it is the line the eye follows. Centring
// the title on the cues' optical CENTRE instead (which this did for a while) puts its
// left edge ~95px to the left of that line and its right edge past their ragged ends,
// so nothing shares an edge and the alignment reads as broken. Left edge to left edge.
function titleAxisX(){                    // in page points
  return (S.doc && S.doc.layout.cols.character) || 252;
}
function positionTitle(){
  const el = document.getElementById('docTitle'); if (!el) return;
  const clear = () => { el.style.left = ''; el.style.transform = ''; el.style.textAlign = ''; };
  if (matchMedia('(max-width: 880px)').matches) return clear();
  const pe = S.pageEls.find(p => p.wrap);
  if (!pe || !S.doc) return clear();
  const r = pe.wrap.getBoundingClientRect();
  if (!r.width) return clear();
  // the box is centred by default (transform + text-align); to place its FIRST
  // CHARACTER we position the box's content edge instead
  const cs = getComputedStyle(el);
  const padL = parseFloat(cs.paddingLeft) || 0;
  el.style.transform = 'none';
  el.style.textAlign = 'left';
  el.style.left = (r.left + titleAxisX() * S.k - padL) + 'px';
}

function renderPage(i){
  const pe = S.pageEls[i]; if (!pe) return;
  const p = S.res.pages[i];
  const sig = pageSig(p) + '|k' + S.k;
  if (pe.live && pe.sig === sig) return;
  const L = S.doc.layout, k = S.k;
  const page = document.createElement('div');
  page.className = 'page';
  page.style.width = (L.pageW * k) + 'px';
  page.style.height = (L.pageH * k) + 'px';
  page.style.fontSize = (S.fontPt * k) + 'px';
  page.style.lineHeight = (L.rowH * k) + 'px';
  for (const l of p.lines) {
    const d = document.createElement('div');
    d.className = 'line';
    const editable = l.kind !== 'pn' && l.kind !== 'more' && l.kind !== 'contcue';
    if (!editable) { d.contentEditable = 'false'; d.classList.add('gen'); }
    d.dataset.el = l.el; d.dataset.off = l.off; d.dataset.kind = l.kind;
    d.style.left = (l.x * k) + 'px';
    d.style.top = ((l.y - S.fontPt * 0.79) * k) + 'px';
    d.style.height = (L.rowH * k) + 'px';
    const src = editable ? elById(l.el) : null;
    const bits = src ? markBitsFor(src, l.off, l.text.length) : null;
    if (bits) d.innerHTML = markedHTML(l.text, bits);
    else d.textContent = l.text;
    page.appendChild(d);
    if (l.rev && L.revX) { // the source's revision star, back at its own margin x
      const m = document.createElement('div');
      m.className = 'line gen';
      m.contentEditable = 'false';
      m.dataset.kind = 'rev';
      m.style.left = (L.revX * k) + 'px';
      m.style.top = ((l.y - S.fontPt * 0.79) * k) + 'px';
      m.style.height = (L.rowH * k) + 'px';
      m.textContent = '*';
      page.appendChild(m);
    }
  }
  pe.wrap.replaceChildren(page);
  pe.wrap.style.width = (L.pageW * k) + 'px';
  pe.wrap.style.height = (L.pageH * k) + 'px';
  pe.page = page; pe.sig = sig; pe.live = true;
  renderNotes(i);
  renderPanels(i);
}

function renderAfterEdit(){
  if (B.doc && B.id === S.docId) { clearTimeout(window._bEdit); window._bEdit = setTimeout(repaginateB, 500); }
  const n = S.res.pages.length;
  if (n !== S.pageEls.length) { buildPages(); }
  renderAllVisible();
  restoreCaret();
  rail(); status(); saveSoon();
}

function rerenderAll(){ computeK(); for (const pe of S.pageEls){ pe.sig=null; } buildPages(); renderAllVisible(); restoreCaret(); }

// ---------- caret mapping ----------
function caretPage(){
  if (!S.caret) return -1;
  const { el, off } = S.caret;
  let any = -1;
  for (let i = 0; i < S.res.pages.length; i++)
    for (const l of S.res.pages[i].lines) {
      if (l.el !== el || l.kind === 'more' || l.kind === 'contcue' || l.kind === 'pn') continue;
      if (any < 0) any = i;
      if (off >= (l.off || 0) && off <= (l.off || 0) + l.text.length) return i;
    }
  return any;
}

function domCaret(){        // DOM selection -> {el, off} | null
  const sel = getSelection();
  if (!sel.anchorNode) return null;
  return pointFrom(sel.anchorNode, sel.anchorOffset);
}
function domRange(){        // both ends, ordered by document position
  const sel = getSelection();
  if (sel.rangeCount === 0) return null;
  const a = pointFrom(sel.anchorNode, sel.anchorOffset);
  const f = pointFrom(sel.focusNode, sel.focusOffset);
  if (!a || !f) return null;
  if (a.el === f.el) return a.off <= f.off ? [a, f] : [f, a];
  const ia = orderKey(a), ifo = orderKey(f);
  return ia <= ifo ? [a, f] : [f, a];
}
// A line may contain nested <b>/<i>/<u> spans, so the caret's offset within the line is
// the sum of every text node before it — not the offset inside whichever node it landed in.
function pointFrom(node, offset){
  if (!node) return null;
  const host = (node.nodeType === 3 ? node.parentElement : node);
  const line = host.closest?.('.line');
  if (!line || !line.dataset.el || line.dataset.el === 'pn') return null;
  let within = 0;
  if (node.nodeType === 3) {
    const walk = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
    let n, found = false;
    while ((n = walk.nextNode())) {
      if (n === node) { within += offset; found = true; break; }
      within += n.length;
    }
    if (!found) within = offset;
  } else {
    within = offset > 0 ? line.textContent.length : 0;
  }
  return { el: line.dataset.el, off: (+line.dataset.off || 0) + within };
}
function orderKey(pt){
  if (pt.el.startsWith('title:')) return -1e6 + (+pt.el.slice(6));
  const i = S.doc.elements.findIndex(e => e.id === pt.el);
  return i * 1e6 + pt.off;
}

function syncCaret(){
  const dc = domCaret();
  if (dc) {
    // A wrap trims the trailing space from the rendered line, so a caret sitting
    // just after that space has no DOM home — the DOM reads one char left. That
    // reading must defer to the model or the next keystroke lands INSIDE the space.
    const amb = S.caret && dc.el === S.caret.el && S.caret.off === dc.off + 1
      && (elById(dc.el)?.text?.[dc.off] === ' ');
    if (!amb) S.caret = dc;
  }
  return S.caret;
}

// Find the line that truly CONTAINS the caret offset. Generated lines ((MORE),
// (CONT'D) cues, page numbers) share a real element's id at off 0 and must never
// match. If the containing line isn't rendered yet — the tail of a speech that
// just crossed onto a fresh page — render the caret's page and look again;
// only then fall back to the nearest line BELOW the offset. The old fallback
// grabbed the element's FIRST line and clamped, teleporting the caret a hundred
// characters back mid-typing.
function caretLine(el, off){
  let contain = null, below = null;
  for (const pe of S.pageEls) {
    if (!pe.live || !pe.page) continue;
    for (const d of pe.page.children) {
      if (d.dataset.el !== el) continue;
      const k = d.dataset.kind;
      if (k === 'more' || k === 'contcue' || k === 'pn') continue;
      const start = +d.dataset.off || 0, len = d.textContent.length;
      if (off >= start && off <= start + len) contain = { d, at: off - start };
      else if (off > start + len && (!below || start > (+below.d.dataset.off || 0))) below = { d, at: len };
    }
  }
  return { contain, below };
}
function restoreCaret(){
  if (!S.caret) return;
  const { el, off } = S.caret;
  let { contain, below } = caretLine(el, off);
  if (!contain) {
    const i = caretPage();
    if (i >= 0) { renderPage(i); renderPage(i + 1); ({ contain, below } = caretLine(el, off)); }
  }
  const best = contain || below;
  if (best) placeCaret(best.d, best.at);
}
function domPosIn(lineDiv, at){   // (line div, char offset) → [text node, node offset]
  const walk = document.createTreeWalker(lineDiv, NodeFilter.SHOW_TEXT);
  let n, acc = 0, target = null, off = 0;
  while ((n = walk.nextNode())) {
    if (at <= acc + n.length) { target = n; off = at - acc; break; }
    acc += n.length;
    target = n; off = n.length;
  }
  return target ? [target, Math.min(off, target.length)] : [lineDiv, 0];
}
function placeCaret(lineDiv, at){
  const r = document.createRange();
  const [n, o] = domPosIn(lineDiv, at);
  r.setStart(n, o);
  r.collapse(true);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}

// ---------- model ops + undo ----------
const elById = id => S.doc.elements.find(e => e.id === id);
const elIndex = id => S.doc.elements.findIndex(e => e.id === id);

function pushUndo(rec){ S.redo = []; S.undo.push(rec); if (S.undo.length > 600) S.undo.shift(); }

function opText(id, text, caretAfter){
  if (typeof inReader === 'function' && inReader()) return;
  const el = id.startsWith('title:') ? null : elById(id);
  if (id.startsWith('title:')) {
    const i = +id.slice(6); const t = S.doc.titlePage[i]; if (!t) return;
    const last = S.undo[S.undo.length - 1];
    if (last && last.k === 'ttext' && last.i === i && Date.now() - last.ts < 900) { last.after = text; last.ca = caretAfter; last.ts = Date.now(); }
    else pushUndo({ k: 'ttext', i, before: t.text, after: text, cb: S.caret, ca: caretAfter, ts: Date.now() });
    t.text = text; delete t.x; // recenter on edit
    if (i === 0) { S.doc.title = text || 'UNTITLED'; $('#docTitle').textContent = S.doc.title; }
  } else {
    if (!el) return;
    const last = S.undo[S.undo.length - 1];
    if (last && last.k === 'text' && last.id === id && Date.now() - last.ts < 900) { last.after = text; last.ca = caretAfter; last.ts = Date.now(); }
    else pushUndo({ k: 'text', id, before: el.text, after: text, cb: S.caret, ca: caretAfter, ts: Date.now() });
    el.text = text;
  }
  S.caret = caretAfter;
  repaginate(); renderAfterEdit();
}

function opSplice(i, delCount, inserted, caretAfter){
  if (inReader()) return;
  const removed = S.doc.elements.slice(i, i + delCount).map(e => ({ ...e }));
  pushUndo({ k: 'splice', i, removed, inserted: inserted.map(e => ({ ...e })), cb: S.caret, ca: caretAfter, ts: Date.now() });
  S.doc.elements.splice(i, delCount, ...inserted);
  S.caret = caretAfter;
  repaginate(); renderAfterEdit();
}

// several text changes as one undo step (Replace All)
function opTexts(changes, caretAfter){
  if (inReader()) return;
  const real = changes.filter(c => elById(c.id));
  if (!real.length) return;
  pushUndo({ k: 'texts', list: real.map(c => ({ id: c.id, before: elById(c.id).text, after: c.text })), cb: S.caret, ca: caretAfter || S.caret, ts: Date.now() });
  for (const c of real) elById(c.id).text = c.text;
  S.caret = caretAfter || S.caret;
  repaginate(); renderAfterEdit();
}

function opConvert(id, type){
  if (inReader()) return;
  const el = elById(id); if (!el) return;
  pushUndo({ k: 'retype', ids: [id], before: [{ t: el.type, x: el.text }], after: null, cb: S.caret, ca: S.caret, ts: Date.now() });
  el.type = type;
  if (type === 'scene' || type === 'character' || type === 'transition' || type === 'shot') el.text = el.text.toUpperCase();
  if (type === 'paren' && el.text !== '' && !/^\(/.test(el.text)) el.text = '(' + el.text.replace(/\)?\s*$/, '') + ')';
  S.undo[S.undo.length - 1].after = [{ t: el.type, x: el.text }];
  repaginate(); renderAfterEdit();
}

// retype several elements at once — one undo step
function opRetype(ids, type){
  if (inReader()) return;
  const els = ids.map(elById).filter(Boolean);
  if (!els.length) return;
  pushUndo({ k: 'retype', ids: els.map(e => e.id), before: els.map(e => ({ t: e.type, x: e.text })), after: null, cb: S.caret, ca: S.caret, ts: Date.now() });
  for (const el of els) {
    el.type = type;
    if (type === 'scene' || type === 'character' || type === 'transition' || type === 'shot') el.text = el.text.toUpperCase();
    if (type === 'paren' && el.text !== '' && !/^\(/.test(el.text)) el.text = '(' + el.text.replace(/\)?\s*$/, '') + ')';
  }
  S.undo[S.undo.length - 1].after = els.map(e => ({ t: e.type, x: e.text }));
  repaginate(); renderAfterEdit();
}

function undo(redo){
  const src = redo ? S.redo : S.undo, dst = redo ? S.undo : S.redo;
  const rec = src.pop(); if (!rec) return;
  dst.push(rec);
  if (rec.k === 'text') { const el = elById(rec.id); if (el) el.text = redo ? rec.after : rec.before; }
  else if (rec.k === 'ttext') { const t = S.doc.titlePage[rec.i]; if (t) { t.text = redo ? rec.after : rec.before; if (rec.i === 0) { S.doc.title = t.text; $('#docTitle').textContent = t.text; } } }
  else if (rec.k === 'splice') {
    if (redo) S.doc.elements.splice(rec.i, rec.removed.length, ...rec.inserted.map(e => ({ ...e })));
    else S.doc.elements.splice(rec.i, rec.inserted.length, ...rec.removed.map(e => ({ ...e })));
  }
  else if (rec.k === 'texts') {
    for (const c of rec.list) { const el = elById(c.id); if (el) el.text = redo ? c.after : c.before; }
  }
  else if (rec.k === 'retype') {
    const state = redo ? rec.after : rec.before;
    rec.ids.forEach((id, i) => { const el = elById(id); if (el && state[i]) { el.type = state[i].t; el.text = state[i].x; } });
  }
  else if (rec.k === 'marks') {
    const state = redo ? rec.after : rec.before;
    rec.ids.forEach((id, i) => {
      const el = elById(id); if (!el) return;
      if (state[i]) el.marks = JSON.parse(JSON.stringify(state[i])); else delete el.marks;
    });
  }
  else if (rec.k === 'notes' || rec.k === 'panels') {
    const state = redo ? rec.after : rec.before;
    rec.ids.forEach((id, i) => {
      const el = elById(id); if (!el) return;
      if (state[i]) el[rec.k] = JSON.parse(JSON.stringify(state[i])); else delete el[rec.k];
    });
    if (rec.k === 'notes') ensureAnnotate(); else ensureStoryboard();
  }
  S.caret = redo ? rec.ca : rec.cb;
  repaginate(); renderAfterEdit();
  // margins track whatever came back: re-render both layers (they bail when off)
  renderNotesAll(); renderPanelsAll();
}

// ---------- editing behaviour: the Final Draft grammar ----------
// Final Draft's own grammar. FOLLOW is the ReturnKey= attribute from FD12's shipped
