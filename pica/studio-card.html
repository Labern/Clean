<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>★★★★★ × PARADOX</title>
<!--
  THE STUDIO CARD — ★★★★★ × PARADOX
  ═════════════════════════════════════════════════════════════════════════════
  The thing that appears for two seconds when one of these apps opens, the way a
  film company's logo precedes a film: the studio signs the work, then gets out
  of the way. The app behind it keeps its own visual language — PICA is ink on
  paper and always will be. This is not that app; it is who made it.

  ONE FILE, EVERY PRODUCT. Do not copy the markup into a host and restyle it —
  that is how two versions of a mark start to drift apart. Load THIS file:

    · a Mac app  — a borderless NSPanel with a WKWebView on it, ?mode=panel
    · a web app  — a fixed, transparent <iframe> over everything, ?mode=overlay

  PARAMETERS (query string, all optional)
    product   the app's name          PICA
    tagline   one line under it       a screenwriting instrument
    version   shown in the colophon   1.0
    year      copyright year          2026
    holder    copyright holder        LABERN
    mode      panel | overlay         overlay
    theme     dark | light            dark
    ms        total time on screen    1940

  It tells its host when it is finished — postMessage 'paradox-card-done' to the
  parent, and to webkit.messageHandlers.paradox if a native side is listening —
  so nobody has to keep a second copy of the timing.

  Palette and type are STYLE.md's, unaltered: ~/Desktop/★★★★★/STYLE.md.
-->
<style>
:root{
  /* PARADOX — the canonical set. Every colour below is a token and nothing
     references a hex directly, so the light version is one class, not a rewrite. */
  --bg-1:#0f0c29; --bg-2:#302b63; --bg-3:#24243e; --bg-4:#1a1a2e;
  --border:#875fd7;
  --ink:#cfcae6; --faint:#8787af; --dark:#5f5f87;
  /* the accent family — the mark is monochrome, these are here for anything a host
     product wants to tint on top of the card */
  --teal2:#5fd7af; --teal:#87d7d7; --violet:#af87ff; --violet2:#d787ff; --pink:#ff87ff;
  --rule:rgba(135,95,215,.28);
  --shadow:0 30px 80px rgba(0,0,0,.55);
  --scrim:rgba(10,8,20,.42);
  --mono:"Menlo","SF Mono","Consolas",ui-monospace,monospace;
  --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
}
/* The white version, later, costs exactly this much. */
:root.light{
  --bg-1:#faf9ff; --bg-2:#efecfb; --bg-3:#f4f2fd; --bg-4:#e9e6f7;
  --border:#c9bdf0;
  --ink:#221d3a; --faint:#6b6590; --dark:#a9a2c8;
  --teal2:#0f9c78; --teal:#1f8f9c; --violet:#6d3fd4; --violet2:#9b3fd4; --pink:#c43fb0;
  --rule:rgba(109,63,212,.22);
  --shadow:0 24px 60px rgba(60,40,120,.20);
  --scrim:rgba(250,249,255,.55);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; background:transparent; }
body{
  font-family:var(--mono);
  display:flex; align-items:center; justify-content:center;
  /* the card is never a click target for the app underneath */
  -webkit-user-select:none; user-select:none; cursor:default;
  overflow:hidden;
}
/* overlay mode floats the card on a scrim; panel mode IS the card, edge to edge */
body.overlay{ background:var(--scrim); }
body.panel{ background:transparent; }

.card{
  position:relative; overflow:hidden;
  width:460px; height:300px;
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; justify-content:center;
  padding:0 2.4rem;
  opacity:0;
  transition:opacity var(--in,220ms) ease;
}
body.panel .card{
  /* the window already provides the frame and the shadow's job is done by the
     window server, so the card simply fills it */
  width:100%; height:100%; box-shadow:none;
}
.card.in{ opacity:1; }
.card.out{ opacity:0; transition:opacity var(--out,320ms) ease; }

/* the drifting four-stop ground — STYLE.md §2 */
.card::before{
  content:""; position:absolute; inset:-40%;
  background:linear-gradient(125deg,var(--bg-1),var(--bg-2),var(--bg-3),var(--bg-4));
  background-size:260% 260%;
  animation:drift 26s ease-in-out infinite;
}
@keyframes drift{
  0%,100%{ background-position:0% 50%; }
  50%    { background-position:100% 50%; }
}
.inner{ position:relative; text-align:center; }

/* ── the mark ─────────────────────────────────────────────────────────────── */
/* The lockup itself — brackets, five stars, the ×, PARADOX in its serif — is the
   artwork at ~/Desktop/★★★★★/img/logo-white.png, inlined here as data so the card
   stays one file with no requests. It is white on transparent, so it sits on any
   dark ground and inverts to the light theme by being darkened, not by swapping to
   a second file that could fall out of step with this one. */
.mark{
  width:232px; height:auto; display:block; margin:0 auto;
  opacity:0; animation:strike 620ms cubic-bezier(.2,.7,.3,1) 140ms forwards;
}
:root.light .mark{ filter:invert(1) brightness(.18); }
@keyframes strike{
  from{ opacity:0; transform:translateY(-3px) scale(1.035); }
  to  { opacity:1; transform:none; }
}

/* ── the product ──────────────────────────────────────────────────────────── */
.product{
  /* MONOGRAPH's thesis, borrowed: the serif is the writer, the mono is the engineer.
     The mark is set in a serif, so the product's name answers it in one — and every
     label, count and date on the card stays mono. */
  margin-top:2.1rem;
  font-family:var(--serif);
  font-size:30px; letter-spacing:.2em; color:var(--ink);
  text-transform:uppercase; white-space:nowrap;
}
.tagline{ margin-top:.85rem; font-size:11.5px; letter-spacing:.06em; color:var(--faint); }

/* ── the colophon ─────────────────────────────────────────────────────────── */
.rule{ height:1px; background:var(--rule); margin:2.2rem 0 .95rem; }
.colophon{
  font-size:9.5px; letter-spacing:.2em; color:var(--faint);
  text-transform:uppercase; white-space:nowrap;
}

/* Anyone who has asked the system to stop moving things gets a still card. */
@media (prefers-reduced-motion:reduce){
  .card::before{ animation:none; }
  .mark{ animation:none; opacity:1; }
}
</style>
</head>

    <div class="tagline" id="tagline"></div>
    <div class="rule"></div>
    <div class="colophon" id="colophon"></div>
  </div>
</div>
<script>
(() => {
  // Two ways in, because not every host has a URL to hang a query on: a native app
  // that loads this file as a STRING (the card is self-contained, logo included, so it
  // needs no origin at all) sets window.PARADOX_PARAMS before the document runs.
  const q = new URLSearchParams(location.search);
  const injected = window.PARADOX_PARAMS || {};
  const get = (k, dflt) => {
    if (injected[k] != null && injected[k] !== '') return String(injected[k]);
    const v = q.get(k);
    return (v == null || v === '') ? dflt : v;
  };

  const product = get('product', 'PICA');
  const tagline = get('tagline', 'a screenwriting instrument');
  const version = get('version', '1.0');
  const year    = get('year', String(new Date().getFullYear()));
  const holder  = get('holder', 'LABERN');
  const total   = Math.max(600, parseInt(get('ms', '1940'), 10) || 1940);

  if (get('theme', 'dark') === 'light') document.documentElement.classList.add('light');
  document.body.className = get('mode', 'overlay') === 'panel' ? 'panel' : 'overlay';

  // Tracking out is done with letter-spacing, not by typing spaces between letters:
  // spaced-out characters are what made a title page read "F O R  Y O U R" once, and
  // anything that copies text out of here should get the word, not the spelling of it.
  document.getElementById('product').textContent = product;
  document.getElementById('tagline').textContent = tagline;
  document.getElementById('colophon').textContent =
    'Version ' + version + ' · © ' + year + ' ' + holder;

  const card = document.getElementById('card');
  const IN = 220, OUT = 320;
  card.style.setProperty('--in', IN + 'ms');
  card.style.setProperty('--out', OUT + 'ms');

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    card.classList.add('out');
    setTimeout(() => {
      try { parent.postMessage('paradox-card-done', '*'); } catch {}
      try { webkit.messageHandlers.paradox.postMessage('done'); } catch {}
    }, OUT);
  };

  requestAnimationFrame(() => card.classList.add('in'));
  const timer = setTimeout(finish, total - OUT);
  // it is a signature, not a dialogue — any click or key sends it away early
  const early = () => { clearTimeout(timer); finish(); };
  addEventListener('mousedown', early);
  addEventListener('keydown', early);
})();
</script>
