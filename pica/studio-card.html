<html lang="en">
<head>
<meta charset="utf-8">
<title>★★★★★ × PARADOX</title>
<!--
  THE STUDIO CARD — ★★★★★ × PARADOX
  ═════════════════════════════════════════════════════════════════════════════
  The two seconds when one of these apps opens, the way a film company's mark
  precedes a film: the studio signs the work, then gets out of the way. The app
  behind it keeps its own visual language and owes this card nothing.

  TWO VARIANTS, ALWAYS BOTH. Every product gets its card made both ways:

    icon      the app's own logo, then ★★★★★ × PARADOX signing underneath —
              two drawn marks, nothing between them (the order a credit runs
              on a title page)
    wordmark  ★★★★★ × PARADOX, a thin grey rule, then the app's name typeset —
              a drawn mark answered by a set one

  The rule belongs only to the wordmark: it separates two different kinds of
  thing. Between two drawn marks it would be a fence.

  ONE FILE, EVERY PRODUCT. Do not copy this markup into a host and restyle it;
  that is how two versions of a mark start to drift apart. Load THIS file:

    · a Mac app  — a borderless NSPanel with a WKWebView on it, mode=panel
    · a web app  — a fixed, transparent <iframe> over everything, mode=overlay

  PARAMETERS — query string, or window.PARADOX_PARAMS set before the document
  runs, for a native host with no URL to hang a query on:

    variant   icon | wordmark        wordmark
    product   the app's name         (the wordmark variant sets it)
    icon      url or data: uri       app-icon.png, beside this file
    version   appended to the ©      (omitted)
    year      copyright year         this year
    holder    copyright holder       PARADOXICA Ltd.
    mode      panel | overlay        overlay
    theme     light | dark           light
    ms        total time on screen   1940

  It tells its host when it has finished — postMessage 'paradox-card-done' to
  the parent, and to webkit.messageHandlers.paradox if a native side listens —
  so nobody keeps a second copy of the timing.

  The lockup is the real artwork (★★★★★/img/logo-white.png recoloured to ink,
  its alpha untouched) inlined as data: no request, no second file, and a dark
  ground inverts it back rather than loading another copy.
-->
<style>
:root{
  /* ink on white — the studio's card is monochrome and stays that way */
  --paper:#ffffff;
  --ink:#0d0d0c;
  --faint:#8a8a84;
  --line:#d8d7d1;          /* the rule, and the border round the app's tile */
  --edge:#e4e3dd;          /* the card's own border */
  --shadow:0 24px 60px rgba(20,20,19,.22);
  --scrim:rgba(255,255,255,.55);
  --invert:0;              /* the lockup is drawn in ink; 1 flips it for a dark ground */
  --mono:ui-monospace,"SF Mono","Menlo","Consolas",monospace;
  --serif:ui-serif,"New York","Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
}
/* the dark ground, when a product wants one: one class, no second artwork */
:root.dark{
  --paper:#0e0b1a; --ink:#f2f0ea; --faint:#7e7d92;
  --line:#33304a; --edge:#2a2350;
  --shadow:0 30px 80px rgba(0,0,0,.55);
  --scrim:rgba(10,8,20,.42);
  --invert:1;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; background:transparent; }
body{
  font-family:var(--mono);
  display:flex; align-items:center; justify-content:center;
  -webkit-user-select:none; user-select:none; cursor:default;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
body.overlay{ background:var(--scrim); }   /* floats the card on a scrim */
body.panel{ background:transparent; }      /* the card IS the window */

.card{
  position:relative; overflow:hidden;
  width:460px; height:300px;
  background:var(--paper);
  border:1px solid var(--edge);
  border-radius:12px;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding-bottom:1.1rem;                 /* room under the block for the copyright */
  opacity:0; transition:opacity var(--in,220ms) ease;
}
body.panel .card{ width:100%; height:100%; box-shadow:none; }
.card.in{ opacity:1; }
.card.out{ opacity:0; transition:opacity var(--out,320ms) ease; }

/* the app's own logo — the tile is drawn for a Dock, where the system supplies its
   edge; on paper the card supplies it, or the white tile has no shape at all */
.appicon{
  width:92px; height:92px; display:block;
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  margin-bottom:1.4rem;
}
.mark{
  width:196px; height:auto; display:block;
  filter:invert(var(--invert));
  opacity:0; animation:strike 620ms cubic-bezier(.2,.7,.3,1) 140ms forwards;
}
@keyframes strike{
  from{ opacity:0; transform:translateY(-3px) scale(1.03); }
  to  { opacity:1; transform:none; }
}
/* the rule belongs to the wordmark variant only */
.rule{ width:236px; height:1px; background:var(--line); margin:1.9rem 0; }
.product{
  font-family:var(--serif);
  font-size:32px; letter-spacing:.26em; color:var(--ink);
  text-transform:uppercase; white-space:nowrap;
  text-indent:.26em;                      /* tracking pushes the last letter right */
}
.cr{
  position:absolute; right:18px; bottom:14px;
  font-size:8px; letter-spacing:.16em; color:var(--faint); white-space:nowrap;
  /* NOT uppercased: the company is PARADOXICA Ltd., and shouting it gives LTD.,
     which breaks the word the name is making. */
}
@media (prefers-reduced-motion:reduce){ .mark{ animation:none; opacity:1; } }
</style>
</head>

<script>
(() => {
  // Two ways in, because not every host has a URL to hang a query on: a native app
  // that loads this file as a STRING — it is self-contained, so it needs no origin —
  // sets window.PARADOX_PARAMS before the document runs.
  const q = new URLSearchParams(location.search);
  const injected = window.PARADOX_PARAMS || {};
  const get = (k, dflt) => {
    if (injected[k] != null && injected[k] !== '') return String(injected[k]);
    const v = q.get(k);
    return (v == null || v === '') ? dflt : v;
  };

  const variant = get('variant', 'wordmark') === 'icon' ? 'icon' : 'wordmark';
  const product = get('product', 'PICA');
  const version = get('version', '');
  const year    = get('year', String(new Date().getFullYear()));
  const holder  = get('holder', 'PARADOXICA Ltd.');
  const total   = Math.max(600, parseInt(get('ms', '1940'), 10) || 1940);

  if (get('theme', 'light') === 'dark') document.documentElement.classList.add('dark');
  document.body.className = get('mode', 'overlay') === 'panel' ? 'panel' : 'overlay';

  const card = document.getElementById('card');
  if (variant === 'icon') {
    const img = document.getElementById('appicon');
    img.alt = product;
    img.src = get('icon', 'app-icon.png');
    // If the app's own logo cannot be found there is nothing to sign, so the card
    // falls back to the name rather than showing a hole where a mark should be.
    img.onerror = () => { img.remove(); showWordmark(); };
    img.hidden = false;
    // the app first, the studio signing underneath
    card.insertBefore(img, card.firstElementChild);
  } else showWordmark();

  function showWordmark(){
    const p = document.getElementById('product'), r = document.getElementById('rule');
    p.textContent = product;
    p.hidden = false; r.hidden = false;
  }

  document.getElementById('cr').textContent =
    '© ' + year + ' ' + holder + (version ? ' · v' + version : '');

  const IN = 220, OUT = 320;
  card.style.setProperty('--in', IN + 'ms');
  card.style.setProperty('--out', OUT + 'ms');

  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    card.classList.add('out');
    setTimeout(() => {
      try { parent.postMessage('paradox-card-done', '*'); } catch {}
      try { webkit.messageHandlers.paradox.postMessage('done'); } catch {}
    }, OUT);
  };

  requestAnimationFrame(() => card.classList.add('in'));
  const timer = setTimeout(finish, total - OUT);
  // it is a signature, not a dialogue — any click or key sends it away early
  const early = () => { clearTimeout(timer); finish(); };
  addEventListener('mousedown', early);
  addEventListener('keydown', early);
