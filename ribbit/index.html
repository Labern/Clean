<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF7FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ribbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-192.png">
<title>Ribbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --ink:#2A2C3B; --ink2:#4A4D63; --ground:#FFF7FA; --white:#FFFFFF;
  --pink:#FFB3C7; --pink2:#FFD3E0; --pinkbg:#FFE4EC; --butter:#FFF1B8; --sun:#FFE07A;
  --lilac:#E5DDFF; --lilac2:#C9B6FF; --sky:#EAF1FF; --water:#BFE6F2; --pad:#8FD383;
  --mint:#E3F7EC; --blue:#CFEFFF; --low:#FF9A7A;
  --display:Fredoka, ui-rounded, system-ui, sans-serif;
  --body:Nunito, ui-rounded, system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--body);font-weight:700;overscroll-behavior:none}
body{display:flex;justify-content:center}
#app{width:100%;max-width:440px;height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);position:relative;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.h2{font-family:var(--display);font-weight:700;font-size:22px}
.sub{font-size:14px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--white);border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 4px 0 var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:2.5px solid var(--ink);border-radius:99px;padding:5px 12px 5px 6px;box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:17px}
.btn{text-align:center;border:2.5px solid var(--ink);border-radius:22px;box-shadow:0 4px 0 var(--ink);background:var(--white);font-family:var(--display);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:6px 10px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.5}
.big{min-height:60px;font-size:20px;font-weight:700}
.back{width:48px;height:48px;border-radius:16px;padding:0;min-height:0;box-shadow:0 3px 0 var(--ink)}
.chip{flex:1;min-height:44px;border-radius:99px;box-shadow:none;font-size:15px;padding:4px 6px}
.on{background:var(--butter)!important;box-shadow:0 0 0 3px var(--ground),0 0 0 5.5px var(--ink)!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat .lab{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:5px}
.bar{height:14px;background:var(--white);border:2.5px solid var(--ink);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.stage{flex:1;min-height:250px;position:relative;border:2.5px solid var(--ink);border-radius:32px;overflow:hidden;box-shadow:0 4px 0 var(--ink);background:var(--sky)}
.stage>svg.bg{position:absolute;inset:0;width:100%;height:100%}
.bubble{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--white);border:2.5px solid var(--ink);border-radius:20px;padding:9px 15px;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap;z-index:5;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.frogwrap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:3}
.frog{display:block;animation:bob 2.8s ease-in-out infinite}
.frog.hop{animation:hop .55s ease-out}
.frog svg{display:block;width:100%;height:auto;overflow:visible}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(4px) scale(1.06,.92)}55%{transform:translateY(-34px) scale(.96,1.06)}80%{transform:translateY(0) scale(1.04,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.025)}}
@keyframes drift{0%{transform:translate(0,-20px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(40px,520px) rotate(240deg);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}}
@keyframes glow{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-10px)}}
@keyframes fall{0%{transform:translateY(-30px);opacity:0}15%{opacity:1}100%{transform:translateY(520px);opacity:0}}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.4);opacity:0}30%{transform:translate(-50%,0) scale(1.1);opacity:1}100%{transform:translate(-50%,-34px) scale(1);opacity:0}}
@keyframes plop{0%{transform:scale(.3) translateY(-20px);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes toast{0%{transform:translate(-50%,-20px);opacity:0}12%,85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-10px);opacity:0}}
.petal{position:absolute;top:0;animation:drift 10s linear infinite;z-index:2}
.tw{position:absolute;animation:twinkle 2.3s ease-in-out infinite;z-index:2}
.ff{position:absolute;animation:glow 2.6s ease-in-out infinite;z-index:4}
.drop{position:absolute;top:0;animation:fall 1.7s linear infinite;z-index:4}
.treatpop{position:absolute;left:50%;top:70px;z-index:6;animation:pop 1.8s ease-out forwards}
.plop{animation:plop .45s ease-out}
.wiggle{animation:wiggle .9s ease-in-out infinite}
.decor{position:absolute;z-index:2}
.visitor{position:absolute;z-index:4;display:flex;align-items:flex-end;gap:2px;background:none;border:0;padding:0}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.actions .btn{flex-direction:column;min-height:82px;gap:2px;border-radius:22px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{flex-direction:column;min-height:110px;gap:3px;border-radius:22px;padding:6px}
.price{font-size:12px;font-weight:700;background:var(--white);border:2px solid var(--ink);border-radius:99px;padding:1px 9px;font-family:var(--display)}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:6px;margin:0 -4px;padding-left:4px;padding-right:4px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--white);font-family:var(--display);font-weight:600;font-size:16px;padding:10px 18px;border-radius:99px;animation:toast 2.6s ease forwards;white-space:nowrap;pointer-events:none}
input[type=text]{width:100%;height:58px;background:var(--white);border:2.5px solid var(--ink);border-radius:20px;padding:0 18px;font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);box-shadow:0 4px 0 var(--ink);outline:none}
label{font-family:var(--display);font-weight:600;font-size:17px}
.night{background:#2E2B4F}
.swatch.ring{box-shadow:0 0 0 3px var(--ground),0 0 0 5.5px var(--ink)}
.swatch{width:50px;height:50px;border-radius:99px;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0}
.ic{display:inline-block;line-height:0}
.ic svg{width:100%;height:100%}
.list .btn{justify-content:flex-start;text-align:left;gap:12px;padding:10px 12px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const K = '#2A2C3B';
const HEART = 'M0 10 C-12 2 -10 -10 -3 -7 Q0 -6 0 -2 Q0 -6 3 -7 C10 -10 12 2 0 10 Z';
const SPARK = 'M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12 Z';
const STARP = 'M0 -18 L5 -6 L18 -5 L8 3 L11 16 L0 9 L-11 16 L-8 3 L-18 -5 L-5 -6 Z';

/* ---------- art: the frog ---------- */
const MOODS = {
  happy: {},
  hungry: { mouth: 'M131 156 a9 10 0 1 0 18 0 a9 10 0 1 0 -18 0 Z', mouthFill: '#C2475E', pupil: 13, sparkle: 0 },
  eating: { mouth: 'M118 146 Q140 180 162 146 Z', mouthFill: '#C2475E', open: 0, squint: 1, tongue: 1 },
  sleepy: { mouth: 'M133 154 Q140 158 147 154', open: 0, sleep: 1, zzz: 1, sparkle: 0, blush: 0.6 },
  love: { mouth: 'M112 146 Q140 174 168 146', open: 0, love: 1, hearts: 1 },
  sad: { mouth: 'M122 160 Q140 148 158 160', pupil: 9, tear: 1, blush: 0.4, sparkle: 0 }
};
function frogSVG(o) {
  const m = Object.assign({ mouth: 'M116 150 Q140 168 164 150', mouthFill: 'none', open: 1, pupil: 11, love: 0, squint: 0, sleep: 0, blush: 1, tongue: 0, tear: 0, hearts: 0, zzz: 0, sparkle: 1 }, MOODS[o.mood] || {});
  const wear = o.wear || 'none', rc = o.color || '#FF9FBF', stage = o.stage || 'bloom';
  const bud = stage === 'bud' ? 1 : 0, sprout = stage === 'sprout' ? 1 : 0, bloom = bud || sprout ? 0 : 1;
  return `<svg viewBox="0 0 280 260" role="img" aria-label="${esc(o.name || 'Ribbit')} the frog, feeling ${MOODS[o.mood] ? o.mood : 'happy'}">
<ellipse cx="140" cy="250" rx="70" ry="7" fill="${K}" opacity="0.12"/>
<g class="breathe">
<g stroke="${K}" stroke-width="3" stroke-linejoin="round">
<ellipse cx="114" cy="244" rx="20" ry="8" fill="#7DCB6E"/><ellipse cx="166" cy="244" rx="20" ry="8" fill="#7DCB6E"/>
<ellipse cx="140" cy="214" rx="50" ry="34" fill="#7DCB6E"/>
<ellipse cx="88" cy="214" rx="12" ry="18" fill="#7DCB6E" transform="rotate(28 88 214)"/><ellipse cx="192" cy="214" rx="12" ry="18" fill="#7DCB6E" transform="rotate(-28 192 214)"/>
<ellipse cx="140" cy="222" rx="28" ry="20" fill="#E9F7DF" stroke="none"/>
</g>
<g opacity="${bud}" stroke="${K}" stroke-width="3" stroke-linejoin="round"><path d="M114 188 Q118 210 130 206 Q134 200 132 188 Z M166 188 Q162 210 150 206 Q146 200 148 188 Z" fill="#5DAE57"/><path d="M128 188 Q130 210 140 212 Q150 210 152 188 Z" fill="#A8E6C8"/></g>
<g opacity="${sprout}" stroke="${K}" stroke-width="3" stroke-linejoin="round"><path d="M116 188 Q114 210 140 214 Q166 210 164 188 Z" fill="#FFD3E0"/><path d="M126 190 Q128 206 140 208 Q152 206 154 190 Z" fill="#FFFFFF"/></g>
<g opacity="${bloom}" stroke="${K}" stroke-width="3" stroke-linejoin="round" fill="#FFF4F7"><path d="M98 186 Q92 204 108 210 Q118 200 116 186 Z"/><path d="M182 186 Q188 204 172 210 Q162 200 164 186 Z"/><path d="M116 188 Q114 210 140 214 Q166 210 164 188 Z" fill="#FFD3E0"/><path d="M126 190 Q128 206 140 208 Q152 206 154 190 Z" fill="#FFFFFF"/><circle cx="140" cy="200" r="3.5" fill="#FFE07A" stroke-width="1.5"/></g>
<ellipse cx="140" cy="138" rx="112" ry="64" fill="#7DCB6E" stroke="${K}" stroke-width="3"/>
<g stroke="${K}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<path d="M140 76 Q138 56 140 38" fill="none" stroke="#5DAE57" stroke-width="4"/>
<path opacity="${bud}" d="M140 22 Q130 32 140 42 Q150 32 140 22 Z" fill="#A8E6C8"/>
<path opacity="${sprout}" d="M140 44 Q124 30 128 22 Q140 26 140 44 Z M140 44 Q156 30 152 22 Q140 26 140 44 Z" fill="#8FD383"/>
<g opacity="${bloom}"><path d="M140 40 Q126 30 128 18 Q136 24 140 40 Z M140 40 Q154 30 152 18 Q144 24 140 40 Z M140 40 Q133 24 140 12 Q147 24 140 40 Z" fill="#FFD3E0"/><circle cx="140" cy="36" r="3" fill="#FFE07A"/></g>
</g>
<g class="${m.open ? 'blink' : ''}">
<g fill="#FFFFFF" stroke="${K}" stroke-width="3"><circle cx="94" cy="74" r="38"/><circle cx="186" cy="74" r="38"/></g>
<g opacity="${m.open}" fill="${K}"><circle cx="99" cy="80" r="${m.pupil}"/><circle cx="181" cy="80" r="${m.pupil}"/><circle cx="102" cy="76" r="3" fill="#FFFFFF"/><circle cx="184" cy="76" r="3" fill="#FFFFFF"/></g>
</g>
<g opacity="${m.love}" fill="#FF7D9C" stroke="${K}" stroke-width="1.2" stroke-linejoin="round"><path transform="translate(96 78) scale(1.5)" d="${HEART}"/><path transform="translate(184 78) scale(1.5)" d="${HEART}"/></g>
<g opacity="${m.squint}" fill="none" stroke="${K}" stroke-width="4" stroke-linecap="round"><path d="M82 84 Q96 66 110 84"/><path d="M170 84 Q184 66 198 84"/></g>
<g opacity="${m.sleep}" fill="none" stroke="${K}" stroke-width="4" stroke-linecap="round"><path d="M80 78 Q96 92 112 78"/><path d="M168 78 Q184 92 200 78"/></g>
<g opacity="${m.tear}" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"><path d="M78 50 L96 56"/><path d="M202 50 L184 56"/></g>
<g fill="#FFB3C7" opacity="${m.blush}"><ellipse cx="62" cy="146" rx="15" ry="9"/><ellipse cx="218" cy="146" rx="15" ry="9"/></g>
<path d="${m.mouth}" fill="${m.mouthFill}" stroke="${K}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="140" cy="160" rx="10" ry="5" fill="#FF8FA8" opacity="${m.tongue}"/>
<path d="M66 108 Q60 122 66 128 Q72 122 66 108 Z" fill="#9AD8F5" stroke="${K}" stroke-width="2.5" stroke-linejoin="round" opacity="${m.tear}"/>
${wear === 'bow' ? `<g fill="${rc}" stroke="${K}" stroke-width="3" stroke-linejoin="round"><path d="M212 26 L188 10 Q178 26 188 42 Z"/><path d="M212 26 L236 10 Q246 26 236 42 Z"/><circle cx="212" cy="26" r="7"/></g>` : ''}
${wear === 'crown' ? `<g stroke="${K}" stroke-width="2.5"><path d="M70 44 Q140 18 210 44" fill="none" stroke="#5DAE57" stroke-width="4"/><circle cx="86" cy="36" r="9" fill="#FFFFFF"/><circle cx="86" cy="36" r="3.5" fill="#FFD45C" stroke="none"/><circle cx="140" cy="27" r="11" fill="#FFB3C7"/><circle cx="140" cy="27" r="4" fill="#FFD45C" stroke="none"/><circle cx="194" cy="36" r="9" fill="#FFFFFF"/><circle cx="194" cy="36" r="3.5" fill="#FFD45C" stroke="none"/><circle cx="113" cy="30" r="7" fill="#D9CCFF"/><circle cx="167" cy="30" r="7" fill="#D9CCFF"/></g>` : ''}
${wear === 'star' ? `<path transform="translate(214 30) scale(1.1)" d="${STARP}" fill="#FFE07A" stroke="${K}" stroke-width="2.6" stroke-linejoin="round"/>` : ''}
</g>
<g opacity="${m.sparkle}" fill="#FFE07A" stroke="${K}" stroke-width="2" stroke-linejoin="round"><path transform="translate(30 70)" d="${SPARK}"/><path transform="translate(256 110) scale(0.7)" d="${SPARK}"/><path transform="translate(40 190) scale(0.55)" d="${SPARK}"/></g>
<g opacity="${m.hearts}" fill="#FF7D9C" stroke="${K}" stroke-width="1.3" stroke-linejoin="round"><path transform="translate(250 64) scale(1.4)" d="${HEART}"/><path transform="translate(28 112) scale(1.1)" d="${HEART}"/></g>
<g opacity="${m.zzz}" fill="#8C7BE8" stroke="${K}" stroke-width="1" font-family="Fredoka, sans-serif" font-weight="700"><text x="236" y="108" font-size="22">z</text><text x="252" y="86" font-size="30">Z</text></g>
</svg>`;
}

/* ---------- art: treats, items, friends (48×48) ---------- */
const S2 = `stroke="${K}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"`;
const ART = {
  cupcake: () => `<g ${S2}><path d="M12 26 L16 42 H32 L36 26 Z" fill="#FFD3E0"/><path d="M19 28 L20.5 42 M24 28 V42 M29 28 L27.5 42" fill="none"/><path d="M10 27 Q7 19 15 18 Q15 10 24 11 Q33 10 33 18 Q41 19 38 27 Z" fill="#FFF4F7"/><circle cx="24" cy="9" r="4" fill="#FF6B81"/><path d="M24 5 Q25 2 28 1" fill="none"/></g><path d="M16 22 l2 -1 M22 17 l2 1 M29 21 l2 -1 M26 24 l1 1" stroke="#8C7BE8" stroke-width="2" stroke-linecap="round"/>`,
  croissant: () => `<g ${S2}><path d="M5 31 Q8 15 24 13 Q40 15 43 31 Q37 35 33 30 Q29 37 24 33 Q19 37 15 30 Q11 35 5 31 Z" fill="#F6BE6A"/><path d="M15 30 Q15 20 19 15 M33 30 Q33 20 29 15 M24 33 V14" fill="none"/></g><path d="M18 20 q2 -2 4 -2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>`,
  macaron: () => `<g ${S2}><path d="M8 22 Q8 11 24 11 Q40 11 40 22 Z" fill="#B9E8D0"/><path d="M7 22 H41 V28 H7 Z" fill="#FFF6E5"/><path d="M8 28 H40 Q40 38 24 38 Q8 38 8 28 Z" fill="#B9E8D0"/></g><path d="M15 16 q3 -2 6 -2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>`,
  strawberry: () => `<g ${S2}><path d="M24 43 Q8 31 10 21 Q12 13 24 15 Q36 13 38 21 Q40 31 24 43 Z" fill="#FF6B81"/><path d="M15 16 L19 8 L24 13 L29 8 L33 16 Q24 20 15 16 Z" fill="#7DCB6E"/></g><g fill="#FFE07A"><ellipse cx="18" cy="24" rx="1.4" ry="2"/><ellipse cx="26" cy="22" rx="1.4" ry="2"/><ellipse cx="31" cy="28" rx="1.4" ry="2"/><ellipse cx="21" cy="31" rx="1.4" ry="2"/><ellipse cx="25" cy="37" rx="1.4" ry="2"/></g>`,
  donut: () => `<g ${S2}><circle cx="24" cy="25" r="17" fill="#F6BE6A"/><path d="M10 23 Q11 11 24 10 Q37 11 38 23 Q37 28 33 26 Q30 33 26 29 Q22 34 18 29 Q13 31 10 23 Z" fill="#FFB3C7"/><circle cx="24" cy="22" r="5" fill="#FFFFFF"/></g><path d="M15 18 l2 -2 M31 16 l2 1 M30 24 l1 2 M18 25 l2 0" stroke="#8C7BE8" stroke-width="2" stroke-linecap="round"/>`,
  pudding: () => `<g ${S2}><ellipse cx="24" cy="41" rx="19" ry="4" fill="#FFFFFF"/><path d="M12 39 L15 18 H33 L36 39 Z" fill="#FFE59A"/><path d="M15 18 H33 L32.4 23 Q29 21 27 25 Q23 21 20 24 Q17 21 15.6 23 Z" fill="#B5754A"/><circle cx="24" cy="14" r="4" fill="#FF6B81"/></g>`,
  bow: (c) => `<g fill="${c || '#FF9FBF'}" ${S2}><path d="M24 22 L6 10 Q-1 22 6 34 Z"/><path d="M24 22 L42 10 Q49 22 42 34 Z"/><path d="M21 26 L15 40 L20 38 L22 42 Z M27 26 L33 40 L28 38 L26 42 Z"/><circle cx="24" cy="22" r="6"/></g>`,
  crown: () => `<path d="M4 30 Q24 40 44 30" fill="none" stroke="#5DAE57" stroke-width="3.5" stroke-linecap="round"/><g stroke="${K}" stroke-width="2"><circle cx="10" cy="28" r="6" fill="#FFFFFF"/><circle cx="24" cy="33" r="8" fill="#FFB3C7"/><circle cx="38" cy="28" r="6" fill="#FFFFFF"/><circle cx="17" cy="32" r="4" fill="#D9CCFF"/><circle cx="31" cy="32" r="4" fill="#D9CCFF"/></g><g fill="#FFD45C"><circle cx="10" cy="28" r="2.2"/><circle cx="24" cy="33" r="3"/><circle cx="38" cy="28" r="2.2"/></g>`,
  star: () => `<path d="M24 5 L29.5 17.5 L43 18.5 L32.5 27 L36 40.5 L24 33 L12 40.5 L15.5 27 L5 18.5 L18.5 17.5 Z" fill="#FFE07A" ${S2}/><circle cx="19" cy="23" r="1.6" fill="${K}"/><circle cx="29" cy="23" r="1.6" fill="${K}"/><path d="M21 27 q3 2.5 6 0" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/>`,
  parasol: () => `<g ${S2}><path d="M24 24 V40 Q24 45 19.5 45 Q16 45 16 41" fill="none"/><path d="M4 24 Q24 -1 44 24 Q37 19 31 24 Q24 18 17 24 Q11 19 4 24 Z" fill="#FFD3E0"/><path d="M24 6 Q19 14 17 24 M24 6 Q29 14 31 24" fill="none"/></g>`,
  teacup: () => `<g ${S2}><ellipse cx="22" cy="40" rx="17" ry="4" fill="#FFD3E0"/><path d="M34 23 Q42 23 41 29 Q40 34 33 33" fill="none"/><path d="M9 20 H35 V28 Q35 39 22 39 Q9 39 9 28 Z" fill="#FFFFFF"/><path d="M17 6 q-3 4 0 7 M24 4 q-3 4 0 8 M31 6 q-3 4 0 7" fill="none" stroke-width="1.8"/></g><path transform="translate(22 28) scale(0.45)" d="${HEART}" fill="#FF7D9C"/>`,
  lamp: () => `<g ${S2}><path d="M17 26 H31 L32.5 42 H15.5 Z" fill="#FFF6E5"/><path d="M6 27 Q6 7 24 7 Q42 7 42 27 Z" fill="#FF6B81"/></g><g fill="#FFFFFF"><circle cx="16" cy="17" r="3.5"/><circle cx="28" cy="13" r="2.5"/><circle cx="34" cy="21" r="3"/></g><path d="M20 34 q4 3 8 0" fill="none" stroke="${K}" stroke-width="1.8" stroke-linecap="round"/>`,

/* ---------- state ---------- */
const KEY = 'ribbit.v1';
let st = null;
try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) { st = null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const ui = { screen: st ? 'home' : 'bloom', flash: null, line: null, treat: null, shopTab: 'treats', pick: { treats: 'cupcake', ribbons: 'sky', cute: 'crown' }, bake: { frost: 'pink', on: { sprinkles: true, cherry: true } }, served: null };
let flashTimer = null;

function today(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
const clamp = (v) => Math.max(0, Math.min(100, v));
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }
function isNight() { const h = new Date().getHours(); return h >= 19 || h < 7; }

function newFrog(name) {
  return {
    v: 1, name: name || 'Ribbit', born: Date.now(), t: Date.now(),
    tummy: 70, joy: 75, energy: 80, stars: 20,
    inv: { croissant: 1, cupcake: 1 }, owned: ['ribbon:petal'], decor: [],
    wear: { kind: 'bow', color: '#FF9FBF' },
    careDays: [], friends: { snail: 0, ladybug: 0, bee: 0 }, visited: {}, visitor: null,
    lastBake: 0, bakedDay: '', bonusDay: '', weatherOn: false, rain: false, weatherAt: 0
  };
}
function tick() {
  if (!st) return;
  const now = Date.now(), h = Math.max(0, (now - st.t) / 3.6e6);
  const night = isNight();
  st.tummy = clamp(st.tummy - h * (night ? 2.5 : 5));
  st.joy = clamp(st.joy - h * (st.rain ? 2 : 3.5) + h * st.decor.length * 0.125); // each decoration: +3 joy a day
  st.energy = clamp(st.energy + h * (night ? 9 : -3));
  st.t = now;
  save();
}
function streak() {
  const set = new Set(st.careDays); let n = 0; const d = new Date();
  if (!set.has(today(d))) d.setDate(d.getDate() - 1);
  while (set.has(today(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function stageOf() { const s = streak(); return s >= 10 ? 'bloom' : s >= 3 ? 'sprout' : 'bud'; }
const STAGE_NAME = { bud: 'Bud', sprout: 'Sprout', bloom: 'Full Bloom' };
function care() {
  const d = today();
  if (!st.careDays.includes(d)) { st.careDays.push(d); st.careDays = st.careDays.slice(-60); }
}
function mood() {
  if (ui.flash) return ui.flash;
  if (isNight() && ui.screen === 'home') return 'sleepy';
  if (st.tummy < 30) return 'hungry';
  if (st.joy < 30) return 'sad';
  if (st.energy < 25) return 'sleepy';
  return 'happy';
}
function idleLine(m) {
  const n = esc(st.name);
  return { hungry: 'Is that… a cupcake?', sad: 'Cuddle me?', sleepy: isNight() ? 'Zzz… sweet dreams' : 'So sleepy…', happy: `Hi! I’m ${n}.` }[m] || 'Ribbit!';
}
function flash(m, line, ms, treat) {
  clearTimeout(flashTimer);
  ui.flash = m; ui.line = line; ui.treat = treat || null;
  render();
  flashTimer = setTimeout(() => { ui.flash = null; ui.line = null; ui.treat = null; render(); }, ms || 1900);
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2700);
}
function frogFor(m, size) { return frogSVG({ mood: m, wear: st.wear.kind, color: st.wear.color, stage: stageOf(), name: st.name }); }

/* ---------- friends ---------- */
function checkVisitor() {
  if (st.visitor) return;
  const d = today(), v = st.visited;
  const cand = [];
  if ((st.rain || hash(d) % 3 === 0) && v.snail !== d) cand.push('snail');
  if (st.joy > 80 && v.ladybug !== d) cand.push('ladybug');
  if (st.bakedDay === d && v.bee !== d) cand.push('bee');
  if (cand.length) { st.visitor = cand[0]; save(); }
}
function openGift() {
  const k = st.visitor; if (!k) return;
  const d = today();
  st.visited[k] = d; st.friends[k] = Math.min(5, (st.friends[k] || 0) + 1); st.visitor = null;
  let msg;
  if (k === 'ladybug') {
    const r = RIBBONS.find((x) => !st.owned.includes('ribbon:' + x.id));
    if (r) { st.owned.push('ribbon:' + r.id); msg = `Dot gave you a ${r.label} ribbon!`; }
  } else if (k === 'snail') {
    const c = CUTE.find((x) => !x.wear && !st.owned.includes('cute:' + x.id));
    if (c) { st.owned.push('cute:' + c.id); msg = `Shelly gave you a ${c.label.toLowerCase()}!`; }
  } else {
    st.inv.macaron = (st.inv.macaron || 0) + 1; st.stars += 10; msg = 'Bumble brought a macaron and 10 stars!';
  }
  if (!msg) { st.stars += 15; msg = 'A gift of 15 stars!'; }
  st.joy = clamp(st.joy + 10); care(); save();
  toast(msg); flash('love', 'A present! Thank you!', 2200);
}

/* ---------- weather ---------- */
function refreshWeather(force) {
  if (!st || !st.weatherOn || !navigator.geolocation) return;
  if (!force && Date.now() - st.weatherAt < 30 * 60e3) return;
  navigator.geolocation.getCurrentPosition((p) => {
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.coords.latitude.toFixed(2)}&longitude=${p.coords.longitude.toFixed(2)}&current=weather_code`)
      .then((r) => r.json()).then((j) => {
        const c = j && j.current ? j.current.weather_code : 0;
        st.rain = (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
        st.weatherAt = Date.now(); save(); render();
      }).catch(() => {});
  }, () => { st.weatherOn = false; save(); toast('Location is off, so no live weather'); render(); }, { maximumAge: 30 * 60e3, timeout: 10e3 });
}

/* ---------- actions ---------- */
let lastPet = 0;
const ACTS = {
  hatch() {
    const n = (document.getElementById('name').value || '').trim() || 'Ribbit';
    st = newFrog(n.slice(0, 16)); care(); st.bonusDay = today(); save();
    ui.screen = 'home'; render(); toast(`Welcome, ${n}! Here are 20 stars.`);

  pet() {

    st.joy = clamp(st.joy + 8);
    if (now - lastPet > 20e3) { st.stars += 2; lastPet = now; flash('love', 'Ribbit! +2 stars'); } else flash('love', 'Hehe, that tickles!');
    care(); save(); hop();
  },
  nap() {

    st.energy = clamp(st.energy + 35); care(); save(); flash('sleepy', 'Zzz… cloud dreams', 2800);
  },
  eat(el) {
    const k = el.dataset.k, t = TREATS[k];
    if (k !== 'strawberry') { if (!st.inv[k]) { toast('Buy more in the shop'); return; } st.inv[k]--; }
    st.tummy = clamp(st.tummy + t.tummy); st.joy = clamp(st.joy + t.joy); care(); save();
    ui.screen = 'home'; flash('eating', `Yum, ${t.short}!`, 2000, k); hop();
  },
  tab(el) { ui.shopTab = el.dataset.k; render(); },
  pick(el) { ui.pick[ui.shopTab] = el.dataset.k; render(); },
  buy() {
    const tab = ui.shopTab, cur = shopList(tab).find((x) => x.id === ui.pick[tab]) || shopList(tab)[0];
    if (st.stars < cur.cost) return;
    st.stars -= cur.cost;
    if (tab === 'treats') { st.inv[cur.id] = (st.inv[cur.id] || 0) + 1; toast(`${cur.label} added to the tea party`); }
    else if (tab === 'ribbons') { st.owned.push('ribbon:' + cur.id); st.wear = { kind: 'bow', color: cur.color }; toast(`${st.name} loves the ${cur.label} ribbon!`); }
    else { st.owned.push('cute:' + cur.id); if (cur.wear) { st.wear = { kind: cur.id, color: st.wear.color }; toast(`${st.name} is wearing the ${cur.label.toLowerCase()}!`); } else { st.decor.push(cur.id); toast(`${cur.label} placed in the pond`); } }
    save(); render();
  },
  wear() {
    const tab = ui.shopTab, cur = shopList(tab).find((x) => x.id === ui.pick[tab]);
    st.wear = tab === 'ribbons' ? { kind: 'bow', color: cur.color } : { kind: cur.id, color: st.wear.color };
    save(); render();
  },
  place() { const id = ui.pick.cute; if (!st.decor.includes(id)) st.decor.push(id); save(); render(); },
  toggleDecor(el) { const k = el.dataset.k; st.decor = st.decor.includes(k) ? st.decor.filter((x) => x !== k) : st.decor.concat(k); save(); render(); },
  gift() { openGift(); },
  frost(el) { ui.bake.frost = el.dataset.k; ui.served = null; render(); },
  topping(el) { const k = el.dataset.k; ui.bake.on[k] = !ui.bake.on[k]; ui.served = null; render(); },
  serve() {
    if (ui.served) { ui.served = null; render(); return; }
    if (Date.now() - st.lastBake < 15 * 60e3) return;
    const b = ui.bake, cr = craving();
    const count = TOPPINGS.filter((t) => b.on[t[0]]).length;
    const hit = b.frost === cr.frost[0] && b.on[cr.top[0]];
    const stars = 3 + count * 2 + (hit ? 12 : 0);
    st.stars += stars; st.tummy = clamp(st.tummy + 30); st.joy = clamp(st.joy + (hit ? 25 : 12));
    st.lastBake = Date.now(); st.bakedDay = today(); care(); save();
    ui.served = { craving: hit, stars: stars }; render();
  },
  rename() { const v = (document.getElementById('rename').value || '').trim(); if (v) { st.name = v.slice(0, 16); save(); toast(`Hello, ${st.name}!`); render(); } },
  weather() { st.weatherOn = !st.weatherOn; if (!st.weatherOn) st.rain = false; save(); render(); if (st.weatherOn) refreshWeather(true); },
  reset() { if (confirm(`Say goodbye to ${st.name} and start over?`)) { st = null; try { localStorage.removeItem(KEY); } catch (e) {} ui.screen = 'bloom'; render(); } }
};
app.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]');
  if (g) { if (g.dataset.tab) ui.shopTab = g.dataset.tab; go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACTS[a.dataset.act] && !a.disabled) ACTS[a.dataset.act](a);
});
app.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'frog') { e.preventDefault(); ACTS.pet(); } if (e.key === 'Enter' && e.target.id === 'name') ACTS.hatch(); });

/* ---------- boot ---------- */
if (st) {
  tick();
  if (st.bonusDay !== today()) { st.bonusDay = today(); st.stars += 10; save(); setTimeout(() => toast('Daily lily bonus: +10 stars'), 600); }
  refreshWeather();
}
render();
setInterval(() => { if (st && ['home', 'decorate'].includes(ui.screen) && !ui.flash && document.activeElement.tagName !== 'INPUT') render(); }, 30e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden && st) { refreshWeather(); render(); } });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
