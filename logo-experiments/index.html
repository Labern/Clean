<!doctype html>
<html lang="en" data-palette="noir">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Logo Experiments — ★★★★★ × PARADOX</title>
<meta name="description" content="★★★★★ × PARADOX — every logo variation, on any ground, anywhere on the page.">
<meta name="theme-color" content="#000000" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PARADOX">
<meta property="og:title" content="Logo Experiments — ★★★★★ × PARADOX">
<meta property="og:description" content="Every logo variation, on any ground, anywhere on the page.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Cpath d='M50 12 61 40 91 40 67 58 76 88 50 70 24 88 33 58 9 40 39 40Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ── tokens: a palette is one attribute on <html> ────────────────────────── */
:root{
  --bg:#000; --ink:#f2f2f7; --hi:#fff; --dim:#9a9aa6; --line:rgba(255,255,255,.16);
  --glow:rgba(255,255,255,.10); --sheen:screen; --veil:rgba(0,0,0,.9);
  --t:cubic-bezier(.16,1,.3,1);
}
:root[data-palette="paper"]{
  --bg:#fff; --ink:#08080a; --hi:#000; --dim:#6e6e79; --line:rgba(0,0,0,.18);
  --glow:rgba(0,0,0,.07); --sheen:multiply; --veil:rgba(255,255,255,.93);
}
:root[data-palette="violet"]{
  --bg:#594992; --ink:#fff; --hi:#fff; --dim:rgba(255,255,255,.78); --line:rgba(255,255,255,.3);
  --glow:rgba(255,255,255,.14); --sheen:screen; --veil:rgba(38,30,68,.92);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{
  color:var(--ink);font:400 13px/1 "Menlo","SF Mono",ui-monospace,monospace;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:background-color .6s var(--t),color .6s var(--t);
}
/* ── the marks ───────────────────────────────────────────────────────────── */
#field{position:fixed;inset:0}
.tile{
  position:absolute;touch-action:none;cursor:grab;
  transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));
}
/* the entrance plays on arrival and for new copies only — never again on a
   colour or variation change, which would flicker what you are working on */
.tile.in{animation:rise .9s var(--t) both;animation-delay:calc(var(--i,0) * 24ms)}
.tile.dragging{cursor:grabbing}
@keyframes rise{ from{opacity:0} to{opacity:1} }
.tile img{display:block;width:100%;height:100%;filter:drop-shadow(0 0 26px var(--glow))}
/* a pass of light over the same artwork — never in the way of a drag */
.tile .sheen{
  position:absolute;inset:0;pointer-events:none;mix-blend-mode:var(--sheen);
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(176deg,transparent 30%,var(--hi) 46%,var(--hi) 54%,transparent 70%);
  background-size:100% 320%;animation:rake 11s cubic-bezier(.45,.05,.3,1) infinite;opacity:.9;
}
@keyframes rake{ 0%,12%{background-position:0 -220%} 56%,100%{background-position:0 220%} }
:root[data-palette="paper"] .tile .sheen{opacity:.45}

/* The bounding line shows only while the circle is being held — it is there to
   size against, and it goes the moment you let go. */
.frame{position:absolute;inset:-18px;border:1px solid var(--line);pointer-events:none;display:none}
body.sizing .frame{display:block}

/* the one handle: hold it to spin and scale */
.grip{
  position:absolute;right:-31px;bottom:-31px;width:26px;height:26px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--ink);cursor:nwse-resize;touch-action:none;
  transition:background-color .2s var(--t),transform .2s var(--t);
}
.grip::before{content:"";position:absolute;inset:-16px;border-radius:50%}
.grip.hot{background:var(--ink);transform:scale(1.2)}
@media (pointer:coarse){ .grip{width:32px;height:32px;right:-34px;bottom:-34px}
  .grip::before{inset:-20px} }

/* ── hover: take the artwork with you ────────────────────────────────────── */
#grab{position:fixed;z-index:4;display:flex;gap:2px;opacity:0;pointer-events:none;transition:opacity .2s ease}
#grab.on{opacity:1;pointer-events:auto}
#grab a{color:var(--bg);background:var(--ink);text-decoration:none;font-size:11px;
  letter-spacing:.16em;padding:9px 12px 8px;cursor:pointer}
#grab a:hover{background:var(--hi)}

/* ── the controls ────────────────────────────────────────────────────────── */
#dock{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--bg)}
#bar{
  border-top:1px solid var(--line);
  padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));
  display:flex;align-items:stretch;justify-content:space-between;gap:8px;
}
.grp{display:flex;align-items:center;gap:16px}
#mid{gap:10px}
.btn{
  appearance:none;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit;
  font-size:13px;letter-spacing:.2em;padding:17px 4px;white-space:nowrap;
  transition:color .2s var(--t);
}
.btn:hover,.btn:focus-visible{color:var(--ink);outline:0}
.btn.lit{color:var(--ink)}
.arrow{font-size:19px;letter-spacing:0;padding:15px 8px;line-height:1}
/* fixed widths: stepping through marks or counts never shifts the controls */
#logos{text-decoration:none}
#name{width:29ch;text-align:center;color:var(--ink);letter-spacing:.14em;overflow:hidden}
#num{width:4.5ch;text-align:center;color:var(--ink)}
#dots{display:flex;gap:14px;align-items:center;padding:14px 0}
.dot{
  appearance:none;border:1.5px solid var(--line);width:19px;height:19px;border-radius:50%;
  padding:0;cursor:pointer;position:relative;transition:transform .2s var(--t),border-color .2s var(--t);
}
.dot[data-p="noir"]{background:#000}
.dot[data-p="paper"]{background:#fff}
.dot[data-p="violet"]{background:#594992}
.dot:hover{transform:scale(1.14)}
.dot[aria-current="true"]{border-color:var(--ink)}
.dot[aria-current="true"]::after{content:"";position:absolute;inset:-6px;border:1px solid var(--line);border-radius:50%}
.sep{width:1px;align-self:center;height:20px;background:var(--line)}

/* ── the note underneath ─────────────────────────────────────────────────── */

/* HIDE takes everything away for a clean shot; a tap anywhere brings it back */
body.bare #dock,body.bare .grip,body.bare .frame,body.bare #grab{display:none}

/* ── the index of every mark ─────────────────────────────────────────────── */
#sheet{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;
  flex-direction:column;overscroll-behavior:contain}
#sheet.on{display:flex}
#sheet header{display:flex;align-items:center;justify-content:space-between;
  padding:max(20px,env(safe-area-inset-top)) 24px 18px;
  color:var(--dim);font-size:13px;letter-spacing:.2em}
#sheet .grid{
  flex:1;overflow:auto;display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  padding:0 24px max(24px,env(safe-area-inset-bottom));align-content:start;
}
/* minmax(0,1fr) — a plain 1fr refuses to shrink below the image's own size,
   which is what made the marks overflow their cells */
#sheet figure{display:grid;grid-template-rows:minmax(0,1fr) auto;justify-items:center;gap:18px;
  height:310px;padding:22px 16px;cursor:pointer;border:1px solid transparent;overflow:hidden}
#sheet figure:hover,#sheet figure[aria-current="true"]{border-color:var(--line)}
#sheet img{max-width:100%;max-height:100%;min-height:0;height:100%;object-fit:contain}
#sheet figcaption{color:var(--dim);font-size:11px;letter-spacing:.14em;text-align:center;line-height:1.6}
#sheet figure:hover figcaption,#sheet figure[aria-current="true"] figcaption{color:var(--ink)}

@media (max-width:760px){
  #bar{flex-wrap:wrap;justify-content:center;gap:0 14px}
  .grp{gap:13px}
  .btn{font-size:12px;padding:14px 3px}
  #name{width:100%;order:-1;padding-top:14px;padding-bottom:0}
  @media (prefers-reduced-motion:reduce){ .tile{animation:none} .tile .sheen{animation:none;opacity:0} }
</style>
</head>
<body>
<div id="field"></div>
<div id="grab"><a id="dl-svg">SVG</a><a id="dl-png">PNG</a></div>

<div id="dock">
  <div id="bar">
    <div class="grp">
      <div id="dots">
        <button class="dot" data-p="noir" aria-label="black"></button>
        <button class="dot" data-p="paper" aria-label="white"></button>
        <button class="dot" data-p="violet" aria-label="violet"></button>
      </div>
    </div>
    <div class="grp" id="mid">
      <button class="btn arrow" id="prev" aria-label="previous variation">‹</button>
      <button class="btn" id="name" title="every variation"></button>
      <button class="btn arrow" id="next" aria-label="next variation">›</button>
      <button class="btn" id="all">ALL 18</button>
      <span class="sep"></span>
      <button class="btn arrow" id="less" aria-label="fewer">−</button>
      <button class="btn" id="num"></button>
      <button class="btn arrow" id="more" aria-label="more">+</button>
    </div>
    <div class="grp">
      <button class="btn" id="reset">RESET</button>
      <span class="sep"></span>
      <button class="btn" id="save">SAVE</button>
      <button class="btn" id="share">SHARE</button>
      <span class="sep"></span>
      <button class="btn" id="hide">HIDE</button>
      <a class="btn" id="logos" href="/logos">LOGOS&nbsp;&nbsp;&#8594;</a>
    </div>
  </div>
</div>

<div id="sheet" role="dialog" aria-label="all variations"></div>

<script src="logos.js"></script>
<script>
(function(){
  const L=window.LOGOS, root=document.documentElement, body=document.body,
        field=document.getElementById('field'), grab=document.getElementById('grab'),
        sheet=document.getElementById('sheet'), tc=document.getElementById('tc');
  const $=id=>document.getElementById(id);

  const PALETTES=['noir','paper','violet'];
  const BG={noir:'#000000',paper:'#ffffff',violet:'#594992'};

  /* one mark, one arrangement — no modes, nothing to switch on */
  const S={i:0, pal:0, T:null};

  /* ── artwork ────────────────────────────────────────────────────────────
     One standalone SVG per (mark, ink), handed to an <img>: decoded once
     however many copies are on screen, and right-click saves that very file. */
  const cache=new Map();
  function svgText(logo, ink){
    const k=logo.id+ink;
    if(!cache.has(k)) cache.set(k,
      `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" `+
      `viewBox="${logo.vb}" width="${logo.w}" height="${logo.h}">`+
      `<title>${logo.label}</title><g fill="${ink}">${logo.d}</g></svg>`);
    return cache.get(k);
  }
  const uri=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
  const inkNow=()=>getComputedStyle(root).getPropertyValue('--ink').trim();
  const logo=()=>L[S.i];

  /* the controls keep their height even while hidden, so hiding them never
     resizes or shifts the mark */
  let dockH=0;
  const measure=()=>{ if(!body.classList.contains('bare')) dockH=$('dock').offsetHeight; return dockH; };
  const free=()=>innerHeight-measure();

  function baseSize(){
    const l=logo(), A=l.w/l.h;
    const h=Math.min(free()-92,(innerWidth*.9)/A);
    return {w:h*A, h:h};
  }
  const spread=()=>{ const l=logo(); return (l.w/l.h)<.3 ? 1.7 : 1.3; };
  const home=()=>({x:innerWidth/2, y:free()/2, s:1, r:0, n:1});

  /* ── drawing ────────────────────────────────────────────────────────── */
  let firstBuild=true, prevN=0;
  function build(){
    const l=logo(), T=S.T, b=baseSize(), art=uri(svgText(l,inkNow()));
    const entering=firstBuild||T.n>prevN;
    firstBuild=false; prevN=T.n;
    const dx=Math.cos(T.r*Math.PI/180), dy=Math.sin(T.r*Math.PI/180),
          step=b.w*T.s*spread();
    field.innerHTML='';
    const frag=document.createDocumentFragment();
    for(let c=0;c<T.n;c++){
      const off=(c-(T.n-1)/2)*step;
      const t=document.createElement('div');
      t.className=entering?'tile in':'tile';
      t.style.cssText=`left:${T.x+dx*off}px;top:${T.y+dy*off}px;width:${b.w}px;`+
                      `height:${b.h}px;--i:${c};--r:${T.r}deg;--s:${T.s}`;
      const im=document.createElement('img');
      im.src=art; im.alt=l.label; im.draggable=false;
      const sh=document.createElement('span');
      sh.className='sheen';
      sh.style.cssText=`-webkit-mask-image:url("${art}");mask-image:url("${art}")`;
      t.append(im,sh);
      if(c===0){
        const f=document.createElement('div'); f.className='frame';
        const g=document.createElement('div'); g.className='grip';
        t.append(f,g);
      }
      frag.appendChild(t);
    }
    field.appendChild(frag);
    forgetShot();
    $('name').textContent=l.label;
    $('num').textContent='×'+T.n;
    hash();
  }
  /* while dragging, move what is on screen instead of rebuilding it */
  function paint(){
    const T=S.T, b=baseSize(), dx=Math.cos(T.r*Math.PI/180), dy=Math.sin(T.r*Math.PI/180),
          step=b.w*T.s*spread(), tiles=field.children;
    for(let c=0;c<tiles.length;c++){
      const off=(c-(tiles.length-1)/2)*step, t=tiles[c];
      t.style.left=(T.x+dx*off)+'px'; t.style.top=(T.y+dy*off)+'px';
      t.style.setProperty('--r',T.r+'deg'); t.style.setProperty('--s',T.s);
    }
    forgetShot();
  }

  /* ── drag it, spin it, scale it — always, mouse or finger ───────────── */
  let drag=null, moved=false;
  field.addEventListener('pointerdown',e=>{
    const grip=e.target.closest('.grip'), t=e.target.closest('.tile');
    if(!t&&!grip) return;
    e.preventDefault();
    moved=false;
    const c={x:S.T.x,y:S.T.y};
    drag = grip
      ? {grip:true, a0:Math.atan2(e.clientY-c.y,e.clientX-c.x),
         d0:Math.hypot(e.clientY-c.y,e.clientX-c.x)||1, r0:S.T.r, s0:S.T.s}
      : {dx:e.clientX-S.T.x, dy:e.clientY-S.T.y};
    if(t) t.classList.add('dragging');
    if(grip){ grip.classList.add('hot'); body.classList.add('sizing'); }
    try{ field.setPointerCapture(e.pointerId); }catch(_){}
  });
  addEventListener('pointermove',e=>{
    if(!drag) return;
    moved=true;
    if(drag.grip){
      const a=Math.atan2(e.clientY-S.T.y,e.clientX-S.T.x),
            d=Math.hypot(e.clientY-S.T.y,e.clientX-S.T.x);
      S.T.r=drag.r0+(a-drag.a0)*180/Math.PI;
      S.T.s=Math.max(.08,Math.min(6,drag.s0*(d/drag.d0)));
    }else{ S.T.x=e.clientX-drag.dx; S.T.y=e.clientY-drag.dy; }
    paint();
  });
  const endDrag=()=>{ if(!drag) return; drag=null; hash(); body.classList.remove('sizing');
    document.querySelectorAll('.dragging').forEach(t=>t.classList.remove('dragging'));
    document.querySelectorAll('.grip.hot').forEach(g=>g.classList.remove('hot')); };
  addEventListener('pointerup',endDrag);
  addEventListener('pointercancel',endDrag);

  /* ── downloads ──────────────────────────────────────────────────────── */
  function save(blob,name){
    const u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000);
  }
  $('dl-svg').addEventListener('click',()=>{
    const l=logo();
    save(new Blob([svgText(l,inkNow())],{type:'image/svg+xml'}),
         `paradox-${l.id}-${PALETTES[S.pal]}.svg`);
  });
  $('dl-png').addEventListener('click',()=>{
    const l=logo(), A=l.w/l.h, LONG=4096;
    const w=A>=1?LONG:Math.round(LONG*A), h=A>=1?Math.round(LONG/A):LONG, img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>save(b,`paradox-${l.id}-${PALETTES[S.pal]}-${w}x${h}.png`),'image/png');
    };
    img.src=uri(svgText(l,inkNow()));
  });
  let hovered=null;
  field.addEventListener('pointerover',e=>{
    if(drag||body.classList.contains('bare')) return;
    const t=e.target.closest('.tile'); if(!t||t===hovered) return;
    hovered=t; const r=t.getBoundingClientRect();
    grab.style.left=Math.min(innerWidth-108,Math.max(8,r.right+12))+'px';
    grab.style.top=Math.max(8,r.top)+'px';
    grab.classList.add('on');
  });
  document.addEventListener('pointerover',e=>{
    if(!e.target.closest('.tile')&&!e.target.closest('#grab')){ hovered=null; grab.classList.remove('on'); }
  });

  /* ── share: the picture plus the exact arrangement ───────────────────
     The composition is redrawn onto a canvas rather than screenshotted — same
     positions, rotations and ground, far above screen resolution — and the link
     carries the co-ordinates, so anything received reopens exactly as it was. */
  let shot=null;
  const forgetShot=()=>{ shot=null; };
  async function render(){
    const vw=innerWidth, vh=innerHeight, k=Math.min(3, 2600/Math.max(vw,vh));
    const W=Math.round(vw*k), H=Math.round(vh*k);
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const ctx=c.getContext('2d');
    ctx.fillStyle=getComputedStyle(root).getPropertyValue('--bg').trim()||BG[PALETTES[S.pal]];
    ctx.fillRect(0,0,W,H);
    const img=new Image(); img.src=uri(svgText(logo(), inkNow()));
    await img.decode();
    for(const t of field.children){
      const w=parseFloat(t.style.width), h=parseFloat(t.style.height),
            x=parseFloat(t.style.left), y=parseFloat(t.style.top),
            r=parseFloat(t.style.getPropertyValue('--r'))||0,
            sc=parseFloat(t.style.getPropertyValue('--s'))||1;
      ctx.save();
      ctx.translate(x*k, y*k); ctx.rotate(r*Math.PI/180); ctx.scale(sc,sc);
      ctx.drawImage(img, -w*k/2, -h*k/2, w*k, h*k);
      ctx.restore();
    }
    return new Promise(r=>c.toBlob(r,'image/png'));
  }
  const prime=()=>{ if(!shot) shot=render(); return shot; };
  $('save').addEventListener('click',async()=>{
    const l=logo(), b=await prime();
    save(b, `paradox-${l.id}-${PALETTES[S.pal]}.png`);
  });
  $('save').addEventListener('pointerdown',prime);
  const shareBtn=$('share');
  /* start drawing on press so the sheet can open on release — iOS only hands
     it over inside the gesture that asked for it */
  shareBtn.addEventListener('pointerdown',prime);
  shareBtn.addEventListener('mouseenter',prime);
  shareBtn.addEventListener('click',async()=>{
    const l=logo(), name=`paradox-${l.id}-${PALETTES[S.pal]}.png`;
    const note=`★★★★★ × PARADOX — ${l.label}`;
    shareBtn.classList.add('lit');
    try{
      const blob=await prime();
      const file=new File([blob], name, {type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        await navigator.share({files:[file], text:`${note}\n${location.href}`});
      }else{
        save(blob, name);
        open('https://wa.me/?text='+encodeURIComponent(`${note}\n${location.href}`),'_blank');
      }
    }catch(err){ if(err&&err.name!=='AbortError')
      open('https://wa.me/?text='+encodeURIComponent(`${note}\n${location.href}`),'_blank'); }
    shareBtn.classList.remove('lit');
  });

  /* ── the index of every mark ────────────────────────────────────────── */
  function fillSheet(){
    const ink=inkNow();
    sheet.innerHTML='<header><span>ALL '+L.length+' VARIATIONS</span>'+
                    '<button class="btn" id="close">CLOSE</button></header>';
    const grid=document.createElement('div'); grid.className='grid';
    sheet.appendChild(grid);
    $('close').addEventListener('click',()=>toggleSheet(false));
    L.forEach((l,i)=>{
      const f=document.createElement('figure');
      f.setAttribute('aria-current',String(i===S.i));
      f.innerHTML=`<img src="${uri(svgText(l,ink))}" alt="${l.label}"><figcaption>${l.label}</figcaption>`;
      f.addEventListener('click',()=>{ S.i=i; toggleSheet(false); build(); });
      grid.appendChild(f);
    });
  }
  function toggleSheet(on){
    const want = on===undefined ? !sheet.classList.contains('on') : on;
    if(want) fillSheet();
    sheet.classList.toggle('on',want);
  }
  $('name').addEventListener('click',()=>toggleSheet());
  $('all').addEventListener('click',()=>toggleSheet());
  sheet.addEventListener('click',e=>{ if(e.target===sheet||e.target.className==='grid') toggleSheet(false); });

  /* ── state ──────────────────────────────────────────────────────────── */
  function marks(){
    document.querySelectorAll('.dot').forEach(d=>
      d.setAttribute('aria-current',String(d.dataset.p===PALETTES[S.pal])));
  }
  function palette(i){
    S.pal=(i+PALETTES.length)%PALETTES.length;
    root.dataset.palette=PALETTES[S.pal]; tc.content=BG[PALETTES[S.pal]];
    marks(); build(); if(sheet.classList.contains('on')) fillSheet();
  }
  /* changing the variation keeps the arrangement — it stays exactly where you
     put it, at the size you set, however many copies there are */
  const setLogo=i=>{ S.i=(i+L.length)%L.length; build(); };
  const setNum=d=>{ S.T.n=Math.max(1,Math.min(40,S.T.n+d)); build(); };
  const reset=()=>{ S.T=home(); build(); };

  document.querySelectorAll('.dot').forEach(d=>
    d.addEventListener('click',()=>palette(PALETTES.indexOf(d.dataset.p))));
  $('prev').addEventListener('click',()=>setLogo(S.i-1));
  $('next').addEventListener('click',()=>setLogo(S.i+1));
  $('less').addEventListener('click',()=>setNum(-1));
  $('more').addEventListener('click',()=>setNum(1));
  $('num').addEventListener('click',()=>setNum(1));
  $('reset').addEventListener('click',reset);

  const bare=on=>body.classList.toggle('bare', on===undefined ? !body.classList.contains('bare') : on);
  $('hide').addEventListener('click',()=>bare(true));
  /* a tap that is not a drag brings the controls back */
  addEventListener('click',e=>{
    if(!body.classList.contains('bare')||moved) return;
    if(e.target.closest('#dock')) return;
    bare(false);
  });

  function hash(){
    const T=S.T;
    const h=`#${L[S.i].id}/${PALETTES[S.pal]}/`+
            `${Math.round(T.x)},${Math.round(T.y)},${T.s.toFixed(2)},${Math.round(T.r)},${T.n}`;
    if(location.hash!==h) history.replaceState(null,'',h);
  }
  function fromHash(){
    const [a,b,c]=decodeURIComponent(location.hash.slice(1)).split('/');
    const i=L.findIndex(x=>x.id===a); if(i>=0) S.i=i;
    const p=PALETTES.indexOf(b); if(p>=0) S.pal=p;
    root.dataset.palette=PALETTES[S.pal]; tc.content=BG[PALETTES[S.pal]]; marks();
    S.T=home();
    if(c){
      const [x,y,s,r,n]=c.split(',').map(Number);
      if([x,y,s,r,n].every(v=>Number.isFinite(v))) S.T={x,y,s,r,n};
    }
  }

  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(e.key==='Escape'){ if(sheet.classList.contains('on')) toggleSheet(false); else bare(false); }
    else if(sheet.classList.contains('on')&&k!=='g') return;
    else if(e.key==='ArrowRight') setLogo(S.i+1);
    else if(e.key==='ArrowLeft') setLogo(S.i-1);
    else if(e.key==='ArrowUp'||e.key==='+'||e.key==='=') setNum(1);
    else if(e.key==='ArrowDown'||e.key==='-') setNum(-1);
    else if(k==='c') palette(S.pal+1);
    else if(k==='h') bare();
    else if(k==='r') reset();
    else if(k==='g') toggleSheet();
    else if(k==='f'){ document.fullscreenElement?document.exitFullscreen()
                    :document.documentElement.requestFullscreen?.().catch(()=>{}); }
    else return;
    e.preventDefault();
  });

  /* the arrangement keeps its place in the window as the window changes */
  let pw=innerWidth, ph=innerHeight, rz;
  addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
    S.T.x*=innerWidth/pw; S.T.y*=innerHeight/ph; pw=innerWidth; ph=innerHeight; build();
  },120); });

  addEventListener('hashchange',()=>{ fromHash(); build(); });
  fromHash(); build();
})();
</script>
</body>
</html>
