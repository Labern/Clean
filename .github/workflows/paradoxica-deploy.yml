name: paradoxica deploy

# Any push that touches paradoxica/site uploads it to Fasthosts htdocs.
# Needs repo secret FASTHOSTS_PASSWORD (the Fasthosts SSH/SFTP password).
on:
  push:
    paths:
      - "paradoxica/site/**"
      - ".github/workflows/paradoxica-deploy.yml"
  workflow_dispatch:

concurrency:
  group: paradoxica-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp build
        run: echo "${GITHUB_SHA::7}-${GITHUB_RUN_ID}" > paradoxica/site/deploy.txt

      - name: Upload over SFTP
        env:
          PASS: ${{ secrets.FASTHOSTS_PASSWORD }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          lftp -u "csh3485222,$PASS" sftp://ssh.paradoxica.uk -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mirror --reverse --verbose --no-perms paradoxica/site htdocs;
            bye"

      - name: Verify live
        run: |
          want="$(cat paradoxica/site/deploy.txt)"
          for i in 1 2 3 4 5 6; do
            for scheme in https http; do
              got="$(curl -fsS --max-time 15 "$scheme://paradoxica.uk/deploy.txt?$i" || true)"
              if [ "$got" = "$want" ]; then echo "live on $scheme://paradoxica.uk ($want)"; exit 0; fi
            done
            sleep 10
          done
          echo "::error::uploaded, but paradoxica.uk/deploy.txt does not show $want"
          exit 1
