<!doctype html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#efede7; --text:#3d3d3a; --muted:#8a8880; --rule:#dedbd2;
  --accent:#3f6f8f; --code-bg:#ecebe5; --code-text:#3b3b38;
  --k:#8a4a8f; --s:#4d7a3a; --c:#96938a; --n:#a2622a; --t:#2f6f86; --f:#3f5fa8;
  --size:19px; --measure:68ch;
  --serif:"Iowan Old Style","Charter","Palatino","Georgia",serif;
  --sans:-apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
html[data-theme="sepia"]{
  --bg:#f3e9d6; --surface:#eaddc5; --text:#4a3f30; --muted:#94836a; --rule:#dccdb0;
  --accent:#8a5a2b; --code-bg:#eadfc8; --code-text:#453a2c;
  --k:#8a3f6a; --s:#5a7030; --c:#a3927a; --n:#a2562a; --t:#2f6a72; --f:#3f558f;
}
html[data-theme="night"]{
  --bg:#17181b; --surface:#1f2125; --text:#c9c7c0; --muted:#7d7b76; --rule:#2c2e33;
  --accent:#7fb2d0; --code-bg:#1f2126; --code-text:#d2d0c9;
  --k:#c594c9; --s:#9cc27e; --c:#6f6d68; --n:#d9a066; --t:#6fc0cf; --f:#8fa8e8;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--serif);font-size:var(--size);line-height:1.62}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}

/* top bar */
#bar{position:fixed;inset:0 0 auto 0;height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--bg);border-bottom:1px solid var(--rule);font:13px/1 var(--sans);color:var(--muted);z-index:10}
#bar button{padding:6px 8px;border-radius:6px;color:var(--muted)}
#bar button:hover{background:var(--surface);color:var(--text)}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;color:var(--text)}
#where{font-variant-numeric:tabular-nums;white-space:nowrap}
#meter{position:fixed;top:44px;left:0;height:2px;width:0;background:var(--accent);z-index:11}

/* shelf */
#shelf{max-width:640px;margin:0 auto;padding:110px 20px 80px;font-family:var(--sans)}
#shelf h1{font:600 15px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.book{display:block;width:100%;text-align:left;padding:18px 0;border-top:1px solid var(--rule)}
.book:hover .bt{color:var(--accent)}
.bt{font:20px/1.3 var(--serif);color:var(--text)}
.bm{font-size:13px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.bp{height:2px;background:var(--rule);margin-top:10px}
.bp i{display:block;height:100%;background:var(--accent)}
#drop{margin-top:8px;border-top:1px solid var(--rule);padding:22px 0;color:var(--muted);font-size:14px}
#drop button{color:var(--accent)}
body.dragging #shelf{outline:2px dashed var(--accent);outline-offset:-24px}

/* loading */
#loading{position:fixed;inset:44px 0 0 0;display:grid;place-items:center;background:var(--bg);font:14px var(--sans);color:var(--muted);z-index:5}
#loading .track{width:220px;height:2px;background:var(--rule);margin-top:14px}
#loading .fill{height:100%;width:0;background:var(--accent)}

/* table of contents */
#toc{position:fixed;top:44px;bottom:0;left:0;width:300px;overflow:auto;padding:16px 8px 40px;background:var(--bg);
  border-right:1px solid var(--rule);font:13px/1.35 var(--sans);z-index:9}
#toc a{display:block;padding:5px 10px;border-radius:6px;color:var(--muted);text-decoration:none}
#toc a:hover{background:var(--surface);color:var(--text)}
#toc a.d0{color:var(--text);margin-top:6px}
#toc a.d1{padding-left:22px}
#toc a.d2{padding-left:34px}
#toc a.here{color:var(--accent)}

/* the book */
#book{max-width:calc(var(--measure) + 120px);margin:0 auto;padding:84px 60px 40vh}
body.toc-open #book{margin-left:max(300px, calc((100% - var(--measure) - 120px) / 2))}
section{position:relative;content-visibility:auto;contain-intrinsic-size:auto 900px}
.pn{position:absolute;right:calc(100% + 14px);top:.45em;font:11px var(--sans);color:var(--muted);opacity:.7;
  font-variant-numeric:tabular-nums;user-select:none;white-space:nowrap}
.b{margin:0 0 .95em}
p.b{hyphens:auto;-webkit-hyphens:auto;text-wrap:pretty}
p.small{font-size:.86em;color:var(--muted)}
p.item{padding-left:1.4em;text-indent:-1.4em;margin-bottom:.45em}
p.inset{margin-left:1.6em}
h1.b{font-size:1.9em;line-height:1.18;margin:2.4em 0 .7em;font-weight:600;letter-spacing:-.01em}
h2.b{font-size:1.4em;line-height:1.25;margin:2em 0 .6em;font-weight:600}
h3.b{font-size:1.14em;line-height:1.3;margin:1.7em 0 .5em;font-weight:600}
h4.b{font-size:1em;margin:1.4em 0 .4em;font-weight:600}
p code{font:.86em var(--mono);background:var(--code-bg);color:var(--code-text);padding:.1em .32em;border-radius:4px}
figure.code{position:relative;margin:1.2em 0 1.4em;background:var(--code-bg);border-radius:8px;border:1px solid var(--rule)}
figure.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:calc(var(--size) * .76)/1.55 var(--mono);color:var(--code-text);tab-size:4}
figure.code code{font:inherit}
.tools{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
figure.code:hover .tools,figure.code:focus-within .tools{opacity:1}
.tools button{font:11px var(--sans);padding:5px 8px;border-radius:5px;background:var(--bg);color:var(--muted);border:1px solid var(--rule)}
.tools button:hover{color:var(--accent);border-color:var(--accent)}
.tools button.hit{transform:scale(.94)}
@media (hover:none){.tools{opacity:1;position:static;justify-content:flex-end;padding:6px 6px 0}}
.hljs-keyword,.hljs-built_in,.hljs-literal,.hljs-meta .hljs-keyword{color:var(--k)}
.hljs-string,.hljs-meta .hljs-string,.hljs-char{color:var(--s)}
.hljs-comment{color:var(--c);font-style:italic}
.hljs-number{color:var(--n)}
.hljs-type,.hljs-class .hljs-title,.hljs-title.class_{color:var(--t)}
.hljs-title.function_,.hljs-function .hljs-title{color:var(--f)}
.hljs-meta{color:var(--n)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  font:13px var(--sans);padding:9px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:820px){
  #book{padding:70px 20px 40vh} .pn{display:none}
  body.toc-open #book{margin-left:auto} #toc{width:min(300px,86vw)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="bar">
  <button id="home" title="Back to the shelf" hidden>‹ Shelf</button>
  <button id="tocBtn" title="Contents" hidden>Contents</button>
  <div id="title">Reader</div>
  <span id="where"></span>
  <button id="smaller" title="Smaller text">A−</button>
  <button id="bigger" title="Larger text">A+</button>
  <button id="theme" title="Change theme">Paper</button>
</header>
<div id="meter"></div>

<main id="shelf" hidden>
  <h1>Shelf</h1>
  <div id="books"></div>
  <div id="drop">Drop a PDF anywhere here, or <button id="pick">choose a file</button>.
    <input id="file" type="file" accept="application/pdf" multiple hidden></div>
</main>
<nav id="toc" hidden></nav>
<article id="book" hidden></article>
<div id="loading" hidden><div><div id="loadText">Opening…</div><div class="track"><div class="fill" id="loadFill"></div></div></div></div>
<div id="toast"></div>

<script src="/vendor/pdf.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script>
'use strict';
const VERSION = 3;                       // bump when extraction changes: invalidates caches
pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const frame = () => new Promise((r) => { const c = new MessageChannel(); c.port1.onmessage = r; c.port2.postMessage(0); });   // yields without rAF throttling
const LANGS = ['cpp', 'c', 'python', 'javascript', 'typescript', 'java', 'rust', 'go', 'bash', 'json', 'xml', 'sql', 'swift', 'csharp'];

/* ---------- preferences (theme, size) ---------- */
const THEMES = ['paper', 'sepia', 'night'];
const prefs = (() => { try { return JSON.parse(localStorage.getItem('reader.prefs')) || {}; } catch { return {}; } })();
if (!prefs.theme) prefs.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
if (!prefs.size) prefs.size = 19;
function applyPrefs(keepPlace) {
  const a = keepPlace && current ? anchor() : null;
  document.documentElement.dataset.theme = prefs.theme;
  document.documentElement.style.setProperty('--size', prefs.size + 'px');
  $('theme').textContent = prefs.theme[0].toUpperCase() + prefs.theme.slice(1);
  try { localStorage.setItem('reader.prefs', JSON.stringify(prefs)); } catch {}
  if (a) restore(a);
}
$('theme').onclick = () => { prefs.theme = THEMES[(THEMES.indexOf(prefs.theme) + 1) % THEMES.length]; applyPrefs(); };
$('smaller').onclick = () => { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(true); };
$('bigger').onclick = () => { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(true); };

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- shelf ---------- */
let current = null;           // { id, data, sections }
async function showShelf() {
  current = null;
  for (const id of ['book', 'toc', 'home', 'tocBtn', 'loading']) $(id).hidden = true;
  document.body.classList.remove('toc-open');
  $('shelf').hidden = false; $('title').textContent = 'Reader'; $('where').textContent = ''; $('meter').style.width = 0;
  document.title = 'Reader';
  const books = await (await fetch('/api/books')).json();
  $('books').innerHTML = books.length ? books.map((b) => {
    const pct = b.pos && b.pos.pages ? Math.round((b.pos.pct || 0) * 100) : 0;
    const meta = b.pos && b.pos.pages ? `Page ${b.pos.page} of ${b.pos.pages} · ${pct}%` : 'Not started';
    return `<button class="book" data-id="${esc(b.id).replace(/"/g, '&quot;')}"><div class="bt">${esc(b.title)}</div>
      <div class="bm">${meta}</div><div class="bp"><i style="width:${pct}%"></i></div></button>`;
  }).join('') : '';
  scrollTo(0, 0);
}
$('books').onclick = (e) => { const b = e.target.closest('.book'); if (b) location.hash = '#' + encodeURIComponent(b.dataset.id); };
$('home').onclick = () => { savePos(); location.hash = ''; };
$('pick').onclick = () => $('file').click();
$('file').onchange = (e) => addFiles(e.target.files);
async function addFiles(files) {
  let last = null;
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name)) { toast(f.name + ' is not a PDF'); continue; }
    toast('Adding ' + f.name + '…');
    const r = await fetch('/api/books?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
    if (r.ok) last = (await r.json()).id; else toast('Could not add ' + f.name);
  }
  if (files.length === 1 && last) location.hash = '#' + encodeURIComponent(last); else showShelf();
}
addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', (e) => { e.preventDefault(); document.body.classList.remove('dragging'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ---------- extraction: PDF → lines → blocks ---------- */
const MONO_NAME = /mono|courier|consol|menlo|typewriter|cmtt|lettergothic|andale|sourcecode|inconsolata|firacode|\bcode\b|prestige|ocr-?[ab]/i;
const CODE_SHAPE = /[;{}]\s*(\/\/.*)?$|^\s*(#\s*(include|define|if|ifn?def|endif|pragma)\b|\/\/|\/\*|(template|class|struct|enum|namespace|using|typedef|return|for|while|if|else|switch|case|public|private|protected|try|catch|auto|const|constexpr|static|void|int|double|float|char|bool|long|unsigned|virtual|explicit|inline|def|import|fn|let|var|func|function)\b)|::|->|==|!=|<<|>>|\+\+|&&|\|\||\(\)|\[\]|\w\(.*\)|=\s*\S/;
const BULLET = /^(•|·|–|—|▪|■|□|○|●|\*|\[\d+\]|\(\d+\)|\d{1,2}\.)\s/;

function buildLines(items, fonts, y0) {
  const its = [];
  for (const i of items) {
    if (!i.str || Math.abs(i.transform[1]) > 0.01) continue;           // skip empty and rotated text
    its.push({ s: i.str, x: i.transform[4], y: i.transform[5] - y0, w: i.width,
      sz: Math.hypot(i.transform[2], i.transform[3]) || i.height || 10, f: i.fontName });
  }
  its.sort((a, b) => b.y - a.y || a.x - b.x);
  const groups = [];
  for (const it of its) {
    const g = groups[groups.length - 1];
    if (g && Math.abs(it.y - g.y) <= Math.max(it.sz, g.sz) * 0.35) g.items.push(it);
    else groups.push({ y: it.y, sz: it.sz, items: [it] });
  }
  const lines = [];
  for (const g of groups) {
    g.items.sort((a, b) => a.x - b.x);
    let text = '', wide = '', prevEnd = null, monoChars = 0, total = 0;
    const runs = [], bySize = {}, byFont = {};
    for (const it of g.items) {
      const n = it.s.replace(/\s/g, '').length;
      const fi = fonts.get(it.f) || {};
      total += n; if (fi.mono) monoChars += n;
      const k = Math.round(it.sz * 10) / 10; bySize[k] = (bySize[k] || 0) + n;
      byFont[it.f] = (byFont[it.f] || 0) + n;
      let sep = '', wsep = '';
      if (prevEnd !== null) {
        const gap = it.x - prevEnd;
        if (gap > it.sz * 0.18 && !/\s$/.test(text) && !/^\s/.test(it.s)) sep = ' ';
        const cols = Math.round(gap / (it.sz * (fi.mono ? 0.6 : 0.5)));
        wsep = gap > it.sz * 0.9 ? ' '.repeat(Math.min(48, Math.max(2, cols))) : sep;
      }
      text += sep + it.s; wide += wsep + it.s;
      const last = runs[runs.length - 1];
      if (last && last[1] === it.f) last[0] += sep + it.s; else runs.push([sep + it.s, it.f]);
      prevEnd = it.x + it.w;
    }
    if (!text.trim()) continue;
    const top = (o) => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
    lines.push({ x0: g.items[0].x, x1: prevEnd, y: g.y, sz: +top(bySize), font: top(byFont),
      mono: total > 0 && monoChars / total > 0.8, text: text.trim(), wide: wide.replace(/\s+$/, ''), runs, len: total });
  }
  return lines;
}

async function extract(pdf, progress) {
  const fonts = new Map(), pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    if (tc.items.some((i) => i.fontName && !fonts.has(i.fontName))) {
      try { await page.getOperatorList(); } catch {}             // makes real font names available
      for (const i of tc.items) {
        if (!i.fontName || fonts.has(i.fontName)) continue;
        let f = null; try { f = page.commonObjs.get(i.fontName); } catch {}
        const name = ((f && f.name) || '').replace(/^[A-Z]{6}\+/, '');
        const fam = (tc.styles[i.fontName] || {}).fontFamily || '';
        fonts.set(i.fontName, { name: name || i.fontName,
          mono: !!(f && f.isMonospace) || MONO_NAME.test(name) || fam === 'monospace',
          bold: !!(f && f.bold) || /bold|black|heavy|semibold|demi/i.test(name),
          italic: !!(f && f.italic) || /ital|obli/i.test(name) });
      }
    }
    const v = page.view, H = v[3] - v[1];
    let lines = buildLines(tc.items, fonts, v[1]);
    // running heads and folios: short lines in the top or bottom margin
    lines = lines.filter((l) => !((l.y > H * 0.935 || l.y < H * 0.055) && l.text.length < 100));
    pages.push({ n, lines });
    page.cleanup();
    if (n % 4 === 0) { progress(n / pdf.numPages); await frame(); }
  }

  // document-wide facts: the body size and body font
  const sizeW = {}, fontW = {};
  for (const p of pages) for (const l of p.lines) sizeW[l.sz] = (sizeW[l.sz] || 0) + l.len;
  const body = +(Object.entries(sizeW).sort((a, b) => b[1] - a[1])[0] || [10])[0];
  for (const p of pages) for (const l of p.lines) if (Math.abs(l.sz - body) < body * 0.06 && !l.mono) fontW[l.font] = (fontW[l.font] || 0) + l.len;
  const bodyFont = (Object.entries(fontW).sort((a, b) => b[1] - a[1])[0] || [''])[0];
  const fname = (k) => (fonts.get(k) || {}).name || k;
  const bodyName = fname(bodyFont);

  // per-page margins, then code detection
  const codeFontW = {};
  for (const p of pages) {
    const xs = {};
    for (const l of p.lines) if (!l.mono && l.text.length > 50 && Math.abs(l.sz - body) < body * 0.06) { const k = Math.round(l.x0); xs[k] = (xs[k] || 0) + 1; }
    const e = Object.entries(xs).sort((a, b) => b[1] - a[1])[0];
    p.left = e ? +e[0] : Math.min(...p.lines.map((l) => l.x0), 1e9);
    p.right = Math.max(...p.lines.filter((l) => l.text.length > 50).map((l) => l.x1), 0);
    for (const l of p.lines) {
      l.indented = l.x0 > p.left + l.sz * 0.8;
      const other = fname(l.font) !== bodyName && Math.abs(l.sz - body) < body * 0.22;
      l.code = l.mono || (other && l.indented && CODE_SHAPE.test(l.text));
      if (l.code && !l.mono) codeFontW[fname(l.font)] = (codeFontW[fname(l.font)] || 0) + 1;
    }
  }
  // fonts that carry code in this book (proportional code faces included)
  const codeFonts = new Set(Object.entries(codeFontW).filter(([, n]) => n >= 12).map(([k]) => k));
  for (const p of pages) {
    for (const l of p.lines) if (l.code && !l.mono && !codeFonts.has(fname(l.font))) l.code = false;
    const grow = (i, j) => {
      const l = p.lines[i], nb = p.lines[j];
      if (l && nb && !l.code && nb.code && l.indented && codeFonts.has(fname(l.font)) && Math.abs(nb.y - l.y) < l.sz * 2.2) l.code = true;
    };
    for (let i = 1; i < p.lines.length; i++) grow(i, i - 1);
    for (let i = p.lines.length - 2; i >= 0; i--) grow(i, i + 1);
  }
  const flagsOf = (k) => { const f = fonts.get(k) || {}; const nm = f.name || k;
    return (f.mono || codeFonts.has(nm) ? 1 : 0) | (f.bold ? 2 : 0) | (f.italic && !codeFonts.has(nm) ? 4 : 0); };
  const bodyFlags = flagsOf(bodyFont);

  // lines → blocks
  const blocks = [];
  const addRuns = (b, l) => {
    for (const [t, f] of l.runs) {
      const fl = flagsOf(f) & ~(bodyFlags & 6);
      const last = b.r[b.r.length - 1];
      if (last && last[1] === fl) last[0] += t; else b.r.push([t, fl]);
    }
  };
  const joinLine = (b, l) => {
    const last = b.r[b.r.length - 1];
    if (/[A-Za-z]-$/.test(last[0]) && /^[a-z]/.test(l.text)) last[0] = last[0].slice(0, -1);
    else if (!/\s$/.test(last[0])) last[0] += ' ';
    addRuns(b, l);
  };
  for (const p of pages) {
    let prev = null;
    for (const l of p.lines) {
      const gap = prev ? prev.y - l.y : Infinity;
      const last = blocks[blocks.length - 1];
      const ratio = l.sz / body;
      if (l.code) {
        if (last && last.t === 'c' && last.p === p.n && prev && prev.code && gap < l.sz * 3.4) {
          if (gap > l.sz * 1.75) last.L.push(null);
          last.L.push(l);
        } else blocks.push({ t: 'c', p: p.n, L: [l] });
      } else if (ratio >= 1.18 && l.text.length < 140) {
        const lv = ratio >= 1.7 ? 1 : ratio >= 1.35 ? 2 : 3;
        if (last && last.t === 'h' && last.l === lv && last.p === p.n && gap < l.sz * 1.7) last.s += ' ' + l.text;
        else blocks.push({ t: 'h', l: lv, p: p.n, s: l.text });
      } else {
        const allBold = l.runs.every(([t, f]) => !t.trim() || (flagsOf(f) & 2)) && !(bodyFlags & 2);
        if (allBold && ratio >= 0.98 && l.text.length < 90 && gap > l.sz * 1.5 && !/[.,;]$/.test(l.text)) {
          blocks.push({ t: 'h', l: 4, p: p.n, s: l.text }); prev = l; continue;
        }
        const bullet = BULLET.test(l.text);
        let cont = false;
        if (last && last.t === 'p' && !bullet && Math.abs(last.sz - l.sz) < l.sz * 0.06) {
          if (last.pEnd === p.n && prev && !prev.code) {
            const indentStart = !last.bullet && l.x0 > last.x + l.sz * 0.9;
            const prevShort = prev.x1 < p.right - l.sz * 4 && /[.:?!]["”’)]?$/.test(prev.text);
            cont = gap < l.sz * 1.55 && gap > 0 && !indentStart && !prevShort;
          } else if (last.pEnd === p.n - 1 && !prev) {
            cont = !/[.!?:;]["”’)]?$/.test(last.r[last.r.length - 1][0].trim()) && /^[a-z(]/.test(l.text);
          }
        }
        if (cont) { joinLine(last, l); last.x = l.x0; last.pEnd = p.n; }
        else {
          const b = { t: 'p', p: p.n, pEnd: p.n, sz: l.sz, x: l.x0, bullet, r: [],
            k: bullet ? 'item' : ratio < 0.9 ? 'small' : l.x0 > p.left + l.sz * 2.2 ? 'inset' : '' };
          addRuns(b, l); blocks.push(b);
        }
      }
      prev = l;
    }
  }
  // finish: code text with its indentation, trim working fields
  return blocks.map((b) => {
    if (b.t === 'c') {
      const real = b.L.filter(Boolean), minX = Math.min(...real.map((l) => l.x0));
      const s = b.L.map((l) => l ? ' '.repeat(Math.max(0, Math.round((l.x0 - minX) / (l.sz * (l.mono ? 0.6 : 0.5))))) + l.wide : '').join('\n');
      return { t: 'c', p: b.p, s };
    }
    if (b.t === 'p') return { t: 'p', p: b.p, k: b.k, r: b.r };
    return b;
  });
}

async function outline(pdf, blocks) {
  const toc = [];
  try {
    const walk = async (items, d) => {
      for (const it of items || []) {
        let page = null;
        try {
          const dest = typeof it.dest === 'string' ? await pdf.getDestination(it.dest) : it.dest;
          if (dest && dest[0] && typeof dest[0] === 'object') page = (await pdf.getPageIndex(dest[0])) + 1;
          else if (dest && Number.isInteger(dest[0])) page = dest[0] + 1;
        } catch {}
        if (page) toc.push({ s: it.title.trim(), d, p: page });
        if (d < 2) await walk(it.items, d + 1);
      }
    };
    await walk(await pdf.getOutline(), 0);
  } catch {}
  if (toc.length >= 3) return toc;
  return blocks.filter((b) => b.t === 'h' && b.l <= 2).map((b) => ({ s: b.s, d: b.l - 1, p: b.p }));
}

/* ---------- rendering ---------- */
const runHTML = (r) => r.map(([t, f]) => {
  if (!f || !t.trim()) return esc(t);
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(t);          // keep edge spaces outside the styling
  let h = esc(m[2]);
  if (f & 1) h = '<code>' + h + '</code>';
  if (f & 2) h = '<b>' + h + '</b>';
  if (f & 4) h = '<i>' + h + '</i>';
  return m[1] + h + m[3];
}).join('');

async function render(data) {
  const book = $('book'); book.innerHTML = '';
  const byPage = new Map();
  let nCode = 0;
  for (const b of data.blocks) {
    let h;
    if (b.t === 'h') h = `<h${b.l} class="b">${esc(b.s)}</h${b.l}>`;
    else if (b.t === 'c') {
      const n = ++nCode;
      const tools = b.s.includes('\n') ? `<div class="tools"><button data-act="copy">Copy</button><button data-act="open">Open in VS Code</button></div>` : '';
      h = `<figure class="b code" data-n="${n}">${tools}<pre><code>${esc(b.s)}</code></pre></figure>`;
    } else h = `<p class="b ${b.k || ''}">${runHTML(b.r)}</p>`;
    if (!byPage.has(b.p)) byPage.set(b.p, []);
    byPage.get(b.p).push(h);
  }
  const sections = [];
  let html = '', count = 0;
  for (let n = 1; n <= data.pages; n++) {
    html += `<section data-p="${n}" id="pg${n}"><span class="pn">${n}</span>${(byPage.get(n) || []).join('')}</section>`;
    if (++count % 80 === 0) { book.insertAdjacentHTML('beforeend', html); html = ''; await frame(); }
  }
  book.insertAdjacentHTML('beforeend', html);
  book.querySelectorAll('section').forEach((s) => sections.push(s));
  const io = new IntersectionObserver((es) => {
    for (const e of es) if (e.isIntersecting) { io.unobserve(e.target); highlight(e.target); }
  }, { rootMargin: '800px' });
  book.querySelectorAll('figure.code').forEach((f) => io.observe(f));
  return sections;
}

const langVotes = {};
function highlight(fig) {
  if (fig.dataset.lang) return fig.dataset.lang;
  const code = fig.querySelector('code');
  let lang = 'cpp';
  try {
    const r = hljs.highlightAuto(code.textContent, LANGS);
    const voted = Object.entries(langVotes).sort((a, b) => b[1] - a[1])[0];
    if (r.language && r.relevance >= 7) { lang = r.language; langVotes[lang] = (langVotes[lang] || 0) + 1; }
    else lang = voted ? voted[0] : (r.language || 'cpp');
    if (lang === 'c' && langVotes.cpp) lang = 'cpp';
    code.innerHTML = hljs.highlight(code.textContent, { language: lang, ignoreIllegals: true }).value;
  } catch {}
  return (fig.dataset.lang = lang);
}

$('book').onclick = async (e) => {
  const btn = e.target.closest('button[data-act]'); if (!btn) return;
  const fig = btn.closest('figure'), code = fig.querySelector('code').textContent;
  btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 70);       // hit stop
  if (btn.dataset.act === 'copy') { await navigator.clipboard.writeText(code); toast('Copied'); return; }
  const r = await fetch('/api/open', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ book: current.id, n: +fig.dataset.n, lang: highlight(fig), code }) });
  const j = await r.json().catch(() => ({}));
  toast(j.ok ? 'Opened ' + j.file : 'Could not open VS Code. The file is at ' + (j.file || 'examples/'));
};

/* ---------- reading position ---------- */
const TOP = 56;
function anchor() {
  const S = current.sections; let lo = 0, hi = S.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (S[m].getBoundingClientRect().bottom > TOP) hi = m; else lo = m + 1; }
  const sec = S[lo], kids = sec.querySelectorAll(':scope > .b');
  let idx = 0, frac = 0;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (r.bottom > TOP) { idx = i; frac = r.height ? Math.max(0, (TOP - r.top) / r.height) : 0; break; }
    idx = i;
  }
  return { page: lo + 1, idx, frac: +frac.toFixed(3), pages: S.length,
    pct: +(scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)).toFixed(4) };
}
function restore(a) {
  const go = () => {
    const sec = current && current.sections[Math.min(a.page, current.sections.length) - 1]; if (!sec) return;
    const el = sec.querySelectorAll(':scope > .b')[a.idx] || sec;
    const r = el.getBoundingClientRect();
    scrollTo(0, scrollY + r.top + r.height * (a.frac || 0) - TOP);
  };
  go(); requestAnimationFrame(go); setTimeout(go, 250); setTimeout(() => { go(); restoring = false; updateWhere(); }, 700);
}
let restoring = false, saveT = null, lastSaved = '';
function savePos(beacon) {
  if (!current || restoring) return;
  const a = anchor(), body = JSON.stringify(a);
  if (body === lastSaved) return; lastSaved = body;
  try { localStorage.setItem('reader.pos.' + current.id, body); } catch {}
  const url = '/api/pos?id=' + encodeURIComponent(current.id);
  if (beacon) navigator.sendBeacon(url, body); else fetch(url, { method: 'POST', body, keepalive: true }).catch(() => {});
}
function updateWhere() {
  if (!current) return;
  const a = anchor();
  $('where').textContent = `${a.page} / ${a.pages}`;
  $('meter').style.width = (a.pct * 100) + '%';
  if (!$('toc').hidden) {
    let here = null;
    for (const l of $('toc').children) { if (+l.dataset.p <= a.page) here = l; l.classList.remove('here'); }
    if (here) here.classList.add('here');
  }
}
addEventListener('scroll', () => {
  if (!current) return;
  if (!updateWhere.q) { updateWhere.q = true; requestAnimationFrame(() => { updateWhere.q = false; updateWhere(); }); }
  clearTimeout(saveT); saveT = setTimeout(() => savePos(), 350);
}, { passive: true });
addEventListener('pagehide', () => savePos(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(true); });

/* ---------- contents ---------- */
$('tocBtn').onclick = () => {
  const open = $('toc').hidden; const a = anchor();
  $('toc').hidden = !open; document.body.classList.toggle('toc-open', open);
  restore(a); updateWhere();
  if (open) { const h = $('toc').querySelector('.here'); if (h) h.scrollIntoView({ block: 'center' }); }
};
$('toc').onclick = (e) => {
  const l = e.target.closest('a'); if (!l) return; e.preventDefault();
  restore({ page: +l.dataset.p, idx: 0, frac: 0 });
  if (innerWidth <= 820) $('tocBtn').click();
};

/* ---------- open a book ---------- */
async function openBook(id) {
  $('shelf').hidden = true; $('loading').hidden = false; $('home').hidden = false;
  const title = id.replace(/\.pdf$/i, '');
  $('title').textContent = title; document.title = title;
  const load = (t, f) => { $('loadText').textContent = t; $('loadFill').style.width = (f * 100) + '%'; };
  load('Opening…', 0);
  let data = null;
  try { const r = await fetch('/api/cache?id=' + encodeURIComponent(id)); if (r.ok) { const d = await r.json(); if (d.v === VERSION) data = d; } } catch {}
  if (!data) {
    const pdf = await pdfjsLib.getDocument({ url: '/api/pdf?id=' + encodeURIComponent(id) }).promise;
    const blocks = await extract(pdf, (f) => load(`Reading the book, page ${Math.round(f * pdf.numPages)} of ${pdf.numPages}. This happens once.`, f));
    data = { v: VERSION, pages: pdf.numPages, blocks, toc: await outline(pdf, blocks) };
    fetch('/api/cache?id=' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify(data) }).catch(() => {});
    pdf.destroy();
  }
  load('Laying out…', 1);
  if (location.hash.slice(1) !== encodeURIComponent(id)) return;      // user left while loading
  $('book').hidden = false;
  const sections = await render(data);
  current = { id, data, sections };
  $('toc').innerHTML = data.toc.map((t) => `<a href="#" class="d${t.d}" data-p="${t.p}">${esc(t.s)}</a>`).join('');
  $('tocBtn').hidden = !data.toc.length;
  $('loading').hidden = true;
  let pos = null;
  try { const books = await (await fetch('/api/books')).json(); pos = (books.find((b) => b.id === id) || {}).pos; } catch {}
  if (!pos) { try { pos = JSON.parse(localStorage.getItem('reader.pos.' + id)); } catch {} }
  if (pos && pos.page) { restoring = true; restore(pos); } else { scrollTo(0, 0); updateWhere(); }
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) openBook(id).catch((e) => { console.error(e); toast('Could not open that book: ' + e.message); location.hash = ''; });
  else showShelf();
}
addEventListener('hashchange', route);
applyPrefs(); route();
</script>
