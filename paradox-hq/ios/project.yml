# XcodeGen spec — the .xcodeproj is GENERATED from this file and never committed.
# Regenerate any time with:  xcodegen generate   (ios-run does it for you)
name: ParadoxHQ
options:
  bundleIdPrefix: com.labern
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Icons made in the app's designer are baked in here, before the project is
  # written: the script fills Custom.xcconfig, which may not exist until it runs.
  preGenCommand: sh design/icons/bake_custom.sh
  disabledValidations: [missingConfigFiles]
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.labern.paradox.hq
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
targets:
  ParadoxHQ:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - target: ParadoxWidgets
    configFiles:
      Debug: Custom.xcconfig
      Release: Custom.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Light AppIcon-Bold AppIcon-Bracket AppIcon-Diagonal AppIcon-Diagonal7 AppIcon-DiagonalLight AppIcon-Kana AppIcon-Original $(CUSTOM_APPICONS)"
    entitlements:
      path: Resources/ParadoxHQ.entitlements
      properties:
        com.apple.security.application-groups: [group.com.labern.paradox.hq]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: PARADOX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: Ground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Face ID keeps the company's figures to you.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.labern.paradox.hq.refresh]
    scheme:
      testTargets: [ParadoxHQTests]
      gatherCoverageData: true
  # Home Screen and Lock Screen widgets. They read one small snapshot the app
  # leaves in the shared App Group; they never hold the Stripe key.
  ParadoxWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources/Assets.xcassets
    entitlements:
      path: Widgets/ParadoxWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.labern.paradox.hq]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.labern.paradox.hq.widgets
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: PARADOX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ParadoxHQTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ParadoxHQ
